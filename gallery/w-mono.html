function fillStatic(d) { const L = logs[d.id] = { lines: [], done: true, t: 0 }; (d.st === "error" ? ERRSTEPS(d) : LOGSTEPS(d)).forEach(([dl, cl, tx]) => { if (cl === "prog") tx = "  [████████████████████████] 100%  38.2/38.2 GB", cl = ""; L.t += dl * 11; L.lines.push({ t: L.t, cl, tx }); }); }

const esc = (s) => s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

  const rows = vis.map((d) => `<div><button class="row" data-d="${d.id}"><i class="dot ${d.st}"></i><span class="n"><b>${d.proj}<span class="env ${d.env === "生产" ? "p" : ""}">${d.env}</span></b><small>${d.id}</small></span><span class="cmt"><div>${d.cm}</div><small>${ICON.branch}${d.branch}</small></span><span class="dur">${d.st === "building" ? "构建中…" : stat(d.st) === "排队中" ? "排队中" : d.dur}</span><span class="who">${d.ago}<i>${AV[d.who]}</i></span></button><div class="logbox ${openId === d.id ? "on" : ""}" id="box-${d.id}"><div class="lh"><b>构建日志</b><span>${d.id}</span><span class="sp"></span><button class="btn o" data-copy="${d.id}">复制</button><button class="btn o" data-redo="${d.id}">重新部署</button></div><div class="log" id="log-${d.id}"></div></div></div>`).join("");

  const useTab = `<div class="sech"><h2>用量</h2><span style="flex:1"></span><span style="color:var(--mute);font-size:12.5px">今日 · 单位：次</span></div><div class="usage">${P.map((p) => { const v = p[7] * 1440 * .6; const mx = 2650 * 1440 * .6; return `<div class="u"><span>${p[0]}</span><div class="b"><i style="width:${v / mx * 100}%"></i></div><span>${Math.round(v).toLocaleString()}</span></div>`; }).join("")}</div>`;

  vis.forEach((d) => { if (openId === d.id) paintLog(d); });
  document.querySelectorAll(".card").forEach((c) => (c.onclick = () => { filter = filter === c.dataset.p ? "" : c.dataset.p; renderAll(); }));
  document.querySelectorAll(".row").forEach((r) => (r.onclick = () => openDep(r.dataset.d)));
  const cl = $("[data-clear]"); if (cl) cl.onclick = () => { filter = ""; renderAll(); };

  document.querySelectorAll("[data-redo]").forEach((b) => (b.onclick = () => newDeploy(D.find((d) => d.id === b.dataset.redo).proj)));
  const nd = $("#newdep"); if (nd) nd.onclick = () => newDeploy("qwen-chat");
  const pf = $("#pf"); if (pf) pf.oninput = (e) => { q = e.target.value; const pos = e.target.selectionStart; renderAll(); const n = $("#pf"); n.focus(); n.setSelectionRange(pos, pos); };
  $("#acts").innerHTML = ACT.map((a) => `<div class="act"><div class="a">${a[1]}</div><div><div>${a[2]}${a[4] ? ` <i class="dot ${a[4]}" style="margin-left:4px"></i>` : ""}</div><small>${a[0]} · ${a[3]}</small></div></div>`).join("");
}
function openDep(id) {
  const d = D.find((x) => x.id === id); if (!d) return;
  if (!logs[id]) fillStatic(d);
  openId = openId === id ? null : id; renderAll();
}
function newDeploy(proj) {
  const p = P.find((x) => x[0] === proj), d = { id: "dpl_" + Math.random().toString(36).slice(2, 7), proj, env: "生产", branch: p[3], cm: p[4], who: "周启明", st: "building", dur: "—", ago: "刚刚", _fast: true };
  D.unshift(d); ACT.unshift(["周启明", "ZQ", `触发了 <b>${proj}</b> 的生产部署 <em>${d.id}</em>`, "刚刚", "building"]); filter = ""; tab = tab === "use" ? "all" : tab; openId = d.id; syncTabs(); renderAll(); startBuild(d); toast("已创建部署 " + d.id);
}
function toast(m) { const t = $("#toast"); t.textContent = m; t.classList.add("on"); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove("on"), 2200); }
function syncTabs() { document.querySelectorAll("#tabs button").forEach((b) => b.classList.toggle("on", b.dataset.t === tab)); }
$("#tabs").onclick = (e) => { const t = e.target.dataset.t; if (!t) return; tab = t; syncTabs(); renderAll(); };
// ---- ⌘K ----
let items = [], act = 0;
function cmds() {
  return [["动作", ICON.plus, "新建部署", "", () => newDeploy("qwen-chat")], ["动作", ICON.nav, "查看全部部署", "", () => { tab = "dep"; syncTabs(); renderAll(); }], ["动作", ICON.nav, "回到概览", "", () => { tab = "all"; filter = ""; syncTabs(); renderAll(); }], ["动作", ICON.undo, "回滚 qwen-chat 到上一个生产部署", "dpl_3y8kn", () => toast("已回滚到 dpl_3y8kn")],
    ...P.map((p) => ["项目", ICON.box, p[0], p[1], () => { tab = "all"; syncTabs(); filter = p[0]; renderAll(); }]), ...D.slice(0, 6).map((d) => ["部署", ICON.run, d.id, d.proj + " · " + stat(d.st), () => { tab = tab === "use" ? "all" : tab; syncTabs(); filter = ""; if (!logs[d.id]) fillStatic(d); openId = d.id; renderAll(); setTimeout(() => $("#box-" + d.id)?.scrollIntoView({ block: "center", behavior: "smooth" }), 50); }])];
}
function fz(s, q) { s = s.toLowerCase(); q = q.toLowerCase(); let i = 0, idx = []; for (let k = 0; k < s.length && i < q.length; k++) if (s[k] === q[i]) { idx.push(k); i++; } return i === q.length ? idx : null; }
function hl(s, idx) { if (!idx) return esc(s); let o = ""; for (let k = 0; k < s.length; k++) o += idx.includes(k) ? `<mark>${esc(s[k])}</mark>` : esc(s[k]); return o; }
function renderPal() {
  const v = $("#pq").value.trim(); items = [];
  cmds().forEach((c) => { const m = v ? fz(c[2], v) : []; if (m) items.push({ c, m: v ? m : null }); });

  $("#plist").innerHTML = h || '<div class="empty">没有匹配项</div>';
  document.querySelectorAll(".pit").forEach((e) => { e.onmouseenter = () => { act = +e.dataset.i; document.querySelectorAll(".pit").forEach((x) => x.classList.toggle("on", x === e)); }; e.onclick = () => run(+e.dataset.i); });
}
function run(i) { const it = items[i]; if (!it) return; closePal(); it.c[4](); }
function openPal() { $("#pal").classList.add("on"); $("#pq").value = ""; act = 0; renderPal(); $("#pq").focus(); }
function closePal() { $("#pal").classList.remove("on"); }
$("#kopen").onclick = openPal; $("#pal").onmousedown = (e) => { if (e.target.id === "pal") closePal(); };
$("#pq").oninput = () => { act = 0; renderPal(); };
addEventListener("keydown", (e) => {

  if (e.key === "Escape") closePal(); else if (e.key === "ArrowDown") { e.preventDefault(); act = (act + 1) % items.length; renderPal(); $(".pit.on")?.scrollIntoView({ block: "nearest" }); } else if (e.key === "ArrowUp") { e.preventDefault(); act = (act - 1 + items.length) % items.length; renderPal(); $(".pit.on")?.scrollIntoView({ block: "nearest" }); } else if (e.key === "Enter") run(act);

renderAll(); openId = D[0].id; renderAll(); startBuild(D[0]);
</script>
