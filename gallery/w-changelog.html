<style>
:root{--bg:#fff;--ink:#0f1115;--ink2:#4b505c;--mute:#8d919d;--line:#e9eaee;--acc:#3326ff;--accbg:#eceaff;

*{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}button,input{font:inherit;color:inherit}button{cursor:pointer;background:none;border:0}
.wrap{max-width:1240px;margin:0 auto;padding:0 48px}
.top{display:flex;align-items:center;height:64px;gap:28px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;letter-spacing:-.02em}
.logo i{width:22px;height:22px;background:var(--ink);border-radius:6px;position:relative;display:block}
.logo i:after{content:"";position:absolute;left:5px;top:5px;width:12px;height:4px;background:#fff;box-shadow:0 5px 0 #fff,0 10px 0 var(--acc);border-radius:1px;transform:translateY(-1px)}
.top nav{display:flex;gap:22px;font-size:14px;color:var(--ink2);margin-left:12px}.top nav a.on{color:var(--ink);font-weight:600}.top nav a:hover{color:var(--ink)}
.top .sp{flex:1}.top .rss{font-family:var(--mono);font-size:12px;color:var(--mute);border:1px solid var(--line);padding:5px 10px;border-radius:6px}
.head{display:grid;grid-template-columns:240px 1fr;gap:56px;padding:20px 0 26px;border-bottom:1px solid var(--line)}
.head h1{font-size:66px;line-height:1;font-weight:800;letter-spacing:-.05em;grid-column:1/-1;display:flex;align-items:baseline;gap:20px}
.head h1 small{font-family:var(--mono);font-size:13px;font-weight:400;letter-spacing:0;color:var(--mute)}
.head .sub{color:var(--ink2);font-size:15px;max-width:480px;margin-top:2px}
.hr{display:flex;justify-content:space-between;align-items:center;gap:24px;grid-column:1/-1;margin-top:6px}
.filters{display:flex;gap:8px}
.chip{height:34px;padding:0 14px;border-radius:99px;border:1px solid var(--line);font-size:13.5px;color:var(--ink2);display:flex;align-items:center;gap:8px;transition:.18s}
.chip em{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--mute)}
.chip:hover{border-color:var(--ink);color:var(--ink)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}.chip.on em{color:#aab}
.chip .dot{width:7px;height:7px;border-radius:50%}
form.sub{display:flex;gap:8px;position:relative;height:40px}
form.sub input{width:260px;height:40px;border:1px solid #cfd1d8;border-radius:10px;padding:0 14px;font-size:14px;outline:0;background:#fff;transition:.15s}
form.sub input:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--accbg)}form.sub input.bad{border-color:var(--fix);animation:sh .3s}
@keyframes sh{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.go{height:40px;min-width:88px;padding:0 18px;border-radius:10px;background:var(--acc);color:#fff;font-weight:600;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px;transition:.2s}
.go:hover{background:#1f13e0}.go .sp{width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.okmsg{display:none;align-items:center;gap:10px;height:40px;padding:0 16px;border-radius:10px;background:#e4f7ec;color:#0c7a42;font-size:14px;font-weight:500}
.okmsg svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.4}
form.sub.done input,form.sub.done .go{display:none}form.sub.done .okmsg{display:flex;animation:pop .45s cubic-bezier(.3,1.4,.5,1)}
@keyframes pop{from{opacity:0;transform:scale(.9)}}
.cols{display:grid;grid-template-columns:240px 1fr;gap:56px;align-items:start}
/* timeline */
.tl{position:sticky;top:20px;padding:30px 0 40px;align-self:start}
.tl ol{list-style:none;position:relative;margin-left:5px}
.tl ol:before{content:"";position:absolute;left:4px;top:8px;bottom:8px;width:1px;background:var(--line)}
.tl .ym{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--mute);padding:14px 0 6px 26px;text-transform:uppercase}
.tl li.ym:first-child{padding-top:0}
.tl a{display:flex;align-items:baseline;gap:10px;padding:5px 0 5px 26px;position:relative;color:var(--mute);font-size:14px;transition:.2s}
.tl a:before{content:"";position:absolute;left:0;top:13px;width:9px;height:9px;border-radius:50%;background:#fff;border:1.5px solid #c9cbd3;transition:.25s}
.tl a b{font-weight:500;font-variant-numeric:tabular-nums}.tl a span{font-family:var(--mono);font-size:11.5px}
.tl a:hover{color:var(--ink)}
.tl a.on{color:var(--ink)}.tl a.on b{font-weight:800;font-size:16px}.tl a.on:before{background:var(--acc);border-color:var(--acc);box-shadow:0 0 0 4px var(--accbg)}
.tl li.hide{display:none}
.tl .cnt{margin:26px 0 0 26px;font-family:var(--mono);font-size:11.5px;color:var(--mute)}
/* entries */
.list{padding:30px 0 120px;display:grid;gap:80px}
article{scroll-margin-top:24px;transition:opacity .3s}
article.hide{display:none}
article .meta{display:flex;align-items:center;gap:8px;margin-bottom:14px;font-family:var(--mono);font-size:12px;color:var(--mute)}
article .ver{color:var(--ink);font-weight:500;background:#f3f4f6;padding:2px 8px;border-radius:5px}
.tag{font-family:var(--sans);font-size:12px;font-weight:600;padding:1px 8px;border-radius:5px;letter-spacing:.02em}
.tag.new{background:var(--newbg);color:var(--new)}.tag.imp{background:var(--impbg);color:var(--imp)}.tag.fix{background:var(--fixbg);color:var(--fix)}
article h2{font-size:34px;line-height:1.2;font-weight:800;letter-spacing:-.035em;max-width:640px}
article .lead{color:var(--ink2);font-size:16px;margin:12px 0 22px;max-width:620px;line-height:1.75}
.shot{position:relative;display:block;width:100%;border-radius:14px;overflow:hidden;cursor:zoom-in;box-shadow:0 0 0 1px rgba(0,0,0,.06);aspect-ratio:760/400;background:#eee}
.shot svg{display:block;width:100%;height:100%;transition:transform .8s cubic-bezier(.2,.8,.2,1)}
.shot:hover svg{transform:scale(1.025)}
.shot .zoom{position:absolute;right:14px;bottom:14px;width:34px;height:34px;border-radius:9px;background:rgba(15,17,21,.82);display:grid;place-items:center;opacity:0;transform:translateY(4px);transition:.25s}
.shot:hover .zoom{opacity:1;transform:none}.zoom svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:2;transform:none!important}
.shot .cap{position:absolute;left:14px;bottom:14px;font-size:11.5px;font-family:var(--mono);color:rgba(15,17,21,.55)}
ul.items{list-style:none;margin-top:26px;display:grid;gap:0;max-width:680px}
ul.items li{display:grid;grid-template-columns:54px 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--line);font-size:15px;color:var(--ink2);align-items:baseline}
ul.items li.hide{display:none}ul.items li b{color:var(--ink);font-weight:600}
ul.items li .tag{justify-self:start;font-size:11.5px}
.more{display:inline-flex;margin-top:14px;font-size:14px;font-weight:600;color:var(--acc);gap:6px;align-items:center}.more:hover{gap:10px}.more{transition:gap .2s}
.empty{display:none;color:var(--mute);padding:60px 0}
/* lightbox */
.lb{position:fixed;inset:0;z-index:100;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s}
.lb.on{opacity:1;pointer-events:auto}
.lb .stage{width:min(1120px,86vw);aspect-ratio:760/400;border-radius:16px;overflow:hidden;box-shadow:0 0 0 1px rgba(0,0,0,.08),0 40px 100px -30px rgba(20,20,60,.35);transform:scale(.94);transition:transform .35s cubic-bezier(.2,.9,.3,1)}
.lb.on .stage{transform:none}.lb .stage svg{width:100%;height:100%;display:block}
.lb .bar{display:flex;align-items:center;gap:18px;margin-top:20px;font-size:14px;color:var(--ink2)}
.lb .bar b{color:var(--ink)}.lb .bar span{font-family:var(--mono);font-size:12px;color:var(--mute)}
.lb button.nv{position:absolute;top:50%;width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:#fff;display:grid;place-items:center;transform:translateY(-50%);transition:.15s}
.lb button.nv:hover{border-color:var(--ink)}.lb .nv svg{width:18px;height:18px;stroke:var(--ink);fill:none;stroke-width:2}
.lb .p{left:28px}.lb .n{right:28px}.lb .x{position:absolute;top:22px;right:28px;font-family:var(--mono);font-size:12px;color:var(--mute);border:1px solid var(--line);padding:6px 12px;border-radius:8px}.lb .x:hover{color:var(--ink);border-color:var(--ink)}
.foot{position:fixed;left:12px;bottom:8px;font-size:11px;color:var(--mute)}

function filter(k){
 $$("#filters .chip").forEach(c=>c.classList.toggle("on",c.dataset.k===k));let n=0;

 $("#empty").style.display=n?"none":"block";$("#cnt").textContent=`共 ${n} 条更新`;spy();
