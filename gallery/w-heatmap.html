<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>占用方块 · 全公司 GPU</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&display=swap" media="print" onload="this.media='all'">
<style>
  :root { --bg:#151618; --bar:#1b1c1f; --line:#2c2e33; --ink:#eceef0; --ink2:#a4a9b1; --mute:#6c727b; --hit:#ffe14d; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; background:var(--bg); overflow:hidden; }
  body { font-family:"Inter","Noto Sans SC",sans-serif; font-size:12px; color:var(--ink); -webkit-font-smoothing:antialiased; min-width:1100px; display:flex; flex-direction:column; }
  button,input { font:inherit; color:inherit; background:none; border:0; outline:none; cursor:pointer; }
  button:focus-visible { outline:2px solid var(--hit); outline-offset:-2px; }
  .mono { font-family:"JetBrains Mono",monospace; font-variant-numeric:tabular-nums; }
  svg { display:block; }

  .top { height:52px; flex:none; display:flex; align-items:center; gap:18px; padding:0 14px 0 16px; background:var(--bar); border-bottom:1px solid var(--line); }
  .brand { display:flex; align-items:center; gap:9px; font-weight:600; font-size:14px; letter-spacing:.02em; white-space:nowrap; }
  .brand svg { width:20px; height:20px; }
  .crumb { display:flex; align-items:center; gap:2px; font-size:13px; min-width:0; }
  .crumb button { padding:5px 8px; border-radius:3px; color:var(--ink2); white-space:nowrap; }
  .crumb button:hover { background:#2a2c31; color:#fff; }
  .crumb button.cur { color:#fff; font-weight:600; cursor:default; }
  .crumb button.cur:hover { background:none; }
  .crumb i { color:var(--mute); font-style:normal; }
  .sp { flex:1; }
  .search { display:flex; align-items:center; gap:8px; height:30px; width:250px; padding:0 10px; background:#101113; border:1px solid var(--line); border-radius:3px; }
  .search:focus-within { border-color:#6b7078; }
  .search svg { width:14px; height:14px; color:var(--mute); flex:none; }
  .search input { flex:1; min-width:0; cursor:text; font-size:12.5px; }
  .search input::placeholder { color:var(--mute); }
  .search .n { font-size:11px; color:var(--hit); white-space:nowrap; }
  .search kbd { font:500 10.5px "JetBrains Mono"; color:var(--mute); border:1px solid #3a3d43; padding:0 5px; border-radius:3px; }
  .tg { display:flex; align-items:center; gap:8px; color:var(--mute); font-size:12px; }
  .seg { display:flex; border:1px solid var(--line); border-radius:3px; overflow:hidden; }
  .seg button { height:28px; padding:0 12px; color:var(--ink2); border-right:1px solid var(--line); }
  .seg button:last-child { border-right:0; }
  .seg button:hover { color:#fff; background:#25272b; }
  .seg button.on { background:#e8eaed; color:#15161a; font-weight:600; }

  #stage { flex:1; position:relative; min-height:0; overflow:hidden; background:var(--bg); }
  .layer { position:absolute; inset:0; }
  .layer.old { pointer-events:none; }
  .it { position:absolute; overflow:hidden; transition:left .55s cubic-bezier(.3,.8,.2,1), top .55s cubic-bezier(.3,.8,.2,1), width .55s cubic-bezier(.3,.8,.2,1), height .55s cubic-bezier(.3,.8,.2,1), opacity .4s, background-color .45s; }
  .it.fade { transition:opacity .4s; }
  .f { z-index:1; background:#202226; border:1px solid #101113; }
  .f .hd { height:18px; display:flex; align-items:center; padding:0 7px; font-size:11px; font-weight:600; color:#cfd3d8; white-space:nowrap; cursor:pointer; letter-spacing:.02em; position:relative; z-index:3; }
  .f .hd:hover { color:#fff; background:#ffffff14; }
  .f .hd.proj { font-size:10px; font-weight:500; color:#b9bec5; padding:0 5px; }
  .f .hd.proj em { font-size:9.5px; margin-left:5px; }
  .f .hd span { overflow:hidden; text-overflow:ellipsis; }
  .f .hd em { font-style:normal; color:#8e949c; font-weight:400; margin-left:7px; font-family:"JetBrains Mono"; font-size:10.5px; flex:none; }
  .f .hd svg { width:9px; height:9px; margin-left:5px; flex:none; opacity:0; }
  .f .hd:hover svg { opacity:.8; }
  .b { z-index:2; border:1px solid #151618; padding:6px 7px; color:#fff; cursor:pointer; display:flex; flex-direction:column; justify-content:flex-start; line-height:1.18; }
  .b:hover { z-index:4; outline:2px solid #fff; outline-offset:-2px; }
  .b .nm { font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; letter-spacing:-.005em; text-shadow:0 1px 2px #0006; }
  .b .vl { font-family:"JetBrains Mono"; font-variant-numeric:tabular-nums; opacity:.85; white-space:nowrap; margin-top:3px; text-shadow:0 1px 2px #0006; }
  .b .vl2 { font-family:"JetBrains Mono"; opacity:.65; white-space:nowrap; margin-top:2px; }
  .b.sel { outline:2px solid var(--hit); outline-offset:-3px; z-index:5; }
  .dim .b.nm0 { filter:brightness(.36) saturate(.35); }
  .it.hit { z-index:6; animation:hit 1.1s ease-in-out 2; }
  @keyframes hit { 0%,100% { box-shadow:inset 0 0 0 0 #ffe14d; } 40%,60% { box-shadow:inset 0 0 0 4px #ffe14d, 0 0 0 3px #ffe14d55; } }
  .it.hit.keep { outline:2px solid var(--hit); outline-offset:-2px; }

  .tip { position:fixed; z-index:30; pointer-events:none; width:262px; background:#0d0e10f2; border:1px solid #3a3d43; border-radius:4px; padding:11px 13px 10px; opacity:0; transition:opacity .1s; }
  .tip .t { font-weight:600; font-size:13.5px; }
  .tip .p { color:var(--mute); font-size:11px; margin:2px 0 8px; }
  .tip .r { display:flex; justify-content:space-between; padding:3px 0; font-size:12px; border-top:1px solid #23252a; }
  .tip .r span:first-child { color:var(--ink2); }
  .tip .bar { height:5px; background:#2a2c31; margin:8px 0 2px; position:relative; }
  .tip .bar i { position:absolute; left:0; top:0; bottom:0; }
  .tip .hint { margin-top:7px; font-size:10.5px; color:var(--mute); }

  .pin { position:absolute; right:14px; top:14px; z-index:20; width:268px; background:#0d0e10f5; border:1px solid #4a4e55; border-radius:4px; padding:13px 14px; animation:pin .3s both; }
  @keyframes pin { from { opacity:0; transform:translateY(-6px); } }
  .pin .x { position:absolute; right:6px; top:6px; width:24px; height:24px; display:grid; place-items:center; color:var(--ink2); border-radius:3px; }
  .pin .x:hover { background:#2a2c31; color:#fff; }
  .pin .t { font-size:15px; font-weight:600; padding-right:22px; }
  .pin .p { color:var(--mute); font-size:11px; margin:2px 0 8px; }
  .pin .r { display:flex; justify-content:space-between; padding:5px 0; border-top:1px solid #23252a; font-size:12.5px; }
  .pin .r span:first-child { color:var(--ink2); }

  .foot { height:38px; flex:none; display:flex; align-items:center; gap:22px; padding:0 16px; background:var(--bar); border-top:1px solid var(--line); font-size:11.5px; color:var(--ink2); }
  .foot b { color:var(--ink); font-weight:500; }
  .leg { display:flex; align-items:center; gap:10px; }
  .leg .sw { display:flex; }
  .leg .sw i { width:26px; height:12px; display:block; }
  .leg .ax { display:flex; flex-direction:column; }
  .leg .ax div { display:flex; justify-content:space-between; font:400 10.5px "JetBrains Mono"; color:var(--mute); margin-top:2px; }
  .foot .keys { color:var(--mute); }
  .foot .keys kbd { font:500 10.5px "JetBrains Mono"; border:1px solid #3a3d43; padding:0 5px; border-radius:3px; margin:0 2px; }
</style>
</head>
<body>
<div class="top">
  <div class="brand"><svg viewBox="0 0 24 24" fill="none" stroke="#eceef0" stroke-width="1.7" stroke-linejoin="round"><rect x="3" y="3" width="11" height="10" /><rect x="14" y="3" width="7" height="6" /><rect x="14" y="9" width="7" height="12" /><rect x="3" y="13" width="11" height="8" /></svg>占用方块</div>
  <div class="crumb" id="crumb"></div>
  <div class="sp"></div>
  <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l5 5"/></svg><input id="q" placeholder="搜索部门、项目或作业" autocomplete="off"><span class="n" id="qn"></span><kbd>/</kbd></div>
  <div class="tg">面积<div class="seg" id="segA"><button data-v="cards" class="on">卡数</button><button data-v="cost">费用</button></div></div>
  <div class="tg">颜色<div class="seg" id="segC"><button data-v="util" class="on">利用率</button><button data-v="idle">空闲天数</button></div></div>
</div>
<div id="stage"></div>
<div class="foot">
  <div id="sum"></div>
  <div class="leg" id="leg"></div>
  <div class="sp"></div>
  <div class="keys"><kbd>Esc</kbd>返回上一层 &nbsp; <kbd>/</kbd>搜索 &nbsp; 示例数据</div>
</div>
<div class="tip" id="tip"></div>

<script>
const $ = s => document.querySelector(s);
/* ---------- 数据 ---------- */
let seed = 20261120; const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const RATE = { H100:2.2, H800:1.9, A100:1.2, A800:1.0, L40S:0.55, "910B":0.8 };   // 万元 / 卡 · 月
const OWN = ["王磊","陈静","刘洋","赵敏","孙浩","周婷","吴凡","郑凯","马俊","林夕","何佳","高远"];
const SPEC = [
  ["算法中心", .74, [["预训练","pt",["H100","H800"]],["对齐微调","al",["H100","A800"]],["评测基准","ev",["A100","L40S"]],["长上下文","lc",["H800","H100"]]]],
  ["多模态组", .69, [["图文大模型","vl",["H800","H100"]],["视频生成","vg",["H100"]],["语音多模态","sm",["A800","A100"]]]],
  ["推荐平台部", .78, [["排序模型","rk",["A100","A800"]],["召回模型","rc",["A800","A100"]],["特征平台","ft",["L40S","A100"]],["在线推理","sv",["L40S","H800"]]]],
  ["数据平台部", .52, [["数据清洗","dc",["L40S","A100"]],["标注辅助","an",["L40S"]],["向量检索","vs",["A100","L40S"]]]],
  ["基础架构部", .41, [["编译器优化","cp",["H100","910B"]],["通信库","cm",["H800","910B"]],["调度器","sc",["A100","L40S"]]]],
  ["语音组", .58, [["语音识别","asr",["A100","A800"]],["语音合成","tts",["A100","L40S"]]]],
  ["自动驾驶组", .66, [["感知模型","pc",["H100","A100"]],["规划控制","pl",["A800","A100"]],["仿真回放","sim",["L40S","A800"]],["数据闭环","dl",["A100","L40S"]]]],
  ["搜索部", .62, [["召回排序","sr",["A800","A100"]],["问答生成","qa",["H800","H100"]]]],
];
const DW = [30,18,16,10,8,5,9,6];                 // 各部门卡数权重
const KIND = ["main","abl","nightly","sweep","ckpt","serve","distill","prep"];
const CARDS = [8,8,16,16,24,32,32,48,64,96,128];
const root = { name:"全公司", children:[], path:[] };
SPEC.forEach(([dn, du, ps], di) => {
  const d = { name:dn, children:[], kind:"dept", parent:root };
  ps.forEach(([pn, code, models], pi) => {
    const p = { name:pn, children:[], kind:"proj", parent:d, code };
    const nj = 3 + Math.floor(rnd()*5);
    for(let k=0;k<nj;k++){
      const util = Math.max(3, Math.min(98, Math.round(du*100 + (rnd()-.5)*62 + (k===0?10:0))));
      const idle = util < 25 ? 5+Math.floor(rnd()*22) : util < 50 ? Math.floor(rnd()*9) : Math.floor(rnd()*3);
      const model = models[Math.floor(rnd()*models.length)];
      const j = { name:`${code}-${KIND[(k*3+pi)%8]}-v${1+Math.floor(rnd()*4)}`, kind:"job", parent:p, raw:CARDS[Math.floor(rnd()*CARDS.length)]*(1+DW[di]/30)|0, util, idle, model, owner:OWN[Math.floor(rnd()*OWN.length)] };
      p.children.push(j);
    }
    d.children.push(p);
  });
  root.children.push(d);
});
// 卡数缩放到合计 3,264，且都是 8 的倍数
const jobs = []; (function walk(n){ n.children ? n.children.forEach(walk) : jobs.push(n); })(root);
const rawSum = jobs.reduce((a,j)=>a+j.raw,0);
jobs.forEach(j => { j.cards = Math.max(8, Math.round(j.raw*3264/rawSum/8)*8); });
let diff = 3264 - jobs.reduce((a,j)=>a+j.cards,0); const big = jobs.slice().sort((a,b)=>b.cards-a.cards)[0]; big.cards += diff;
jobs.forEach(j => { j.cost = +(j.cards*RATE[j.model]).toFixed(1); });
(function agg(n){ if(!n.children) return n; n.children.forEach(agg); n.cards = n.children.reduce((a,c)=>a+c.cards,0); n.cost = +n.children.reduce((a,c)=>a+c.cost,0).toFixed(1);
  n.util = n.children.reduce((a,c)=>a+c.util*c.cards,0)/n.cards; n.idle = n.children.reduce((a,c)=>a+c.idle*c.cards,0)/n.cards; n.models = [...new Set(n.children.flatMap(c=>c.models||[c.model]))]; })(root);
root.models = ["H100","H800","A100","A800","L40S","910B"];
const all = []; (function walk(n){ if(n!==root) all.push(n); (n.children||[]).forEach(walk); })(root);
const keyOf = n => n===root ? "root" : (n.parent===root? n.name : n.parent.parent===root ? n.parent.name+"/"+n.name : n.parent.parent.name+"/"+n.parent.name+"/"+n.name);
all.forEach(n => n.key = keyOf(n));
const pathOf = n => { const a=[]; while(n && n!==root){ a.unshift(n); n=n.parent; } return a; };

/* ---------- 色阶 ---------- */
const STOPS = [[0,[196,52,60]],[28,[142,56,62]],[52,[72,74,82]],[76,[44,122,88]],[100,[28,166,104]]];
function ramp(t){ t=Math.max(0,Math.min(100,t)); for(let i=1;i<STOPS.length;i++){ if(t<=STOPS[i][0]){ const [a,ca]=STOPS[i-1],[b,cb]=STOPS[i], k=(t-a)/(b-a); return ca.map((v,j)=>Math.round(v+(cb[j]-v)*k)); } } return STOPS[4][1]; }
const score = n => st.col==="util" ? n.util : 100 - Math.min(14,n.idle)/14*100;
const rgb = c => `rgb(${c[0]},${c[1]},${c[2]})`;
const fillOf = n => rgb(ramp(score(n)));

/* ---------- squarify ---------- */
function squarify(items, x, y, w, h){
  const out=[]; const tot = items.reduce((a,i)=>a+i.v,0); if(!tot||w<=0||h<=0) return out;
  const ar = items.map(i=>i.v/tot*w*h); let i0=0, rx=x, ry=y, rw=w, rh=h;
  const worst = (r,s) => { const t=r.reduce((a,b)=>a+b,0); return Math.max(s*s*Math.max(...r)/(t*t), t*t/(s*s*Math.min(...r))); };
  while(i0<items.length){
    const side=Math.min(rw,rh); let row=[ar[i0]], n=1;
    while(i0+n<items.length){ const t=row.concat(ar[i0+n]); if(worst(t,side)<=worst(row,side)){ row=t; n++; } else break; }
    const rs=row.reduce((a,b)=>a+b,0);
    if(rw>=rh){ const cw=rs/rh; let yy=ry; row.forEach((a,k)=>{ const hh=a/cw; out.push({it:items[i0+k],x:rx,y:yy,w:cw,h:hh}); yy+=hh; }); rx+=cw; rw-=cw; }
    else { const rhh=rs/rw; let xx=rx; row.forEach((a,k)=>{ const ww=a/rhh; out.push({it:items[i0+k],x:xx,y:ry,w:ww,h:rhh}); xx+=ww; }); ry+=rhh; rh-=rhh; }
    i0+=n;
  }
  return out;
}

/* ---------- 状态与布局 ---------- */
const st = { path:[], area:"cards", col:"util", q:"", sel:null };
const stage = $("#stage"); let SW=0, SH=0;
const val = n => st.area==="cards" ? n.cards : n.cost;
const nodeAt = p => p.reduce((n,k)=>n.children.find(c=>c.name===k), root);
function layout(){
  SW = stage.clientWidth; SH = stage.clientHeight;
  const node = nodeAt(st.path), items=[];
  const sorted = ch => ch.slice().sort((a,b)=>val(b)-val(a));
  const lay = (nd, x, y, w, h) => {
    squarify(sorted(nd.children).map(c=>({n:c,v:val(c)})), x, y, w, h).forEach(r => {
      const c = r.it.n;
      if(c.kind==="job"){ items.push({key:c.key,node:c,type:"b",x:r.x,y:r.y,w:r.w,h:r.h}); return; }
      const hdr = c.kind==="dept" ? (r.h>40 && r.w>64 ? 19 : 0) : (r.h>36 && r.w>58 ? 15 : 0);
      items.push({key:c.key,node:c,type:"f",hdr,x:r.x,y:r.y,w:r.w,h:r.h});
      lay(c, r.x+1, r.y+1+hdr, r.w-2, r.h-2-hdr);
    });
  };
  lay(node, 0, 0, SW, SH);
  return items;
}

/* ---------- 渲染（按 key 复用，所以切换面积时方块会滑动） ---------- */
let layer = null;
const SVG_ARROW = '<svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 1.5 7 5 3 8.5"/></svg>';
function mkEl(it){
  const e=document.createElement("div"); e.className="it "+(it.type==="f"?"f":"b"); e.dataset.key=it.key; return e;
}
function fillEl(e, it){
  e.style.left=it.x+"px"; e.style.top=it.y+"px"; e.style.width=it.w+"px"; e.style.height=it.h+"px";
  const n=it.node;
  if(it.type==="f"){
    e.style.background = "";
    const c=ramp(score(n)); e.style.backgroundColor = `rgb(${Math.round(c[0]*.55+14)},${Math.round(c[1]*.55+14)},${Math.round(c[2]*.55+14)})`;
    e.innerHTML = it.hdr ? `<div class="hd ${n.kind}" style="height:${it.hdr}px" data-go="${n.key}"><span>${n.name}</span><em>${n.cards.toLocaleString("en-US")} 卡 · ${st.col==="util"?Math.round(n.util)+"%":n.idle.toFixed(1)+" 天"}</em>${SVG_ARROW}</div>` : "";
  } else {
    e.style.backgroundColor = fillOf(n);
    const fs = Math.max(8, Math.min(24, Math.sqrt(it.w*it.h)/8.2)), show = it.w>34 && it.h>20;
    const l1 = n.kind==="job" ? `${n.model} × ${n.cards}` : `${n.cards.toLocaleString("en-US")} 卡`;
    const l2 = st.col==="util" ? `${Math.round(n.util)}%` : `${n.idle.toFixed(n.kind==="job"?0:1)} 天`;
    const l3 = st.area==="cost" ? `¥${n.cost.toLocaleString("en-US")} 万` : "";
    e.style.padding = Math.max(3,Math.min(8,fs/3))+"px "+Math.max(4,Math.min(9,fs/2.5))+"px";
    e.innerHTML = show ? `<div class="nm" style="font-size:${fs.toFixed(1)}px">${n.name}</div>${it.h>fs*2.6+10?`<div class="vl" style="font-size:${Math.max(9,fs*.62).toFixed(1)}px">${st.area==="cost"?l3:l1} · ${l2}</div>`:""}${it.h>fs*4.4+14&&it.w>fs*7?`<div class="vl2" style="font-size:${Math.max(9,fs*.55).toFixed(1)}px">${st.area==="cost"?l1:n.kind==="job"?n.owner:""}</div>`:""}` : "";
  }
  e.classList.toggle("sel", st.sel===n);
}
function applyQuery(){
  const q=st.q.trim().toLowerCase();
  layer.classList.toggle("dim", !!q);
  layer.querySelectorAll(".it").forEach(e => { const n=all.find(x=>x.key===e.dataset.key); const m = q && n.name.toLowerCase().includes(q); e.classList.toggle("nm0", !!q && !m); });
}
function render(items, mode){
  const old = new Map([...layer.children].map(e=>[e.dataset.key,e]));
  items.forEach(it => { let e = old.get(it.key); if(!e){ e=mkEl(it); layer.appendChild(e); } old.delete(it.key); fillEl(e,it); });
  old.forEach(e => e.remove());
  applyQuery(); renderFoot();
}
function newLayer(){ const l=document.createElement("div"); l.className="layer"; stage.appendChild(l); return l; }

function go(path, how, from){
  const prev = layer; st.path = path; st.sel = null; closePin(); const items = layout();
  const nl = newLayer();
  if(how==="in" && from){
    items.forEach(it => { const e=mkEl(it); nl.appendChild(e); fillEl(e,{...it,x:from.x,y:from.y,w:from.w,h:from.h}); e.style.transition="none"; e.style.opacity="0"; });
    layer = nl; void nl.offsetWidth;
    items.forEach((it,i) => { const e=nl.children[i]; e.style.transition=""; requestAnimationFrame(()=>{ fillEl(e,it); e.style.opacity="1"; }); });
    prev.classList.add("old"); prev.querySelectorAll(".it").forEach(e=>{ e.style.transition="opacity .35s"; e.style.opacity="0"; });
  } else if(how==="out" && from){
    items.forEach(it => { const e=mkEl(it); nl.appendChild(e); fillEl(e,it); e.style.opacity="0"; e.style.transition="none"; });
    layer = nl; void nl.offsetWidth;
    items.forEach((it,i) => { const e=nl.children[i]; e.style.transition="opacity .45s"; e.style.opacity="1"; });
    const tgt = items.find(x=>x.key===from.key) || {x:0,y:0,w:SW,h:SH};
    prev.classList.add("old"); prev.querySelectorAll(".it").forEach(e=>{ e.style.left=tgt.x+"px"; e.style.top=tgt.y+"px"; e.style.width=tgt.w+"px"; e.style.height=tgt.h+"px"; e.style.opacity="0"; });
  } else {
    items.forEach(it => { const e=mkEl(it); nl.appendChild(e); fillEl(e,it); e.style.opacity="0"; e.style.transition="none"; });
    layer = nl; void nl.offsetWidth; [...nl.children].forEach(e=>{ e.style.transition="opacity .35s"; e.style.opacity="1"; });
    prev.classList.add("old"); prev.querySelectorAll(".it").forEach(e=>{ e.style.transition="opacity .3s"; e.style.opacity="0"; });
  }
  setTimeout(()=>{ prev.remove(); layer.querySelectorAll(".it").forEach(e=>{ e.style.transition=""; }); }, 700);
  applyQuery(); renderCrumb(); renderFoot();
}
function relayout(){ render(layout()); }

/* ---------- 面包屑、底栏 ---------- */
function renderCrumb(){
  const parts = [["全公司",[]]]; st.path.forEach((k,i)=>parts.push([k,st.path.slice(0,i+1)]));
  $("#crumb").innerHTML = parts.map((p,i)=> (i?"<i>›</i>":"") + `<button class="${i===parts.length-1?'cur':''}" data-p='${JSON.stringify(p[1])}'>${p[0]}</button>`).join("");
}
$("#crumb").addEventListener("click", e => { const b=e.target.closest("button"); if(!b||b.classList.contains("cur")) return; const p=JSON.parse(b.dataset.p);
  const anc = nodeAt(st.path.slice(0,p.length+1)); go(p, "out", {key:anc.key}); });
function renderFoot(){
  const n = nodeAt(st.path);
  $("#sum").innerHTML = `<b>${n.name}</b> &nbsp;${n.cards.toLocaleString("en-US")} 卡 &nbsp;·&nbsp; 月费用 ¥${Math.round(n.cost).toLocaleString("en-US")} 万 &nbsp;·&nbsp; 加权利用率 <b class="mono">${n.util.toFixed(1)}%</b> &nbsp;·&nbsp; 平均空闲 <b class="mono">${n.idle.toFixed(1)}</b> 天`;
  const steps = st.col==="util" ? [5,20,35,50,65,80,95] : [14,11,8,5,3,1,0];
  const lab = st.col==="util" ? ["0%","","","50%","","","100%"] : ["≥14 天","","","7 天","","","0 天"];
  $("#leg").innerHTML = `<span style="color:var(--mute)">${st.col==="util"?"利用率":"空闲天数"}</span><div class="ax"><div class="sw">${steps.map(v=>`<i style="background:${rgb(ramp(st.col==="util"?v:100-Math.min(14,v)/14*100))}"></i>`).join("")}</div><div><span>${st.col==="util"?"0%":"≥14 天"}</span><span>${st.col==="util"?"100%":"0 天"}</span></div></div><span style="color:var(--mute)">面积 = ${st.area==="cards"?"卡数":"月费用"}</span>`;
}

/* ---------- 交互 ---------- */
const tip = $("#tip");
const rowS = (a,b) => `<div class="r"><span>${a}</span><span class="mono">${b}</span></div>`;
function tipHTML(n){
  const pth = pathOf(n).slice(0,-1).map(x=>x.name).join(" › ") || "全公司";
  const c = ramp(score(n));
  return `<div class="t">${n.name}</div><div class="p">${pth} · ${n.kind==="dept"?"部门":n.kind==="proj"?"项目":"作业"}</div>` +
    rowS("占用卡数", n.cards.toLocaleString("en-US")+(n.kind==="job"?" ("+n.model+")":"")) + rowS("利用率", n.util.toFixed(n.kind==="job"?0:1)+"%") + rowS("空闲天数", n.idle.toFixed(n.kind==="job"?0:1)+" 天") + rowS("月费用", "¥"+n.cost.toLocaleString("en-US")+" 万") + (n.kind==="job"?rowS("负责人",n.owner):rowS("下级数量", n.children.length+(n.kind==="dept"?" 个项目":" 个作业"))) +
    `<div class="bar"><i style="width:${Math.min(100,n.util)}%;background:${rgb(ramp(n.util))}"></i></div><div class="hint">${n.kind==="job"?"点击查看并固定详情":"点击下钻"}</div>`;
}
function placeTip(e){ const w=262, h=tip.offsetHeight; let x=e.clientX+16, y=e.clientY+16; if(x+w>innerWidth-8) x=e.clientX-w-16; if(y+h>innerHeight-8) y=e.clientY-h-16; tip.style.left=x+"px"; tip.style.top=y+"px"; }
stage.addEventListener("mousemove", e => { const el=e.target.closest(".it"); if(!el||el.closest(".layer")!==layer){ tip.style.opacity=0; return; }
  const n=all.find(x=>x.key===el.dataset.key); if(!n){ tip.style.opacity=0; return; }
  if(tip.dataset.k!==n.key+st.area+st.col){ tip.innerHTML=tipHTML(n); tip.dataset.k=n.key+st.area+st.col; } tip.style.opacity=1; placeTip(e); });
stage.addEventListener("mouseleave", ()=>tip.style.opacity=0);
function rectOf(key){ const e=[...layer.children].find(x=>x.dataset.key===key); return e ? {x:e.offsetLeft,y:e.offsetTop,w:e.offsetWidth,h:e.offsetHeight,key} : {x:0,y:0,w:SW,h:SH,key}; }
stage.addEventListener("click", e => {
  const el=e.target.closest(".it"); if(!el||el.closest(".layer")!==layer) return;
  const n=all.find(x=>x.key===el.dataset.key); if(!n) return;
  if(n.kind!=="job"){ return go(pathOf(n).map(x=>x.name),"in",rectOf(n.key)); }
  st.sel = n; layer.querySelectorAll(".sel").forEach(x=>x.classList.remove("sel")); el.classList.add("sel"); showPin(n);
});
function showPin(n){
  closePin(); const d=document.createElement("div"); d.className="pin"; d.id="pin"; const pth=pathOf(n).slice(0,-1).map(x=>x.name).join(" › ");
  d.innerHTML=`<button class="x" aria-label="关闭"><svg width="12" height="12" viewBox="0 0 12 12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2 2l8 8M10 2l-8 8"/></svg></button><div class="t">${n.name}</div><div class="p">${pth}</div>`+rowS("型号 × 卡数",n.model+" × "+n.cards)+rowS("利用率",n.util+"%")+rowS("空闲天数",n.idle+" 天")+rowS("月费用","¥"+n.cost+" 万")+rowS("负责人",n.owner)+`<div class="r"><span>处理建议</span><span>${n.util<25?"建议回收":n.util<50?"建议复核":"保持"}</span></div>`;
  stage.appendChild(d); d.querySelector(".x").onclick=()=>{ st.sel=null; layer.querySelectorAll(".sel").forEach(x=>x.classList.remove("sel")); closePin(); };
}
function closePin(){ const p=$("#pin"); if(p) p.remove(); }
$("#segA").addEventListener("click", e=>{ const b=e.target.closest("button"); if(!b) return; st.area=b.dataset.v; document.querySelectorAll("#segA button").forEach(x=>x.classList.toggle("on",x===b)); tip.dataset.k=""; relayout(); });
$("#segC").addEventListener("click", e=>{ const b=e.target.closest("button"); if(!b) return; st.col=b.dataset.v; document.querySelectorAll("#segC button").forEach(x=>x.classList.toggle("on",x===b)); tip.dataset.k=""; relayout(); });

/* 搜索：命中的方块描边闪烁；不在当前层就先跳到能看到它的那一层 */
let hitIdx=0, qt=0;
function visibleKeys(){ return new Set([...layer.children].map(e=>e.dataset.key)); }
function doSearch(jump){
  const q=st.q.trim().toLowerCase(); layer.querySelectorAll(".hit").forEach(e=>e.classList.remove("hit","keep"));
  if(!q){ $("#qn").textContent=""; applyQuery(); return; }
  const ms = all.filter(n=>n.name.toLowerCase().includes(q)); $("#qn").textContent = ms.length ? ms.length+" 处" : "无匹配";
  if(!ms.length){ applyQuery(); return; }
  const vis = visibleKeys(); let target = ms.filter(n=>vis.has(n.key));
  if(jump && !target.length){ const m=ms[hitIdx%ms.length]; go(m.kind==="job"?[pathOf(m)[0].name]:[], "jump"); setTimeout(()=>doSearch(false), 120); return; }
  applyQuery(); target.forEach(n => { const e=[...layer.children].find(x=>x.dataset.key===n.key); if(e){ void e.offsetWidth; e.classList.add("hit"); } });
  setTimeout(()=>layer.querySelectorAll(".hit").forEach(e=>e.classList.add("keep")), 2300);
}
$("#q").addEventListener("input", e=>{ st.q=e.target.value; hitIdx=0; clearTimeout(qt); qt=setTimeout(()=>doSearch(true), 180); });
$("#q").addEventListener("keydown", e=>{ if(e.key==="Enter"){ hitIdx++; doSearch(true); } if(e.key==="Escape"){ e.target.value=""; st.q=""; doSearch(false); e.target.blur(); e.stopPropagation(); } });
window.addEventListener("keydown", e=>{
  if(e.key==="/" && document.activeElement!==$("#q")){ e.preventDefault(); $("#q").focus(); }
  if(e.key==="Escape" && document.activeElement!==$("#q") && st.path.length){ go(st.path.slice(0,-1),"out",{key:nodeAt(st.path).key}); }
});
window.addEventListener("resize", ()=>{ layer.querySelectorAll(".it").forEach(e=>e.style.transition="none"); relayout(); setTimeout(()=>layer.querySelectorAll(".it").forEach(e=>e.style.transition=""),50); });

/* 启动：方块从中心散开 */
layer = newLayer(); renderCrumb();
(function boot(){ const items=layout(); items.forEach((it,i)=>{ const e=mkEl(it); layer.appendChild(e); fillEl(e,{...it,x:SW/2-10,y:SH/2-10,w:20,h:20}); e.style.opacity="0"; e.style.transition="none"; }); void layer.offsetWidth;
  items.forEach((it,i)=>{ const e=layer.children[i]; setTimeout(()=>{ e.style.transition=""; fillEl(e,it); e.style.opacity="1"; }, (it.type==="f"?0:60)+i*4); });
  applyQuery(); renderFoot(); })();
</script>
</body>
</html>
