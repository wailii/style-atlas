<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>栈云 · 2026 算力年度报告</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=DM+Mono:wght@400;500&family=Noto+Sans+SC:wght@500;700;900&display=swap" media="print" onload="this.media='all'">
<style>
:root{--blue:#2b1dff;--lime:#d6ff3a;--pink:#ff4fa3;--plum:#1a0b3b;--orange:#ff6a13;--mint:#00d1b2;--disp:"Archivo Black","Noto Sans SC",sans-serif;--zh:"Noto Sans SC",sans-serif;--mono:"DM Mono","Noto Sans SC",monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#000;font-family:var(--zh);-webkit-font-smoothing:antialiased;user-select:none}
button,input{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#stage{position:fixed;inset:0;--bg:var(--blue);--fg:var(--lime);--fg2:#fff;overflow:hidden;background:var(--bg)}
.ch{position:absolute;inset:0;display:none;padding:96px 72px 64px;color:var(--fg2)}
.ch.on{display:block}
.ln{display:block;overflow:hidden;padding:.06em 0 .16em;margin-bottom:-.1em}.ln i{display:block;font-style:normal;transform:translateY(110%)}
.ch.in .ln i{animation:up .9s cubic-bezier(.2,.9,.15,1) both;animation-delay:var(--d,0s)}
@keyframes up{from{transform:translateY(110%)}to{transform:none}}
.fade{opacity:0}.ch.in .fade{animation:fd .7s ease both;animation-delay:var(--d,.6s)}
@keyframes fd{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.mono{font-family:var(--mono);font-size:15px;letter-spacing:.08em;text-transform:uppercase}
.disp{font-family:var(--disp);font-weight:900;letter-spacing:-.04em;line-height:.9}
/* hud */
#prog{position:absolute;z-index:30;left:72px;right:72px;top:28px;display:flex;gap:8px}
#prog button{flex:1;height:22px;position:relative;display:flex;align-items:center}
#prog button:before{content:"";position:absolute;left:0;right:0;height:4px;border-radius:2px;background:var(--fg);opacity:.28}
#prog button i{position:absolute;left:0;height:4px;border-radius:2px;background:var(--fg);width:0}
#hud{position:absolute;z-index:30;left:72px;right:72px;top:58px;display:flex;justify-content:space-between;align-items:center;color:var(--fg);pointer-events:none}
#hud .b{display:flex;align-items:center;gap:10px;font-weight:900;font-size:16px}
#hud .b svg{width:22px;height:22px}
#pp{pointer-events:auto;display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:13px;letter-spacing:.06em;padding:6px 12px;border:1.5px solid var(--fg);border-radius:99px;color:var(--fg)}
#pp svg{width:12px;height:12px;fill:var(--fg)}
#hint{position:absolute;z-index:30;left:72px;bottom:26px;font-family:var(--mono);font-size:12px;letter-spacing:.06em;color:var(--fg);opacity:.75}
#ex{position:absolute;z-index:30;right:72px;bottom:26px;font-size:11px;color:var(--fg);opacity:.6}
/* wipe */
#wipe{position:absolute;inset:0;z-index:50;display:flex;pointer-events:none}
#wipe i{flex:1;transform:scaleY(0);transform-origin:50% 100%;margin-right:-1px}
/* c0 */
.c0 .t{position:absolute;left:72px;top:150px}
.c0 h1{font-size:176px;font-weight:900;line-height:.98;letter-spacing:-.06em;color:#fff}
.c0 h1 em{font-style:normal;color:var(--lime)}
.c0 .yr{position:absolute;right:44px;top:132px;font-family:var(--disp);font-weight:900;font-size:250px;line-height:1;letter-spacing:-.07em;color:transparent;-webkit-text-stroke:3px var(--lime);opacity:.9}
.c0 .star{position:absolute;right:120px;bottom:120px;width:300px;height:300px;animation:rot 18s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.c0 .start{position:absolute;left:72px;bottom:110px;display:flex;align-items:center;gap:16px;background:var(--lime);color:var(--blue);font-weight:900;font-size:26px;padding:20px 34px;border-radius:99px;transition:transform .2s}
.c0 .start:hover{transform:scale(1.05) rotate(-2deg)}.c0 .start svg{width:20px;height:20px;fill:var(--blue)}
.c0 .who{position:absolute;left:72px;top:100px;color:var(--lime)}
.marq{position:absolute;left:0;right:0;bottom:56px;height:46px;overflow:hidden;border-block:2px solid var(--lime);color:var(--lime);display:flex;align-items:center;z-index:2;background:var(--blue)}
.marq div{white-space:nowrap;font-family:var(--disp);font-size:22px;letter-spacing:.02em;animation:mq 26s linear infinite}
@keyframes mq{to{transform:translateX(-50%)}}
/* c1 */
.c1 .q{font-size:34px;font-weight:900;color:var(--plum)}
.c1 .num{font-size:206px;color:var(--plum);margin:18px 0 0 -14px;white-space:nowrap;font-variant-numeric:tabular-nums}
.c1 .u{display:flex;align-items:baseline;gap:30px;margin-top:6px}
.c1 .u b{font-size:96px;font-weight:900;color:var(--blue);letter-spacing:-.04em}
.c1 .u span{font-size:28px;font-weight:700;color:var(--plum);max-width:640px;line-height:1.35}
.c1 .badge{position:absolute;right:110px;top:430px;width:250px;height:250px;border-radius:50%;background:var(--pink);color:var(--plum);display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(12deg);text-align:center}
.c1 .badge b{font-family:var(--disp);font-size:88px;letter-spacing:-.05em;line-height:1}.c1 .badge span{font-weight:900;font-size:20px;line-height:1.3;margin-top:6px}
/* c2 */
.c2{color:var(--plum)}.c2 .q{font-size:60px;font-weight:900;letter-spacing:-.04em;line-height:1.1}
.rk{margin-top:34px;display:grid;gap:14px}
.rk .r{display:grid;grid-template-columns:100px 340px 1fr 230px;align-items:center;gap:20px;height:104px;border-top:3px solid var(--plum);transform:translateX(-120%);opacity:0}
.ch.in .rk .r{animation:rin .8s cubic-bezier(.2,.9,.2,1) both;animation-delay:calc(.5s + var(--k)*.22s)}
@keyframes rin{from{transform:translateX(-110%);opacity:0}to{transform:none;opacity:1}}
.rk .no{font-family:var(--disp);font-weight:900;font-size:80px;letter-spacing:-.06em}
.rk .nm{font-family:var(--disp);font-weight:900;font-size:56px;letter-spacing:-.04em}.rk .nm small{display:block;font-family:var(--mono);font-size:13px;letter-spacing:.06em;margin-top:6px;opacity:.7}
.rk .bar{height:46px;background:rgba(26,11,59,.14);border-radius:4px;position:relative;overflow:hidden}
.rk .bar i{position:absolute;inset:0;width:0;background:var(--plum);transition:width 1.4s cubic-bezier(.2,.9,.2,1)}
.ch.in .rk .bar i{width:var(--w);transition-delay:calc(.9s + var(--k)*.22s)}
.rk .v{text-align:right;font-family:var(--disp);font-weight:900;font-size:38px;letter-spacing:-.03em;font-variant-numeric:tabular-nums}.rk .v small{font-family:var(--mono);font-size:13px;display:block;letter-spacing:.04em;margin-top:2px;opacity:.7}
.rk .r:first-child .no,.rk .r:first-child .nm{color:#fff}.rk .r:first-child .bar i{background:#fff}.rk .r:first-child{height:124px}.rk .r:first-child .nm{font-size:72px}
/* c3 */
.c3 .q{font-size:30px;font-weight:700;color:var(--orange)}
.c3 .big{font-size:340px;color:#fff;margin:8px 0 0 -12px;white-space:nowrap}.c3 .big span{color:var(--orange)}
.c3 .tx{font-size:34px;font-weight:700;max-width:760px;line-height:1.4;margin-top:8px}.c3 .tx b{color:var(--lime)}
.c3 .hrs{position:absolute;right:72px;bottom:110px;width:560px}
.c3 .hrs svg{width:100%;height:auto;display:block;overflow:visible}
.c3 .hrs .ax{display:flex;justify-content:space-between;font-family:var(--mono);font-size:12px;opacity:.7;margin-top:8px;letter-spacing:.06em}
.c3 .bars rect{transform-origin:50% 100%;transform-box:fill-box;transform:scaleY(0)}
.ch.in .c3 .bars rect,.c3.in .bars rect{animation:gr .8s cubic-bezier(.2,.9,.2,1) both;animation-delay:calc(.6s + var(--k)*.04s)}
@keyframes gr{to{transform:scaleY(1)}}
/* c4 */
.c4{color:var(--plum)}
.c4 .q{font-size:34px;font-weight:900}
.c4 .num{font-size:330px;margin:10px 0 0 -12px;color:#fff;white-space:nowrap}.c4 .num sup{font-size:140px;vertical-align:top;position:relative;top:34px;margin-right:12px;letter-spacing:0}.c4 .num span.w{font-size:150px;letter-spacing:-.04em;margin-left:14px;color:var(--plum)}
.c4 .tri{display:grid;grid-template-columns:repeat(3,300px);gap:20px;margin-top:30px}
.c4 .tri div{border-top:3px solid var(--plum);padding-top:12px}.c4 .tri b{font-family:var(--disp);font-size:64px;letter-spacing:-.04em;display:block;line-height:1}.c4 .tri span{font-size:18px;font-weight:700}
/* c5 */
.c5{color:var(--plum)}.c5 .q{font-size:30px;font-weight:900}
.c5 h2{font-size:250px;font-weight:900;letter-spacing:-.07em;line-height:.95;margin:10px 0 0 -10px;color:var(--plum)}
.c5 h2 .ln:nth-child(2) i{color:#fff}
.c5 .seal{position:absolute;right:100px;top:200px;width:330px;height:330px;border-radius:50%;border:4px dashed var(--plum);display:flex;align-items:center;justify-content:center;text-align:center;transform:rotate(-10deg);animation:spinslow 30s linear infinite}
.c5 .seal div{font-weight:900;font-size:26px;line-height:1.35;animation:spinslow 30s linear infinite reverse}.c5 .seal b{display:block;font-family:var(--disp);font-size:92px;letter-spacing:-.05em;line-height:1}
@keyframes spinslow{to{transform:rotate(350deg)}}
.c5 .tx{font-size:28px;font-weight:700;max-width:760px;line-height:1.45;margin-top:22px}
/* c6 */
.ch.on.c6{display:flex;gap:90px;align-items:center;padding-top:100px}
.c6 .cardw{flex:none;height:700px;aspect-ratio:3/4;transform:rotate(-3deg);box-shadow:0 30px 80px rgba(0,0,0,.5);border-radius:6px;overflow:hidden}
.c6 canvas{width:100%;height:100%;display:block}
.c6 .r h2{font-size:104px;font-weight:900;letter-spacing:-.05em;line-height:1;color:var(--lime)}
.c6 .r p{font-size:22px;margin-top:20px;max-width:520px;color:#fff;line-height:1.6;font-weight:500}
.c6 label{display:block;margin-top:34px;font-family:var(--mono);font-size:13px;letter-spacing:.08em;color:var(--pink)}
.c6 input{width:420px;border-bottom:3px solid var(--lime);padding:6px 0;font-size:34px;font-weight:900;color:#fff;cursor:text;outline:0}
.c6 .act{display:flex;gap:16px;margin-top:38px}
.c6 .act button{font-weight:900;font-size:24px;padding:18px 32px;border-radius:99px;transition:transform .2s}
.c6 .act .p{background:var(--lime);color:var(--plum)}.c6 .act .s{border:3px solid #fff;color:#fff}.c6 .act button:hover{transform:translateY(-3px)}
.c6 .tip{position:absolute;right:72px;top:108px;font-family:var(--mono);font-size:13px;color:var(--lime);opacity:0;transition:.3s}.c6 .tip.on{opacity:1}
</style></head><body>
<div id="stage">
 <div id="prog"></div>
 <div id="hud"><div class="b"><svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="2.4"><rect x="2" y="3" width="18" height="5" rx="1.5"/><rect x="2" y="10" width="18" height="5" rx="1.5"/><path d="M2 19h10"/></svg>栈云 · 年度回顾</div><button id="pp" aria-label="暂停或播放"><span id="ppi"></span><span id="ppt">暂停</span></button></div>
 <div id="chs"></div>
 <div id="hint">点击右侧或按空格 / → 下一章　← 上一章　按住画面暂停</div><div id="ex">示例数据</div>
 <div id="wipe"></div>
</div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const fmt=n=>Math.round(n).toLocaleString("en-US");
const ln=(t,d=0)=>`<span class="ln"><i style="--d:${d}s">${t}</i></span>`;
const THEME=[{bg:"#2b1dff",fg:"#d6ff3a"},{bg:"#d6ff3a",fg:"#1a0b3b"},{bg:"#ff4fa3",fg:"#1a0b3b"},{bg:"#1a0b3b",fg:"#ff6a13"},{bg:"#ff6a13",fg:"#1a0b3b"},{bg:"#00d1b2",fg:"#1a0b3b"},{bg:"#1a0b3b",fg:"#d6ff3a"}];
const DUR=6500;
const HRS=[2,1,1,1,0,3,6,14,22,31,35,30,24,33,38,36,30,22,18,12,16,26,40,48];
const star=(n,r1,r2)=>{let p="";for(let i=0;i<n*2;i++){const a=i*Math.PI/n,r=i%2?r2:r1;p+=(i?"L":"M")+(150+Math.cos(a)*r).toFixed(1)+" "+(150+Math.sin(a)*r).toFixed(1)}return p+"Z"};
const marq=["H800","A100","昇腾 910B","L40S","H20","MI300X","RTX 4090"].map(x=>x+" ✦ ").join("").repeat(3);
const C=[
`<div class="who mono fade" style="--d:.2s">算法部 · 李想 · 共 7 章</div><div class="yr fade" style="--d:.1s">2026</div><svg class="star" viewBox="0 0 300 300"><path d="${star(14,148,104)}" fill="#ff4fa3"/><circle cx="150" cy="150" r="52" fill="#2b1dff"/></svg>
 <div class="t"><h1>${ln("你的算力",.15)}${ln("<em>年度</em>报告",.3)}</h1></div>
 <button class="start fade no-nav" style="--d:.9s" id="start"><svg viewBox="0 0 20 20"><path d="M4 2l14 8-14 8z"/></svg>开始回顾</button><div class="marq"><div>${marq}${marq}</div></div>`,
`<div class="q">${ln("今年，你一共跑了",0)}</div><div class="num disp" id="n1">${ln("0",.15)}</div>
 <div class="u fade" style="--d:1.3s"><b>卡时</b><span>相当于一张 H800 不眠不休，连续跑了 146 年。</span></div>
 <div class="badge fade" style="--d:1.8s"><b>94%</b><span>你比全公司<br>94% 的同事用得多</span></div>`,
`<div class="q">${ln("你最爱的卡",0)}</div>
 <div class="rk">${[["H800","612,300 卡时",47.7,"4 号池 · 华东 A"],["A100","410,200 卡时",31.9,"2 号池 · 华北"],["昇腾 910B","198,430 卡时",15.4,"信创池"],["L40S","63,700 卡时",5.0,"推理池"]].map((r,i)=>`<div class="r" style="--k:${i};--w:${r[2]/47.7*100}%"><div class="no">${i+1}</div><div class="nm">${r[0]}<small>${r[3]}</small></div><div class="bar"><i></i></div><div class="v">${r[2]}%<small>${r[1]}</small></div></div>`).join("")}</div>`,
`<div class="q">${ln("今年最忙的一天",0)}</div><div class="big disp">${ln("3<span>月</span>14<span>日</span>",.15)}</div>
 <div class="tx fade" style="--d:1.1s">这一天你跑了 <b>5,820 卡时</b>。<br>凌晨 2 点，你的训练还在跑。</div>
 <div class="hrs fade" style="--d:.8s"><svg viewBox="0 0 560 200" class="bars">${HRS.map((h,i)=>`<rect style="--k:${i}" x="${i*23.4}" y="${200-h*3.7}" width="17" height="${h*3.7}" rx="2" fill="${i===2?"#d6ff3a":"#ff6a13"}"/>`).join("")}</svg><div class="ax"><span>0 点</span><span>6</span><span>12</span><span>18</span><span>23 点</span></div></div>`,
`<div class="q">${ln("你主动释放了空转的卡",0)}</div><div class="num disp" id="n4">${ln("<sup>¥</sup>0<span class='w'>万</span>",.15)}</div>
 <div class="tri fade" style="--d:1.2s"><div><b>3,200</b><span>卡时没有被白白占着</span></div><div><b>47</b><span>次在任务结束后立刻释放</span></div><div><b>4 分钟</b><span>排在你后面的人平均少等</span></div></div>`,
`<div class="q">${ln("综合你的年度数据，你是",0)}</div><h2 class="disp">${ln("夜行",.15)}${ln("训练者",.3)}</h2>
 <div class="seal fade" style="--d:1s"><div><b>38%</b>任务在 22 点后<br>提交</div></div>
 <div class="tx fade" style="--d:1.3s">你的任务大多在下班后提交，早上 8 点前结束。显存利用率 71%，高于部门平均。</div>`,
`<div class="cardw fade no-nav" style="--d:.2s"><canvas id="cv" width="1080" height="1440"></canvas></div>
 <div class="r no-nav"><h2>${ln("带走",.1)}${ln("你的卡片",.25)}</h2><p class="fade" style="--d:.9s">一张图记下今年的算力。昵称可以改，改完卡片实时更新。</p>
 <label class="fade" style="--d:1s">卡片上的名字</label><input class="fade" id="nm" value="李想 · 算法部" maxlength="14" style="--d:1.05s">
 <div class="act fade" style="--d:1.2s"><button class="p" id="dl">下载图片</button><button class="s" id="again">再看一遍</button></div></div><div class="tip" id="tip">已保存 wrapped-2026.png</div>`
];
$("#chs").innerHTML=C.map((h,i)=>`<section class="ch c${i}" data-i="${i}">${h}</section>`).join("");
$("#prog").innerHTML=C.map((_,i)=>`<button data-i="${i}" aria-label="第 ${i+1} 章"><i></i></button>`).join("");
$("#wipe").innerHTML="<i></i>".repeat(9);
/* 状态 */
let cur=0,playing=false,started=false,el=0,busy=false,hold=false,last=performance.now();
function setTheme(i){const s=$("#stage");s.style.setProperty("--bg",THEME[i].bg);s.style.setProperty("--fg",THEME[i].fg);s.style.background=THEME[i].bg;
 s.style.setProperty("--fg2",[ "#fff","#1a0b3b","#1a0b3b","#fff","#1a0b3b","#1a0b3b","#fff"][i])}
function enter(i){const c=$$(".ch")[i];c.classList.remove("in");void c.offsetWidth;c.classList.add("on","in");
 if(i===1)count($("#n1 i"),1284630,2200,v=>fmt(v));
 if(i===4)count($("#n4 i"),41.6,2000,v=>"<sup>¥</sup>"+v.toFixed(1)+"<span class='w'>万</span>");
 if(i===6)draw()}
function count(node,to,ms,f){const t0=performance.now()+700;const k=()=>{const p=Math.min(1,Math.max(0,(performance.now()-t0)/ms));const e=p===1?1:1-Math.pow(2,-10*p);node.innerHTML=f(to*e);if(p<1)requestAnimationFrame(k)};k()}
function go(n,dir){if(busy||n<0||n>=C.length||n===cur)return;busy=true;const bars=$$("#wipe i");const col=THEME[n].bg;
 bars.forEach(b=>{b.style.background=col;b.style.transformOrigin=dir>0?"50% 100%":"50% 0"});
 const A=bars.map((b,k)=>b.animate([{transform:"scaleY(0)"},{transform:"scaleY(1)"}],{duration:420,delay:k*34,easing:"cubic-bezier(.7,0,.3,1)",fill:"forwards"}));
 A[A.length-1].onfinish=()=>{$$(".ch")[cur].classList.remove("on","in");cur=n;el=0;setTheme(n);$$(".ch")[n].classList.add("on");
  bars.forEach(b=>b.style.transformOrigin=dir>0?"50% 0":"50% 100%");
  const B=bars.map((b,k)=>b.animate([{transform:"scaleY(1)"},{transform:"scaleY(0)"}],{duration:420,delay:k*34,easing:"cubic-bezier(.7,0,.3,1)",fill:"forwards"}));
  enter(n);B[B.length-1].onfinish=()=>{busy=false;bars.forEach(b=>b.getAnimations().forEach(a=>a.cancel()))}};
 }
function next(){if(!started&&cur===0){started=true;playing=true}go(cur+1,1)}
function prev(){go(cur-1,-1)}
/* 进度与自动播放 */
function tick(now){const dt=now-last;last=now;if(playing&&!hold&&!busy){el+=dt;if(cur<C.length-1&&el>=DUR){el=0;go(cur+1,1)}}
 $$("#prog button i").forEach((b,i)=>b.style.width=(i<cur?100:i===cur?(cur===C.length-1||(cur===0&&!started)?(cur===C.length-1?100:0):Math.min(100,el/DUR*100)):0)+"%");requestAnimationFrame(tick)}
function ppUI(){$("#ppt").textContent=playing?"暂停":"播放";$("#ppi").innerHTML=playing?'<svg viewBox="0 0 12 12"><path d="M2 1h3v10H2zM7 1h3v10H7z"/></svg>':'<svg viewBox="0 0 12 12"><path d="M2 1l9 5-9 5z"/></svg>'}
$("#pp").onclick=e=>{e.stopPropagation();playing=!playing;started=true;ppUI()};
$$("#prog button").forEach(b=>b.onclick=e=>{e.stopPropagation();const i=+b.dataset.i;go(i,i>cur?1:-1)});
addEventListener("keydown",e=>{if(e.target.tagName==="INPUT")return;if(e.key===" "||e.key==="ArrowRight"||e.key==="ArrowDown"){e.preventDefault();next()}else if(e.key==="ArrowLeft"||e.key==="ArrowUp"){e.preventDefault();prev()}else if(e.key==="p"||e.key==="P"){playing=!playing;started=true;ppUI()}});
$("#stage").addEventListener("mousedown",e=>{if(e.target.closest(".no-nav,#pp,#prog"))return;hold=true});
addEventListener("mouseup",()=>hold=false);
$("#stage").addEventListener("click",e=>{if(e.target.closest(".no-nav,#pp,#prog"))return;e.clientX<innerWidth*.3?prev():next()});
$("#start").onclick=e=>{e.stopPropagation();next();ppUI()};
$("#again").onclick=()=>{go(0,-1);started=false;playing=false;ppUI()};
$("#nm").oninput=()=>draw();
/* 分享卡 */
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function draw(){const cv=$("#cv"),c=cv.getContext("2d");const W=1080,H=1440;
 c.fillStyle="#2b1dff";c.fillRect(0,0,W,H);
 c.fillStyle="#d6ff3a";rr(c,48,48,W-96,H-96,20);c.stroke;
 c.strokeStyle="#d6ff3a";c.lineWidth=5;rr(c,40,40,W-80,H-80,24);c.stroke();
 // 星
 c.save();c.translate(870,250);c.rotate(.2);c.fillStyle="#ff4fa3";c.beginPath();for(let i=0;i<28;i++){const a=i*Math.PI/14,r=i%2?100:146;c.lineTo(Math.cos(a)*r,Math.sin(a)*r)}c.closePath();c.fill();c.fillStyle="#2b1dff";c.beginPath();c.arc(0,0,50,0,7);c.fill();c.restore();
 c.fillStyle="#d6ff3a";c.font="500 30px 'DM Mono','Noto Sans SC',monospace";c.fillText("2026  ·  算力年度报告",90,120);
 c.fillStyle="#fff";c.font="900 56px 'Noto Sans SC',sans-serif";c.fillText($("#nm").value||"—",90,200);
 c.fillStyle="#d6ff3a";c.font="400 158px 'Archivo Black','Noto Sans SC',sans-serif";c.fillText("1,284,630",80,520);
 c.fillStyle="#fff";c.font="900 54px 'Noto Sans SC',sans-serif";c.fillText("卡时 · 超过全公司 94% 的同事",90,610);
 const rows=[["最爱的卡","H800","47.7%"],["最忙的一天","3 月 14 日","5,820 卡时"],["主动释放空转","¥41.6 万","3,200 卡时"]];
 rows.forEach((r,i)=>{const y=700+i*150;c.fillStyle="#d6ff3a";c.fillRect(90,y,W-180,4);c.fillStyle="#d6ff3a";c.font="500 26px 'DM Mono','Noto Sans SC',monospace";c.fillText(r[0],90,y+52);c.fillStyle="#fff";c.font="400 66px 'Archivo Black','Noto Sans SC',sans-serif";c.fillText(r[1],90,y+122);c.font="500 30px 'DM Mono','Noto Sans SC',monospace";c.fillStyle="#ff4fa3";c.textAlign="right";c.fillText(r[2],W-90,y+122);c.textAlign="left"});
 c.save();c.translate(800,1260);c.rotate(-.18);c.fillStyle="#d6ff3a";rr(c,-190,-62,380,124,62);c.fill();c.fillStyle="#2b1dff";c.font="900 58px 'Noto Sans SC',sans-serif";c.textAlign="center";c.fillText("夜行训练者",0,20);c.restore();
 c.fillStyle="#d6ff3a";c.font="500 24px 'DM Mono','Noto Sans SC',monospace";c.fillText("栈云 · 示例数据",90,1350)}
$("#dl").onclick=()=>{draw();$("#cv").toBlob(b=>{const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="wrapped-2026.png";document.body.appendChild(a);a.click();a.remove();$("#tip").classList.add("on");setTimeout(()=>$("#tip").classList.remove("on"),2600)})};
/* 起步 */
setTheme(0);$$(".ch")[0].classList.add("on");enter(0);ppUI();requestAnimationFrame(t=>{last=t;tick(t)});
window.__go=n=>{started=true;go(n,1)};
</script></body></html>
