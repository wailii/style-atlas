<style>

  .row .a time { font-size: 11.5px; color: var(--mute); font-variant-numeric: tabular-nums; }
  .row .s { margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
  .row .p { margin-top: 3px; color: var(--mute); font-size: 12px; display: flex; gap: 8px; align-items: center; white-space: nowrap; overflow: hidden; }

  .pvb h1 { font-family: "Noto Serif SC", serif; font-size: 27px; line-height: 1.4; font-weight: 600; letter-spacing: -.01em; }

  .from time { margin-left: auto; font-size: 12px; color: var(--mute); }
  .body { margin-top: 26px; line-height: 1.85; font-size: 14.5px; color: #2a2c2a; }
  .body p + p { margin-top: 12px; }
  .kv { margin-top: 22px; border-top: 1px solid var(--ink); }
  .kv div { display: grid; grid-template-columns: 112px 1fr; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .kv dt { color: var(--mute); font-size: 12.5px; } .kv dd { font-weight: 500; font-variant-numeric: tabular-nums; }

  .nodes { margin-top: 20px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px 24px; }

  .act { position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 56px 20px; background: linear-gradient(to top, #fff 70%, rgba(255,255,255,0)); }
  .act .in { max-width: 700px; margin: 0 auto; display: flex; gap: 10px; align-items: center; }
  .btn { height: 38px; padding: 0 18px; border-radius: 9px; font-weight: 600; font-size: 13.5px; display: flex; align-items: center; gap: 8px; transition: transform .1s, background .15s; }

  <section class="pv">

      <span class="sp2"></span><span class="cnt" id="cnt"></span>
    </div>
    <div class="pvb" id="pvb"></div>
    <div class="act" id="act"></div>
  </section>
</div>

  <button data-k="2"><span>明天早上</span><em>周四 09:00</em><b>2</b></button>
  <button data-k="3"><span>下周一</span><em>11月23日 09:00</em><b>3</b></button>
  <button data-k="4"><span>下个月初</span><em>12月1日 09:00</em><b>4</b></button></div>
<div class="toast" id="toast"><span id="tmsg"></span><button id="undo">撤销</button></div>

  { id: 9, type: "交付", from: "陈婕", org: "交付组", av: "陈", time: "11月16日", subj: "H100 × 8 已交付给搜索组", snip: "节点 gn-h100-031，已验收", body: ["搜索组申请的 H100 × 8 已完成交付并通过验收。"], nodes: [["gn-h100-031", "已验收"]] },
  { id: 10, type: "系统", from: "资源周报", org: "系统", av: "报", time: "11月15日", subj: "资源管理周报 · 11 月第 3 周", snip: "整体利用率 63.4%，较上周 +2.1 个百分点", body: ["本周 GPU 整体利用率 63.4%，较上周上升 2.1 个百分点。", "利用率低于 30% 的节点有 14 台，已列入下周清理建议。"], kv: [["整体利用率", "63.4%", "+2.1 pt"], ["低利用节点", "14 台"], ["本周新增申请", "37 单"]] },
  { id: 11, type: "审批", imp: 1, from: "郑一鸣", org: "安全组", av: "郑", time: "11月15日", subj: "申请公网 IP × 4", snip: "用于渗透测试环境", body: ["郑一鸣申请 4 个公网 IP 用于渗透测试环境，使用期限 30 天。"], kv: [["资源", "公网 IP × 4"], ["使用期限", "30 天"], ["预估费用", "¥ 960"]] },
  { id: 12, type: "维保", from: "机房运维", org: "运维组", av: "运", time: "11月14日", subj: "周六 B1 机房搬迁演练，影响 22 台节点", snip: "11月21日 08:00 – 14:00", body: ["11 月 21 日 08:00 至 14:00 进行 B1 机房搬迁演练，期间 22 台节点会短暂下线，已通知相关使用方。"], kv: [["时间", "11月21日 08:00 – 14:00"], ["影响节点", "22 台"], ["负责人", "运维组 · 孙立"]] }
];
let items, sel, split, view, typ, lastUndo, snzTarget, rejecting;
function init() { items = DATA.map((d) => ({ ...d, st: "inbox", read: false, res: null })); split = "important"; view = "inbox"; typ = null; sel = 1; rejecting = false; renderAll(); }
const inView = () => items.filter((i) => {
  if (view === "snoozed") return i.st === "snoozed";
  if (view === "done") return i.st === "done";
  if (i.st !== "inbox") return false;
  if (typ) return i.type === typ;
  return split === "important" ? i.imp : !i.imp;
});
const count = (f) => items.filter(f).length;

function renderAll() { renderNav(); renderList(); renderPreview(); }
function renderNav() {
  $("#nInbox").textContent = count((i) => i.st === "inbox"); $("#nSnz").textContent = count((i) => i.st === "snoozed") || ""; $("#nDone").textContent = count((i) => i.st === "done") || "";
  $("#tA").textContent = count((i) => i.st === "inbox" && i.type === "审批") || ""; $("#tB").textContent = count((i) => i.st === "inbox" && i.type === "告警") || ""; $("#tC").textContent = count((i) => i.st === "inbox" && i.type === "交付") || "";
  $$(".nv").forEach((n) => n.classList.toggle("on", n.dataset.t ? typ === n.dataset.t && view === "inbox" : !typ && n.dataset.v === view));
  const imp = count((i) => i.st === "inbox" && i.imp), oth = count((i) => i.st === "inbox" && !i.imp), sn = count((i) => i.st === "snoozed");
  $("#splits").innerHTML = view === "inbox" && !typ
    ? [["important", "重要", imp], ["other", "其他", oth], ["snoozed", "稍后", sn]].map(([k, n, c]) => `<button class="sp${(k === split) ? " on" : ""}" data-k="${k}">${n}<i>${c}</i></button>`).join("")
    : `<button class="sp on">${typ ? typ === "审批" ? "资源申请" : typ === "告警" ? "费用告警" : "交付完成" : view === "snoozed" ? "稍后" : "已处理"}<i>${inView().length}</i></button>`;
  $("#lt").firstChild.textContent = view === "inbox" ? "收件箱" : view === "snoozed" ? "稍后" : "已处理";
  const need = count((i) => i.st === "inbox" && i.type === "审批");
  $("#ls").textContent = view === "inbox" ? (need ? `${need} 项待你审批` : "") : "";
}
function renderList() {
  const rows = $("#rows"), list = inView();
  $$(".row", rows).forEach((r) => r.remove());
  if (!list.some((i) => i.id === sel)) sel = list.length ? list[0].id : null;
  const frag = document.createDocumentFragment();
  list.forEach((i) => {
    const el = document.createElement("div");
    el.className = "row" + (i.id === sel ? " sel" : "") + (!i.read && i.st === "inbox" ? " unread" : "");
    el.dataset.id = i.id;
    const [c, b] = TAGS[i.type];
    el.innerHTML = `<div class="a"><b>${i.from}<span style="font-weight:400;color:var(--mute)"> · ${i.org}</span></b><time>${i.snz && i.st === "snoozed" ? "" : i.time}</time></div>
      <div class="s">${i.subj}</div>
      <div class="p"><span class="tg" style="--c:${c};--b:${b}">${i.type === "审批" ? (i.res ? (i.res === "ok" ? "已同意" : "已驳回") : "待审批") : i.type}</span>${i.st === "snoozed" ? `<span class="sn">${i.snz} 回到收件箱</span>` : `<span style="overflow:hidden;text-overflow:ellipsis">${i.snip}</span>`}</div>`;
    frag.appendChild(el);
  });
  rows.appendChild(frag);
  const e = $("#empty"); e.classList.toggle("on", !list.length);
  if (!list.length) {
    const all = count((i) => i.st === "inbox");
    $("#et").textContent = view === "snoozed" ? "没有稍后处理的事项" : view === "done" ? "还没有处理过的事项" : all === 0 ? "全部处理完了" : split === "important" && !typ ? "重要的都处理完了" : "这一栏已经清空";
    $("#ep").textContent = view === "inbox" && all === 0 ? "收件箱已清空，去喝杯水吧。" : view === "inbox" ? `「其他」里还有 ${count((i) => i.st === "inbox")} 封。` : "按 E 归档、H 稍后，处理过的会出现在这里。";
    const svg = $("#empty svg"); svg.innerHTML = svg.innerHTML; // 重播线条
  }
  $("#cnt").textContent = list.length && sel ? `${list.findIndex((i) => i.id === sel) + 1} / ${list.length}` : "";
}
function renderPreview() {
  const i = items.find((x) => x.id === sel), pb = $("#pvb"), act = $("#act");
  $("#bA").style.visibility = $("#bH").style.visibility = i ? "visible" : "hidden";
  if (!i) { pb.innerHTML = `<div class="none">没有选中的事项</div>`; act.innerHTML = ""; return; }
  i.read = true;
  const [c, b] = TAGS[i.type];
  let h = `<div class="inner" key="${i.id}"><h1>${i.subj}</h1>
    <div class="from"><div class="av">${i.av}</div><div><b>${i.from}</b><span>${i.org}</span></div><time>${i.type === "审批" ? "" : ""}${i.time === "昨天" ? "昨天" : i.time.includes("月") ? i.time : "今天 " + i.time}</time></div>
    <div class="body">${i.body.map((p) => `<p>${p}</p>`).join("")}</div>`;
  if (i.kv) h += `<dl class="kv">${i.kv.map((r) => `<div><dt>${r[0]}</dt><dd>${r[1]}${r[2] ? `<small>${r[2]}</small>` : ""}</dd></div>`).join("")}</dl>`;
  if (i.chart) h += chartSvg(i.chart, i.id === 2);
  if (i.nodes) h += `<div class="nodes">${i.nodes.map((n) => `<div class="mono">${n[0]}<b><svg viewBox="0 0 16 16" style="width:13px;height:13px"><path d="M3 8.5 6.5 12 13 4.5"/></svg>${n[1]}</b></div>`).join("")}</div>`;
  h += "</div>";
  pb.innerHTML = h;
  let a = "";
  if (i.st === "done") a = `<div class="in"><span class="done" style="background:var(--wash);color:var(--ink2)">已处理${i.res === "ok" ? " · 已同意" : i.res === "no" ? " · 已驳回" : ""}</span></div>`;
  else if (i.type === "审批" && !i.res) {
    a = rejecting
      ? `<div class="in"><div class="reason"><input id="rsn" placeholder="写一句驳回理由，回车确认" maxlength="40"><small>Esc 取消</small></div><button class="btn sec" id="bCancel">取消</button></div>`
      : `<div class="in"><button class="btn pri" id="bOk"><svg viewBox="0 0 16 16" style="stroke:#fff"><path d="M3 8.5 6.5 12 13 4.5"/></svg>同意</button><button class="btn danger" id="bNo">驳回</button><span class="hint">同意后自动进入下一封</span></div>`;
  } else if (i.type === "告警") a = `<div class="in"><button class="btn pri" id="bKnow">已知悉并归档</button><button class="btn sec" id="bGo">去看费用明细</button></div>`;
  else a = `<div class="in"><button class="btn sec" id="bAr">归档</button></div>`;
  act.innerHTML = a;
  const q = (s, f) => { const e = $(s); if (e) e.onclick = f; };
  q("#bOk", () => decide("ok")); q("#bNo", () => { rejecting = true; renderPreview(); $("#rsn").focus(); }); q("#bCancel", () => { rejecting = false; renderPreview(); });
  q("#bKnow", () => archive()); q("#bAr", () => archive()); q("#bGo", () => toast("已打开费用明细（示意）", true));
  const r = $("#rsn"); if (r) r.onkeydown = (e) => { e.stopPropagation(); if (e.key === "Enter") decide("no", r.value); if (e.key === "Escape") { rejecting = false; renderPreview(); } };
}
function chartSvg(d, bud) {
  const W = 700, H = 120, mx = Math.max(...d, bud ? 100 : 0) * 1.05, mn = 0, x = (k) => k / (d.length - 1) * (W - 6) + 3, y = (v) => H - 8 - (v - mn) / (mx - mn) * (H - 20);
  const p = d.map((v, k) => `${k ? "L" : "M"}${x(k).toFixed(1)} ${y(v).toFixed(1)}`).join("");
  const last = d.length - 1;
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${bud ? `<line x1="0" x2="${W}" y1="${y(100)}" y2="${y(100)}" stroke="#c4452f" stroke-dasharray="4 4" stroke-width="1"/>` : ""}<path d="${p}" stroke="#17181a" vector-effect="non-scaling-stroke"/><circle cx="${x(last)}" cy="${y(d[last])}" r="4" fill="#c4452f" stroke="none"/></svg><div class="cap"><span>${bud ? "11月1日 – 11月18日 · 预算使用率 %" : "近 8 天 · 日费用（千元）"}</span><span>${bud ? "虚线为 100% 预算" : "昨日 31.8"}</span></div></div>`;
}

/* 操作 */
function pick(id) { sel = id; rejecting = false; renderAll(); $(`.row[data-id="${id}"]`)?.scrollIntoView({ block: "nearest" }); }
function move(d) { const l = inView(); if (!l.length) return; const k = Math.max(0, Math.min(l.length - 1, l.findIndex((i) => i.id === sel) + d)); pick(l[k].id); }
function leave(i, patch, msg) {
  const l = inView(), k = l.findIndex((x) => x.id === i.id), next = l[k + 1] || l[k - 1];
  lastUndo = { id: i.id, prev: { st: i.st, res: i.res, snz: i.snz } };
  const el = $(`.row[data-id="${i.id}"]`); if (el) el.className = "row out";
  Object.assign(i, patch); sel = next && next.id !== i.id ? next.id : null; rejecting = false;
  renderNav(); renderPreview(); $$(".row:not(.out)").forEach((r) => r.classList.toggle("sel", +r.dataset.id === sel));
  setTimeout(renderList, 270);
  toast(msg, true);
}
function archive() { const i = items.find((x) => x.id === sel); if (i && i.st === "inbox") leave(i, { st: "done" }, `已归档「${i.subj.slice(0, 14)}…」`); }
function decide(r, why) { const i = items.find((x) => x.id === sel); if (!i) return; leave(i, { st: "done", res: r }, r === "ok" ? `已同意 ${i.from} 的申请，已通知对方` : `已驳回${why ? "：" + why : ""}，已通知 ${i.from}`); }
function snooze(k) {
  const i = snzTarget; closeSnz(); if (!i) return;
  const t = { 1: "今天 18:00", 2: "明天 09:00", 3: "11月23日 09:00", 4: "12月1日 09:00" }[k];
  leave(i, { st: "snoozed", snz: t }, `已稍后，${t} 回到收件箱`);
}
function openSnz() {
  const i = items.find((x) => x.id === sel); if (!i || i.st !== "inbox") return; snzTarget = i;
  const el = $("#snz"), r = $("#bH").getBoundingClientRect(); el.style.left = Math.min(r.left, innerWidth - 270) + "px"; el.style.top = r.bottom + 6 + "px"; el.classList.add("on");
}
function closeSnz() { $("#snz").classList.remove("on"); snzTarget = null; }
$("#snz").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) snooze(b.dataset.k); });
document.addEventListener("pointerdown", (e) => { if (!e.target.closest("#snz") && !e.target.closest("#bH")) closeSnz(); });
let tt; function toast(m, undo) { $("#tmsg").textContent = m; $("#undo").style.display = undo ? "" : "none"; $("#toast").classList.add("on"); clearTimeout(tt); tt = setTimeout(() => $("#toast").classList.remove("on"), 3200); }
function undo() { if (!lastUndo) return; const i = items.find((x) => x.id === lastUndo.id); Object.assign(i, lastUndo.prev); if (view === "done" || view === "snoozed") { view = "inbox"; } sel = i.id; typ = null; split = i.imp ? "important" : "other"; lastUndo = null; $("#toast").classList.remove("on"); renderAll(); }
$("#undo").onclick = undo;

$("#rows").addEventListener("click", (e) => { const r = e.target.closest(".row"); if (r) pick(+r.dataset.id); });
$("#splits").addEventListener("click", (e) => { const b = e.target.closest(".sp"); if (!b || !b.dataset.k) return; if (b.dataset.k === "snoozed") { view = "snoozed"; typ = null; } else split = b.dataset.k; sel = null; rejecting = false; renderAll(); });
$$(".nv").forEach((n) => (n.onclick = () => { if (n.dataset.t) { typ = n.dataset.t; view = "inbox"; } else { view = n.dataset.v; typ = null; } sel = null; rejecting = false; renderAll(); }));
$("#bA").onclick = archive; $("#bH").onclick = openSnz; $("#reset").onclick = init;
document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT" || e.metaKey || e.ctrlKey) return;
  const k = e.key.toLowerCase();
  if ($("#snz").classList.contains("on")) { if ("1234".includes(k) && k) snooze(k); else if (k === "escape") closeSnz(); return; }
  if (k === "j" || k === "arrowdown") { e.preventDefault(); move(1); }
  else if (k === "k" || k === "arrowup") { e.preventDefault(); move(-1); }
  else if (k === "e") archive();
  else if (k === "h") { e.preventDefault(); openSnz(); }
  else if (k === "z") undo();
});
init();
</script>
