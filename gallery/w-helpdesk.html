const MAC = [

let cur = 1, tab = "all", mode = "reply", macIdx = 0, vt = Date.now();
const ST0 = Date.now();
const rem = (t) => t.rem - Math.floor((Date.now() - ST0) / 1000);
const fmt = (s) => { const a = Math.abs(s), h = Math.floor(a / 3600), m = Math.floor(a % 3600 / 60), x = a % 60, p = (n) => String(n).padStart(2, "0"); return (h ? h + ":" : "") + p(m) + ":" + p(x); };
function slaCls(t) { if (t.wait) return "p"; const r = rem(t); return r < 0 ? "d pulse" : r < 600 ? "d" : r < 1800 ? "w" : ""; }
function slaTxt(t) { if (t.wait) return "等待用户"; const r = rem(t); return r < 0 ? "已超时 " + fmt(r) : fmt(r); }
const CLK = '<svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6"/><path d="M8 4.8V8l2.2 1.4"/></svg>';
const sorted = () => T.filter((t) => tab === "all" || (tab === "mine" ? t.own === "我" : t.own === "未分配")).sort((a, b) => (a.wait ? 1 : 0) - (b.wait ? 1 : 0) || rem(a) - rem(b));
let lastOrder = "";
function renderQ(force) {
  const l = sorted(), ord = l.map((t) => t.id).join() + cur + tab;
  if (!force && ord === lastOrder) return; lastOrder = ord;
  $("#qtabs").innerHTML = [["all", "全部", T.length], ["mine", "我的", T.filter((t) => t.own === "我").length], ["un", "未分配", T.filter((t) => t.own === "未分配").length]].map(([k, n, c]) => `<button class="qt${k === tab ? " on" : ""}" data-k="${k}">${n}<i>${c}</i></button>`).join("");
  $("#ql").innerHTML = l.map((t) => `<div class="qi${t.id === cur ? " sel" : ""}" data-id="${t.id}">${t.unread ? '<i class="unr"></i>' : ""}<div class="av" style="--c:${COL[t.id % 8]}">${t.who[0]}</div>
    <div class="m"><div class="n"><i class="pr ${t.pri}"></i><b>${t.who}</b><span style="color:var(--mute);font-size:11.5px;font-weight:400">${t.org}</span></div><div class="s">${t.subj}</div><div class="p">${t.m.filter((m) => m[0] !== "s").slice(-1)[0][3]}</div></div>
    <div class="r"><time>${t.t}</time><span class="sla ${slaCls(t)}" data-sla="${t.id}">${t.wait ? "" : CLK}<span>${slaTxt(t)}</span></span></div></div>`).join("");
  $("#hOpen").textContent = T.length; $("#hOver").textContent = T.filter((t) => !t.wait && rem(t) < 0).length;
}
function tick() {
  $$("[data-sla]").forEach((e) => { const t = T.find((x) => x.id == e.dataset.sla); e.className = "sla " + slaCls(t); e.lastElementChild.textContent = slaTxt(t); });
  const b = $("#bigsla"); if (b) { const t = T.find((x) => x.id === cur); b.className = "sla " + slaCls(t); b.lastElementChild.textContent = slaTxt(t); }
  $("#hOver").textContent = T.filter((t) => !t.wait && rem(t) < 0).length;

}
function renderCv() {
  const t = T.find((x) => x.id === cur); t.unread = 0;
  const msgs = t.m.map((m, i) => {
    if (m[0] === "s") return `<div class="sys">${m[2]} · ${m[3]}</div>`;
    const a = m[0] === "a" ? "a" : m[0] === "n" ? "n" : "c";
    return `<div class="mi ${a}" style="animation-delay:${Math.min(i, 6) * 40}ms">${a === "n" ? "" : `<div class="av" style="--c:${a === "a" ? "#1a2030" : COL[t.id % 8]}">${m[1][0]}</div>`}<div class="b"><div class="who"><span>${a === "n" ? "内部备注 · " : ""}${m[1]}</span><span>${m[2]}</span></div><div class="bb">${m[3]}</div></div></div>`;
  }).join("");

    <div class="big"><div class="l">${t.wait ? "SLA 暂停" : "距 SLA 超时"}</div><span class="sla ${slaCls(t)}" id="bigsla">${t.wait ? "" : CLK}<span>${slaTxt(t)}</span></span></div><button class="btn ok" id="resolve">标为已解决</button></div>
    <div class="msgs" id="msgs">${msgs}</div>
    <div class="comp${mode === "note" ? " note" : ""}" id="comp"><div class="mac" id="mac"></div>
      <div class="tabs"><button class="tb${mode === "reply" ? " on" : ""}" data-m="reply"><svg viewBox="0 0 16 16"><path d="M6 4 2.5 7.5 6 11M3 7.5h6.5a4 4 0 0 1 4 4V12"/></svg>回复用户</button><button class="tb${mode === "note" ? " on" : ""}" data-m="note"><svg viewBox="0 0 16 16"><path d="M3 2.5h10v8l-3.5 3H3zM9.5 13.5v-3h3.5"/></svg>内部备注</button></div>
      <textarea id="ta" placeholder="${mode === "note" ? "写一条只有团队可见的备注…" : "回复 " + t.who + "，输入 # 插入快捷回复"}"></textarea>
      <div class="fo"><span>${mode === "note" ? "仅团队成员可见，不会通知用户" : "将发送给 " + t.who + " 并通知到飞书"}</span><span class="sp"></span><span>⌘↵ 发送</span><button class="send" id="send">${mode === "note" ? "添加备注" : "发送"}</button></div></div>`;
  const m = $("#msgs"); m.scrollTop = m.scrollHeight;

}
function renderCx(t) {
  const c = t.ctx;
  $("#cx").innerHTML = `<div class="cd"><h4>${c.gpus ? "故障设备" : "相关设备"}<span class="mono" style="font-weight:400">${c.host}</span></h4><dl class="kv"><dt>型号</dt><dd>${c.model}</dd><dt>地址</dt><dd class="mono" style="font-weight:400">${c.ip}</dd><dt>机位</dt><dd>${c.loc}</dd><dt>保修</dt><dd>${c.war}</dd></dl>
    ${c.gpus ? `<div class="gpus">${c.gpus.map((g, i) => `<div class="gpu ${g === "ok" ? "" : g}">GPU${i}</div>`).join("")}</div>` : `<div class="gpus" style="grid-template-columns:1fr"><div class="gpu bad" style="font-family:Inter,'Noto Sans SC'">${c.ports}</div></div>`}</div>
    <div class="cd"><h4>负责人与合同</h4><dl class="kv"><dt>使用方</dt><dd>${c.owner}</dd><dt>厂商</dt><dd>${c.vendor}</dd><dt>合同</dt><dd>${c.contract}</dd></dl></div>
    <div class="cd"><h4>历史报修<span style="font-weight:400">${c.hist.length} 条</span></h4>${c.hist.length ? c.hist.map((h) => `<div class="hi"><time>${h[0]}</time><div><b>${h[1]}</b><span>${h[2]}</span></div></div>`).join("") : `<div style="color:var(--mute)">这台设备此前没有报修记录</div>`}</div>
    <div class="cd"><h4>标签</h4>${c.tags.map((x) => `<span class="tag">${x}</span>`).join("")}</div>`;
}
/* 回复框与快捷回复 */
function bindComp() {
  const ta = $("#ta"), mac = $("#mac");
  $$(".tb").forEach((b) => (b.onclick = () => { const v = ta.value; mode = b.dataset.m; renderCv(); $("#ta").value = v; $("#ta").focus(); }));
  const hide = () => mac.classList.remove("on");
  const cand = () => { const m = ta.value.slice(0, ta.selectionStart).match(/#([^\s#]*)$/); if (!m) return null; const q = m[1]; return { q, list: MAC.filter((x) => x[0].includes(q)), start: ta.selectionStart - m[0].length }; };
  const draw = () => { const c = cand(); if (!c || !c.list.length) { hide(); return; } macIdx = Math.min(macIdx, c.list.length - 1);
    mac.innerHTML = `<h6>快捷回复 · ${c.list.length} 条</h6>` + c.list.map((x, i) => `<button data-i="${i}" class="${i === macIdx ? "f" : ""}"><b>${x[0]}</b><span>${x[1]}</span></button>`).join(""); mac.classList.add("on"); };
  const pick = (i) => { const c = cand(); if (!c) return; const x = c.list[i]; ta.value = ta.value.slice(0, c.start) + x[1] + ta.value.slice(ta.selectionStart); ta.focus(); hide(); ta.selectionStart = ta.selectionEnd = c.start + x[1].length; };
  ta.oninput = () => { macIdx = 0; draw(); };
  mac.onmousedown = (e) => { e.preventDefault(); const b = e.target.closest("button"); if (b) pick(+b.dataset.i); };
  ta.onkeydown = (e) => {
    if (mac.classList.contains("on")) { const n = $$("#mac button").length; if (e.key === "ArrowDown") { e.preventDefault(); macIdx = (macIdx + 1) % n; draw(); return; } if (e.key === "ArrowUp") { e.preventDefault(); macIdx = (macIdx + n - 1) % n; draw(); return; } if (e.key === "Enter" || e.key === "Tab") { e.preventDefault(); pick(macIdx); return; } if (e.key === "Escape") { hide(); return; } }

function send() {
  const ta = $("#ta"), v = ta.value.trim(); if (!v) return; const t = T.find((x) => x.id === cur);
  t.m.push([mode === "note" ? "n" : "a", "孙立", "14:26", v]);

}
function resolve() { const t = T.find((x) => x.id === cur); T.splice(T.indexOf(t), 1); const l = sorted(); cur = l.length ? l[0].id : null; toast(`已解决 ${t.n}`); if (cur) { renderCv(); } else { $("#cv").innerHTML = '<div style="margin:auto;color:var(--mute)">队列已清空</div>'; $("#cx").innerHTML = ""; } renderQ(true); }
$("#ql").addEventListener("click", (e) => { const i = e.target.closest(".qi"); if (i) { cur = +i.dataset.id; renderCv(); renderQ(true); } });

renderCv(); renderQ(true); setInterval(tick, 1000);
</script>
