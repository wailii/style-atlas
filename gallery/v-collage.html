<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080">
<title>今晚 AI 热点前三条 · 纸拼贴</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Special+Elite&family=Noto+Sans+SC:wght@500;700;900&family=Noto+Serif+SC:wght@600;900&display=swap" rel="stylesheet">
<style>
  /* 设计空间 432×768（参考页 390 宽的同一套数值），整体放大 2.5 倍 = 1080×1920 */
  :root { --bg: #ebe3d0; --paper: #fbf8f0; --ink: #141210; --red: #e2402b; --mustard: #f1b73a; --gray: #6e675b; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }
  body { font-family: "Noto Sans SC", sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
  #stage { position: absolute; left: 0; top: 0; width: 432px; height: 768px; overflow: hidden; transform-origin: 0 0; background: var(--bg); }
  #world { position: absolute; left: 0; top: 0; width: 2160px; height: 768px; background: var(--bg) var(--fiber); }
  .panel { position: absolute; top: 0; width: 432px; height: 768px; }
  #grain { position: absolute; inset: 0; pointer-events: none; background-image: var(--grain); mix-blend-mode: multiply; z-index: 20; }
  #hdr, #bar { position: absolute; left: 0; top: 0; width: 432px; height: 768px; pointer-events: none; }
  #hdr { z-index: 5; } #bar { z-index: 6; }
  .row { display: flex; justify-content: center; align-items: flex-end; gap: 3px; }

  /* 每块纸：外层管阴影和抖动，内层管撕边 */
  .scrap { position: relative; display: block; width: max-content; filter: drop-shadow(0 1px 0 rgba(40,30,10,.10)) drop-shadow(1.5px 3px 2.5px rgba(40,30,10,.22)); }
  .scrap > .pp { position: relative; background: var(--paper); white-space: nowrap; }
  .abs, .scrap.abs { position: absolute; }

  /* 勒索信字块 */
  .rk > .pp { padding: 2px 7px 0; line-height: 1.05; font-weight: 900; }
  .rk.A > .pp { padding: 0 6px; font-weight: 400; }

  /* 页头 */
  .h1 > .pp { background: var(--ink); color: var(--paper); font-family: Anton, sans-serif; font-size: 38px; padding: 0 6px; line-height: 1.05; }
  .h2 > .pp { background: var(--mustard); font-family: "Noto Serif SC", serif; font-weight: 900; font-size: 31px; padding: 2px 7px 0; line-height: 1.05; }
  .h3 > .pp { background: var(--paper); font-family: "Noto Serif SC", serif; font-weight: 900; font-size: 40px; padding: 2px 7px 0; line-height: 1.05; }
  .date { font-family: "Special Elite", "Noto Serif SC", monospace; font-size: 13px; color: var(--gray); letter-spacing: .5px; white-space: nowrap; }
  .tag > .pp { background: var(--mustard); padding: 9px 13px 8px; font-family: "Special Elite", "Noto Serif SC", monospace; font-size: 15px; }

  /* 主图 */
  .photo { position: absolute; }
  .photo canvas { position: absolute; left: -4px; top: 0; width: calc(100% + 8px); height: 100%; filter: drop-shadow(1.5px 3px 3px rgba(40,30,10,.25)); }
  .tape { position: absolute; width: 78px; height: 24px; background: rgba(236, 222, 180, .78); mix-blend-mode: multiply; clip-path: polygon(0 8%, 6% 0, 12% 10%, 18% 0, 24% 9%, 30% 0, 100% 0, 100% 92%, 94% 100%, 88% 90%, 82% 100%, 76% 91%, 70% 100%, 0 100%); }
  .sticker { z-index: 3; }
  .sticker > .pp { width: 84px; height: 84px; border-radius: 50%; background: var(--red); color: #fff; display: grid; place-items: center; font-family: Anton, sans-serif; font-size: 40px; padding-top: 2px; }
  .marker { position: absolute; left: 0; top: 0; width: 432px; height: 768px; overflow: visible; pointer-events: none; z-index: 4; }

  /* 标题纸条 + 摘要 + 便签 */
  .stack { position: absolute; left: 0; top: 372px; width: 432px; z-index: 2; }
  .lines { margin-left: 76px; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
  .lines .pp { font-weight: 900; font-size: 24px; line-height: 1.32; padding: 3px 10px 4px; }
  .lines .key .pp { background: var(--ink); color: var(--paper); }
  .memo { margin: 14px 0 0 30px; width: 372px; }
  .memo > .pp { white-space: normal; background: #f4eedf; padding: 12px 14px 12px; font-family: "Noto Serif SC", serif; font-weight: 600; font-size: 14.5px; line-height: 24px; color: #3b362d; background-image: repeating-linear-gradient(transparent 0 23px, rgba(120,100,60,.13) 23px 24px); background-position: 0 9px; }
  .label { position: absolute; right: 14px; top: calc(100% - 12px); z-index: 3; }
  .label > .pp { background: var(--mustard); padding: 6px 13px 7px; font-family: "Special Elite", "Noto Serif SC", monospace; font-size: 13px; line-height: 1.25; }
  .label .hr { display: flex; align-items: baseline; gap: 7px; }
  .label b { font-family: Anton, sans-serif; font-weight: 400; font-size: 42px; line-height: 1; letter-spacing: .5px; }

  /* 小图、列表 */
  .thumb { position: relative; width: 92px; height: 84px; margin-top: 4px; }
  .thumb canvas { position: absolute; inset: 0; width: 100%; height: 100%; filter: drop-shadow(1px 2px 2px rgba(40,30,10,.25)); }
  .thumb .tape { width: 44px; height: 15px; left: 24px; top: -6px; transform: rotate(-6deg); }
  .thumb.big { position: absolute; width: 124px; height: 96px; margin: 0; }
  .thumb.big .tape { width: 54px; height: 17px; left: 34px; }
  .mini { position: absolute; left: -12px; top: -12px; z-index: 3; }
  .mini > .pp { width: 34px; height: 34px; border-radius: 50%; background: var(--red); color: #fff; display: grid; place-items: center; font-family: Anton, sans-serif; font-size: 17px; padding-top: 1px; }
  .it { position: absolute; left: 16px; width: 400px; }
  .it > .pp { display: grid; grid-template-columns: 1fr 92px; gap: 12px; padding: 14px 12px 15px 14px; }
  .it .no { margin-bottom: 7px; }
  .it .no > .pp { background: var(--ink); color: var(--paper); font-family: Anton, sans-serif; font-size: 17px; letter-spacing: .5px; padding: 1px 7px 0; line-height: 1.25; }
  .it h3 { font-size: 18px; font-weight: 700; line-height: 1.45; white-space: normal; }
  .it p { margin-top: 6px; font-family: "Noto Serif SC", serif; font-weight: 600; font-size: 13px; line-height: 1.5; color: var(--gray); }

  /* 底栏 */
  .tabs { bottom: 0; }
  .tabs > .pp { background: var(--ink); display: grid; grid-template-columns: repeat(3, 1fr); padding: 14px 6px 16px; }
  .tab { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; color: #b9b09c; font-size: 12px; font-weight: 700; }
  .tab i { font-style: normal; font-family: Anton, sans-serif; font-weight: 400; font-size: 24px; line-height: 1; position: relative; z-index: 1; letter-spacing: .5px; }
  .tab span { position: relative; z-index: 1; }
  .tab.on { color: #fff; }
  .tab .bgp { position: absolute; left: 14px; right: 14px; top: -7px; bottom: -6px; width: auto; }
  .tab .bgp > .pp { width: 100%; height: 100%; background: var(--red); }
</style>
</head>
<body>
<div id="stage">
  <div id="world"></div>
  <div id="hdr"></div>
  <div id="bar"></div>
  <div id="grain"></div>
</div>
<script src="vendor/rough.js"></script>
<script src="data.js"></script>
<script src="common.js"></script>
<script src="engines.js"></script>
<script>
const { tear, halftoneCutout, dropAt, jitterAt } = Engines;

/* ───────── 时间轴（全部以帧计，12 帧/秒；一共 144 帧 = 12 秒） ───────── */
const FPS = 12, TOTAL = 144, DROP = 6;                 // 落下 = steps(6) 在 0.5s = 6 帧
const PAN = [18, 54, 90, 126];                         // 镜头平移起始帧：intro→1→2→3→收尾，每次 6 帧
const ARR = PAN.map((p) => p + 6);                     // 到位帧
const SCENE = { photo: 0, sticker: 3, strip: 6, memo: 12, label: 13, marker: 14 }; // 相对到位帧的偏移

/* 随机性只用于生成贴图：用 common.js 的 seeded() 固定种子，保证每次渲染一样 */

/* ───────── 内容 ───────── */
const TOP = HOT.slice(0, 3);
const KEYS = TOP.map((h) => KEY[h.rank]);
const scrap = (cls, inner, r = 0, style = "") => `<div class="scrap ${cls}" data-r="${r}" style="${style}"><div class="pp">${inner}</div></div>`;
const V = { ink: "var(--ink)", paper: "var(--paper)", red: "var(--red)", mustard: "var(--mustard)", white: "#fff" };
const FF = { serif: "'Noto Serif SC', serif", sans: "'Noto Sans SC', sans-serif", anton: "Anton, sans-serif" };
const rk = (ch, ff, size, bg, fg, r) => scrap("rk " + (ff === "anton" ? "A" : ""), esc(ch), r).replace('class="pp"', `class="pp" style="font-family:${FF[ff]};font-size:${size}px;background:${V[bg]};color:${V[fg]}"`);

// 摘要截断：优先停在逗号处，不把单词截成半截
const clipClause = (s, n) => { if (s.length <= n) return s; const cut = s.slice(0, n), k = Math.max(cut.lastIndexOf("，"), cut.lastIndexOf("、"), cut.lastIndexOf("；")); return (k > n * 0.5 ? cut.slice(0, k) : cut.replace(/[A-Za-z0-9.]+$/, "").replace(/[，、；\s]+$/, "")) + "…"; };
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
let READY = false, PENDING = null, apply = null;
window.VIDEO = { width: 1080, height: 1920, duration: TOTAL / FPS, fps: FPS };   // fps = 画面更新频率，渲染时按 24 取样即可
window.seek = (t) => { if (READY) { apply(t); return; } PENDING = t; return window.ready; };
window.ready = (async () => {
  const stage = document.getElementById("stage"), world = document.getElementById("world");
  const allText = TOP.map((h) => h.title + h.summary.slice(0, 160) + h.latest).join("") + "AI热点今晚前三条就这三条按热度排序10月22日周四实时热度家在说Nº0123456789 ";
  const loadFont = async (f) => { for (let i = 0; i < 4; i++) { try { await document.fonts.load(f, allText); return; } catch (e) { await wait(400); } } };
  await Promise.race([Promise.all(['900 24px "Noto Sans SC"', '700 24px "Noto Sans SC"', '500 24px "Noto Sans SC"', '600 14px "Noto Serif SC"', '900 24px "Noto Serif SC"', "24px Anton", '24px "Special Elite"'].map(loadFont)), wait(15000)]);
  await document.fonts.ready;
  const imgs = await Promise.all(TOP.map((h) => loadImage(h.cover)));

  stage.style.setProperty("--grain", `url(${seeded(11, () => grainURL(170, 0.09, 40))})`);
  stage.style.setProperty("--fiber", `url(${seeded(7, fiberURL)})`);

  /* 标题拆成纸条：关键词单独一条黑纸，其余按宽度断行 */
  const strips = (h, k) => {
    const t = shortTitle(h), key = KEYS[k], i = t.indexOf(key);
    const segs = i < 0 ? [[t, false]] : [[t.slice(0, i), false], [key, true], [t.slice(i + key.length), false]];
    const FONT = "900 24px 'Noto Sans SC'", out = [];
    for (const [s, isKey] of segs) {
      const txt = s.replace(/^[，、,\s]+|[，、,\s]+$/g, ""); if (!txt) continue;
      let ls = splitLines(txt, FONT, 320);
      // 末行只剩一两个字时，收窄行宽重排，避免孤字
      for (let w = 300; ls.length > 1 && ls[ls.length - 1].length < 3 && w > 150; w -= 20) ls = splitLines(txt, FONT, w);
      for (const l of ls) out.push([l, isKey]);
    }
    return out;
  };
  // 收尾页的标题：只在 关键词前 / 关键词后 / 逗号后 三个位置里挑一个换行点，两行都放得下且最均匀
  const ctx2 = document.createElement("canvas").getContext("2d"); ctx2.font = "700 18px 'Noto Sans SC'";
  const breakTitle = (h, k) => {
    const t = shortTitle(h), key = KEYS[k], i = t.indexOf(key), c = t.indexOf("，");
    const cands = [i, i + key.length, c >= 0 ? c + 1 : -1].filter((p) => p > 0 && p < t.length);
    let best = null;
    for (const p of cands) { const a = t.slice(0, p).trim(), b = t.slice(p).trim(), m = Math.max(ctx2.measureText(a).width, ctx2.measureText(b).width); if (m <= 268 && (!best || m < best.m)) best = { a, b, m }; }
    return best ? `${esc(best.a)}<br>${esc(best.b)}` : esc(t);
  };

  /* ───────── 构建 DOM ───────── */
  // 0 号：开场
  const rows = [[0, 1], [2, 3, 4, 5], [6, 7, 8]];
  const RK = [["今", "serif", 84, "ink", "paper", -3], ["晚", "sans", 76, "mustard", "ink", 2.5], ["A", "anton", 92, "ink", "paper", -4], ["I", "anton", 92, "paper", "ink", 3], ["热", "serif", 80, "mustard", "ink", -2], ["点", "sans", 78, "red", "white", 3.5], ["前", "serif", 84, "paper", "ink", 2], ["三", "sans", 80, "red", "white", -3], ["条", "serif", 80, "ink", "paper", 2]];
  const panel0 = `<section class="panel" style="left:0">
    <div class="abs" style="left:0;top:104px;width:432px;display:flex;flex-direction:column;align-items:center;gap:8px">
      ${rows.map((r) => `<div class="row">${r.map((i) => rk(...RK[i])).join("")}</div>`).join("")}
    </div>
    ${TOP.map((h, i) => `<div class="thumb big abs" data-r="${[-3, 2, 3][i]}" style="left:${[24, 154, 284][i]}px;top:${[478, 470, 484][i]}px"><canvas></canvas><div class="tape"></div>${scrap("mini round", pad2(h.rank), -8)}</div>`).join("")}
    <div class="abs" style="left:0;top:612px;width:432px;display:flex;justify-content:center;gap:10px;align-items:center">
      ${scrap("dt0", `<span style="font-family:'Special Elite','Noto Serif SC',monospace;font-size:19px">10月22日 · 周四 · 实时</span>`, -1.2).replace('class="pp"', 'class="pp" style="padding:7px 12px 6px"')}
      ${scrap("tag", "按热度排序", 2)}
    </div>
  </section>`;

  // 1～3 号：每条一页
  const itemPanel = (h, k) => {
    const st = strips(h, k);
    return `<section class="panel" style="left:${(k + 1) * 432}px">
      <div class="photo" data-r="${[-1.2, 1, -0.8][k]}" style="left:20px;top:134px;width:392px;height:260px"><canvas></canvas><div class="tape" style="left:18px;top:-8px;transform:rotate(-8deg)"></div><div class="tape" style="right:10px;top:-6px;transform:rotate(7deg)"></div></div>
      ${scrap("sticker abs round", pad2(h.rank), -8, "left:6px;top:316px")}
      <div class="stack">
        <div class="lines">${st.map(([l, key], i) => scrap(key ? "key st" : "st", esc(l), [-1.4, 1.1, -0.6, 0.9][i % 4])).join("")}</div>
        ${scrap("memo", esc(clipClause(firstLine(h.summary), 66)), 0.6)}
        ${scrap("label", `<div class="hr"><span>热度</span><b>${heatText(h)}</b></div><div>${h.sources} 家在说</div>`, -3)}
      </div>
      <svg class="marker"></svg>
    </section>`;
  };

  // 4 号：收尾
  const OUT = [["就", "sans", 52, "red", "white", -3], ["这", "serif", 52, "paper", "ink", 2], ["三", "sans", 52, "ink", "paper", -2], ["条", "serif", 52, "mustard", "ink", 3]];
  const panel4 = `<section class="panel" style="left:${4 * 432}px">
    <div class="abs" style="left:0;top:138px;width:432px"><div class="row">${OUT.map((o) => rk(...o)).join("")}</div></div>
    ${TOP.map((h, k) => `<div class="scrap it" data-r="${[-0.7, 0.6, -0.4][k]}" style="top:${232 + k * 146}px"><div class="pp">
      <div>
        ${scrap("no", "Nº " + pad2(h.rank), -2)}
        <h3>${breakTitle(h, k)}</h3>
        <p>热度 ${heatText(h)} · ${h.sources} 家在说</p>
      </div>
      <div class="thumb"><canvas data-r="${k % 2 ? -3 : 3}"></canvas><div class="tape"></div></div>
    </div></div>`).join("")}
  </section>`;

  world.innerHTML = panel0 + TOP.map(itemPanel).join("") + panel4;

  // 页头（跟着镜头不动）
  document.getElementById("hdr").innerHTML = `
    <div class="abs" style="left:18px;top:52px;display:flex;align-items:flex-end;gap:3px">${scrap("h1", "AI", -4)}${scrap("h2", "热", 3)}${scrap("h3", "点", -2)}</div>
    <div class="date abs" data-r="0" style="left:20px;top:104px">10月22日 · 周四 · 实时</div>
    ${scrap("tag abs", "今晚前三条", 2.5, "right:16px;top:60px")}`;

  // 底栏
  document.getElementById("bar").innerHTML = scrap("tabs abs", `${TOP.map((h, k) => `<div class="tab" id="tab${k}">${scrap("bgp", "", [-5, 4, -3][k])}<i>${pad2(h.rank)}</i><span>${esc(KEYS[k])}</span></div>`).join("")}`, 0, "left:0;width:432px");

  /* ───────── 撕边（参考页同款参数） ───────── */
  let seed = 1;
  document.querySelectorAll(".scrap > .pp").forEach((pp) => {
    const s = pp.parentElement;
    if (s.classList.contains("round")) return;
    if (s.classList.contains("tabs")) return tear(pp, 4, seed++, [1, 0, 0, 0]);
    tear(pp, s.classList.contains("it") ? 2.6 : s.classList.contains("rk") ? 2.2 : 2, seed++);
  });

  /* ───────── 网点照片（必须在整体放大之前画，它按元素当前尺寸取像素） ───────── */
  world.querySelectorAll(".photo canvas").forEach((cv, k) => halftoneCutout(cv, imgs[k], { cell: 5, rim: 8, seed: 3 + k }));
  world.querySelectorAll(".panel:first-child .thumb canvas").forEach((cv, k) => halftoneCutout(cv, imgs[k], { cell: 3.4, rim: 4, seed: 9 + k }));
  world.querySelectorAll(".it .thumb canvas").forEach((cv, k) => halftoneCutout(cv, imgs[k], { cell: 3.4, rim: 4, seed: 9 + k }));

  /* ───────── 马克笔圈（rough.js，路径只生成一次，进度由 seek 控制） ───────── */
  const markers = [...world.querySelectorAll(".marker")].map((svg, k) => {
    const rc = rough.svg(svg), g = rc.ellipse(48, 358, 112, 104, { stroke: "#e2402b", strokeWidth: 3.2, roughness: 2.2, bowing: 2, seed: 5 + k });
    svg.appendChild(g);
    const ps = [...g.querySelectorAll("path")].map((p) => { const L = p.getTotalLength(); p.style.strokeDasharray = L; p.style.strokeLinecap = "round"; return { p, L }; });
    return { svg, ps, f0: ARR[k] + SCENE.marker };
  });

  /* ───────── 每块纸出现的帧、落下前的偏移 ───────── */
  const D = new Map();
  const drop = (el, f0, from = {}) => D.set(el, { f0, dur: DROP, x: from.x ?? (rnd(f0 * 3) - 0.5) * 60, y: from.y ?? -40, r: from.r ?? (rnd(f0 * 3 + 1) - 0.5) * 14, f1: from.f1 ?? 1e9 });
  const q = (s, root = document) => root.querySelector(s), qa = (s, root = document) => [...root.querySelectorAll(s)];
  const P = qa(".panel", world);

  // 开场
  qa(".rk", P[0]).forEach((el, i) => drop(el, 1 + i));
  qa(".thumb.big", P[0]).forEach((el, i) => drop(el, 5 + i * 2, { y: -50, x: (i - 1) * 20 }));
  drop(q(".dt0", P[0]), 10, { y: 20, x: -30, r: 0 });
  drop(q(".tag", P[0]), 11, { x: 40, y: -10 });
  // 页头 + 底栏
  drop(q(".h1", document), ARR[0] + 0); drop(q(".h2", document), ARR[0] + 2); drop(q(".h3", document), ARR[0] + 4);
  drop(q(".date", document), ARR[0] + 6, { y: 0, x: -20, r: 0 });
  drop(q("#hdr .tag", document), ARR[0] + 3, { x: 40, y: -10 });
  drop(q(".tabs", document), 7, { y: 60, x: 0, r: 0 });
  // 三条
  TOP.forEach((h, k) => {
    const a = ARR[k], pn = P[k + 1];
    drop(q(".photo", pn), a + SCENE.photo, { y: -60, x: 10, r: -6 });
    drop(q(".sticker", pn), a + SCENE.sticker, { x: -50, y: 20, r: -30 });
    qa(".lines .st", pn).forEach((s, i) => drop(s, a + SCENE.strip + i * 2, { x: 80, y: 0 }));
    drop(q(".memo", pn), a + SCENE.memo, { y: 40 });
    drop(q(".label", pn), a + SCENE.label, { x: 40, y: 10, r: 20 });
    // 底栏里这一条的红纸：到位时贴上，下一次平移开始时撕掉
    const bg = q("#tab" + k + " .bgp", document);
    drop(bg, a, { y: -20, x: 0, r: 20 }); D.get(bg).dur = 3; D.get(bg).f1 = PAN[k + 1];
  });
  // 收尾
  qa(".rk", P[4]).forEach((el, i) => drop(el, PAN[3] + 2 + i));
  qa(".it", P[4]).forEach((el, i) => drop(el, PAN[3] + 4 + i * 2, { y: 70, x: (i % 2 ? 1 : -1) * 30 }));

  /* ───────── seek：每一帧只由 t 决定 ───────── */
  const els = qa("[data-r]");
  const jitEls = new Set(els.filter((e) => e.matches(".scrap, .photo, .thumb")));
  const tabs = [0, 1, 2].map((k) => document.getElementById("tab" + k));
  apply = (t) => {
    const f = Math.max(0, Math.min(TOTAL, Math.floor(t * FPS + 1e-6)));
    let cam = 0; PAN.forEach((p, i) => { const n = f - p; if (n >= 6) cam = i + 1; else if (n >= 0) cam = i + n / 6; });
    world.style.translate = `${(-cam * 432).toFixed(2)}px 0`;             // 镜头：6 帧逐格平移
    els.forEach((el, i) => {
      const d = D.get(el), base = +el.dataset.r;
      let vis = true, tx = 0, ty = 0, rot = base, sc = 1, op = 1, moving = false;
      if (d) {
        if (f >= d.f1) vis = false;
        else { const st = dropAt(f, d.f0, { dur: d.dur, x: d.x, y: d.y, r: d.r }); vis = st.visible; tx = st.tx; ty = st.ty; rot = base + st.rot; sc = st.scale; op = st.opacity; moving = vis && !st.done; }
      }
      if (vis && !moving && jitEls.has(el)) {                             // 落定后一直微微抖：每 2 帧重摆，±0.45px ±0.25°
        const j = jitterAt(f, i); tx = j.tx; ty = j.ty; rot = base + j.rot;
      }
      el.style.visibility = vis ? "" : "hidden";
      el.style.translate = `${tx.toFixed(2)}px ${ty.toFixed(2)}px`;
      el.style.rotate = `${rot.toFixed(2)}deg`;
      el.style.scale = sc.toFixed(3);
      el.style.opacity = op.toFixed(2);
    });
    // 马克笔：steps(8) 画出来
    markers.forEach((m) => {
      const n = f - m.f0, pr = n < 0 ? 0 : n >= 8 ? 1 : n / 8;
      m.svg.style.visibility = pr > 0 ? "" : "hidden";
      m.ps.forEach(({ p, L }) => (p.style.strokeDashoffset = L * (1 - pr)));
    });
    // 底栏：当前这一条字变白
    tabs.forEach((el, k) => el.classList.toggle("on", f >= ARR[k] && f < PAN[k + 1]));
  };

  /* 整体放大到 1080×1920（?fit 时按窗口缩放，方便人看） */
  const SC = /[?&]fit/.test(location.search) ? Math.min(innerWidth / 432, innerHeight / 768) : 2.5;
  stage.style.transform = `scale(${SC})`;
  READY = true; window.__ready = true;
  apply(PENDING ?? 0);
})();
</script>
</body>
