function parse(f){
  const out=[]; let o=0,n=0;
  f.raw.split("\n").forEach(l=>{
    if(l==="" ) return;
    if(l.startsWith("@@")){ const m=/-(\d+)(?:,\d+)? \+(\d+)/.exec(l); o=+m[1]; n=+m[2]; out.push({t:"hk",text:l}); return; }
    const c=l[0], tx=l.slice(1);
    if(c==="+") out.push({t:"add",n:n++,text:tx});
    else if(c==="-") out.push({t:"del",o:o++,text:tx});
    else out.push({t:"ctx",o:o++,n:n++,text:tx});
  });
  f.lines=out; f.add=out.filter(x=>x.t==="add").length; f.del=out.filter(x=>x.t==="del").length;
}

  while((m=re.exec(esc))){ parts.push(esc.slice(last,m.index)); const t=m[0];

    else if(/^[A-Z]\w+$/.test(t)) parts.push(`<span class="tk-f">${t}</span>`);
    else parts.push(t);
    last=m.index+t.length; }
  parts.push(esc.slice(last)); return parts.join("");
}

  const t=T[k]; if(!t) return "";
  if(t.res&&!t.open) return `<div class="th"><div class="thr res"><div class="rsum" data-tog="${k}"><span class="tick"><svg viewBox="0 0 16 16"><path d="M3.5 8.5l3 3 6-7"/></svg></span><b>${t.c[0].who}</b> 的评论已解决 <span>· ${t.c.length} 条 · 点击展开</span></div></div></div>`;
  return `<div class="th"><div class="thr ${t.res?"res":""}">${t.c.map(c=>`<div class="cmt"><span class="av" style="background:${c.who==="陆遥"?"#1c1b1a":c.who==="周博"?"#2a5d7a":c.who==="吴越"?"#7b5bd6":"#b5562a"}">${c.av}</span><div class="b"><h>${c.who}<span>${c.t}</span></h><p>${c.text}</p></div></div>`).join("")}
    <div class="tact"><input data-reply="${k}" placeholder="回复…（回车发送）"><button class="ok" data-res="${k}">${t.res?"重新打开":"标记已解决"}</button>${t.res?`<button data-tog="${k}">折叠</button>`:""}</div></div></div>`;
}
function compHTML(k){ return `<div class="th comp"><div class="thr"><textarea id="cta" placeholder="写下你的评论，⌘↵ 发送"></textarea><div class="tact"><span class="sp"></span><button data-cx="1">取消</button><button class="ok" data-cs="${k}" style="background:var(--ink);color:#fff;border-color:var(--ink)">评论</button></div></div></div>`; }
function drawFile(fi){
  const f=FILES[fi]; const [dir,name]=[f.path.slice(0,f.path.lastIndexOf("/")+1),f.path.slice(f.path.lastIndexOf("/")+1)];
  let body="";
  if(mode==="uni"){
    f.lines.forEach(l=>{
      if(l.t==="hk"){ body+=`<div class="ln hk"><span></span><span></span><span>${l.text}</span></div>`; return; }
      const k=l.n!=null?key(fi,l.n):null, has=k&&T[k];
      body+=`<div class="ln ${l.t} ${has?"has":""}"><span class="n" data-k="${l.n!=null?key(fi,l.n):""}">${l.o??""}</span><span class="n" data-k="${l.n!=null?key(fi,l.n):""}">${l.n??""}</span><span>${l.t==="add"?"+":l.t==="del"?"-":" "} ${hl(l.text)}</span></div>`;
      if(has) body+=threadHTML(k); if(k&&composing===k) body+=compHTML(k);
    });
  } else {
    const L=f.lines; for(let i=0;i<L.length;i++){
      const l=L[i];
      if(l.t==="hk"){ body+=`<div class="ln hk"><span></span><span>${l.text}</span><span></span><span></span></div>`; continue; }
      if(l.t==="ctx"){ const k=key(fi,l.n); body+=row(l,l,k); if(T[k]) body+=threadHTML(k); if(composing===k) body+=compHTML(k); continue; }
      if(l.t==="del"){ const dels=[],adds=[]; let j=i; while(L[j]&&L[j].t==="del") dels.push(L[j++]); while(L[j]&&L[j].t==="add") adds.push(L[j++]); i=j-1;
        const m=Math.max(dels.length,adds.length);
        for(let q=0;q<m;q++){ const a=dels[q],b=adds[q]; const k=b?key(fi,b.n):null; body+=row(a,b,k); if(k&&T[k]) body+=threadHTML(k); if(k&&composing===k) body+=compHTML(k); }
        continue; }
      const k=key(fi,l.n); body+=row(null,l,k); if(T[k]) body+=threadHTML(k); if(composing===k) body+=compHTML(k);
    }
  }
  return `<div class="file ${collapsed.has(fi)?"col":""}" id="f${fi}" data-f="${fi}"><div class="fh" data-fh="${fi}"><svg class="chev" viewBox="0 0 16 16"><path d="M4 6l4 4 4-4"/></svg><span class="p"><span>${dir}</span>${name}</span><span class="cn">+${f.add}<s>-${f.del}</s></span><label><input type="checkbox" data-vw="${fi}" ${viewed.has(fi)?"checked":""}>已查看</label></div><div class="code ${mode==="split"?"sp2":""}">${body}</div></div>`;
}
function row(a,b,k){
  const has=k&&T[k]; const ac=a?(a.t==="del"?"del":""):"emp", bc=b?(b.t==="add"?"add":""):"emp";
  return `<div class="ln ${has?"has":""}"><span class="n ${ac}">${a?.o??""}</span><span class="c ${ac}">${a?hl(a.text):""}</span><span class="n ${bc}" data-k="${b?k:""}">${b?.n??""}</span><span class="c ${bc}">${b?hl(b.text):""}</span></div>`;
}
function drawDiff(keep){
  const sc=$("#diff").scrollTop;
  $("#diff").innerHTML=`<div class="dbar"><b>${FILES.length} 个文件</b><span class="mono" style="color:var(--ok)">+${FILES.reduce((a,f)=>a+f.add,0)}</span><span class="mono" style="color:var(--bad)">-${FILES.reduce((a,f)=>a+f.del,0)}</span><div class="sp"></div><div class="seg" id="seg"><button data-m="uni" class="${mode==="uni"?"on":""}">统一</button><button data-m="split" class="${mode==="split"?"on":""}">并排</button></div></div>`+FILES.map((_,i)=>drawFile(i)).join("")+`<div class="note">示例数据 · 代码与人名均为虚构</div><div class="tail"></div>`;
  if(keep) $("#diff").scrollTop=sc; drawTree(); progress();
}
function drawTree(){
  const cnt=fi=>Object.keys(T).filter(k=>k.startsWith(fi+":")&&!T[k].res).length;
  let last="";
  $("#tree").innerHTML=`<h6>改动文件<span class="mono">${FILES.length}</span></h6>`+FILES.map((f,i)=>{
    const dir=f.path.slice(0,f.path.lastIndexOf("/")+1), nm=f.path.slice(dir.length); let h="";
    if(dir!==last){ h=`<div class="dir">${dir}</div>`; last=dir; }
    const c=cnt(i);
    return h+`<div class="fi ${cur===i?"on":""} ${viewed.has(i)?"vw":""}" data-go="${i}"><span class="nm">${nm}</span>${c?`<span class="cm">${c}</span>`:""}<span class="cn"><b>+${f.add}</b><s>-${f.del}</s></span><span class="vb" data-vb="${i}" title="标记已查看"><svg viewBox="0 0 16 16"><path d="M3.5 8.5l3 3 6-7"/></svg></span></div>`;
  }).join("");
}
function progress(){ $("#pgT").textContent=`已查看 ${viewed.size} / ${FILES.length}`; $("#pgB").style.width=viewed.size/FILES.length*100+"%"; }
function toast(t){ const el=$("#toast"); el.textContent=t; el.classList.add("on"); clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove("on"),1800); }
function setViewed(i,v){ v?viewed.add(i):viewed.delete(i); v?collapsed.add(i):collapsed.delete(i); drawDiff(true); }
document.addEventListener("click",e=>{
  const g=e.target.closest("[data-vb]"); if(g){ e.stopPropagation(); const i=+g.dataset.vb; setViewed(i,!viewed.has(i)); return; }
  const go=e.target.closest("[data-go]"); if(go){ const i=+go.dataset.go; cur=i; drawTree(); const el=$("#f"+i); if(el.classList.contains("col")) el.classList.remove("col"), collapsed.delete(i); $("#diff").scrollTo({top:el.offsetTop-52}); return; }
  if(e.target.closest("[data-vw]")){ const c=e.target.closest("[data-vw]"); setViewed(+c.dataset.vw,c.checked); return; }
  const fh=e.target.closest("[data-fh]"); if(fh&&!e.target.closest("label")){ const i=+fh.dataset.fh; collapsed.has(i)?collapsed.delete(i):collapsed.add(i); $("#f"+i).classList.toggle("col"); return; }
  const m=e.target.closest("#seg button"); if(m){ mode=m.dataset.m; drawDiff(true); return; }
  const n=e.target.closest(".n[data-k]"); if(n&&n.dataset.k){ const k=n.dataset.k; if(T[k]){ T[k].open=true; } else composing=k; drawDiff(true); const ta=$("#cta"); ta&&ta.focus(); return; }
  const r=e.target.closest("[data-res]"); if(r){ const k=r.dataset.res; T[k].res=!T[k].res; T[k].open=false; drawDiff(true); toast(T[k].res?"已标记为已解决":"已重新打开"); return; }
  const tg=e.target.closest("[data-tog]"); if(tg){ const k=tg.dataset.tog; T[k].open=!T[k].open; drawDiff(true); return; }
  if(e.target.closest("[data-cx]")){ composing=null; drawDiff(true); return; }
  const cs=e.target.closest("[data-cs]"); if(cs){ submit(cs.dataset.cs); return; }
  const ck=e.target.closest(".ck"); if(ck){ showLog(ck.dataset.k); return; }
  if(!e.target.closest("#log")) $("#log").classList.remove("on"),document.querySelectorAll(".ck").forEach(x=>x.classList.remove("on"));
  if(e.target.closest("#bReq")){ approved=!approved; $("#bReq").innerHTML=approved?'<svg viewBox="0 0 16 16"><path d="M3 8l3.5 3.5L13 4.5"/></svg>已批准':'<svg viewBox="0 0 16 16"><path d="M3 8l3.5 3.5L13 4.5"/></svg>批准'; $("#bReq").style.background=approved?"var(--add)":""; const mg=$("#bMerge"); mg.disabled=!approved; mg.textContent=approved?"合并到 main":"合并（需 1 个批准）"; toast(approved?"已批准，可以合并":"已撤回批准"); }
  if(e.target.closest("#bMerge")&&!$("#bMerge").disabled){ const open=Object.values(T).filter(t=>!t.res).length; toast(open?`还有 ${open} 条未解决的评论`:"已合并到 main"); }
});
function submit(k){ const ta=$("#cta"); const v=ta.value.trim(); if(!v) return; T[k]=T[k]||{c:[],res:false}; T[k].c.push({who:"陆遥",av:"陆",t:"刚刚",text:v.replace(/</g,"&lt;")}); composing=null; drawDiff(true); toast("评论已添加"); }
document.addEventListener("keydown",e=>{
  if((e.metaKey||e.ctrlKey)&&e.key==="Enter"&&composing) submit(composing);
  if(e.key==="Enter"&&e.target.dataset&&e.target.dataset.reply){ const k=e.target.dataset.reply, v=e.target.value.trim(); if(v){ T[k].c.push({who:"陆遥",av:"陆",t:"刚刚",text:v.replace(/</g,"&lt;")}); drawDiff(true); } }
});
function showLog(k){
  const L={
   build:`<div class="h"><span>构建 · 成功</span><span class="m">1m 42s</span></div><span class="m">[09:13:02]</span> 拉取依赖 ........ <span class="g">缓存命中</span><br><span class="m">[09:13:11]</span> 编译 scheduler / api ........ <span class="g">ok</span><br><span class="m">[09:14:30]</span> 打包镜像 sched:482-3f9a ........ <span class="g">ok</span><br><span class="m">[09:14:44]</span> 推送镜像 ........ <span class="g">完成 · 212 MB</span>`,
   test:`<div class="h"><span>单元测试 · 128 通过</span><span class="m">38s</span></div><span class="m">[09:15:01]</span> tests/test_quota.py ........ <span class="g">3 passed</span><br><span class="m">[09:15:09]</span> tests/test_policy.py ........ <span class="g">21 passed</span><br><span class="m">[09:15:30]</span> tests/test_api.py ........ <span class="g">17 passed</span><br><span class="m">[09:15:39]</span> 其余 87 项 ........ <span class="g">passed</span><br><span class="m">覆盖率 87.4%（+1.2%）</span>`,
   scan:`<div class="h"><span>代码扫描 · 1 个警告 · 3 个提示</span><span class="m">24s</span></div><span class="y">警告</span> api/quota_api.py:23 · <span class="y">manager 以 store=None 初始化，运行时会空引用</span><br><span class="m">提示</span> scheduler/quota.py:71 · 变量可能为 None<br><span class="m">提示</span> scheduler/policy.py:48 · 建议用 is False 以外的显式判断<br><span class="m">提示</span> tests/test_quota.py:5 · 单行定义多个函数`
  };
  const lg=$("#log"), was=lg.classList.contains("on")&&lg.dataset.k===k; document.querySelectorAll(".ck").forEach(x=>x.classList.remove("on"));
  if(was){ lg.classList.remove("on"); return; } lg.innerHTML=L[k]; lg.dataset.k=k; lg.classList.add("on"); document.querySelector(`.ck[data-k=${k}]`).classList.add("on");
}
$("#diff").addEventListener("scroll",()=>{ const top=$("#diff").scrollTop+120; let c=0; FILES.forEach((_,i)=>{ if($("#f"+i).offsetTop<=top) c=i; }); if(c!==cur){ cur=c; drawTree(); } });
drawDiff();
</script>
</body>
</html>
