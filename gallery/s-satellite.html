<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>卫星实景</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1b1e23; --mute: #5d636d; --line: #e3e5e8; --sheet: #ffffff; --chip: rgba(18,20,23,.78);
    --aoi: #ffd60a; --aoi-ink: #1a1500; --survey: #ff5a36; --sel: #0a66c2; --map: #2a2f2a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: var(--map); }
  body { font-family: Inter, "Noto Sans SC", sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .mono { font-family: "JetBrains Mono", monospace; }
  .app { position: relative; height: 100vh; overflow: hidden; }

  /* 地图：真航拍铺底，拖动平移，按钮缩放；标注和影像一起动 */
  .map { position: absolute; left: 0; right: 0; top: 0; height: 548px; overflow: hidden; background: #1e221f; touch-action: none; cursor: grab; }
  .map.drag { cursor: grabbing; }
  .world { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
  .world.fly { transition: transform .9s cubic-bezier(.4,0,.2,1); }
  .world canvas { position: absolute; left: 0; top: 0; display: block; }
  .world svg { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
  .imgfx { transition: filter .45s ease, opacity .45s ease; }
  .map.swap .imgfx { filter: blur(6px) saturate(.6); opacity: .55; }
  /* 标注：黄框 = 关注区（AOI），白虚线 = 剖面线，橙色 = 量出来的尺寸 */
  .aoi { fill: rgba(255,214,10,.06); stroke: var(--aoi); stroke-width: 2; vector-effect: non-scaling-stroke; }
  .aoi-c { fill: none; stroke: rgba(0,0,0,.45); stroke-width: 4; vector-effect: non-scaling-stroke; }
  .dim { stroke: #fff; stroke-width: 1; vector-effect: non-scaling-stroke; }
  .tr { stroke: #fff; stroke-width: 1.6; stroke-dasharray: 6 4; vector-effect: non-scaling-stroke; fill: none; }
  .tr-c { stroke: rgba(0,0,0,.4); stroke-width: 3.6; vector-effect: non-scaling-stroke; fill: none; }
  .grid { stroke: rgba(255,255,255,.22); stroke-width: 1; vector-effect: non-scaling-stroke; }
  .draw { stroke-dasharray: var(--len); stroke-dashoffset: var(--len); animation: draw .7s cubic-bezier(.3,.6,.2,1) forwards; animation-delay: var(--d, 0s); }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .tag { position: absolute; transform-origin: 0 100%; display: flex; align-items: stretch; font: 600 10.5px/1 Inter, "Noto Sans SC"; white-space: nowrap; filter: drop-shadow(0 1px 2px rgba(0,0,0,.35)); opacity: 0; animation: pop .35s ease-out forwards; animation-delay: var(--d, 0s); }
  .tag b { background: var(--aoi); color: var(--aoi-ink); padding: 5px 6px 4px; font: 700 10px/1 "JetBrains Mono"; }
  .tag span { background: var(--chip); color: #fff; padding: 5px 7px 4px; }
  .dimlab { position: absolute; font: 600 9px/1 "JetBrains Mono"; color: #fff; background: rgba(18,20,23,.66); padding: 3px 4px 2px; border-radius: 2px; white-space: nowrap; opacity: 0; animation: pop .3s ease-out forwards; animation-delay: var(--d, 0s); }
  .ab { position: absolute; width: 17px; height: 17px; margin: -8.5px 0 0 -8.5px; border-radius: 50%; background: #fff; color: #111; font: 700 9.5px/17px "JetBrains Mono"; text-align: center; box-shadow: 0 0 0 1.5px rgba(0,0,0,.35); opacity: 0; animation: pop .3s ease-out forwards; animation-delay: var(--d, 0s); }
  @keyframes pop { from { opacity: 0; transform: translateY(4px) scale(.96); } to { opacity: 1; transform: none; } }

  /* 画框上的东西（不随地图动）：网格字母、十字准星、比例尺、指北针、坐标读数、影像署名 */
  .hud { position: absolute; inset: 0; pointer-events: none; }
  .scrim { position: absolute; left: 0; right: 0; top: 0; height: 120px; pointer-events: none; background: linear-gradient(rgba(0,0,0,.38), rgba(0,0,0,0)); }
  .gl { position: absolute; font: 600 9px/1 "JetBrains Mono"; color: rgba(255,255,255,.9); text-shadow: 0 0 2px rgba(0,0,0,.9), 0 0 6px rgba(0,0,0,.5); }
  .cross { position: absolute; width: 26px; height: 26px; margin: -13px 0 0 -13px; }
  .cross::before, .cross::after { content: ""; position: absolute; background: #fff; box-shadow: 0 0 0 .5px rgba(0,0,0,.5); }
  .cross::before { left: 12.5px; top: 0; width: 1px; height: 26px; } .cross::after { top: 12.5px; left: 0; height: 1px; width: 26px; }
  .readout { position: absolute; left: 12px; bottom: 44px; display: flex; flex-direction: column; gap: 4px; }
  .pill { align-self: flex-start; background: var(--chip); color: #fff; border-radius: 4px; padding: 4px 7px 3px; font: 500 9.5px/1.25 "JetBrains Mono"; letter-spacing: .01em; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
  .pill em { font-style: normal; color: rgba(255,255,255,.62); }
  .scale { display: flex; align-items: flex-end; gap: 6px; }
  .scale i { display: block; height: 6px; border: 1.5px solid #fff; border-top: 0; box-shadow: 0 1px 0 rgba(0,0,0,.45), -1px 0 0 rgba(0,0,0,.25); }
  .scale span { font: 600 9px/1 "JetBrains Mono"; color: #fff; text-shadow: 0 0 2px #000, 0 0 5px rgba(0,0,0,.6); }
  .credit { position: absolute; right: 10px; bottom: 44px; max-width: 196px; text-align: right; font: 500 8px/1.35 Inter, "Noto Sans SC"; color: rgba(255,255,255,.9); text-shadow: 0 0 2px rgba(0,0,0,.95), 0 0 6px rgba(0,0,0,.6); }

  /* 顶部：状态栏 + 搜索框 + 右侧工具 */
  .sb { position: absolute; left: 0; right: 0; top: 0; height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 4px 26px 0; font: 600 15px Inter; color: #fff; text-shadow: 0 0 6px rgba(0,0,0,.6); z-index: 6; pointer-events: none; }
  .sb i { font-style: normal; font-size: 12px; }
  .search { position: absolute; left: 12px; right: 12px; top: 48px; height: 46px; z-index: 6; display: flex; align-items: center; gap: 10px; padding: 0 8px 0 14px; background: #fff; border-radius: 23px; box-shadow: 0 1px 2px rgba(0,0,0,.18), 0 4px 14px rgba(0,0,0,.18); }
  .search svg { width: 18px; height: 18px; flex: none; color: var(--mute); }
  .search .q { flex: 1; min-width: 0; font: 600 15px/1.1 "Noto Sans SC", Inter; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .search .q small { font: 500 12px Inter, "Noto Sans SC"; color: var(--mute); margin-left: 6px; }
  .search .av { width: 32px; height: 32px; border-radius: 50%; background: #e9ecef; display: grid; place-items: center; font: 700 11px "JetBrains Mono"; color: var(--ink); }
  .tools { position: absolute; right: 12px; top: 106px; z-index: 6; display: flex; flex-direction: column; gap: 10px; }
  .tool { width: 40px; height: 40px; border-radius: 50%; background: #fff; display: grid; place-items: center; box-shadow: 0 1px 2px rgba(0,0,0,.2), 0 3px 10px rgba(0,0,0,.16); color: #2f343b; }
  .tool svg { width: 19px; height: 19px; }
  .tool.on { color: var(--sel); }
  .zoom { width: 40px; border-radius: 20px; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.2), 0 3px 10px rgba(0,0,0,.16); overflow: hidden; }
  .zoom button { width: 40px; height: 38px; display: grid; place-items: center; font: 400 22px/1 Inter; color: #2f343b; }
  .zoom button + button { border-top: 1px solid var(--line); }
  .north { position: relative; }
  .north svg { width: 26px; height: 26px; }
  .north small { position: absolute; bottom: 3px; left: 0; right: 0; text-align: center; font: 700 6.5px/1 "Noto Sans SC"; color: #6b7178; }
  .north svg { margin-top: -6px; }

  /* 底部抽屉：选中的关注区 + 剖面图 + 全部热点 */
  .sheet { position: absolute; left: 0; right: 0; top: 520px; bottom: 0; z-index: 7; background: var(--sheet); border-radius: 16px 16px 0 0; box-shadow: 0 -2px 14px rgba(0,0,0,.22); display: flex; flex-direction: column; transform: translateY(40px); opacity: 0; animation: sheet .7s cubic-bezier(.2,.8,.2,1) .5s forwards; }
  @keyframes sheet { to { transform: none; opacity: 1; } }
  .sheet.tall { top: 120px; transition: top .45s cubic-bezier(.2,.8,.2,1); }
  .sheet:not(.tall) { transition: top .45s cubic-bezier(.2,.8,.2,1); }
  .handle { flex: none; height: 20px; display: grid; place-items: center; }
  .handle i { width: 36px; height: 4px; border-radius: 2px; background: #d3d6da; }
  .sc { flex: 1; overflow-y: auto; scrollbar-width: none; padding: 0 16px 100px; }
  .sc::-webkit-scrollbar { display: none; }
  .sel .k { display: flex; align-items: center; gap: 8px; font: 500 10.5px/1 "JetBrains Mono"; color: var(--mute); }
  .sel .k b { background: var(--aoi); color: var(--aoi-ink); font-weight: 700; padding: 3px 5px 2px; border-radius: 2px; }
  .sel h2 { margin-top: 8px; font: 700 18px/1.35 "Noto Sans SC", Inter; letter-spacing: -.01em; }
  .stats { margin-top: 10px; display: flex; gap: 6px; flex-wrap: wrap; }
  .stats span { border: 1px solid var(--line); border-radius: 14px; padding: 5px 9px 4px; font: 500 11.5px/1 Inter, "Noto Sans SC"; color: #33383f; }
  .stats span b { font: 700 11.5px "JetBrains Mono"; color: var(--ink); }
  .up { color: #0f8a4a !important; } .down { color: #c7362b !important; }
  .prof { margin-top: 14px; border: 1px solid var(--line); border-radius: 10px; padding: 10px 10px 8px; }
  .prof .t { display: flex; justify-content: space-between; font: 600 11px/1 "Noto Sans SC", Inter; color: #33383f; }
  .prof .t em { font: 500 10px "JetBrains Mono"; font-style: normal; color: var(--mute); }
  .prof svg { display: block; width: 100%; height: 92px; margin-top: 6px; overflow: visible; }
  .prof .ax { font: 500 8.5px "JetBrains Mono"; fill: var(--mute); }
  .prof p { margin-top: 4px; font: 400 10.5px/1.5 "Noto Sans SC"; color: var(--mute); }
  .sum { margin-top: 12px; font: 400 13px/1.65 "Noto Sans SC"; color: #3a3f46; }
  .hd2 { margin: 18px 0 4px; display: flex; justify-content: space-between; align-items: baseline; font: 700 14px "Noto Sans SC"; }
  .hd2 small { font: 500 11px Inter, "Noto Sans SC"; color: var(--mute); }
  .row { width: 100%; display: grid; grid-template-columns: 76px 1fr; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); text-align: left; align-items: center; }
  .row canvas { width: 76px; height: 76px; border-radius: 8px; display: block; background: #3a3f3a; }
  .row .k { font: 500 10px/1 "JetBrains Mono"; color: var(--mute); }
  .row .k b { color: var(--ink); font-weight: 700; }
  .row h3 { margin-top: 5px; font: 600 14px/1.4 "Noto Sans SC", Inter; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .row .m { margin-top: 4px; font: 500 11px/1 Inter, "Noto Sans SC"; color: var(--mute); }
  .row .m b { font: 600 11px "JetBrains Mono"; color: var(--ink); }
  .row.on { background: linear-gradient(90deg, rgba(10,102,194,.07), rgba(10,102,194,0)); box-shadow: inset 3px 0 0 var(--sel); margin: 0 -16px; padding-left: 16px; padding-right: 16px; width: calc(100% + 32px); }
  .row { opacity: 0; animation: pop .4s ease-out forwards; animation-delay: var(--d, 0s); }
  .note { margin-top: 14px; font: 400 10.5px/1.6 "Noto Sans SC"; color: var(--mute); }

  .dock { position: absolute; left: 0; right: 0; bottom: 0; z-index: 9; height: 82px; padding: 8px 8px 26px; display: grid; grid-template-columns: repeat(5, 1fr); background: #fff; box-shadow: 0 -1px 0 var(--line); }
  .tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font: 500 10.5px "Noto Sans SC"; color: var(--mute); }
  .tab svg { width: 20px; height: 20px; }
  .tab span { display: grid; place-items: center; width: 52px; height: 28px; border-radius: 14px; transition: background .2s; }
  .tab.on { color: var(--sel); font-weight: 700; }
  .tab.on span { background: rgba(10,102,194,.12); }
</style>
</head>
<body>
<div class="app" id="app">
  <div class="map" id="map">
    <div class="world" id="world"><canvas id="img" class="imgfx"></canvas><svg id="ann"></svg><div id="labs"></div></div>
    <div class="scrim"></div><div class="hud" id="hud"></div>
  </div>
  <div class="sb"><span id="clock"></span><i>5G ▮▮▮</i></div>
  <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 L20 20"/></svg><div class="q">AI 热点<small>10.22 晚 · 8 处关注区</small></div><button class="av" id="me" aria-label="回到第 1 处">01</button></div>
  <div class="tools">
    <button class="tool" id="layers" aria-label="标注开关"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3 L21 8 L12 13 L3 8 Z"/><path d="M3 12.5 L12 17.5 L21 12.5"/><path d="M3 16.5 L12 21.5 L21 16.5"/></svg></button>
    <div class="zoom"><button id="zin" aria-label="放大">+</button><button id="zout" aria-label="缩小">−</button></div>
    <button class="tool north" id="north" aria-label="复位"><svg viewBox="0 0 26 26"><path d="M13 3 L17.5 13 L13 11.6 L8.5 13 Z" fill="#d93025"/><path d="M13 23 L17.5 13 L13 14.4 L8.5 13 Z" fill="#9aa0a6"/><text x="13" y="3.2" font-size="0" fill="none">N</text></svg><small>示意</small></button>
  </div>
  <section class="sheet" id="sheet"><button class="handle" id="handle" aria-label="展开或收起"><i></i></button><div class="sc" id="sc"></div></section>
  <nav class="dock" id="dock"></nav>
</div>
<script src="data.js"></script>
<script src="common.js"></script>
<script>
// ───────────────────────── 影像：真航拍（Unsplash，无定位数据）——位置一律用图像网格 / 归一化坐标，不编经纬度 ─────────────────────────
const IMG = {
  roundabout: { src: "img/real/satellite-roundabout.jpg", by: "Maximillian Conacher", exif: "DJI FC220 · 4.7mm f/2.2 1/100s ISO 116", w: 683, h: 512 },
  campus: { src: "img/real/satellite-campus.jpg", by: "Victor", exif: "DJI FC2103 · 4.5mm f/2.8 1/640s ISO 100", w: 684, h: 512 },
  stadium: { src: "img/real/satellite-stadium.jpg", by: "Alexander Londoño", exif: "DJI FC220 · 4.7mm f/2.2 1/1900s ISO 100", w: 719, h: 512 },
  harbor: { src: "img/real/satellite-harbor.jpg", by: "Michael Olsen", exif: "DJI FC220 · 4.7mm f/2.2 1/1150s ISO 100", w: 683, h: 512 },
  shore: { src: "img/real/satellite-shore.jpg", by: "Andreas M", exif: "DJI FC220 · 4.7mm f/2.2 1/610s ISO 100", w: 683, h: 512 },
  downtown: { src: "img/real/satellite-downtown.jpg", by: "Alexander Pidgeon", exif: "Canon EOS 70D · 1/500s ISO 100", w: 768, h: 431 },
};
// 每条热点 = 一处关注区：用哪张影像、框在图上哪儿（0～1 归一化）、剖面线从哪到哪
const AOI = {
  1: { img: "roundabout", box: [.385, .33, .615, .64], tr: [[.03, .515], [.97, .50]] },
  2: { img: "campus", box: [.40, .24, .74, .56], tr: [[.05, .40], [.96, .40]] },
  3: { img: "stadium", box: [.385, .22, .625, .70], tr: [[.04, .46], [.96, .46]] },
  4: { img: "harbor", box: [.085, .40, .205, .555], tr: [[.04, .48], [.96, .52]] },
  5: { img: "shore", box: [.405, .46, .515, .575], tr: [[.08, .20], [.92, .80]] },
  6: { img: "downtown", box: [.40, .56, .63, .86], tr: [[.04, .70], [.96, .66]] },
  7: { img: "roundabout", box: [.185, .60, .375, .83], tr: [[.03, .72], [.97, .70]] },
  8: { img: "harbor", box: [.615, .665, .735, .80], tr: [[.04, .74], [.96, .72]] },
};
const COLS = "ABCDEFGH", ROWS = 6;
const gridRef = (x, y) => COLS[Math.min(7, Math.floor(x * 8))] + (Math.min(ROWS - 1, Math.floor(y * ROWS)) + 1);
const cen = (b) => [(b[0] + b[2]) / 2, (b[1] + b[3]) / 2];
const f3 = (v) => v.toFixed(3);
const trendCls = (h) => (h.trend === "up" ? "up" : h.trend === "down" ? "down" : "");
const arrow = (h) => (h.trend === "up" ? "▲" : h.trend === "down" ? "▼" : "▶");
const pct = (h) => `${h.trendPct > 0 ? "+" : ""}${h.trendPct}%`;
const $ = (id) => document.getElementById(id);
$("clock").textContent = nowHM();
const MAPW = 390, MAPH = 548, VIEWH = 520;   // 地图露出来的高度到抽屉顶为止

// ───────────────────────── 影像处理：遥感图的样子（略降饱和、提反差、一点大气蓝雾、锐化） ─────────────────────────
const cache = {};
async function processed(key, W, H) {
  const id = key + W; if (cache[id]) return cache[id];
  const im = await loadImage(IMG[key].src), c = coverCanvas(im, W, H), x = c.getContext("2d"), d = x.getImageData(0, 0, W, H), p = d.data, src = new Uint8ClampedArray(p);
  for (let y = 1; y < H - 1; y++) for (let xx = 1; xx < W - 1; xx++) {
    const i = (y * W + xx) * 4;
    for (let ch = 0; ch < 3; ch++) {
      const v = src[i + ch], blur = (src[i + ch - 4] + src[i + ch + 4] + src[i + ch - W * 4] + src[i + ch + W * 4]) / 4;
      let o = v + (v - blur) * .55;                                  // 反锐化
      o = (o - 128) * 1.07 + 128;                                    // 反差
      p[i + ch] = o;
    }
    const l = .3 * p[i] + .59 * p[i + 1] + .11 * p[i + 2];
    p[i] = (l + (p[i] - l) * .86) * .97 + 160 * .03; p[i + 1] = (l + (p[i + 1] - l) * .86) * .97 + 172 * .03; p[i + 2] = (l + (p[i + 2] - l) * .86) * .97 + 190 * .03;
  }
  x.putImageData(d, 0, 0);
  return (cache[id] = c);
}
// 瓦片加载：先整张模糊低清，再一块块变清楚（地图 App 的样子）
let loadToken = 0;
function tileIn(canvas, full, { tiles = [6, 5], stagger = 45, fade = 260 } = {}) {
  const tok = ++loadToken, x = canvas.getContext("2d"), W = canvas.width, H = canvas.height;
  const lo = document.createElement("canvas"); lo.width = Math.ceil(W / 14); lo.height = Math.ceil(H / 14); lo.getContext("2d").drawImage(full, 0, 0, lo.width, lo.height);
  x.imageSmoothingEnabled = true; x.drawImage(lo, 0, 0, W, H);
  const [tc, tr] = tiles, tw = W / tc, th = H / tr, order = [];
  for (let j = 0; j < tr; j++) for (let i = 0; i < tc; i++) order.push([i, j, Math.hypot(i - tc / 2, j - tr / 2) + rnd(i * 13 + j) * 1.6]);
  order.sort((a, b) => a[2] - b[2]);
  const t0 = performance.now();
  return new Promise((ok) => {
    const step = () => {
      if (tok !== loadToken) return ok();
      const t = performance.now() - t0; let done = true;
      order.forEach(([i, j], k) => {
        const a = Math.min(1, Math.max(0, (t - k * stagger) / fade)); if (a < 1) done = false; if (a <= 0) return;
        x.globalAlpha = a; x.drawImage(full, i * tw, j * th, tw + 1, th + 1, i * tw, j * th, tw + 1, th + 1);
      });
      x.globalAlpha = 1;
      if (done) { x.drawImage(full, 0, 0); ok(); } else setTimeout(step, 30);
    };
    step();
  });
}

// ───────────────────────── 地图：平移、缩放、标注 ─────────────────────────
const map = $("map"), world = $("world"), cv = $("img"), ann = $("ann"), labs = $("labs"), hud = $("hud");
const DPR = Math.min(2, window.devicePixelRatio || 1);
let cur = 1, WW = 0, WH = 0, view = { s: 1, x: 0, y: 0 }, showAnn = true;
const sizeFor = (key) => { const im = IMG[key], s = Math.max(MAPW / im.w, MAPH / im.h) * 1.02; return [Math.round(im.w * s), Math.round(im.h * s)]; };
function clampView(v) {
  const sw = WW * v.s, sh = WH * v.s;
  v.x = Math.min(0, Math.max(MAPW - sw, v.x)); v.y = Math.min(0, Math.max(MAPH - sh, v.y)); return v;
}
function apply(fly = false) {
  world.classList.toggle("fly", fly);
  world.style.transform = `translate(${view.x}px, ${view.y}px) scale(${view.s})`;
  // 画框边上的网格字母 / 行号跟着影像走
  const cx = (MAPW / 2 - view.x) / (WW * view.s), cy = (VIEWH / 2 + 20 - view.y) / (WH * view.s);
  let h = "";
  for (let i = 0; i < 8; i++) { const px = view.x + ((i + .5) / 8) * WW * view.s; if (px > 8 && px < MAPW - 60) h += `<div class="gl" style="left:${px - 3}px;top:102px">${COLS[i]}</div>`; }
  for (let j = 0; j < ROWS; j++) { const py = view.y + ((j + .5) / ROWS) * WH * view.s; if (py > 116 && py < VIEWH - 96) h += `<div class="gl" style="left:6px;top:${py - 4}px">${j + 1}</div>`; }
  const px100 = 100 * (WW / IMG[AOI[cur].img].w) * view.s;   // 原图 100 px 在屏幕上多长
  const im = IMG[AOI[cur].img];
  h += `<div class="cross" style="left:${MAPW / 2}px;top:${VIEWH / 2 + 20}px"></div>
    <div class="readout"><div class="scale"><i style="width:${px100.toFixed(1)}px"></i><span>原图 100 px</span></div>
      <div class="pill">网格 ${gridRef(cx, cy)} · x ${f3(cx)} y ${f3(cy)}</div></div>
    <div class="credit">影像 © ${esc(im.by)} / Unsplash（示意）<br>${esc(im.exif)}<br>无定位数据 · 坐标为图像坐标</div>`;
  hud.innerHTML = h;
}
function drawAnn(n, anim = true) {
  const a = AOI[n], h = HOT[n - 1], [x0, y0, x1, y1] = a.box.map((v, i) => v * (i % 2 ? WH : WW)), im = IMG[a.img];
  // 剖面线：穿过关注区中心，左右各伸出去一段，保证在画面里
  const [cu, cvv] = cen(a.box), half = Math.min(.34, (MAPW / 2 - 72) / WW);
  const [[tx0, ty0], [tx1, ty1]] = [[Math.max(.03, cu - half), cvv + .05], [Math.min(.97, cu + half), cvv - .03]].map(([u, v]) => [u * WW, v * WH]);
  ann.setAttribute("width", WW); ann.setAttribute("height", WH); ann.setAttribute("viewBox", `0 0 ${WW} ${WH}`);
  const per = 2 * ((x1 - x0) + (y1 - y0)), tl = Math.hypot(tx1 - tx0, ty1 - ty0), dd = (s) => (anim ? s : 0);
  let g = "";
  for (let i = 1; i < 8; i++) g += `<line class="grid" x1="${(i / 8) * WW}" y1="0" x2="${(i / 8) * WW}" y2="${WH}"/>`;
  for (let j = 1; j < ROWS; j++) g += `<line class="grid" x1="0" y1="${(j / ROWS) * WH}" x2="${WW}" y2="${(j / ROWS) * WH}"/>`;
  // 剖面线 A–A′
  // 虚线不能用 dasharray 做「画出来」，用遮罩：遮罩里的实线画出来，虚线跟着露出来
  g += `<mask id="trm" maskUnits="userSpaceOnUse"><path class="draw" style="--len:${tl};--d:${dd(.9)}s" d="M${tx0} ${ty0} L${tx1} ${ty1}" stroke="#fff" stroke-width="8" fill="none"/></mask>`;
  g += `<g mask="url(#trm)"><path class="tr-c" d="M${tx0} ${ty0} L${tx1} ${ty1}"/><path class="tr" d="M${tx0} ${ty0} L${tx1} ${ty1}"/></g>`;
  // 关注区黄框 + 角标 + 尺寸线（单位：原图像素）
  g += `<rect class="aoi-c draw" style="--len:${per};--d:${dd(.6)}s" x="${x0}" y="${y0}" width="${x1 - x0}" height="${y1 - y0}"/><rect class="aoi draw" style="--len:${per};--d:${dd(.6)}s" x="${x0}" y="${y0}" width="${x1 - x0}" height="${y1 - y0}"/>`;
  const dy = y1 + 9, dx = x0 - 9;
  g += `<path class="dim" d="M${x0} ${dy} L${x1} ${dy} M${x0} ${dy - 4} L${x0} ${dy + 4} M${x1} ${dy - 4} L${x1} ${dy + 4} M${dx} ${y0} L${dx} ${y1} M${dx - 4} ${y0} L${dx + 4} ${y0} M${dx - 4} ${y1} L${dx + 4} ${y1}"/>`;
  ann.innerHTML = g;
  const bw = Math.round((a.box[2] - a.box[0]) * im.w), bh = Math.round((a.box[3] - a.box[1]) * im.h);
  labs.innerHTML = `<div class="tag" style="left:${x0}px;top:${y0 - 22}px;--d:${dd(1.1)}s"><b>AOI-${pad2(n)}</b><span>${esc(clip(shortTitle(h), 14))} · 热度 ${heatText(h)}</span></div>
    <div class="dimlab" style="left:${(x0 + x1) / 2 - 18}px;top:${dy + 4}px;--d:${dd(1.25)}s">${bw} px</div>
    <div class="dimlab" style="left:${dx - 40}px;top:${(y0 + y1) / 2 - 6}px;--d:${dd(1.25)}s">${bh} px</div>
    <div class="ab" style="left:${tx0}px;top:${ty0}px;--d:${dd(1.3)}s">A</div><div class="ab" style="left:${tx1}px;top:${ty1}px;--d:${dd(1.4)}s">A′</div>`;
  labs.style.display = ann.style.display = showAnn ? "" : "none";
}
function centerOn(n) {
  const [u, v] = cen(AOI[n].box);
  view.s = 1; view.x = MAPW / 2 - u * WW; view.y = VIEWH / 2 + 30 - v * WH; clampView(view);
}
async function show(n, first = false) {
  cur = n; const key = AOI[n].img;
  [WW, WH] = sizeFor(key);
  if (!first) { map.classList.add("swap"); await new Promise((r) => setTimeout(r, 280)); }
  cv.width = Math.round(WW * DPR); cv.height = Math.round(WH * DPR); cv.style.width = WW + "px"; cv.style.height = WH + "px";
  centerOn(n); apply(false); drawAnn(n, true);
  map.classList.remove("swap");
  const full = await processed(key, cv.width, cv.height);
  tileIn(cv, full, first ? {} : { stagger: 30, fade: 200 });
  renderSheet(n);
}

// 拖动平移
{
  let st = null;
  map.addEventListener("pointerdown", (e) => { st = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y, moved: false }; map.setPointerCapture(e.pointerId); map.classList.add("drag"); });
  map.addEventListener("pointermove", (e) => { if (!st) return; const dx = e.clientX - st.x, dy = e.clientY - st.y; if (Math.abs(dx) + Math.abs(dy) > 3) st.moved = true; view.x = st.vx + dx; view.y = st.vy + dy; clampView(view); apply(false); });
  const end = () => { st = null; map.classList.remove("drag"); };
  map.addEventListener("pointerup", end); map.addEventListener("pointercancel", end);
}
function zoomBy(f) {
  const ns = Math.min(2.6, Math.max(1, view.s * f)), cx = MAPW / 2, cy = VIEWH / 2 + 20;
  view.x = cx - (cx - view.x) * (ns / view.s); view.y = cy - (cy - view.y) * (ns / view.s); view.s = ns; clampView(view); apply(true);
}
$("zin").onclick = () => zoomBy(1.4);
$("zout").onclick = () => zoomBy(1 / 1.4);
$("north").onclick = () => { centerOn(cur); apply(true); };
$("me").onclick = () => select(1);
$("layers").onclick = () => { showAnn = !showAnn; $("layers").classList.toggle("on", !showAnn); labs.style.display = ann.style.display = showAnn ? "" : "none"; };

// ───────────────────────── 抽屉：选中的关注区 + 剖面图（= 24 小时热度）+ 全部 8 处 ─────────────────────────
function profile(h) {
  const v = h.spark.map((x, i) => [i, x]).filter(([, x]) => x != null), W = 340, H = 76, lo = 0, hi = Math.max(...v.map(([, x]) => x)) * 1.12, n = h.spark.length - 1;
  const X = (i) => 26 + (i / n) * (W - 30), Y = (x) => 6 + (1 - (x - lo) / (hi - lo)) * (H - 14);
  const line = v.map(([i, x], k) => `${k ? "L" : "M"}${X(i).toFixed(1)} ${Y(x).toFixed(1)}`).join(" ");
  const pk = v.reduce((a, b) => (b[1] > a[1] ? b : a));
  let g = "";
  for (const t of [0, .5, 1]) { const val = lo + (hi - lo) * t; g += `<line x1="26" x2="${W - 4}" y1="${Y(val)}" y2="${Y(val)}" stroke="#eceef1"/><text class="ax" x="0" y="${Y(val) + 3}">${Math.round(val)}</text>`; }
  g += `<path d="${line} L${X(v[v.length - 1][0])} ${H - 8} L${X(v[0][0])} ${H - 8} Z" fill="rgba(93,99,109,.16)"/>`;
  g += `<path d="${line}" fill="none" stroke="#2c3138" stroke-width="1.6" stroke-linejoin="round" pathLength="1" style="stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1s ease-out .9s forwards"/>`;
  g += `<circle cx="${X(pk[0])}" cy="${Y(pk[1])}" r="3" fill="#fff" stroke="#c7362b" stroke-width="1.6"/><text class="ax" x="${Math.min(W - 60, X(pk[0]) - 18)}" y="${Y(pk[1]) - 6}" fill="#c7362b">峰值 ${pk[1]}</text>`;
  g += `<text class="ax" x="26" y="${H + 8}">A · −24h</text><text class="ax" x="${W - 52}" y="${H + 8}">A′ · 现在</text>`;
  return `<svg viewBox="0 0 ${W} ${H + 10}">${g}</svg>`;
}
const chips = {};
function renderSheet(n) {
  const h = HOT[n - 1], a = AOI[n], [u, v] = cen(a.box);
  $("sc").innerHTML = `<div class="sel"><div class="k"><b>AOI-${pad2(n)}</b><span>网格 ${gridRef(u, v)} · 中心 (${f3(u)}, ${f3(v)})</span></div>
    <h2>${esc(shortTitle(h))}</h2>
    <div class="stats"><span>热度 <b>${h.heat}</b></span><span class="${trendCls(h)}">${arrow(h)} ${pct(h)}</span><span><b>${h.sources}</b> 家来源</span><span><b>${h.people}</b> 人参与</span></div>
    <div class="prof"><div class="t"><span>剖面 A–A′ · 24 小时热度</span><em>每格 1 小时</em></div>${profile(h)}<p>剖面图的「高程」就是这一条的热度曲线（数据来自热榜），不是地形。</p></div>
    <p class="sum">${esc(clip(firstLine(h.summary), 120))}</p></div>
    <div class="hd2">全部关注区<small>按热度 · 共 ${HOT.length} 处</small></div>
    ${HOT.map((x, i) => { const r = x.rank, b = AOI[r], [cu, cv2] = cen(b.box); return `<button class="row ${r === n ? "on" : ""}" data-r="${r}" style="--d:${(.75 + i * .07).toFixed(2)}s"><canvas data-chip="${r}" width="152" height="152"></canvas><div><div class="k"><b>AOI-${pad2(r)}</b> · 网格 ${gridRef(cu, cv2)}</div><h3>${esc(shortTitle(x))}</h3><div class="m">热度 <b>${heatText(x)}</b> <span class="${trendCls(x)}">${arrow(x)} ${pct(x)}</span> · ${x.sources} 家来源</div></div></button>`; }).join("")}
    <p class="note">影像为 Unsplash 航拍照片（Maximillian Conacher、Victor、Alexander Londoño、Michael Olsen、Andreas M、Alexander Pidgeon），只作示意，与新闻事件无关；照片没有定位数据，所有位置都是图像网格坐标，比例尺以原图像素计。</p>`;
  $("sc").querySelectorAll("canvas[data-chip]").forEach(drawChip);
}
// 列表小图：从影像里按关注区裁一块（放大 2.4 倍），黄框标出来
async function drawChip(c) {
  const r = +c.dataset.chip, a = AOI[r], im = IMG[a.img], full = await processed(a.img, ...sizeFor(a.img).map((v) => Math.round(v * DPR)));
  const [u, v] = cen(a.box), bw = (a.box[2] - a.box[0]), bh = (a.box[3] - a.box[1]), span = Math.max(bw, bh * full.height / full.width) * 1.6;
  const sw = span * full.width, sx = Math.min(full.width - sw, Math.max(0, u * full.width - sw / 2)), sy = Math.min(full.height - sw, Math.max(0, v * full.height - sw / 2));
  const x = c.getContext("2d"); x.drawImage(full, sx, sy, sw, sw, 0, 0, 152, 152);
  const k = 152 / sw; x.strokeStyle = "rgba(0,0,0,.45)"; x.lineWidth = 4; const rx = (a.box[0] * full.width - sx) * k, ry = (a.box[1] * full.height - sy) * k, rw = bw * full.width * k, rh = bh * full.height * k;
  x.strokeRect(rx, ry, rw, rh); x.strokeStyle = "#ffd60a"; x.lineWidth = 2.4; x.strokeRect(rx, ry, rw, rh);
  x.fillStyle = "#ffd60a"; x.fillRect(rx, ry - 15, 30, 15); x.fillStyle = "#1a1500"; x.font = "700 11px 'JetBrains Mono'"; x.fillText(pad2(r), rx + 7, ry - 3.5);
}
function select(n) {
  if (n === cur) { centerOn(n); apply(true); return; }
  $("sheet").classList.remove("tall"); show(n);
}
$("sc").addEventListener("click", (e) => { const row = e.target.closest(".row"); if (row) select(+row.dataset.r); });
$("handle").onclick = () => $("sheet").classList.toggle("tall");

// 底栏
$("dock").innerHTML = TAB_NAMES.map((n, i) => `<button class="tab ${i ? "" : "on"}" data-i="${i}"><span>${iconSVG(i)}</span>${n}</button>`).join("");
const tabs = [...document.querySelectorAll(".tab")];
tabs.forEach((t) => t.addEventListener("click", () => {
  tabs.forEach((x) => x.classList.toggle("on", x === t));
  const i = +t.dataset.i;
  if (i === 0) select(1);
  else if (i === 1) { const top = [...HOT].sort((a, b) => b.trendPct - a.trendPct)[0]; select(top.rank); }   // 热点：涨得最快的那处
  else if (i === 2) $("sheet").classList.add("tall");
  else if (i === 3) { $("sheet").classList.remove("tall"); zoomBy(1.4); }
  else { showAnn = true; $("layers").classList.remove("on"); $("sheet").classList.remove("tall"); cur = 0; show(1); }
}));
setInterval(() => { $("clock").textContent = nowHM(); }, 15000);

fontsReady().then(() => show(1, true));
