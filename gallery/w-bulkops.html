<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>批量操作列表 · 物理机</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Red+Hat+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" media="print" onload="this.media='all'">
<style>
:root{--bg:#f4f3ee;--ink:#141414;--ink2:#58574f;--mute:#9a988c;--line:#dedcd1;--line2:#e9e7dd;--y:#ffd60a;--ysel:#fff4b8;--red:#e5391f;--ok:#2e7d4f}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg)}
body{font:13px/1.4 Archivo,"Noto Sans SC",sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit;background:none;border:0;outline:none;cursor:pointer}
svg{display:block;flex:none}
.mono{font-family:"Red Hat Mono",monospace;font-variant-numeric:tabular-nums}
.app{height:100vh;display:flex;flex-direction:column}
.strip{flex:none;height:44px;background:var(--ink);color:#fff;display:flex;align-items:center;padding:0 32px;gap:14px}
.strip .lg{width:22px;height:22px;background:var(--y);display:grid;place-items:center}
.strip .lg svg{width:13px;height:13px;stroke:var(--ink);fill:none;stroke-width:2.4;stroke-linecap:square}
.strip b{font-weight:800;letter-spacing:.5px}
.strip span{color:#a8a699}
.strip .sp{flex:1}
.wrap{flex:1;min-height:0;display:flex;flex-direction:column;padding:0 32px;max-width:1440px;width:100%;margin:0 auto}
.head{flex:none;display:flex;align-items:flex-end;gap:28px;padding:22px 0 0}
.head h1{font-size:40px;line-height:1;font-weight:800;letter-spacing:-1px}
.head h1 small{font-size:14px;font-weight:500;color:var(--ink2);letter-spacing:0;margin-left:12px}
.tabs{display:flex;gap:0;margin-left:10px}
.tabs button{padding:6px 16px 8px;font-weight:600;color:var(--ink2);border-bottom:3px solid transparent;display:flex;gap:7px;align-items:baseline}
.tabs button em{font:400 11.5px "Red Hat Mono";font-style:normal;color:var(--mute)}
.tabs button.on{color:var(--ink);border-bottom-color:var(--ink)}
.tabs button:hover{color:var(--ink)}
.head .sp{flex:1}
.pgh{padding-bottom:9px;color:var(--ink2);font-size:12.5px}
.tbl{flex:1;min-height:0;display:flex;flex-direction:column;margin-top:0;border-top:3px solid var(--ink)}
.cols,.row{display:grid;grid-template-columns:46px 140px 130px 120px 100px 130px 120px 80px 190px 1fr;align-items:center}
.cols{flex:none;height:44px;border-bottom:1px solid var(--ink);color:var(--ink2);font-size:12px;font-weight:600;position:relative}
.cols>div{padding:0 10px}
.cols .num,.row .num{text-align:right;padding-right:18px}
.selbar{position:absolute;inset:0;background:var(--ink);color:#fff;display:none;align-items:center;padding:0 10px 0 0;gap:12px}
.cols.has .selbar{display:flex;animation:sb .18s}
@keyframes sb{from{transform:translateY(-6px);opacity:0}}
.selbar .ckw{width:46px;display:grid;place-items:center}
.selbar b{font-size:15px;font-weight:800}
.selbar a{color:var(--y);font-weight:700;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.selbar .sp{flex:1}
.selbar .cl{color:#bdbbae;font-weight:500;padding:4px 8px}.selbar .cl:hover{color:#fff}
.body{flex:1;min-height:0;overflow:hidden}
.row{height:41px;border-bottom:1px solid var(--line2);position:relative;transition:background .1s;cursor:default}
.row>div{padding:0 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row:hover{background:#eceae0}
.row.sel{background:var(--ysel)}
.row.sel::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--ink)}
.row.gone{color:var(--mute)}
.row.gone .nm{text-decoration:line-through}
.row.flash{animation:fl 1.4s}
@keyframes fl{from{background:var(--y)}}
.ck{width:17px;height:17px;border:2px solid var(--ink);display:grid;place-items:center;background:var(--bg);margin:0 auto;cursor:pointer;transition:.1s}
.ck svg{width:11px;height:11px;stroke:var(--ink);fill:none;stroke-width:3;opacity:0;stroke-linecap:square}
.row:hover .ck{background:#fff}
.sel .ck{background:var(--ink)}.sel .ck svg{opacity:1;stroke:var(--y)}
.ck.ind{background:var(--ink)}.ck.ind svg{opacity:1;stroke:var(--y)}
.selbar .ck{border-color:#fff;background:var(--ink)}
.selbar .ck svg{stroke:var(--y);opacity:1}
.cols .ck.h{background:var(--bg)}.cols .ck.h.ind{background:var(--ink)}
.st{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:12.5px}
.st i{width:8px;height:8px;background:var(--ink)}
.st.s2 i{background:none;border:2px solid var(--ink)}
.st.s3 i{background:var(--red)}
.st.s9{color:var(--mute)}.st.s9 i{background:var(--mute)}
.nm{font-weight:500;font-size:12.5px}
.ub{display:inline-block;width:96px;height:6px;background:#dcdacd;vertical-align:1px;margin-right:10px}.ub i{display:block;height:100%;background:var(--ink)}.ut{font-size:12px}
.foot{flex:none;height:54px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--ink);color:var(--ink2);font-size:12.5px}
.pager{display:flex;gap:2px}
.pager button{min-width:30px;height:30px;padding:0 8px;font:500 12.5px "Red Hat Mono";border:1px solid transparent}
.pager button:hover{border-color:var(--ink)}
.pager button.on{background:var(--ink);color:#fff}
.pager button:disabled{color:#c8c6b9;cursor:default;border-color:transparent}
.pager span{padding:6px 4px;color:var(--mute)}
.fab{position:fixed;left:50%;bottom:26px;transform:translate(-50%,100px);background:var(--ink);color:#fff;display:flex;align-items:stretch;box-shadow:0 12px 34px rgba(0,0,0,.35);transition:transform .26s cubic-bezier(.3,1.25,.5,1);z-index:30;border-top:3px solid var(--y)}
.fab.on{transform:translate(-50%,0)}
.fab .n{padding:0 18px;display:flex;align-items:center;gap:8px;border-right:1px solid #3a3a36}
.fab .n b{font-size:22px;font-weight:800;color:var(--y);font-variant-numeric:tabular-nums}
.fab .n span{color:#bdbbae;font-size:12px}
.fab button{padding:0 20px;height:52px;display:flex;align-items:center;gap:8px;font-weight:700;border-right:1px solid #3a3a36}
.fab button:hover{background:var(--y);color:var(--ink)}
.fab button.dg:hover{background:var(--red);color:#fff}
.fab button svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:square;stroke-linejoin:miter}
.fab .x{width:48px;justify-content:center;padding:0;border:0;color:#bdbbae}
.mask{position:fixed;inset:0;background:rgba(20,20,20,.55);z-index:80;display:flex;align-items:center;justify-content:center;animation:mk .15s}
@keyframes mk{from{opacity:0}}
.dlg{width:640px;max-height:84vh;background:var(--bg);border-top:6px solid var(--ink);box-shadow:0 30px 80px rgba(0,0,0,.4);display:flex;flex-direction:column;animation:dg .2s cubic-bezier(.3,1.2,.5,1)}
@keyframes dg{from{transform:translateY(16px);opacity:0}}
.dlg.dgr{border-top-color:var(--red)}
.dlg h2{padding:20px 26px 4px;font-size:24px;font-weight:800;letter-spacing:-.4px}
.dlg .sub{padding:0 26px;color:var(--ink2)}
.impact{display:grid;grid-template-columns:repeat(3,1fr);margin:18px 26px 0;border-top:1px solid var(--ink);border-bottom:1px solid var(--line)}
.impact div{padding:14px 0 12px}.impact div+div{padding-left:18px;border-left:1px solid var(--line)}
.impact b{display:block;font-size:34px;line-height:1.05;font-weight:800;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.impact b.neg{color:var(--ok)}.impact b.pos{color:var(--red)}
.impact small{color:var(--ink2);font-size:12px}
.opt{margin:16px 26px 0;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.opt label{color:var(--ink2);font-size:12px;margin-right:6px}
.opt button{height:30px;padding:0 13px;border:1.5px solid var(--ink);font-weight:600}
.opt button.on{background:var(--ink);color:var(--y)}
.opt button:hover:not(.on){background:var(--ysel)}
.dl{margin:16px 26px 0;overflow:auto;flex:1;min-height:120px;border-top:1px solid var(--line);max-height:230px}
.dl table{width:100%;border-collapse:collapse}
.dl td,.dl th{padding:6px 8px 6px 0;text-align:left;font-size:12.5px;border-bottom:1px solid var(--line2);white-space:nowrap}
.dl th{position:sticky;top:0;background:var(--bg);color:var(--ink2);font-weight:600;font-size:12px}
.dl td.r,.dl th.r{text-align:right;padding-right:0}
.dl tr.g td{background:#ebe9df;font-weight:700;padding-left:8px}
.acts{display:flex;justify-content:flex-end;gap:10px;padding:18px 26px 22px}
.acts button{height:40px;padding:0 24px;font-weight:700;border:1.5px solid var(--ink)}
.acts button.pri{background:var(--ink);color:#fff}.acts button.pri:hover{background:#333}
.acts button.dg{background:var(--red);border-color:var(--red);color:#fff}
.acts button.dg:hover{filter:brightness(.92)}
.acts button.ghost:hover{background:var(--line2)}
.undo{position:fixed;right:32px;top:60px;transform:translateY(-180px);visibility:hidden;background:var(--ink);color:#fff;z-index:90;min-width:400px;transition:transform .28s cubic-bezier(.3,1.3,.5,1),visibility .28s;overflow:hidden}
.undo.on{transform:none;visibility:visible}
.undo .in{display:flex;align-items:center;gap:16px;padding:12px 8px 12px 18px}
.undo .in span{flex:1;font-weight:600}
.undo .in b{color:var(--y)}
.undo .in button{color:var(--y);font-weight:800;padding:4px 12px;border:1.5px solid var(--y)}
.undo .in button:hover{background:var(--y);color:var(--ink)}
.undo .pb{height:3px;background:var(--y);transform-origin:left;animation:pb 10s linear forwards}
@keyframes pb{to{transform:scaleX(0)}}
.toast{position:fixed;left:50%;bottom:30px;transform:translate(-50%,14px);background:var(--ink);color:#fff;padding:10px 18px;font-weight:600;opacity:0;pointer-events:none;transition:.2s;z-index:100}
.toast.show{opacity:1;transform:translate(-50%,0)}
.demo{position:fixed;right:12px;bottom:3px;font-size:10px;color:var(--mute)}
</style>
</head>
<body>
<div class="app">
  <div class="strip"><div class="lg"><svg viewBox="0 0 16 16"><path d="M2 3h12M2 8h12M2 13h12"/></svg></div><b>资源台账</b><span>GPU 物理机</span><span class="sp"></span><span>赵明 · 资源管理员</span></div>
  <div class="wrap">
    <div class="head"><h1>物理机<small id="tot"></small></h1><div class="tabs" id="tabs"></div><span class="sp"></span><span class="pgh">Shift 连选 · 勾选后可跨页全选</span></div>
    <div class="tbl">
      <div class="cols" id="cols"></div>
      <div class="body" id="body"></div>
      <div class="foot"><span id="range"></span><div class="pager" id="pager"></div></div>
    </div>
  </div>
</div>
<div class="fab" id="fab"><div class="n"><b id="fn">0</b><span>台已选</span></div>
  <button data-op="move"><svg viewBox="0 0 16 16"><path d="M2 5h10M9 2l3 3-3 3M14 11H4M7 8l-3 3 3 3"/></svg>转移</button>
  <button data-op="owner"><svg viewBox="0 0 16 16"><circle cx="8" cy="5.5" r="2.8"/><path d="M2.5 14c.5-3 2.7-4.5 5.5-4.5s5 1.5 5.5 4.5"/></svg>改负责人</button>
  <button data-op="recycle" class="dg"><svg viewBox="0 0 16 16"><path d="M3 4.5h10M6 4.5V2.5h4v2M4.5 4.5l.6 9h5.8l.6-9"/></svg>回收</button>
  <button data-op="export"><svg viewBox="0 0 16 16"><path d="M8 2v8M4.5 7L8 10.5 11.5 7M2.5 13.5h11"/></svg>导出</button>
  <button class="x" id="fx"><svg viewBox="0 0 16 16"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9"/></svg></button></div>
<div class="undo" id="undo"><div class="in"><span id="um"></span><button id="ub">撤销（<b id="uc">10</b>）</button></div><div class="pb" id="upb"></div></div>
<div class="toast" id="toast"></div><div class="demo">示例数据</div>
<script>
const $=s=>document.querySelector(s);
/* ---------- 数据 ---------- */
let seed=7;const rnd=()=>(seed=(seed*1664525+1013904223)>>>0)/4294967296;const pick=a=>a[Math.floor(rnd()*a.length)];
const MODELS=[["H100 × 8",46800,.3],["A100 × 8",31200,.26],["H20 × 8",21600,.2],["昇腾 910B × 8",27400,.14],["沐曦 C550 × 8",24900,.1]];
const DEPTS=["算法一部","算法二部","基础模型组","平台研发","数据中台","搜索推荐部","智能客服部"];
const OWN=["李薇","刘芳","陈思远","王海涛","孙立","周雅琪","郑浩","吴凡","赵明","钱国梁","黄子轩","林夏"];
const SITE=[["bj",.5],["sh",.3],["gz",.2]];
const D=[];
for(let i=0;i<1284;i++){
  let r=rnd(),m,a=0;for(const x of MODELS){a+=x[2];if(r<a){m=x;break}} m=m||MODELS[0];
  r=rnd();let s="bj",b=0;for(const x of SITE){b+=x[1];if(r<b){s=x[0];break}}
  const st=rnd()<.22?"闲置":rnd()<.04?"维修":"在用";
  D.push({id:`gpu-${s}-${String(i+1).padStart(4,"0")}`,model:m[0],cost:m[1],dept:pick(DEPTS),owner:pick(OWN),st,idle:st==="闲置"?3+Math.floor(rnd()*40):0,util:st==="闲置"?Math.floor(rnd()*14):st==="维修"?0:32+Math.floor(rnd()*66),exp:`2027-${String(1+Math.floor(rnd()*12)).padStart(2,"0")}-${String(1+Math.floor(rnd()*28)).padStart(2,"0")}`,site:{bj:"北京",sh:"上海",gz:"贵阳"}[s]});
}
const byId=new Map(D.map(x=>[x.id,x]));
/* ---------- 状态 ---------- */
let tab="全部",page=0,PS=15,sel=new Set(),allMode=false,excl=new Set(),anchor=null;
const TABS=["全部","在用","闲置","维修","已回收"];
const list=()=>tab==="全部"?D.filter(x=>x.st!=="已回收"):D.filter(x=>x.st===tab);
const fmt=n=>n.toLocaleString("en-US");
const money=n=>"¥"+fmt(Math.abs(n));
let F=list();
function isSel(id){return allMode?!excl.has(id):sel.has(id)}
function selList(){return allMode?F.filter(x=>!excl.has(x.id)):D.filter(x=>sel.has(x.id))}
const selN=()=>allMode?F.length-excl.size:sel.size;
const ckSvg='<svg viewBox="0 0 12 12"><path d="M2 6.3l2.6 2.6L10 3.2"/></svg>';
const ind='<svg viewBox="0 0 12 12"><path d="M2.5 6h7"/></svg>';
/* ---------- 渲染 ---------- */
function renderTabs(){
  const cnt=t=>t==="全部"?D.filter(x=>x.st!=="已回收").length:D.filter(x=>x.st===t).length;
  $("#tabs").innerHTML=TABS.map(t=>`<button class="${t===tab?"on":""}" data-t="${t}">${t}<em>${fmt(cnt(t))}</em></button>`).join("");
  $("#tot").textContent=`${fmt(F.length)} 台`;
}
function renderCols(){
  const pr=F.slice(page*PS,page*PS+PS),n=selN(),pageAll=pr.length&&pr.every(x=>isSel(x.id)),pageSome=pr.some(x=>isSel(x.id));
  let sb="";
  if(n>0){
    const hint=allMode?`<b>已选全部 ${fmt(n)} 台（跨页）</b>`:pageAll&&F.length>PS&&n<F.length?`<b>已选本页 ${pr.length} 台</b><a id="selAll">选中全部 ${fmt(F.length)} 条</a>`:`<b>已选 ${fmt(n)} 台</b>${F.length>PS&&n<F.length?`<a id="selAll">选中全部 ${fmt(F.length)} 条</a>`:""}`;
    sb=`<div class="selbar"><div class="ckw"><div class="ck ${pageAll?"":"ind"}" id="hck">${pageAll?ckSvg:ind}</div></div>${hint}<span class="sp"></span><button class="cl" id="clr">取消选择</button></div>`;
  }
  $("#cols").className="cols"+(n>0?" has":"");
  $("#cols").innerHTML=`<div><div class="ck h ${pageSome&&!pageAll?"ind":pageAll?"ind":""}" id="hck0">${pageAll?ckSvg:pageSome?ind:ckSvg}</div></div><div>机器编号</div><div>型号</div><div>部门</div><div>负责人</div><div>状态</div><div class="num">月费用</div><div>机房</div><div>7 日利用率</div><div>到期日</div>${sb}`;
  if(!pageAll&&!pageSome)$("#hck0").className="ck h";
}
function renderBody(flash){
  const pr=F.slice(page*PS,page*PS+PS);
  $("#body").innerHTML=!pr.length?`<div style="padding:90px 0;text-align:center;color:var(--mute)"><b style="display:block;font-size:18px;color:var(--ink2);margin-bottom:4px">这个分类下没有机器</b>切换上方的页签查看其他机器</div>`:pr.map((x,i)=>`<div class="row ${isSel(x.id)?"sel":""} ${x.st==="已回收"?"gone":""} ${flash&&flash.has(x.id)?"flash":""}" data-id="${x.id}" data-i="${page*PS+i}"><div><div class="ck">${ckSvg}</div></div><div class="nm mono">${x.id}</div><div>${x.model}</div><div>${x.dept}</div><div>${x.owner}</div><div><span class="st ${x.st==="闲置"?"s2":x.st==="维修"?"s3":x.st==="已回收"?"s9":"s1"}"><i></i>${x.st}${x.st==="闲置"?` <span class="mono" style="font-weight:400;color:var(--mute)">${x.idle}天</span>`:""}</span></div><div class="num mono">${x.st==="已回收"?"–":money(x.cost)}</div><div>${x.site}</div><div>${x.st==="已回收"?"":`<span class="ub"><i style="width:${x.util}%"></i></span><span class="mono ut">${x.util}%</span>`}</div><div class="mono" style="color:var(--ink2)">${x.exp}</div></div>`).join("");
  const tp=Math.max(1,Math.ceil(F.length/PS));
  $("#range").textContent=F.length?`第 ${page*PS+1}–${Math.min(F.length,page*PS+PS)} 条，共 ${fmt(F.length)} 条`:"没有数据";
  let ps=[];const add=p=>ps.push(p);
  const set=new Set([0,1,tp-1,tp-2,page-1,page,page+1].filter(p=>p>=0&&p<tp));let prev=-1;
  const arr=[...set].sort((a,b)=>a-b);let h=`<button data-p="${page-1}" ${page===0?"disabled":""}>‹</button>`;
  arr.forEach(p=>{if(prev>=0&&p-prev>1)h+=`<span>…</span>`;h+=`<button data-p="${p}" class="${p===page?"on":""}">${p+1}</button>`;prev=p});
  $("#pager").innerHTML=h+`<button data-p="${page+1}" ${page>=tp-1?"disabled":""}>›</button>`;
}
function renderFab(){const n=selN();$("#fab").classList.toggle("on",n>0);$("#fn").textContent=fmt(n)}
function all(flash){F=list();renderTabs();renderCols();renderBody(flash);renderFab()}
function selChanged(){renderCols();renderFab();$("#body").querySelectorAll(".row").forEach(r=>r.classList.toggle("sel",isSel(r.dataset.id)))}
$("#tabs").onclick=e=>{const b=e.target.closest("button");if(!b)return;tab=b.dataset.t;page=0;clearSel();all()};
$("#pager").onclick=e=>{const b=e.target.closest("button");if(!b||b.disabled)return;page=+b.dataset.p;renderCols();renderBody();renderFab()};
function clearSel(){sel.clear();allMode=false;excl.clear();anchor=null}
function setOne(id,on){if(allMode){on?excl.delete(id):excl.add(id)}else{on?sel.add(id):sel.delete(id)}}
$("#body").addEventListener("click",e=>{
  const row=e.target.closest(".row");if(!row)return;
  const id=row.dataset.id,i=+row.dataset.i;
  if(e.shiftKey&&anchor!==null){
    const [a,b]=[Math.min(anchor,i),Math.max(anchor,i)];const on=!isSel(id)||true;
    // 以锚点行当前状态为准
    const target=isSel(F[anchor].id);
    for(let k=a;k<=b;k++)setOne(F[k].id,target);
    window.getSelection().removeAllRanges();
  } else {setOne(id,!isSel(id));anchor=i}
  selChanged();
});
$("#body").addEventListener("mousedown",e=>{if(e.shiftKey)e.preventDefault()});
$("#cols").addEventListener("click",e=>{
  if(e.target.closest("#hck0")||e.target.closest("#hck")){
    const pr=F.slice(page*PS,page*PS+PS);const pageAll=pr.every(x=>isSel(x.id));
    pr.forEach(x=>setOne(x.id,!pageAll));selChanged();return}
  if(e.target.closest("#selAll")){allMode=true;excl.clear();sel.clear();selChanged();return}
  if(e.target.closest("#clr")){clearSel();selChanged()}
});
$("#fx").onclick=()=>{clearSel();selChanged()};
/* ---------- 操作 ---------- */
let pending=null;
document.querySelectorAll(".fab [data-op]").forEach(b=>b.onclick=()=>openOp(b.dataset.op));
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("show"),2200)}
function openOp(op){
  const rs=selList();if(!rs.length)return;
  if(op==="export"){toast(`已导出 ${fmt(rs.length)} 台机器为 CSV`);return}
  const targets=op==="recycle"?rs.filter(x=>x.st!=="已回收"):rs;
  let to=op==="move"?"算法二部":op==="owner"?"陈思远":null;
  const mask=document.createElement("div");mask.className="mask";document.body.appendChild(mask);
  const draw=()=>{
    const ts=targets.filter(x=>op==="move"?x.dept!==to:op==="owner"?x.owner!==to:true);
    const depts=new Set(ts.map(x=>x.dept)),sum=ts.reduce((a,x)=>a+x.cost,0);
    const byD={};ts.forEach(x=>(byD[x.dept]=byD[x.dept]||[]).push(x));
    const keys=Object.keys(byD).sort((a,b)=>byD[b].length-byD[a].length);
    let title,sub,stat3;
    if(op==="recycle"){title=`回收 ${fmt(ts.length)} 台机器`;sub="回收后机器退回资源池，原部门不再计费，已运行的任务会被停止。";stat3=`<b class="neg">−${money(sum)}</b><small>下月预计费用变化</small>`}
    else if(op==="move"){title=`转移 ${fmt(ts.length)} 台机器`;sub=`目标部门「${to}」。费用从原部门转入目标部门，总额不变。`;stat3=`<b>${money(sum)}</b><small>从原部门转入「${to}」的月费用</small>`}
    else{title=`把 ${fmt(ts.length)} 台机器的负责人改为 ${to}`;sub="只修改负责人，不影响部门和计费。";stat3=`<b>${new Set(ts.map(x=>x.owner)).size}</b><small>位原负责人受影响</small>`}
    const optHTML=op==="move"?`<div class="opt"><label>目标部门</label>${DEPTS.map(d=>`<button data-v="${d}" class="${d===to?"on":""}">${d}</button>`).join("")}</div>`:op==="owner"?`<div class="opt"><label>新负责人</label>${OWN.slice(0,8).map(d=>`<button data-v="${d}" class="${d===to?"on":""}">${d}</button>`).join("")}</div>`:"";
    let rowsHTML=keys.map(k=>`<tr class="g"><td colspan="5">${k} · ${byD[k].length} 台</td></tr>`+byD[k].slice(0,6).map(x=>`<tr><td class="mono">${x.id}</td><td>${x.model}</td><td>${x.owner}</td><td>${x.st}</td><td class="r mono">${money(x.cost)}</td></tr>`).join("")+(byD[k].length>6?`<tr><td colspan="5" style="color:var(--mute)">… 另有 ${byD[k].length-6} 台</td></tr>`:"")).join("");
    mask.innerHTML=`<div class="dlg ${op==="recycle"?"dgr":""}"><h2>${title}</h2><div class="sub">${sub}${rs.length!==targets.length?` 已跳过 ${rs.length-targets.length} 台已回收的机器。`:""}</div>
      <div class="impact"><div><b>${fmt(ts.length)}</b><small>台机器</small></div><div><b>${depts.size}</b><small>个部门</small></div><div>${stat3}</div></div>${optHTML}
      <div class="dl"><table><thead><tr><th>机器</th><th>型号</th><th>负责人</th><th>状态</th><th class="r">月费用</th></tr></thead><tbody>${rowsHTML||`<tr><td colspan="5" style="padding:24px 0;color:var(--mute)">没有会发生变化的机器</td></tr>`}</tbody></table></div>
      <div class="acts"><button class="ghost" data-a="no">取消</button><button class="${op==="recycle"?"dg":"pri"}" data-a="ok" ${ts.length?"":"disabled"}>${op==="recycle"?"确认回收":"确认"} ${fmt(ts.length)} 台</button></div></div>`;
    mask._ts=ts;
  };
  draw();
  mask.onclick=e=>{
    if(e.target===mask||e.target.closest('[data-a="no"]')){mask.remove();return}
    const v=e.target.closest("[data-v]");if(v){to=v.dataset.v;draw();return}
    if(e.target.closest('[data-a="ok"]')){const ts=mask._ts;mask.remove();exec(op,ts,to)}
  };
}
let undoTimer=null,undoFn=null;
function exec(op,ts,to){
  const prev=ts.map(x=>({x,st:x.st,dept:x.dept,owner:x.owner}));
  ts.forEach(x=>{if(op==="recycle")x.st="已回收";else if(op==="move")x.dept=to;else x.owner=to});
  const ids=new Set(ts.map(x=>x.id));
  clearSel();
  if(op==="recycle"&&tab!=="已回收")page=Math.min(page,Math.max(0,Math.ceil(list().length/PS)-1));
  all(op==="recycle"?null:ids);
  const sum=ts.reduce((a,x)=>a+x.cost,0);
  showUndo(op==="recycle"?`已回收 <b>${fmt(ts.length)}</b> 台 · 下月 −${money(sum)}`:op==="move"?`已转移 <b>${fmt(ts.length)}</b> 台到 ${to}`:`已把 <b>${fmt(ts.length)}</b> 台的负责人改为 ${to}`,()=>{prev.forEach(p=>{p.x.st=p.st;p.x.dept=p.dept;p.x.owner=p.owner});all(ids);toast(`已撤销，${fmt(ts.length)} 台机器恢复原状`)});
}
function showUndo(msg,fn){
  clearInterval(undoTimer);undoFn=fn;$("#um").innerHTML=msg;$("#undo").classList.add("on");
  const pb=$("#upb");pb.style.animation="none";void pb.offsetWidth;pb.style.animation="";
  let c=10;$("#uc").textContent=c;
  undoTimer=setInterval(()=>{c--;$("#uc").textContent=c;if(c<=0){clearInterval(undoTimer);$("#undo").classList.remove("on");undoFn=null}},1000);
}
$("#ub").onclick=()=>{if(!undoFn)return;clearInterval(undoTimer);$("#undo").classList.remove("on");const f=undoFn;undoFn=null;f()};
document.addEventListener("keydown",e=>{if(e.key==="Escape"){const m=document.querySelector(".mask");if(m)m.remove();else{clearSel();selChanged()}}});
[2,3,4,7].forEach(i=>sel.add(D.filter(x=>x.st!=="已回收")[i].id));anchor=7;
all();
</script>
