<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>对比列表 · 费用变化</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=DM+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700;900&display=swap" media="print" onload="this.media='all'">
<style>
:root{--bg:#fff;--ink:#14213d;--ink2:#566074;--mute:#99a1b0;--line:#e7eaf0;--band:#f3f5f9;--up:#e8590c;--dn:#0f8b8d;--ring:#8b94a6}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font:13px/1.45 "DM Sans","Noto Sans SC",sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input{font:inherit;color:inherit;background:none;border:0;outline:none;cursor:pointer}
.mono{font-family:"DM Mono","Noto Sans SC",monospace;font-variant-numeric:tabular-nums}
.page{height:100vh;display:flex;flex-direction:column;padding:0 56px}
.kick{display:flex;align-items:center;gap:10px;padding:22px 0 0;font-size:12px;color:var(--mute);letter-spacing:.08em}
.kick b{color:var(--ink);font-weight:700;letter-spacing:.02em}
.kick .sp{flex:1}
.head{display:flex;gap:56px;align-items:flex-end;padding:14px 0 22px}
.head h1{font:900 34px/1.3 "Noto Serif SC",serif;letter-spacing:-.01em;flex:1;max-width:820px}
.head h1 em{font-style:normal;white-space:nowrap}
.head h1 .u{color:var(--up);border-bottom:3px solid var(--up)}
.head h1 .d{color:var(--dn);border-bottom:3px solid var(--dn)}
.kp{display:flex;gap:34px}
.kp div{text-align:right}
.kp b{display:block;font:500 25px "DM Mono";letter-spacing:-.04em}
.kp span{font-size:12px;color:var(--ink2)}
.kp .u{color:var(--up)}.kp .d{color:var(--dn)}
.ctl{display:flex;align-items:center;gap:30px;height:52px;background:var(--band);border-radius:10px;padding:0 18px;margin-bottom:6px}
.ctl .g{display:flex;align-items:center;gap:10px}
.ctl .lab{font-size:12px;color:var(--ink2)}
.seg{display:flex;gap:2px}
.seg button{height:30px;padding:0 14px;border-radius:15px;font-weight:500;color:var(--ink2);transition:.15s}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--ink);color:#fff}
.sw{display:flex;align-items:center;gap:9px;margin-left:auto}
.sw i{width:34px;height:20px;border-radius:10px;background:#c9cfda;position:relative;transition:.2s;flex:none}
.sw i::after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s}
.sw.on i{background:var(--ink)}.sw.on i::after{left:16px}
.sw span{font-weight:500}.sw small{color:var(--mute);margin-left:2px}
.chart{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}
.cols{display:grid;grid-template-columns:176px 1fr 124px 86px 122px;height:38px;align-items:end;padding-bottom:8px;font-size:12px;color:var(--ink2);border-bottom:1.5px solid var(--ink);flex:none;position:relative}
.cols div{padding:0 8px}
.cols .r,.r{text-align:right}
.cols button{font-size:12px;color:var(--ink2);display:flex;gap:4px;align-items:center;justify-content:flex-end;width:100%;padding:0;height:auto}
.cols button.on{color:var(--ink);font-weight:700}
.cols .axis{position:relative;height:100%;padding:0}
.axis span{position:absolute;bottom:0;transform:translateX(-50%);font:11px "DM Mono";color:var(--mute);white-space:nowrap}
.rows{position:relative;flex:1;min-height:0}
.grid{position:absolute;top:0;left:176px;right:332px;pointer-events:none}
.grid i{position:absolute;top:0;bottom:0;width:1px;background:var(--line)}
.row{position:absolute;left:0;right:0;height:66px;display:grid;grid-template-columns:176px 1fr 124px 86px 122px;align-items:center;transition:transform .7s cubic-bezier(.3,.8,.25,1),opacity .35s;border-bottom:1px solid var(--line)}
.row.fade{opacity:.2}
.row:hover{background:rgba(20,33,61,.035)}
.lb{padding:0 8px;cursor:default}
.lb b{display:block;font-size:14px;font-weight:700}
.lb span{font-size:11.5px;color:var(--mute)}
.tr{position:relative;height:100%;cursor:crosshair}
.ln{position:absolute;top:50%;height:4px;margin-top:-2px;border-radius:2px;transition:left .7s cubic-bezier(.3,.8,.25,1),width .7s cubic-bezier(.3,.8,.25,1),background .3s}
.dt{position:absolute;top:50%;border-radius:50%;transform:translate(-50%,-50%);transition:left .7s cubic-bezier(.3,.8,.25,1),background .3s,border-color .3s}
.d0{width:12px;height:12px;border:2px solid var(--ring);background:#fff;z-index:2}
.d1{width:16px;height:16px;z-index:3;border:2px solid #fff;box-shadow:0 0 0 1px rgba(20,33,61,.12)}
.vl{position:absolute;top:calc(50% - 30px);transform:translateX(-50%);font:11.5px "DM Mono";font-weight:500;white-space:nowrap;opacity:0;transition:opacity .12s;pointer-events:none}
.row:hover .vl{opacity:1}
.vl.a{color:var(--ink2)}
.df,.pc,.cu{padding:0 8px;text-align:right;font:500 14px "DM Mono";letter-spacing:-.03em}
.pc{font-weight:500}
.cu{color:var(--ink2);font-weight:400}
.up{color:var(--up)}.dn{color:var(--dn)}.fl{color:var(--mute)}
.foot{height:40px;flex:none;display:flex;align-items:center;gap:24px;font-size:11.5px;color:var(--mute)}
.foot .lg{display:flex;align-items:center;gap:7px}
.foot .lg i{display:inline-block;vertical-align:middle}
.tip{position:fixed;z-index:50;background:var(--ink);color:#fff;border-radius:9px;padding:10px 13px;font-size:12px;pointer-events:none;opacity:0;transition:opacity .1s;width:218px;box-shadow:0 8px 24px rgba(20,33,61,.3)}
.tip.show{opacity:1}
.tip h6{font-size:12.5px;margin-bottom:7px}
.tip .l{display:flex;justify-content:space-between;padding:2px 0}
.tip .l span{color:#a9b2c6}.tip .l b{font:500 12px "DM Mono"}
.tip .s{border-top:1px solid rgba(255,255,255,.15);margin-top:5px;padding-top:6px}
@keyframes rin{from{opacity:0}}
</style>
</head>
<body>
<div class="page">
  <div class="kick"><b>费用变化</b><span id="kc"></span><span class="sp"></span><span>金额单位：万元 · 示例数据</span></div>
  <div class="head"><h1 id="h1"></h1><div class="kp" id="kp"></div></div>
  <div class="ctl">
    <div class="g"><span class="lab">维度</span><div class="seg" id="dim"><button data-v="dept" class="on">部门</button><button data-v="ven">厂商</button></div></div>
    <div class="g"><span class="lab">对比</span><div class="seg" id="bs"><button data-v="prev" class="on">上月</button><button data-v="yoy">去年同月</button><button data-v="bud">预算</button></div></div>
    <div class="g"><span class="lab">排序</span><div class="seg" id="so"><button data-v="diff" class="on">变化额</button><button data-v="pct">变化率</button><button data-v="cur">本月金额</button></div></div>
    <div class="sw" id="sw"><i></i><span>只看变化超过 10%</span><small id="swn"></small></div>
  </div>
  <div class="chart">
    <div class="cols"><div id="c0">部门</div><div class="axis" id="axis"></div><div class="r"><span id="c2">变化额</span></div><div class="r"><span>变化率</span></div><div class="r"><span>本月</span></div></div>
    <div class="rows" id="rows"><div class="grid" id="grid"></div></div>
  </div>
  <div class="foot"><span class="lg"><i style="width:11px;height:11px;border:2px solid var(--ring);border-radius:50%"></i><span id="lg0">上月</span></span><span class="lg"><i style="width:14px;height:14px;background:var(--up);border-radius:50%"></i>本月，涨</span><span class="lg"><i style="width:14px;height:14px;background:var(--dn);border-radius:50%"></i>本月，降</span><span>悬停哑铃看两端读数</span></div>
</div>
<div class="tip" id="tip"></div>
<script>
const $=s=>document.querySelector(s);
const DEP=["算法一部","算法二部","平台研发","数据中台","基础模型组","多模态组","语音组","安全合规"],VEN=["星云云","北辰云","金盾云","澜海云","自建机房","专线服务商","模型 API"];
const DW=[1.0,.78,.5,.42,1.15,.7,.36,.16],VW=[1.2,.9,.7,.5,.8,.14,.34];
const MOM=[.04,.31,-.03,.12,.58,-.18,-.42,.07],YOY=[.35,.9,.12,.48,1.6,.4,-.1,.2],BUD=[1.03,.82,1.06,.98,.78,1.12,1.5,1.0];
let seed=77;const rnd=()=>(seed=(seed*9301+49297)%233280)/233280;
const MX={cur:[],prev:[],yoy:[],bud:[]};
for(let d=0;d<8;d++){MX.cur[d]=[];MX.prev[d]=[];MX.yoy[d]=[];MX.bud[d]=[];for(let v=0;v<7;v++){let base=DW[d]*VW[v]*(32+rnd()*20);if(d===6&&v===6)base*=.5;const c=Math.round(base*10)/10;MX.cur[d][v]=c;
 MX.prev[d][v]=Math.round(c/(1+MOM[d]+(rnd()-.5)*.14)*10)/10;MX.yoy[d][v]=Math.round(c/(1+YOY[d]+(rnd()-.5)*.2)*10)/10;MX.bud[d][v]=Math.round(c*(BUD[d]+(rnd()-.5)*.1)*10)/10}}
const sumRow=(k,d)=>MX[k][d].reduce((a,b)=>a+b,0),sumCol=(k,v)=>MX[k].reduce((a,r)=>a+r[v],0);
function items(dim){const n=dim==="dept"?8:7;return Array.from({length:n},(_,i)=>{const o={name:dim==="dept"?DEP[i]:VEN[i]};["cur","prev","yoy","bud"].forEach(k=>o[k]=dim==="dept"?sumRow(k,i):sumCol(k,i));return o})}
let dim="dept",basis="prev",sortK="diff",sortDir=-1,only=false,first=true;
const BN={prev:"上月",yoy:"去年同月",bud:"预算"},BF={prev:"10 月",yoy:"2025 年 11 月",bud:"11 月预算"};
const f1=v=>v.toLocaleString("en-US",{minimumFractionDigits:1,maximumFractionDigits:1});
const sg=v=>(v>0?"+":v<0?"−":"")+f1(Math.abs(v));
const sp=p=>(p>0?"+":p<0?"−":"")+(Math.abs(p)*100).toFixed(1)+"%";
const cls=v=>v>0?"up":v<0?"dn":"fl";
/* 域：所有口径的最大值，换基准时坐标轴不动 */
function domain(a){const m=Math.max(...a.flatMap(o=>[o.cur,o.prev,o.yoy,o.bud]))*1.06;const step=m>420?100:m>200?50:25;return {max:Math.ceil(m/step)*step,step}}
const RH=66;let rowEls=new Map(),curDim=null;
function rowsData(){const a=items(dim);const D=a.map(o=>{const b=o[basis];return {...o,base:b,diff:o.cur-b,pct:(o.cur-b)/b}});
 D.sort((x,y)=>(x[sortK]-y[sortK])*sortDir);return D}
function build(){const box=$("#rows");rowEls.forEach(r=>r.remove());rowEls.clear();const a=items(dim),dm=domain(a);
 $("#grid").innerHTML="";for(let v=0;v<=dm.max;v+=dm.step){const i=document.createElement("i");i.style.left=v/dm.max*100+"%";$("#grid").appendChild(i)}
 $("#axis").innerHTML=Array.from({length:Math.floor(dm.max/dm.step)+1},(_,k)=>`<span style="left:${k*dm.step/dm.max*100}%">${k*dm.step}</span>`).join("");
 a.forEach(o=>{const r=document.createElement("div");r.className="row";r.dataset.n=o.name;r.style.transform=`translateY(${a.indexOf(o)*RH}px)`;
  r.innerHTML=`<div class="lb"><b>${o.name}</b><span></span></div><div class="tr"><i class="ln"></i><i class="dt d0"></i><i class="dt d1"></i><span class="vl a"></span><span class="vl b"></span></div><div class="df"></div><div class="pc"></div><div class="cu"></div>`;
  box.appendChild(r);rowEls.set(o.name,r)});
 rowEls.dm=dm;curDim=dim;$("#grid").style.height=a.length*RH+"px"}
function update(){if(curDim!==dim)build();const D=rowsData(),dm=rowEls.dm,tot=D.reduce((s,o)=>s+o.cur,0),totB=D.reduce((s,o)=>s+o.base,0);
 D.forEach((o,i)=>{const r=rowEls.get(o.name);r.style.transform=`translateY(${i*RH}px)`;const big=Math.abs(o.pct)>=.1;r.classList.toggle("fade",only&&!big);
  const x0=o.base/dm.max*100,x1=o.cur/dm.max*100,c=o.diff>0?"var(--up)":o.diff<0?"var(--dn)":"var(--ring)";
  const ln=r.querySelector(".ln"),d0=r.querySelector(".d0"),d1=r.querySelector(".d1");
  const set=()=>{ln.style.left=Math.min(x0,x1)+"%";ln.style.width=Math.abs(x1-x0)+"%";ln.style.background=c;d0.style.left=x0+"%";d1.style.left=x1+"%";d1.style.background=c;
   const va=r.querySelector(".vl.a"),vb=r.querySelector(".vl.b");va.style.left=x0+"%";vb.style.left=x1+"%";va.textContent=f1(o.base);vb.textContent=f1(o.cur);vb.style.color=c;
   if(Math.abs(x1-x0)<5){va.style.top="calc(50% - 44px)"}else va.style.top="calc(50% - 30px)"};
  if(first){ln.style.transition=d1.style.transition="none";ln.style.left=x0+"%";ln.style.width="0%";d0.style.left=d1.style.left=x0+"%";d1.style.background=c;ln.style.background=c;requestAnimationFrame(()=>requestAnimationFrame(()=>{ln.style.transition=d1.style.transition="";setTimeout(set,40+i*50)}))}else set();
  r.querySelector(".lb span").textContent=`占本月 ${(o.cur/tot*100).toFixed(1)}%`;
  const df=r.querySelector(".df");df.className="df "+cls(o.diff);df.textContent=sg(o.diff);const pc=r.querySelector(".pc");pc.className="pc "+cls(o.diff);pc.textContent=sp(o.pct);r.querySelector(".cu").textContent=f1(o.cur);
  r._o=o});
 first=false;
 $("#rows").style.minHeight=D.length*RH+"px";
 /* 头 */
 const dd=tot-totB,top=D.slice().sort((x,y)=>y.pct-x.pct)[0],low=D.slice().sort((x,y)=>x.pct-y.pct)[0],nBig=D.filter(o=>Math.abs(o.pct)>=.1).length,nUp=D.filter(o=>o.pct>=.1).length;
 const unit=dim==="dept"?"部门":"厂商",bf=basis==="bud"?"预算":BN[basis];
 $("#h1").innerHTML=basis==="bud"?`11 月算力费用 <em>${f1(tot)} 万</em>，${dd>0?`超出预算 <em class="u">${f1(dd)} 万</em>`:`低于预算 <em class="d">${f1(-dd)} 万</em>`}；${top.pct>0?`${top.name}超得最多（${sp(top.pct)}）`:"各项都在预算内"}`
  :`11 月算力费用 <em>${f1(tot)} 万</em>，比${bf}${dd>=0?`多 <em class="u">${f1(dd)} 万</em>`:`少 <em class="d">${f1(-dd)} 万</em>`}；${top.pct>0?`涨得最多的是${top.name}（${sp(top.pct)}）`:`每个${unit}都在降`}`;
 $("#kp").innerHTML=`<div><b class="${cls(dd)}">${sg(dd)}</b><span>较${bf}（万元）</span></div><div><b class="${cls(dd)}">${sp(dd/totB)}</b><span>变化率</span></div><div><b>${nBig}<small style="font-size:14px;color:var(--mute)"> / ${D.length}</small></b><span>变化超过 10% 的${unit}</span></div>`;
 $("#kc").textContent=`· 按${unit} · 对比 ${BF[basis]}`;$("#c0").textContent=unit;$("#c2").textContent=basis==="bud"?"超出预算":"变化额";$("#lg0").textContent=BN[basis];$("#swn").textContent=`${nBig} 个`;
 $("#so").querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.v===sortK));
 const arrow=sortDir<0?" ↓":" ↑";document.querySelectorAll("#so button").forEach(b=>b.textContent={diff:"变化额",pct:"变化率",cur:"本月金额"}[b.dataset.v]+(b.dataset.v===sortK?arrow:""));
}
/* 事件 */
function seg(id,fn){$(id).onclick=e=>{const b=e.target.closest("button");if(!b)return;document.querySelectorAll(id+" button").forEach(x=>x.classList.toggle("on",x===b));fn(b.dataset.v)}}
seg("#dim",v=>{dim=v;update()});seg("#bs",v=>{basis=v;update()});
$("#so").onclick=e=>{const b=e.target.closest("button");if(!b)return;if(sortK===b.dataset.v)sortDir=-sortDir;else{sortK=b.dataset.v;sortDir=-1}update()};
$("#sw").onclick=()=>{only=!only;$("#sw").classList.toggle("on",only);update()};
const tip=$("#tip");
$("#rows").addEventListener("mousemove",e=>{const tr=e.target.closest(".tr");if(!tr){tip.classList.remove("show");return}const o=tr.parentNode._o;if(!o)return;
 tip.innerHTML=`<h6>${o.name}</h6><div class="l"><span>${BN[basis]}</span><b>¥ ${f1(o.base)} 万</b></div><div class="l"><span>本月</span><b>¥ ${f1(o.cur)} 万</b></div><div class="l s"><span>${basis==="bud"?"超出":"变化"}</span><b style="color:${o.diff>0?"#ffa56b":"#6fd6d8"}">${sg(o.diff)} 万 · ${sp(o.pct)}</b></div>`;
 let x=e.clientX+16,y=e.clientY+14;if(x+220>innerWidth)x=e.clientX-236;if(y+120>innerHeight)y=e.clientY-120;tip.style.left=x+"px";tip.style.top=y+"px";tip.classList.add("show")});
$("#rows").addEventListener("mouseleave",()=>tip.classList.remove("show"));
build();update();
</script>
</body>
</html>
