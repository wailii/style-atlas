<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>液态玻璃</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root { --ink: #0f1626; --mute: rgba(15,22,38,.58); --bg: #eef1f5; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: var(--bg); }
  body { font-family: Inter, "Noto Sans SC", sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  .app { position: relative; height: 100vh; overflow: hidden; }
  .scroll { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; padding-bottom: 120px; }
  .scroll::-webkit-scrollbar { display: none; }

  /* 玻璃：模糊 + 边缘折射（SVG 位移贴图）+ 高光描边 */
  .glass { position: relative; border-radius: var(--r, 24px); background: rgba(255,255,255,.16); -webkit-backdrop-filter: blur(var(--bl, 6px)) saturate(1.7); backdrop-filter: var(--bf, blur(6px) saturate(1.7)); box-shadow: inset 0 1px 0 rgba(255,255,255,.75), inset 0 -1px 0 rgba(255,255,255,.25), inset 1.5px 0 0 rgba(255,255,255,.35), 0 10px 30px -12px rgba(15,22,38,.28); overflow: hidden; }
  .glass::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; background: linear-gradient(115deg, transparent 30%, rgba(255,255,255,.45) 45%, transparent 55%) no-repeat; background-size: 250% 100%; background-position: 160% 0; animation: sheen 6s ease-in-out infinite; animation-delay: var(--sd, 0s); }
  @keyframes sheen { 0%, 70% { background-position: 160% 0; } 100% { background-position: -60% 0; } }
  .jelly { transition: transform .5s cubic-bezier(.3,1.8,.4,1); }
  .jelly:active { transform: scale(1.08, .92); transition-duration: .12s; }

  .scene { position: relative; height: 430px; overflow: hidden; }
  .scene img.bg { position: absolute; inset: -10px; width: calc(100% + 20px); height: calc(100% + 20px); object-fit: cover; }
  .scene::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 120px; background: linear-gradient(rgba(238,241,245,0), var(--bg)); }
  .sb { position: absolute; left: 0; right: 0; top: 0; height: 40px; display: flex; align-items: center; justify-content: space-between; padding: 6px 26px 0; font-weight: 700; font-size: 15px; z-index: 5; }
  .head { position: absolute; left: 14px; right: 14px; top: 48px; display: flex; justify-content: space-between; align-items: center; z-index: 5; }
  .head .pill { --r: 22px; padding: 10px 16px; display: flex; align-items: baseline; gap: 8px; }
  .head h1 { font-weight: 900; font-size: 22px; letter-spacing: -.5px; }
  .head small { font-size: 12px; color: var(--mute); font-weight: 600; }
  .play { --r: 50%; width: 50px; height: 50px; display: grid; place-items: center; }
  .play i { width: 0; height: 0; border-left: 13px solid var(--ink); border-top: 8px solid transparent; border-bottom: 8px solid transparent; margin-left: 4px; transition: all .3s; }
  .play.on i { width: 13px; height: 15px; border: 0; margin: 0; background: linear-gradient(90deg, var(--ink) 35%, transparent 35% 65%, var(--ink) 65%); }
  .lens { position: absolute; width: 132px; height: 132px; --r: 50%; z-index: 3; background: rgba(255,255,255,.04); box-shadow: inset 0 2px 1px rgba(255,255,255,.9), inset 0 -2px 2px rgba(255,255,255,.35), inset 0 0 0 1px rgba(255,255,255,.4), 0 18px 40px -14px rgba(15,22,38,.4); }
  .card { position: absolute; left: 14px; right: 14px; bottom: 26px; z-index: 4; --r: 28px; padding: 16px 18px 16px; }
  .card .k { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; color: var(--mute); }
  .card .k b { font-family: Inter; font-size: 12px; padding: 3px 8px; border-radius: 99px; background: rgba(15,22,38,.86); color: #fff; }
  .card h2 { margin-top: 8px; font-weight: 900; font-size: 21px; line-height: 1.38; letter-spacing: -.3px; }
  .card p { margin-top: 7px; font-size: 13.5px; line-height: 1.6; color: rgba(15,22,38,.72); }

  .amb { position: absolute; left: 0; right: 0; top: 400px; height: 900px; pointer-events: none; }
  .amb img { position: absolute; width: 260px; height: 260px; object-fit: cover; filter: blur(46px) saturate(1.5); opacity: .55; border-radius: 50%; }
  ol { position: relative; list-style: none; display: flex; flex-direction: column; gap: 12px; padding: 4px 14px 0; }
  .it { --r: 22px; display: grid; grid-template-columns: 44px 1fr 64px; gap: 12px; align-items: center; padding: 12px 12px 12px 14px; cursor: pointer; }
  .it .n { font-family: Inter; font-weight: 800; font-size: 22px; letter-spacing: -1px; color: rgba(15,22,38,.35); }
  .it h3 { font-weight: 700; font-size: 15px; line-height: 1.45; }
  .it .m { margin-top: 5px; font-size: 12px; color: var(--mute); font-weight: 600; }
  .it .more { display: none; margin-top: 6px; font-size: 13px; line-height: 1.6; color: rgba(15,22,38,.75); }
  .it.open .more { display: block; }
  .it .tn { width: 64px; height: 64px; border-radius: 16px; overflow: hidden; box-shadow: inset 0 0 0 1px rgba(255,255,255,.6); display: grid; place-items: center; background: rgba(255,255,255,.35); }
  .it .tn img { width: 100%; height: 100%; object-fit: cover; }
  .it .tn svg { width: 34px; height: 34px; opacity: .7; }

  .dock { position: absolute; left: 14px; right: 14px; bottom: 22px; z-index: 10; --r: 32px; height: 64px; display: grid; grid-template-columns: repeat(5, 1fr); padding: 6px; }
  .drop { position: absolute; top: 6px; height: 52px; border-radius: 26px; background: rgba(255,255,255,.55); box-shadow: inset 0 1px 0 rgba(255,255,255,.9), 0 4px 12px -4px rgba(15,22,38,.25); }
  .tab { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; font-weight: 700; color: var(--mute); }
  .tab svg { width: 20px; height: 20px; }
  .tab.on { color: var(--ink); }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" id="defs"></svg>
<div class="app" id="app"></div>
<script src="data.js"></script>
<script src="common.js"></script>
<script src="engines.js"></script>
<script>
const { makeGlass } = Engines;
const app = document.getElementById("app");
const [h1, ...rest] = HOT;

// ── 折射贴图：边缘往里弯、透镜中间放大。R/G 两个通道存横竖位移 ──

app.innerHTML = `
  <main class="scroll" id="scroll">
    <section class="scene">
      <img class="bg" src="${h1.cover}" alt="">
      <div class="glass lens" id="lens"></div>
      <div class="glass card jelly" id="card"><div class="k"><b>TOP 01</b><span>热度 ${heatText(h1)} · ${h1.sources} 家在说</span></div><h2>${esc(shortTitle(h1))}</h2><p>${esc(clip(firstLine(h1.summary), 48))}</p></div>
    </section>
    <div class="amb">${HOT.filter((h) => h.cover).slice(1).map((h, i) => `<img src="${h.cover}" style="left:${[-60, 180, -40][i]}px;top:${[40, 300, 560][i]}px" alt="">`).join("")}</div>
    <ol>${rest.map((h, i) => `<li class="glass it jelly" data-r="${h.rank}" style="--sd:${(i * 0.7).toFixed(1)}s"><span class="n">${pad2(h.rank)}</span><div><h3>${esc(shortTitle(h))}</h3><div class="m">热度 ${heatText(h)} · ${h.sources} 家</div><div class="more">${esc(clip(firstLine(h.summary), 80))}</div></div><div class="tn">${h.cover ? `<img src="${h.cover}" alt="">` : `<svg viewBox="0 0 64 64"><path d="${DOODLE[h.rank]}" fill="none" stroke="#0f1626" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`}</div></li>`).join("")}</ol>
  </main>
  <div class="sb"><span>${nowHM()}</span><span>5G ▮</span></div>
  <div class="head"><div class="glass pill jelly" id="pill"><h1>AI 热点</h1><small>10.22 · 实时</small></div><button class="glass play jelly" id="play"><i></i></button></div>
  <nav class="glass dock" id="dock"><i class="drop" id="drop"></i>${TAB_NAMES.map((n, i) => `<button class="tab ${i ? "" : "on"}">${iconSVG(i)}${n}</button>`).join("")}</nav>`;

const $ = (id) => document.getElementById(id);
(async () => {
await fontsReady();
makeGlass($("card"), { bezel: 22, scale: 46 });
makeGlass($("pill"), { bezel: 14, scale: 30 });
makeGlass($("play"), { r: 25, bezel: 16, scale: 34 });
makeGlass($("dock"), { r: 32, bezel: 18, scale: 40, blur: 8 });
makeGlass($("lens"), { lens: true, scale: 70, blur: 0.4 });
app.querySelectorAll(".it").forEach((el) => makeGlass(el, { r: 22, bezel: 16, scale: 36, blur: 10 }));

// 透镜在头图上慢慢漂，经过的地方被放大、弯折
const lens = $("lens"), scene = app.querySelector(".scene");
(function drift(now) {
  const t = now / 1000, W = scene.clientWidth;
  lens.style.left = (W / 2 - 66 + Math.sin(t * 0.45) * (W / 2 - 80)) + "px";
  lens.style.top = (120 + Math.sin(t * 0.7 + 1) * 60) + "px";
  requestAnimationFrame(drift);
})(0);
// 入场：玻璃从模糊一团凝出来
const appear = (el, d) => el.animate([{ opacity: 0, transform: "translateY(18px) scale(.94)", filter: "blur(10px)" }, { opacity: 1, transform: "none", filter: "blur(0)" }], { duration: 900, delay: d, easing: "cubic-bezier(.2,.9,.2,1.15)", fill: "backwards" });
appear($("pill"), 150); appear($("play"), 250); appear($("lens"), 500); appear($("card"), 650); appear($("dock"), 400);
app.querySelector(".bg").animate([{ transform: "scale(1.12)", filter: "blur(16px)" }, { transform: "none", filter: "blur(0)" }], { duration: 1600, easing: "cubic-bezier(.2,.8,.2,1)" });
app.querySelectorAll(".it").forEach((li, i) => { appear(li, 900 + i * 110); li.addEventListener("click", () => li.classList.toggle("open")); });

// 底栏：一滴玻璃在选项之间流过去，两头先后到
const tabs = [...app.querySelectorAll(".tab")], drop = $("drop");
const E = { l: { x: 0, v: 0, t: 0, k: 300 }, r: { x: 0, v: 0, t: 0, k: 300 } }; let last = 0, run = false;
function target(i, jump) {
  const t = tabs[i], L = t.offsetLeft, R = L + t.offsetWidth, right = L > E.l.t;
  E.l.t = L; E.r.t = R; E.l.k = right ? 140 : 420; E.r.k = right ? 420 : 140;
  if (jump) { E.l.x = L; E.r.x = R; draw(); } else if (!run) { run = true; last = 0; requestAnimationFrame(step); }
}
function draw() { drop.style.left = E.l.x + "px"; drop.style.width = E.r.x - E.l.x + "px"; const st = Math.abs(E.l.v - E.r.v) / 1600; drop.style.transform = `scaleY(${Math.max(0.8, 1 - st)})`; }
function step(now) {
  const dt = Math.min(1 / 30, last ? (now - last) / 1000 : 1 / 60); last = now; let busy = false;
  for (const s of [E.l, E.r]) { for (let i = 0; i < 4; i++) { const a = -s.k * (s.x - s.t) - 2 * Math.sqrt(s.k) * 0.75 * s.v; s.v += (a * dt) / 4; s.x += (s.v * dt) / 4; } if (Math.abs(s.x - s.t) > 0.1 || Math.abs(s.v) > 0.5) busy = true; else { s.x = s.t; s.v = 0; } }
  draw(); if (busy) requestAnimationFrame(step); else run = false;
}
target(0, true);
tabs.forEach((t, i) => t.addEventListener("click", () => { tabs.forEach((x) => x.classList.toggle("on", x === t)); target(i); }));
$("play").addEventListener("click", () => $("play").classList.toggle("on"));
})();
</script>
</body>
</html>
