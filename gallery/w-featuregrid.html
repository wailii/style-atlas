<style>

.b.p{background:var(--ink);color:#fff;border-color:var(--ink)}
.hero{text-align:center;padding:30px 20px 0}
.badge{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;border-radius:99px;padding:4px 12px 4px 5px;font-size:12.5px;color:var(--ink2)}
.badge i{font-style:normal;background:var(--acc);color:#fff;border-radius:99px;padding:1px 8px;font-weight:600;font-size:11.5px}
h1{font-size:54px;line-height:1.14;letter-spacing:-.03em;font-weight:700;margin:16px 0 10px}
h1 span{color:var(--acc)}
.sub{color:var(--ink2);font-size:16.5px;margin-bottom:20px}
.seg{display:inline-flex;background:#e9eaf0;border-radius:11px;padding:3px;position:relative}
.seg button{border:0;background:none;padding:7px 22px;border-radius:9px;font-weight:500;color:var(--ink2);position:relative;z-index:1;transition:color .25s}
.seg button.on{color:var(--ink)}
.seg .th{position:absolute;top:3px;bottom:3px;left:3px;border-radius:9px;background:#fff;box-shadow:0 1px 2px rgba(20,20,40,.12);transition:transform .35s cubic-bezier(.3,.8,.2,1),width .35s}
.grid{max-width:1240px;margin:22px auto 0;padding:0 28px 40px;display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:176px;gap:14px}
.cell{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px 20px;position:relative;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;transition:border-color .25s,transform .25s}
.cell:hover{border-color:#cfd2de}
.cell h3{font-size:15.5px;font-weight:600;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.cell h3 em{font-style:normal;font-size:11px;font-weight:600;color:var(--acc);background:var(--acc2);border-radius:5px;padding:1px 6px}
.cell p{color:var(--ink2);font-size:12.5px;margin-top:3px;line-height:1.5;max-width:340px}
.cell .demo{flex:1;position:relative;margin-top:10px;min-height:0;transition:transform .5s cubic-bezier(.2,.8,.2,1);transform-origin:50% 80%}
.cell:hover .demo{transform:scale(1.035)}
.cell .more{position:absolute;right:14px;top:14px;width:26px;height:26px;border-radius:8px;border:1px solid var(--line);display:grid;place-items:center;color:var(--mute);background:#fff;opacity:0;transition:.2s}
.cell:hover .more{opacity:1}
.cell .more svg{width:12px;height:12px}
.sA{grid-column:1/3;grid-row:1/3}.sB{grid-column:3;grid-row:1}.sC{grid-column:4;grid-row:1/3}.sE{grid-column:3;grid-row:2}.sD{grid-column:1/3;grid-row:3}.sF{grid-column:3;grid-row:3}.sG{grid-column:4;grid-row:3}
.grid.has-open .cell{grid-column:auto;grid-row:auto}.cell.open{grid-column:1/-1!important;grid-row:span 2!important;order:-1;cursor:default;padding:26px 28px;border-color:var(--acc)}
.cell.open .more{opacity:1;right:20px;top:20px}
.cell .detail{display:none}
.cell.open{display:grid;grid-template-columns:1.25fr 1fr;grid-template-rows:auto 1fr;column-gap:36px}
.cell.open>.hd{grid-column:1}.cell.open>.demo{grid-column:1;grid-row:2;margin-top:18px;border:1px solid var(--line);border-radius:14px;background:#fbfbfd;padding:14px}
.cell.open>.detail{display:block;grid-column:2;grid-row:1/3;padding-top:4px}
.cell.open h3{font-size:24px}.cell.open p{font-size:14px;max-width:none}
.detail ul{list-style:none;margin:14px 0 20px}.detail li{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px;color:var(--ink2)}

.ui .dep{margin-top:14px;width:100%;height:34px;border-radius:9px;border:0;background:var(--ink);color:#fff;font-weight:600;font-size:13px;transition:background .3s,transform .15s}
.ui .dep.go{background:#9a8cf7}.ui .dep.ok{background:var(--ok)}.ui .dep.dn{transform:scale(.96)}
.ui .pb{height:4px;border-radius:3px;background:#e7e8ef;margin-top:10px;overflow:hidden}.ui .pb i{display:block;height:100%;width:0;background:var(--acc)}
.cur{position:absolute;width:18px;height:18px;left:0;top:0;z-index:3;filter:drop-shadow(0 2px 3px rgba(0,0,0,.25));pointer-events:none}
/* D */
.term{position:absolute;inset:0;background:#14151a;border-radius:12px;padding:12px 14px;font:12px/1.65 var(--mono);color:#c9ccd8;overflow:hidden}
.term .p{color:#8f7bff}.term .o{color:#6ee7a0}.term .d{color:#7b8094}
.term{display:flex;flex-direction:column;justify-content:flex-end}.term div:last-child:after{content:"";display:inline-block;width:7px;height:13px;margin-left:3px;background:#c9ccd8;vertical-align:-2px;animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:0}}
/* E */
.don{display:flex;align-items:center;gap:14px;height:100%}
.don svg{width:92px;height:92px;flex:none}
.don .t b{display:block;font-size:24px;letter-spacing:-.03em;font-variant-numeric:tabular-nums}.don .t span{font-size:11.5px;color:var(--mute)}
.lg{font-size:11.5px;color:var(--ink2);margin-top:6px;display:flex;flex-direction:column;gap:2px}.lg i{display:inline-block;width:7px;height:7px;border-radius:2px;margin-right:6px}
/* F */
.demo canvas{position:absolute;inset:0;width:100%;height:100%}
/* G */
.flow{display:flex;flex-direction:column;gap:8px;justify-content:center;height:100%}
.flow div{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--mute);transition:color .3s}
.flow i{width:18px;height:18px;border-radius:50%;border:1.5px solid #cfd2de;display:grid;place-items:center;transition:.3s;flex:none}
.flow i svg{width:10px;height:10px;opacity:0;transition:.2s}
.flow .dn{color:var(--ink)}.flow .dn i{background:var(--ok);border-color:var(--ok)}.flow .dn svg{opacity:1}
.flow .cu{color:var(--ink)}.flow .cu i{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc2)}

   const tv=parseFloat(d[4]);$('b',el).textContent=(tv*e).toFixed(tv>99.9?2:1)+'%'}},
 net:{init(el,d){const cv=document.createElement('canvas');el.appendChild(cv);const P=[[.14,.32],[.3,.78],[.52,.2],[.72,.8],[.86,.34]];const nodes=d[3].map((n,i)=>({n,x:P[i][0],y:P[i][1]}));return{cv,nodes,pk:[]}},
  tick(el,s,t,d,dt){const cv=s.cv,w=el.clientWidth,h=el.clientHeight,dpr=2;if(cv.width!==w*dpr){cv.width=w*dpr;cv.height=h*dpr}const g=cv.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,w,h);
   const N=s.nodes,hub={x:.5,y:.55};g.lineWidth=1;g.strokeStyle='#dfe1ea';N.forEach(n=>{g.beginPath();g.moveTo(n.x*w,n.y*h);g.lineTo(hub.x*w,hub.y*h);g.stroke()});
   if(Math.random()<dt*2.2)s.pk.push({i:Math.floor(Math.random()*N.length),u:0,out:Math.random()<.5});s.pk=s.pk.filter(p=>(p.u+=dt*.7)<1);
   s.pk.forEach(p=>{const n=N[p.i],u=p.out?p.u:1-p.u;const x=(hub.x+(n.x-hub.x)*u)*w,y=(hub.y+(n.y-hub.y)*u)*h;g.fillStyle='#5b3df5';g.beginPath();g.arc(x,y,3,0,7);g.fill()});
   g.fillStyle='#0e0f13';g.beginPath();g.arc(hub.x*w,hub.y*h,6,0,7);g.fill();g.font='11px Inter,"Noto Sans SC",sans-serif';g.textAlign='center';
   N.forEach((n,i)=>{const pulse=(Math.sin(t*2+i*1.7)+1)/2;g.strokeStyle='rgba(91,61,245,'+(.35*(1-pulse))+')';g.beginPath();g.arc(n.x*w,n.y*h,5+pulse*8,0,7);g.stroke();g.fillStyle='#fff';g.strokeStyle='#5b3df5';g.lineWidth=1.6;g.beginPath();g.arc(n.x*w,n.y*h,5,0,7);g.fill();g.stroke();g.fillStyle='#7a8092';g.fillText(n.n,n.x*w,n.y*h+19)})}},
 flow:{init(el,d){el.innerHTML='<div class="flow">'+d[3].map(x=>`<div><i><svg viewBox="0 0 10 10" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 5.2l2.2 2.2L8 3"/></svg></i>${x}</div>`).join('')+'</div>';return{}},
  tick(el,s,t,d){const n=d[3].length,p=(t*.8)%(n+1.6);$$('.flow div',el).forEach((e,i)=>{e.classList.toggle('dn',p>i+1);e.classList.toggle('cu',p>i&&p<=i+1)})}}
};
// ---------- 渲染 ----------
function build(){
  const M=MODES[mode];grid.innerHTML='';
  CELLS.forEach(([k,cls,kind])=>{const d=M[k],el=document.createElement('div');el.className='cell '+cls;el.dataset.k=k;el.style.viewTransitionName='c'+k;
    const det=M.detail[k];
    el.innerHTML=`<div class="hd"><h3>${d[0]}${k==='A'?'<em>实时</em>':''}</h3><p>${d[1]}</p></div><div class="demo"></div><button class="more" aria-label="展开">${arrow}</button>
     <div class="detail">${det?`<div class="st">${det[2].map(([a,b])=>`<div><b>${a}</b><span>${b}</span></div>`).join('')}</div><p style="font-size:14.5px;line-height:1.7;color:var(--ink2);max-width:none">${det[0]}</p><ul>${det[1].map(x=>`<li>${x}</li>`).join('')}</ul><button class="b p">在控制台打开</button>`:`<p style="font-size:14.5px;line-height:1.7;color:var(--ink2);max-width:none;margin-top:6px">${d[1]}。在控制台里可以单独配置，也可以和团队共享一套模板。</p><ul><li>支持按环境分别设置</li><li>每次改动自动留痕</li><li>可通过命令行或接口调用</li></ul><button class="b p">在控制台打开</button>`}</div>`;
    grid.appendChild(el);const demo=demos[kind],box=$('.demo',el);state[k]={demo,box,d,s:demo.init(box,d),t:Math.random()*2+3,speed:1,target:1,el};
    el.addEventListener('mouseenter',()=>state[k].target=2.6);el.addEventListener('mouseleave',()=>state[k].target=1);
    el.addEventListener('click',()=>toggleOpen(el));});
}
function toggleOpen(el){const go=()=>{const was=el.classList.contains('open');$$('.cell.open').forEach(c=>{c.classList.remove('open');$('.more',c).innerHTML=arrow});if(!was){el.classList.add('open');$('.more',el).innerHTML=xmark}grid.classList.toggle('has-open',!was)};
  if(document.startViewTransition)document.startViewTransition(go);else go();}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){const o=$('.cell.open');if(o)toggleOpen(o)}});
let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;
  for(const k in state){const S=state[k];S.speed+=(S.target-S.speed)*Math.min(1,dt*6);S.t+=dt*S.speed;if(!S.el.isConnected)continue;try{S.demo.tick(S.box,S.s,S.t,S.d,dt*S.speed)}catch(err){console.error(err)}}
  requestAnimationFrame(loop)}
// ---------- 分段切换 ----------
const th=$('#th');function moveTh(){const b=$('#seg button.on');th.style.width=b.offsetWidth+'px';th.style.transform=`translateX(${b.offsetLeft-3}px)`}
$$('#seg button').forEach(b=>b.addEventListener('click',()=>{if(b.dataset.m===mode)return;$$('#seg button').forEach(x=>x.classList.toggle('on',x===b));mode=b.dataset.m;moveTh();
  const go=()=>{$('#sub').textContent=MODES[mode].sub;build()};if(document.startViewTransition)document.startViewTransition(go);else go()}));
moveTh();build();requestAnimationFrame(loop);document.fonts&&document.fonts.ready.then(moveTh);
</script></body></html>
