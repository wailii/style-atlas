<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>墨水屏</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600;7..72,700&family=Noto+Serif+SC:wght@400;600;900&display=swap" rel="stylesheet">
<style>
  :root { --paper: #e9e8e2; --ink: #1b1b1b; --g1: #3a3a3a; --g2: #6b6b6b; --g3: #a3a3a0; --g4: #cfcec8; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: var(--paper); }
  body { font-family: Literata, "Noto Serif SC", serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  canvas { image-rendering: pixelated; display: block; }
  /* 墨水屏：没有渐变、没有阴影、没有过渡动画；状态一变就是硬切 */
  .app { position: relative; height: 100vh; display: flex; flex-direction: column; overflow: hidden; background: var(--paper); }
  .app::before { content: ""; position: absolute; inset: 0; background-image: var(--grain); opacity: .5; pointer-events: none; z-index: 0; }
  .sb { position: relative; z-index: 1; height: 38px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 6px 22px 0; font-size: 13px; font-weight: 600; }
  .bat { display: flex; align-items: center; gap: 6px; }
  .bat i { width: 22px; height: 11px; border: 1.5px solid var(--ink); border-radius: 2px; position: relative; }
  .bat i::before { content: ""; position: absolute; inset: 1.5px; right: 6px; background: var(--ink); }
  .bat i::after { content: ""; position: absolute; right: -4px; top: 3px; width: 2px; height: 3px; background: var(--ink); }
  .head { position: relative; z-index: 1; flex: none; display: flex; justify-content: space-between; align-items: baseline; padding: 4px 20px 8px; border-bottom: 1.5px solid var(--ink); font-size: 12px; color: var(--g2); }
  .head b { font-size: 15px; color: var(--ink); font-weight: 700; letter-spacing: .05em; }
  .stage { position: relative; z-index: 1; flex: 1; overflow: hidden; }
  .page, .ghost { position: absolute; inset: 0; padding: 18px 22px 0; }
  .ghost { opacity: .07; pointer-events: none; }
  .kick { font-size: 12px; color: var(--g2); letter-spacing: .08em; }
  h2 { margin-top: 6px; font-weight: 900; font-size: 24px; line-height: 1.38; }
  .fig { margin-top: 14px; border: 1.5px solid var(--ink); }
  .fig canvas { width: 100%; height: auto; }
  .cap { margin-top: 5px; font-size: 11px; color: var(--g2); }
  .txt { margin-top: 12px; font-size: 15.5px; line-height: 1.85; text-align: justify; text-indent: 2em; }
  .toc h3 { font-weight: 900; font-size: 20px; margin-bottom: 8px; }
  .toc .row { display: flex; align-items: baseline; gap: 6px; padding: 9px 0; border-bottom: 1px solid var(--g4); font-size: 14.5px; line-height: 1.5; cursor: pointer; }
  .toc .row b { font-weight: 700; width: 22px; flex: none; }
  .toc .row span { flex: 1; }
  .toc .row em { font-style: normal; font-size: 12.5px; color: var(--g2); flex: none; }
  .toc .row.on { background: var(--ink); color: var(--paper); margin: 0 -8px; padding: 9px 8px; }
  .toc .row.on em { color: var(--g4); }
  .foot { position: relative; z-index: 1; flex: none; padding: 8px 22px 6px; font-size: 11.5px; color: var(--g2); display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .prog { flex: 1; height: 1.5px; background: var(--g4); position: relative; }
  .prog i { position: absolute; left: 0; top: -2px; height: 5.5px; width: var(--p); border-right: 2px solid var(--ink); }
  .prog i::before { content: ""; position: absolute; inset: 2px 0; background: var(--ink); }
  .tools { position: relative; z-index: 1; flex: none; display: grid; grid-template-columns: repeat(4, 1fr); margin: 0 14px 22px; border: 1.5px solid var(--ink); }
  .tools button { height: 44px; font-size: 13.5px; font-weight: 600; }
  .tools button + button { border-left: 1.5px solid var(--ink); }
  .tools button.on { background: var(--ink); color: var(--paper); }
  .flash { position: absolute; inset: 0; z-index: 9; pointer-events: none; opacity: 0; }
</style>
</head>
<body>
<div class="app" id="app"></div>
<script src="data.js"></script>
<script src="common.js"></script>
<script>
const app = document.getElementById("app");
const [h1, h2] = HOT;
app.style.setProperty("--grain", `url(${grainURL(160, 0.05, 0)})`);
// 16 级灰 + Floyd–Steinberg 误差扩散：墨水屏的标准画法；bits=1 时是刷新第一拍的黑白版
function eink(img, w, h, bits = 4) {
  const c = coverCanvas(img, w, h), x = c.getContext("2d"), id = x.getImageData(0, 0, w, h), d = id.data, L = new Float32Array(w * h), n = (1 << bits) - 1;
  for (let i = 0; i < w * h; i++) L[i] = Math.min(255, (0.299 * d[i * 4] + 0.587 * d[i * 4 + 1] + 0.114 * d[i * 4 + 2]) * 1.04 + 4);
  for (let y = 0; y < h; y++) for (let xx = 0; xx < w; xx++) {
    const i = y * w + xx, o = L[i], q = Math.round((o / 255) * n) * (255 / n), e = o - q; L[i] = q;
    if (xx + 1 < w) L[i + 1] += e * 7 / 16; if (y + 1 < h) { if (xx > 0) L[i + w - 1] += e * 3 / 16; L[i + w] += e * 5 / 16; if (xx + 1 < w) L[i + w + 1] += e / 16; }
  }
  // 白 = 纸色，黑 = 墨色
  for (let i = 0; i < w * h; i++) { const t = L[i] / 255; d[i * 4] = 27 + t * (233 - 27); d[i * 4 + 1] = 27 + t * (232 - 27); d[i * 4 + 2] = 27 + t * (226 - 27); }
  x.putImageData(id, 0, 0); return c;
}
const mins = (s) => Math.max(1, Math.round([...s].length / 400));
const article = (h, k) => `<div class="kick">第 ${h.rank} 条 · 共 ${HOT.length} 条</div><h2>${esc(shortTitle(h))}</h2>${h.cover ? `<div class="fig"><canvas data-src="${h.cover}" width="346" height="195"></canvas></div><div class="cap">头条封面 · 16 级灰抖动</div>` : ""}<p class="txt">${esc(clip(firstLine(h.summary), k))}</p>`;
const PAGES = [
  () => article(h1, 210),
  () => `<div class="toc"><h3>目录</h3>${HOT.map((h, i) => `<div class="row ${i ? "" : "on"}" data-i="${i}"><b>${h.rank}</b><span>${esc(shortTitle(h))}</span><em>${heatText(h)}</em></div>`).join("")}</div>`,
  () => article(h2, 170),
];
app.innerHTML = `
  <div class="sb"><span>${nowHM()}</span><span class="bat">78%<i></i></span></div>
  <div class="head"><b>AI 热点</b><span>10 月 22 日 · 周四</span></div>
  <div class="stage" id="stage"><div class="ghost" id="ghost"></div><div class="page" id="page"></div></div>
  <div class="foot"><span id="pn">1 / 3</span><span class="prog"><i id="pg"></i></span><span>约 ${mins(h1.summary + h2.summary)} 分钟读完</span></div>
  <nav class="tools"><button id="prev">上一页</button><button id="read">朗读</button><button id="toc">目录</button><button id="next">下一页</button></nav>
  <div class="flash" id="flash"></div>`;
const $ = (id) => document.getElementById(id);
let cur = 0, turns = 0;
const imgs = {};
// 翻页：每 4 次局部刷新留一层残影，第 4 次做一次全刷（黑一下、白一下、再出内容）清掉残影
async function show(i, full = false) {
  turns++; full = full || turns % 4 === 0;
  $("ghost").innerHTML = full ? "" : $("page").innerHTML;
  cur = i; $("page").innerHTML = PAGES[i]();
  $("pn").textContent = `${i + 1} / ${PAGES.length}`; $("pg").style.setProperty("--p", `${((i + 1) / PAGES.length) * 100}%`);
  const cvs = [...$("page").querySelectorAll("canvas[data-src]")];
  for (const cv of cvs) { const im = imgs[cv.dataset.src] || (imgs[cv.dataset.src] = await loadImage(cv.dataset.src)); cv.getContext("2d").drawImage(eink(im, cv.width, cv.height, 1), 0, 0); setTimeout(() => cv.getContext("2d").drawImage(eink(im, cv.width, cv.height, 4), 0, 0), full ? 420 : 160); }
  $("page").querySelectorAll(".row").forEach((r) => r.addEventListener("click", (e) => { e.stopPropagation(); $("page").querySelectorAll(".row").forEach((x) => x.classList.toggle("on", x === r)); }));
  const f = $("flash");
  if (full) f.animate([{ opacity: 1, background: "#1b1b1b" }, { opacity: 1, background: "#1b1b1b", offset: 0.35 }, { opacity: 1, background: "#e9e8e2", offset: 0.36 }, { opacity: 1, background: "#e9e8e2", offset: 0.7 }, { opacity: 0, offset: 0.71 }, { opacity: 0 }], { duration: 380, easing: "linear" });
  else $("page").animate([{ filter: "invert(1)" }, { filter: "invert(1)", offset: 0.5 }, { filter: "none", offset: 0.51 }, { filter: "none" }], { duration: 140 });
}
$("next").onclick = () => show((cur + 1) % PAGES.length);
$("prev").onclick = () => show((cur + PAGES.length - 1) % PAGES.length);
$("toc").onclick = () => show(1);
$("stage").addEventListener("click", (e) => { const r = $("stage").getBoundingClientRect(); (e.clientX - r.left > r.width / 3 ? $("next") : $("prev")).click(); });
$("read").onclick = () => { const on = $("read").classList.toggle("on"); $("read").textContent = on ? "朗读中" : "朗读"; };
(async () => { await fontsReady(); turns = 3; show(0, true); })();
</script>
</body>
</html>
