<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>纸拼贴</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Special+Elite&family=Noto+Sans+SC:wght@500;700;900&family=Noto+Serif+SC:wght@600;900&display=swap" rel="stylesheet">
<style>
  :root { --bg: #ebe3d0; --paper: #fbf8f0; --ink: #141210; --red: #e2402b; --mustard: #f1b73a; --gray: #6e675b; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: var(--bg); }
  body { font-family: "Noto Sans SC", sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  .app { position: relative; height: 100vh; display: flex; flex-direction: column; background: var(--bg) var(--fiber); }
  .app::after { content: ""; position: absolute; inset: 0; pointer-events: none; background-image: var(--grain); mix-blend-mode: multiply; }

  /* 每块纸：外层管阴影和抖动，内层管撕边 */
  .scrap { position: relative; display: inline-block; filter: drop-shadow(0 1px 0 rgba(40,30,10,.10)) drop-shadow(1.5px 3px 2.5px rgba(40,30,10,.22)); transform: rotate(var(--r, 0deg)); }
  .scrap > .pp { position: relative; background: var(--paper); }
  .hide { visibility: hidden; }

  .sb { height: 40px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 6px 24px 0; font-family: "Special Elite", monospace; font-size: 15px; }

  .top { flex: none; display: flex; align-items: flex-start; justify-content: space-between; padding: 4px 16px 10px 18px; position: relative; z-index: 2; }
  .ransom { display: flex; align-items: flex-end; gap: 3px; }
  .ransom .pp { padding: 2px 7px 0; line-height: 1.05; }
  .r1 .pp { background: var(--ink); color: var(--paper); font-family: Anton, sans-serif; font-size: 38px; padding: 0 6px; }
  .r2 .pp { background: var(--mustard); font-family: "Noto Serif SC", serif; font-weight: 900; font-size: 31px; }
  .r3 .pp { background: var(--paper); font-family: "Noto Serif SC", serif; font-weight: 900; font-size: 40px; }
  .r4 .pp { background: var(--red); color: #fff; font-weight: 900; font-size: 33px; }
  .date { margin-top: 9px; font-family: "Special Elite", "Noto Serif SC", monospace; font-size: 13px; color: var(--gray); letter-spacing: .5px; }
  .listen .pp { background: var(--mustard); padding: 9px 13px 8px; font-family: "Special Elite", "Noto Serif SC", monospace; font-size: 15px; display: flex; align-items: center; gap: 7px; }
  .listen i { display: inline-block; width: 0; height: 0; border-left: 10px solid var(--ink); border-top: 6px solid transparent; border-bottom: 6px solid transparent; }
  .listen.on i { width: 10px; height: 11px; border: 0; background: linear-gradient(90deg, var(--ink) 35%, transparent 35% 65%, var(--ink) 65%); }
  .bars { display: none; gap: 2px; align-items: flex-end; height: 14px; }
  .listen.on .bars { display: flex; }
  .bars b { width: 3px; background: var(--red); height: 6px; }

  .scroll { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 6px 14px 30px; scrollbar-width: none; position: relative; z-index: 1; }
  .scroll::-webkit-scrollbar { display: none; }

  .hero { position: relative; margin: 6px 0 22px; }
  .photo { position: relative; width: 100%; height: 222px; }
  .photo canvas { position: absolute; left: -4px; top: 0; width: calc(100% + 8px); height: 100%; filter: drop-shadow(1.5px 3px 3px rgba(40,30,10,.25)); }
  .tape { position: absolute; width: 78px; height: 24px; background: rgba(236, 222, 180, .78); mix-blend-mode: multiply; clip-path: polygon(0 8%, 6% 0, 12% 10%, 18% 0, 24% 9%, 30% 0, 100% 0, 100% 92%, 94% 100%, 88% 90%, 82% 100%, 76% 91%, 70% 100%, 0 100%); }
  .sticker { position: absolute; left: -2px; top: 150px; width: 84px; height: 84px; z-index: 3; }
  .sticker .pp { width: 84px; height: 84px; border-radius: 50%; background: var(--red); color: #fff; display: grid; place-items: center; font-family: Anton, sans-serif; font-size: 40px; padding-top: 2px; }
  .lines { position: relative; margin: -22px 0 0 64px; z-index: 2; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
  .lines .pp { font-weight: 900; font-size: 22px; line-height: 1.32; padding: 3px 10px 4px; white-space: nowrap; }
  .lines .key .pp { background: var(--ink); color: var(--paper); }
  .memo { margin: 14px 4px 0 18px; width: calc(100% - 34px); }
  .memo .pp { background: #f4eedf; padding: 12px 14px 12px; font-family: "Noto Serif SC", serif; font-weight: 600; font-size: 13.5px; line-height: 1.7; color: #3b362d; background-image: repeating-linear-gradient(transparent 0 22px, rgba(120,100,60,.13) 22px 23px); background-position: 0 9px; }
  .label { position: absolute; right: 4px; bottom: -16px; z-index: 3; }
  .label .pp { background: var(--mustard); padding: 6px 10px 5px; font-family: "Special Elite", "Noto Serif SC", monospace; font-size: 12.5px; }
  .marker { position: absolute; inset: -16px -18px; width: calc(100% + 36px); height: calc(100% + 32px); overflow: visible; pointer-events: none; z-index: 4; }

  ol { list-style: none; display: flex; flex-direction: column; gap: 14px; padding-top: 4px; }
  .it { width: 100%; cursor: pointer; }
  .it > .pp { display: grid; grid-template-columns: 1fr 92px; gap: 12px; padding: 14px 12px 15px 14px; }
  .it .no { display: inline-block; margin-bottom: 7px; }
  .it .no .pp { background: var(--ink); color: var(--paper); font-family: Anton, sans-serif; font-size: 17px; letter-spacing: .5px; padding: 1px 7px 0; }
  .it h3 { font-size: 16.5px; font-weight: 700; line-height: 1.45; }
  .it p { margin-top: 6px; font-family: "Noto Serif SC", serif; font-weight: 600; font-size: 12.5px; line-height: 1.5; color: var(--gray); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .it .more { display: none; margin-top: 8px; font-family: "Noto Serif SC", serif; font-weight: 600; font-size: 13px; line-height: 1.7; color: #3b362d; }
  .it.open .more { display: block; }
  .it.open p { display: none; }
  .thumb { position: relative; width: 92px; height: 84px; margin-top: 4px; }
  .thumb canvas { position: absolute; inset: 0; width: 100%; height: 100%; filter: drop-shadow(1px 2px 2px rgba(40,30,10,.25)); transform: rotate(var(--tr, 3deg)); }
  .thumb .type { position: absolute; inset: 4px 2px; }
  .thumb .type .pp { width: 100%; height: 100%; display: grid; place-items: center; font-family: Anton, "Noto Sans SC", sans-serif; font-weight: 900; font-size: 26px; line-height: 1; text-align: center; }
  .thumb .tape { width: 44px; height: 15px; left: 24px; top: -6px; transform: rotate(-6deg); }

  .tabs { flex: none; position: relative; z-index: 3; margin-top: -8px; }
  .tabs > .scrap { display: block; width: 100%; }
  .tabs .pp { background: var(--ink); display: grid; grid-template-columns: repeat(5, 1fr); padding: 14px 6px 22px; }
  .tab { position: relative; display: flex; flex-direction: column; align-items: center; gap: 3px; color: #b9b09c; font-size: 11.5px; font-weight: 700; }
  .tab svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; position: relative; z-index: 1; }
  .tab span { position: relative; z-index: 1; }
  .tab.on { color: #fff; }
  .tab .bgp { position: absolute; left: 50%; top: -6px; width: 52px; height: 52px; margin-left: -26px; }
  .tab .bgp .pp { width: 100%; height: 100%; background: var(--red); }
</style>
</head>
<body>
<div class="app" id="app"></div>
<script src="vendor/rough.js"></script>
<script src="data.js"></script>
<script src="common.js"></script>
<script src="engines.js"></script>
<script>
const { tornPoly, tear, halftoneCutout } = Engines;
const app = document.getElementById("app");
app.style.setProperty("--grain", `url(${grainURL(170, 0.09, 40)})`);
app.style.setProperty("--fiber", `url(${fiberURL()})`);
const [h1, ...rest] = HOT;
const scrap = (cls, inner, r = 0) => `<div class="scrap ${cls}" style="--r:${r}deg"><div class="pp">${inner}</div></div>`;
const TYPE = { 5: ["40B", "#f1b73a", "#141210"], 6: ["合并", "#e2402b", "#fff"], 7: ["CLOUD", "#141210", "#fbf8f0"], 8: ["168亿", "#fbf8f0", "#e2402b"] };
const ICONS = [
  "M4 6 H20 M4 12 H20 M4 18 H14",
  "M12 3 C16 8 19 11 19 15 C19 19 16 21 12 21 C8 21 5 19 5 15 C5 11 9 10 9 6 C11 8 11 9 12 3 Z",
  "M6 3 H15 L19 7 V21 H6 Z M9 11 H16 M9 15 H16",
  "M5 20 V13 M10 20 V6 M15 20 V10 M20 20 V15",
  "M5 12 A7 7 0 1 0 8 6.5 M4 4 L8 6.5 L5.5 10 M12 8 V12 L15 14",
];

app.innerHTML = `
  <div class="sb"><span>${nowHM()}</span><span>5G ▮▮▮ ▭</span></div>
  <header class="top">
    <div>
      <div class="ransom">${scrap("r1", "AI", -4)}${scrap("r2", "热", 3)}${scrap("r3", "点", -2)}</div>
      <div class="date">10月22日 · 周四 · 实时</div>
    </div>
    <button class="listen" id="listen">${scrap("", `<i></i><span>听热点</span><span class="bars">${"<b></b>".repeat(5)}</span>`, 2.5)}</button>
  </header>
  <main class="scroll" id="scroll">
    <section class="hero">
      <div class="photo"><canvas id="heroc"></canvas><div class="tape" style="left:18px;top:-8px;transform:rotate(-8deg)"></div><div class="tape" style="right:10px;top:-6px;transform:rotate(7deg)"></div></div>
      ${scrap("sticker", "01", -8)}
      <div class="lines" id="lines"></div>
      ${scrap("memo", esc(clip(firstLine(h1.summary), 70)), 0.6)}
      ${scrap("label", `${h1.sources} 家在说 · 热度 ${heatText(h1)}`, -3)}
      <svg class="marker" id="marker"></svg>
    </section>
    <ol>${rest.map((h, i) => `
      <li class="it scrap" data-r="${h.rank}" style="--r:${[-0.7, 0.6, -0.4, 0.8, -0.6, 0.5, -0.3][i]}deg"><div class="pp">
        <div>
          ${scrap("no", "Nº " + pad2(h.rank), -2)}
          <h3>${esc(shortTitle(h))}</h3>
          <p>${esc(h.latest)}</p>
          <div class="more">${esc(clip(firstLine(h.summary), 90))}</div>
        </div>
        <div class="thumb" style="--tr:${i % 2 ? -3 : 3}deg">${h.cover ? `<canvas></canvas><div class="tape"></div>` : scrap("type", TYPE[h.rank][0], i % 2 ? -4 : 3)}</div>
      </div></li>`).join("")}
    </ol>
  </main>
  <nav class="tabs"><div class="scrap" style="--r:0deg"><div class="pp">${["精选", "热点", "日报", "模型", "重置"].map((n, i) => `<button class="tab ${i ? "" : "on"}">${i ? "" : scrap("bgp", "", -5)}<svg viewBox="0 0 24 24"><path d="${ICONS[i]}"/></svg><span>${n}</span></button>`).join("")}</div></div></nav>`;

// 没封面的条目：用大字纸片代替
app.querySelectorAll(".it").forEach((li) => {
  const t = TYPE[li.dataset.r]; if (!t) return;
  const pp = li.querySelector(".type .pp"); pp.style.background = t[1]; pp.style.color = t[2];
  if (t[0].length > 4) pp.style.fontSize = "21px";
});

// ── 撕边：沿四条边每隔几像素往里随机缩一点 ──
// 撕边的半调照片：先画一圈白边，再在里面印网点

(async () => {
await Promise.race([document.fonts.ready, new Promise((r) => setTimeout(r, 1500))]);
const lines = splitLines(shortTitle(h1), "900 22px 'Noto Sans SC'", 250);
const key = KEY[h1.rank];
document.getElementById("lines").innerHTML = lines.map((l, i) => scrap(l.includes(key) || (key && key.split(" ").some((w) => w.length > 3 && l.includes(w))) ? "key" : "", esc(l), [-1.4, 1.1, -0.6, 0.9][i % 4])).join("");

// 撕边
let seed = 1;
app.querySelectorAll(".scrap > .pp").forEach((pp) => {
  const s = pp.parentElement;
  if (s.classList.contains("sticker")) return;
  if (s.parentElement.classList.contains("tabs")) return tear(pp, 4, seed++, [1, 0, 0, 0]);
  tear(pp, s.classList.contains("it") ? 2.6 : 2, seed++);
});

// 半调照片
loadImage(h1.cover).then((img) => halftoneCutout(document.getElementById("heroc"), img, { cell: 5, rim: 8 }));
app.querySelectorAll(".it").forEach((li, i) => {
  const h = rest[i]; if (!h.cover) return;
  loadImage(h.cover).then((img) => halftoneCutout(li.querySelector("canvas"), img, { cell: 3.4, rim: 4, seed: 9 + i }));
});

// ── 定格动画：一块块纸按 12 帧/秒落到桌面上 ──
const drop = (el, delay, from = {}) => {
  el.classList.add("hide");
  setTimeout(() => {
    el.classList.remove("hide");
    const dx = from.x ?? (rnd(delay) - 0.5) * 60, dy = from.y ?? -40, dr = from.r ?? (rnd(delay + 1) - 0.5) * 14;
    el.animate([
      { translate: `${dx}px ${dy}px`, scale: 1.14, rotate: `${dr}deg`, opacity: 0 },
      { opacity: 1, offset: 0.2 },
      { translate: "0 0", scale: 1, rotate: "0deg", opacity: 1 },
    ], { duration: 500, easing: "steps(6, end)", fill: "backwards" });
  }, delay);
};
const q = (s) => app.querySelector(s);
drop(q(".r1"), 100); drop(q(".r2"), 250); drop(q(".r3"), 400); drop(q(".date"), 600, { y: 0, x: -20, r: 0 });
drop(q(".listen"), 700, { x: 40, y: -10 });
drop(q(".photo"), 650, { y: -60, x: 10, r: -6 });
drop(q(".sticker"), 1250, { x: -50, y: 20, r: -30 });
app.querySelectorAll(".lines .scrap").forEach((s, i) => drop(s, 1450 + i * 170, { x: 80, y: 0 }));
drop(q(".memo"), 1950, { y: 40 });
drop(q(".label"), 2200, { x: 40, y: 10, r: 20 });
app.querySelectorAll(".it").forEach((li, i) => drop(li, 2350 + i * 160, { y: 70, x: (i % 2 ? 1 : -1) * 30 }));
drop(q(".tabs"), 500, { y: 60, x: 0, r: 0 });

// 红色马克笔圈出头条编号
setTimeout(() => {
  const svg = document.getElementById("marker"), rc = rough.svg(svg);
  const n = rc.ellipse(56, 202, 112, 104, { stroke: "#e2402b", strokeWidth: 3.2, roughness: 2.2, bowing: 2, seed: 5 });
  svg.appendChild(n);
  n.querySelectorAll("path").forEach((p) => {
    const L = p.getTotalLength(); p.style.strokeDasharray = L; p.style.strokeDashoffset = L; p.style.strokeLinecap = "round";
    p.animate([{ strokeDashoffset: L }, { strokeDashoffset: 0 }], { duration: 600, easing: "steps(8, end)", fill: "forwards" });
  });
}, 2500);

// 一直在微微抖：每两帧重摆一次，像逐格拍的
const jit = [...app.querySelectorAll(".scrap, .photo")];
let tick = 0;
setInterval(() => {
  tick++;
  jit.forEach((el, i) => {
    if (el.getAnimations().length) return;
    el.style.translate = `${((rnd(tick * 7 + i) - 0.5) * 0.9).toFixed(2)}px ${((rnd(tick * 3 + i * 5) - 0.5) * 0.9).toFixed(2)}px`;
    el.style.rotate = `${((rnd(tick * 11 + i * 3) - 0.5) * 0.5).toFixed(2)}deg`;
  });
}, 167);

// 交互
const listen = document.getElementById("listen");
const bars = [...listen.querySelectorAll(".bars b")];
let barT = 0;
setInterval(() => { if (!listen.classList.contains("on")) return; barT++; bars.forEach((b, i) => (b.style.height = `${4 + Math.round(rnd(barT * 5 + i) * 10)}px`)); }, 125);
listen.addEventListener("click", () => {
  const on = listen.classList.toggle("on");
  listen.querySelector("span").textContent = on ? "在听 01" : "听热点";
  const s = listen.querySelector(".scrap"), pp = s.querySelector(".pp");
  s.animate([{ rotate: "0deg", scale: 1 }, { rotate: "-9deg", scale: 1.08 }, { rotate: "0deg", scale: 1 }], { duration: 330, easing: "steps(4, end)" });
  requestAnimationFrame(() => tear(pp, 2, 77));
});
app.querySelectorAll(".it").forEach((li) => li.addEventListener("click", () => {
  li.classList.toggle("open");
  requestAnimationFrame(() => tear(li.querySelector(":scope > .pp"), 2.6, +li.dataset.r));
  li.animate([{ scale: 1 }, { scale: 1.03, rotate: "1.2deg" }, { scale: 1 }], { duration: 280, easing: "steps(3, end)" });
}));
const tabs = [...app.querySelectorAll(".tab")];
tabs.forEach((t) => t.addEventListener("click", () => {
  const bg = app.querySelector(".tab .bgp");
  tabs.forEach((x) => x.classList.toggle("on", x === t));
  t.prepend(bg);
  bg.animate([{ translate: "0 -20px", rotate: "20deg", opacity: 0 }, { translate: "0 0", rotate: "0deg", opacity: 1 }], { duration: 260, easing: "steps(4, end)" });
}));
})();
</script>
</body>
</html>
