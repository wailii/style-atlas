<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>字段表格 · 资源台账</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--navy:#1c2540;--navy2:#2a3558;--amb:#f2a516;--bg:#f5f3ee;--line:#dedad0;--line2:#ebe8df;--ink:#1d2230;--ink2:#5a6073;--mute:#9298a8;--sel:#2c5be0;--selbg:#e8eefc}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:"DM Sans","Noto Sans SC",sans-serif;font-size:13px;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit;background:none;border:0;outline:none;cursor:pointer}
svg{display:block;flex:none}
.app{display:flex;flex-direction:column;height:100vh}
.top{height:50px;flex:none;background:var(--navy);color:#fff;display:flex;align-items:center;padding:0 16px;gap:14px}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px}
.logo i{width:26px;height:26px;border-radius:7px;background:var(--amb);display:grid;place-items:center}
.logo svg{width:16px;height:16px;stroke:var(--navy);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tabs{display:flex;gap:2px;margin-left:12px}
.tabs button{height:50px;padding:0 14px;color:#aab3cf;font-weight:500;position:relative}
.tabs button.on{color:#fff}.tabs button.on::after{content:"";position:absolute;left:10px;right:10px;bottom:0;height:3px;background:var(--amb);border-radius:2px 2px 0 0}
.top .sp{flex:1}
.top .me{width:28px;height:28px;border-radius:50%;background:#5b6aa0;display:grid;place-items:center;font-size:12px;font-weight:600}
.top small{font-size:11px;color:#7f8aa9}
.body{flex:1;display:flex;min-height:0}
.views{width:232px;flex:none;background:#fff;border-right:1px solid var(--line);padding:12px 8px;display:flex;flex-direction:column;gap:1px}
.views h6{font-size:11px;color:var(--mute);font-weight:500;padding:6px 10px;letter-spacing:.5px}
.vw{display:flex;align-items:center;gap:9px;height:32px;padding:0 10px;border-radius:6px;cursor:pointer;color:var(--ink2)}
.vw:hover{background:#f3f1ea}
.vw.on{background:var(--selbg);color:var(--sel);font-weight:600}
.vw svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.vw em{margin-left:auto;font-style:normal;font-size:11px;color:var(--mute);font-family:"DM Mono"}
.vw.on em{color:var(--sel)}
.views .foot{margin-top:auto;font-size:11px;color:var(--mute);padding:8px 10px;line-height:1.6}
.mainc{flex:1;min-width:0;display:flex;flex-direction:column}
.tool{height:44px;flex:none;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px;padding:0 12px}
.tool h2{font-size:14px;font-weight:700;margin-right:10px}
.tb{height:28px;padding:0 9px;border-radius:5px;color:var(--ink2);display:flex;align-items:center;gap:6px;font-size:12.5px}
.tb:hover{background:#f3f1ea}.tb.act{background:#fdf0cf;color:#7a4f00}
.tb svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.srch{margin-left:auto;display:flex;align-items:center;gap:6px;height:28px;border:1px solid var(--line);border-radius:6px;padding:0 8px;width:200px}
.srch input{flex:1;width:100%;cursor:text;font-size:12.5px}
.srch svg{width:13px;height:13px;stroke:var(--mute);fill:none;stroke-width:1.6}
.gridw{flex:1;min-height:0;overflow:auto;background:#fff;position:relative}
table.g{border-collapse:separate;border-spacing:0;font-size:13px;min-width:100%}
.g th{position:sticky;top:0;z-index:3;background:#faf9f5;height:34px;text-align:left;font-weight:500;color:var(--ink2);padding:0 10px;border-right:1px solid var(--line2);border-bottom:1px solid var(--line);white-space:nowrap}
.g th .th{display:flex;align-items:center;gap:7px}
.g th svg{width:14px;height:14px;stroke:var(--mute);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.g th.col-on{background:#eef1fb}
.g td{height:33px;padding:0 10px;border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);white-space:nowrap;max-width:240px;overflow:hidden;text-overflow:ellipsis;position:relative;cursor:cell}
.g td.n{text-align:right;font-family:"DM Mono",monospace;font-variant-numeric:tabular-nums}
.g td.rn,.g th.rn{position:sticky;left:0;z-index:2;width:78px;min-width:78px;padding:0 6px;background:#fff;color:var(--mute);font-family:"DM Mono";font-size:11.5px;cursor:default}
.g th.rn{z-index:4;background:#faf9f5}
.g td.rn .cell{display:flex;align-items:center;gap:6px}
.g td.rn .num{width:22px;text-align:right}
.g td.rn .exp{width:20px;height:20px;border-radius:4px;display:grid;place-items:center;opacity:0;cursor:pointer;color:var(--ink2)}
.g td.rn .exp svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round}
.g tr:hover td.rn .exp{opacity:1}.g td.rn .exp:hover{background:#ebe8df}
.g td.pk{position:sticky;left:78px;z-index:2;background:#fff;font-weight:600;border-right:1px solid var(--line)}
.g th.pk{position:sticky;left:78px;z-index:4;background:#faf9f5;border-right:1px solid var(--line)}
.g tr:hover td{background:#fbfaf6}.g tr:hover td.rn,.g tr:hover td.pk{background:#fbfaf6}
.g td.sel{outline:2px solid var(--sel);outline-offset:-2px;background:var(--selbg)!important;z-index:1}
.g td.rowsel,.g td.rowsel.pk{background:var(--selbg)}
.g td.sel.pk{z-index:3}
.g td input.ed{position:absolute;inset:0;width:100%;height:100%;padding:0 10px;background:#fff;outline:2px solid var(--sel);outline-offset:-2px;cursor:text;z-index:5;font-size:13px}
.g td.n input.ed{text-align:right;font-family:"DM Mono"}
.tag{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:10px;font-size:12px;font-weight:500;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.tg-0{background:#d6e4ff;color:#1b3f94}.tg-1{background:#cdeedd;color:#14573a}.tg-2{background:#ffe3b3;color:#7a4700}.tg-3{background:#ffd4d6;color:#8a1c25}.tg-4{background:#e5d8fb;color:#4b2a8c}.tg-5{background:#d3eef3;color:#0f5766}.tg-6{background:#e9e6dc;color:#4e4a3c}
.red{color:#c0252d;font-weight:600}
.gh td{background:#f1efe7!important;height:34px;font-weight:600;cursor:pointer;position:sticky;left:0;z-index:2}
.gh .gl{display:flex;align-items:center;gap:8px;position:sticky;left:10px;width:max-content}
.gh .gl svg{width:12px;height:12px;stroke:var(--ink2);fill:none;stroke-width:2;transition:transform .15s}
.gh.fold .gl svg{transform:rotate(-90deg)}
.gh .gl em{font-style:normal;font-weight:400;color:var(--mute);font-family:"DM Mono";font-size:12px}
.sub td{background:#faf9f5!important;height:28px;font-size:11.5px;color:var(--ink2);cursor:default;border-bottom:2px solid var(--line)}
.sub td.n b{font-weight:600;color:var(--ink)}
.sumbar{height:34px;flex:none;background:#faf9f5;border-top:1px solid var(--line);display:flex;align-items:center;padding:0 14px;gap:22px;font-size:12px;color:var(--ink2)}
.sumbar b{font-family:"DM Mono";font-weight:500;color:var(--ink)}
.sumbar .sp{flex:1}.sumbar span.m{color:var(--mute);font-size:11px}
.board{flex:1;min-height:0;overflow:auto;display:flex;gap:12px;padding:14px;align-items:flex-start;background:var(--bg)}
.bc{width:264px;flex:none;background:#ebe8de;border-radius:10px;padding:8px;max-height:100%;display:flex;flex-direction:column}
.bc h4{display:flex;align-items:center;gap:8px;padding:4px 4px 8px;font-size:12.5px}
.bc h4 em{font-style:normal;color:var(--mute);font-family:"DM Mono";font-size:12px}
.bcs{overflow:auto;display:flex;flex-direction:column;gap:8px;min-height:30px}
.bcd{background:#fff;border-radius:8px;padding:10px 11px;box-shadow:0 1px 0 rgba(0,0,0,.08),0 0 0 1px rgba(0,0,0,.04);cursor:pointer;font-size:12.5px;line-height:1.5}
.bcd:hover{box-shadow:0 2px 8px rgba(30,30,50,.14),0 0 0 1px rgba(0,0,0,.06)}
.bcd b{display:block;font-size:13px;margin-bottom:6px}
.bcd .r{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;color:var(--ink2);align-items:center}
.bc.over{outline:2px dashed var(--sel)}
.bcd .mono{font-family:"DM Mono";font-size:11.5px;color:var(--ink2)}
/* pop & modal */
.pop{position:fixed;z-index:50;background:#fff;border-radius:8px;box-shadow:0 8px 28px rgba(28,37,64,.22),0 0 0 1px rgba(28,37,64,.1);padding:6px;min-width:170px;animation:pp .12s}
@keyframes pp{from{opacity:0;transform:translateY(-3px)}}
.pop .o{display:flex;align-items:center;gap:8px;height:30px;padding:0 8px;border-radius:5px;cursor:pointer}
.pop .o:hover,.pop .o.on{background:#f1efe7}
.pop .o i{margin-left:auto;font-style:normal;color:var(--sel)}
.scrim{position:fixed;inset:0;background:rgba(28,37,64,.38);z-index:40;display:none;align-items:center;justify-content:center}
.scrim.show{display:flex;animation:fi .15s}
@keyframes fi{from{opacity:0}}
.rec{width:560px;max-height:84vh;background:#fff;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.35);display:flex;flex-direction:column;overflow:hidden;animation:pp .18s}
.rec header{padding:16px 22px 12px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.rec header h3{font-size:18px;font-weight:700;flex:1}
.rec header small{color:var(--mute);font-size:11.5px;font-family:"DM Mono"}
.rec header button{width:28px;height:28px;border-radius:6px;font-size:16px;color:var(--ink2)}
.rec header button:hover{background:#f1efe7}
.rec .fs{overflow:auto;padding:8px 22px 18px}
.fr{display:grid;grid-template-columns:130px 1fr;align-items:center;min-height:42px;border-bottom:1px solid var(--line2);gap:10px}
.fr label{color:var(--ink2);display:flex;gap:7px;align-items:center}
.fr label svg{width:14px;height:14px;stroke:var(--mute);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.fv{min-height:30px;display:flex;align-items:center;padding:0 8px;border-radius:5px;cursor:text;margin:0 -8px}
.fv:hover{background:#f6f4ee}
.fv input{width:100%;height:30px;background:#fff;border-radius:5px;padding:0 8px;margin:0 -8px;outline:2px solid var(--sel);cursor:text}
.fv.sl{cursor:pointer}
.toast{position:fixed;bottom:18px;left:50%;transform:translate(-50%,10px);background:var(--navy);color:#fff;padding:8px 14px;border-radius:8px;opacity:0;transition:.2s;z-index:60;font-size:12.5px;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="logo"><i><svg viewBox="0 0 16 16"><rect x="2" y="2" width="12" height="12" rx="2"/><path d="M2 6.5h12M6.5 6.5V14"/></svg></i>方格</div>
    <div class="tabs"><button class="on">资源台账</button><button>采购记录</button><button>机房与机柜</button><button>维保合同</button></div>
    <span class="sp"></span><small>示例数据</small><div class="me">陈</div>
  </div>
  <div class="body">
    <aside class="views" id="views"></aside>
    <section class="mainc">
      <div class="tool">
        <h2 id="vtitle"></h2>
        <button class="tb" data-tb="f"><svg viewBox="0 0 16 16"><path d="M2.5 3.5h11l-4.2 5v4l-2.6 1v-5z"/></svg><span id="tf">筛选</span></button>
        <button class="tb" data-tb="g"><svg viewBox="0 0 16 16"><path d="M3 3.5h10M5 8h8M7 12.5h6"/></svg><span id="tg">分组</span></button>
        <button class="tb" data-tb="s"><svg viewBox="0 0 16 16"><path d="M5 3v10M5 13l-2.5-2.5M5 13l2.5-2.5M11 13V3M11 3L8.5 5.5M11 3l2.5 2.5"/></svg><span id="ts">排序</span></button>
        <div class="srch"><svg viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/></svg><input id="q" placeholder="在表中查找"></div>
        <button class="tb" id="newrow"><svg viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></svg>新增记录</button>
      </div>
      <div id="content" style="display:flex;flex-direction:column;flex:1;min-height:0"></div>
    </section>
  </div>
</div>
<div class="scrim" id="scrim"><div class="rec" id="rec"></div></div>
<div class="toast" id="toast"></div>
<div class="pop" id="pop" style="display:none"></div>
<script>
const $=s=>document.querySelector(s);
const TODAY=new Date("2026-11-20");
const OPT={
 gpu:["H100 80G","H20 96G","A100 80G","L40S","昇腾 910B"],
 dept:["算法一部","算法二部","平台研发","数据中台","基础模型组"],
 st:["在用","空闲","维修中","待退还"],
 room:["北京亦庄","上海临港","乌兰察布"]};
const TCOL={ "在用":1,"空闲":0,"维修中":3,"待退还":2 };
const COLS=[
 {k:"id",n:"资产编号",t:"text",pk:1,w:120},
 {k:"model",n:"服务器型号",t:"text",w:150},
 {k:"gpu",n:"GPU 型号",t:"sel",o:"gpu",w:130},
 {k:"cnt",n:"GPU 数",t:"num",w:90},
 {k:"dept",n:"部门",t:"sel",o:"dept",w:120},
 {k:"st",n:"状态",t:"sel",o:"st",w:100},
 {k:"owner",n:"负责人",t:"text",w:100},
 {k:"room",n:"机房",t:"sel",o:"room",w:110},
 {k:"exp",n:"到期日",t:"date",w:120}];
const ICO={
 text:'<svg viewBox="0 0 16 16"><path d="M3 12.5l3.2-9 3.2 9M4.2 9.5h4M11 12.5V8.5a2 2 0 013.4-1.4"/></svg>',
 num:'<svg viewBox="0 0 16 16"><path d="M6 2.5L4.5 13.5M11.5 2.5L10 13.5M2.5 5.8h11M2.5 10.2h11"/></svg>',
 sel:'<svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.5"/><path d="M5.8 7l2.2 2.3L10.2 7"/></svg>',
 date:'<svg viewBox="0 0 16 16"><rect x="2.5" y="3.5" width="11" height="10" rx="1.5"/><path d="M2.5 7h11M5.5 2v3M10.5 2v3"/></svg>'};
const names=["林骁","陈汐","周牧","赵一舟","宋知意","何言","吴桐","郑屿","冯远","许清"];
const models=["Atlas-8H100","Atlas-8H20","Nova-8A100","Edge-4L40","Kun-8910B"];
let R=[];
(function(){
  let seed=7; const rnd=()=>(seed=(seed*9301+49297)%233280)/233280;
  const gpuOfModel=[0,1,2,3,4];
  for(let i=0;i<30;i++){
    const gi=Math.floor(rnd()*5), d=Math.floor(rnd()*5), r=rnd();
    const st=r<.55?"在用":r<.75?"空闲":r<.9?"维修中":"待退还";
    const days=Math.floor(rnd()*420)-10; const dt=new Date(TODAY.getTime()+days*864e5);
    R.push({_i:i+1,id:"SV-"+String(1021+i*7).padStart(4,"0"),model:models[gi],gpu:OPT.gpu[gi],cnt:gi===3?4:8,dept:OPT.dept[d],st,owner:names[Math.floor(rnd()*10)],room:OPT.room[Math.floor(rnd()*3)],exp:dt.toISOString().slice(0,10)});
  }
})();
const VIEWS=[
 {id:"all",n:"全部资源",ic:'<path d="M2.5 4h11M2.5 8h11M2.5 12h11M6 4v8"/>',ty:"grid"},
 {id:"dept",n:"按部门分组",ic:'<path d="M3 3.5h10M5 8h8M7 12.5h6"/>',ty:"grid",group:"dept"},
 {id:"soon",n:"即将到期",ic:'<circle cx="8" cy="8" r="5.5"/><path d="M8 5v3l2 1.5"/>',ty:"grid",soon:1},
 {id:"board",n:"状态看板",ic:'<rect x="2.5" y="3" width="3.5" height="10" rx=".8"/><rect x="7.5" y="3" width="3.5" height="6" rx=".8"/>',ty:"board"}];
let view="all", fold={}, selCell=null, editing=null, search="", selRows=new Set();
const daysLeft=s=>Math.round((new Date(s)-TODAY)/864e5);
function rows(){
  const v=VIEWS.find(x=>x.id===view); let a=R.slice();
  if(v.soon) a=a.filter(r=>daysLeft(r.exp)<=90).sort((x,y)=>x.exp<y.exp?-1:1);
  if(search) a=a.filter(r=>Object.values(r).some(x=>String(x).toLowerCase().includes(search.toLowerCase())));
  return a;
}
function tag(c,val){ if(!val) return ""; const o=OPT[c.o]; const idx=c.k==="st"?TCOL[val]:o.indexOf(val); return `<span class="tag tg-${idx%7}">${val}</span>`; }
function cellHTML(c,r){
  const v=r[c.k];
  if(c.t==="sel") return tag(c,v);
  if(c.k==="exp"){ const d=daysLeft(v); return `<span class="${d<=30?"red":""}">${v}</span>${d<=30?`<span class="tag tg-3" style="margin-left:8px">${d<0?"已过期":d+" 天"}</span>`:""}`; }
  return String(v);
}
function renderViews(){
  $("#views").innerHTML=`<h6>视图</h6>`+VIEWS.map(v=>{const n=v.soon?R.filter(r=>daysLeft(r.exp)<=90).length:R.length;return `<div class="vw ${v.id===view?"on":""}" data-v="${v.id}"><svg viewBox="0 0 16 16">${v.ic}</svg>${v.n}<em>${n}</em></div>`}).join("")+`<h6 style="margin-top:12px">表</h6><div class="vw"><svg viewBox="0 0 16 16"><rect x="2.5" y="3" width="11" height="10" rx="1.5"/><path d="M2.5 6.5h11M6.5 6.5V13"/></svg>服务器<em>${R.length}</em></div><div class="foot">双击单元格编辑 · 方向键移动 · 回车编辑<br>悬停行号，点展开图标看完整记录</div>`;
  const v=VIEWS.find(x=>x.id===view); $("#vtitle").textContent=v.n;
  $("#tf").textContent=v.soon?"筛选：90 天内到期":"筛选"; $("#tg").textContent=v.group?"分组：部门":v.ty==="board"?"分组：状态":"分组"; $("#ts").textContent=v.soon?"排序：到期日":"排序";
  document.querySelectorAll(".tb[data-tb]").forEach(b=>b.classList.toggle("act",!!((b.dataset.tb==="f"&&v.soon)||(b.dataset.tb==="g"&&(v.group||v.ty==="board"))||(b.dataset.tb==="s"&&v.soon))));
}
function renderGrid(){
  const v=VIEWS.find(x=>x.id===view); const a=rows();
  let h=`<div class="gridw" id="gw"><table class="g"><thead><tr><th class="rn"></th>${COLS.map(c=>`<th data-k="${c.k}" class="${c.pk?"pk":""}" style="min-width:${c.w}px"><div class="th">${ICO[c.t]}${c.n}</div></th>`).join("")}</tr></thead><tbody>`;
  const rowH=(r,i)=>`<tr data-r="${r._i}"><td class="rn"><div class="cell"><span class="num">${i}</span><span class="exp" title="展开记录"><svg viewBox="0 0 16 16"><path d="M9.5 2.5h4v4M6.5 13.5h-4v-4M13.5 2.5L9 7M2.5 13.5L7 9"/></svg></span></div></td>${COLS.map(c=>`<td class="${c.t==="num"?"n":""} ${c.pk?"pk":""}" data-k="${c.k}">${cellHTML(c,r)}</td>`).join("")}</tr>`;
  if(v.group){
    let i=1; OPT.dept.forEach(d=>{ const g=a.filter(r=>r.dept===d); if(!g.length) return; const tot=g.reduce((s,r)=>s+r.cnt,0);
      h+=`<tr class="gh ${fold[d]?"fold":""}" data-g="${d}"><td colspan="${COLS.length+1}"><div class="gl"><svg viewBox="0 0 12 12"><path d="M2.5 4.5l3.5 3.5 3.5-3.5"/></svg><span class="tag tg-${OPT.dept.indexOf(d)%7}">${d}</span><em>${g.length} 台 · ${tot} 卡</em></div></td></tr>`;
      if(!fold[d]){ g.forEach(r=>h+=rowH(r,i++));
        h+=`<tr class="sub"><td class="rn"></td>${COLS.map(c=>c.k==="id"?`<td class="pk">小计</td>`:c.k==="cnt"?`<td class="n"><b>${tot}</b></td>`:c.k==="model"?`<td>${g.length} 台</td>`:c.k==="st"?`<td>${g.filter(r=>r.st==="在用").length} 在用</td>`:`<td></td>`).join("")}</tr>`; } else i+=g.length; });
  } else a.forEach((r,i)=>h+=rowH(r,i+1));
  h+=`</tbody></table></div><div class="sumbar"><span><b>${a.length}</b> 条记录</span><span>GPU 合计 <b>${a.reduce((s,r)=>s+r.cnt,0)}</b> 卡</span><span>在用 <b>${a.filter(r=>r.st==="在用").length}</b></span><span class="sp"></span><span class="m">示例数据</span></div>`;
  $("#content").innerHTML=h; paintSel();
}
function renderBoard(){
  const a=rows();
  $("#content").innerHTML=`<div class="board" id="board">`+OPT.st.map(s=>{const g=a.filter(r=>r.st===s);return `<div class="bc" data-s="${s}"><h4><span class="tag tg-${TCOL[s]}">${s}</span><em>${g.length}</em></h4><div class="bcs">${g.map(r=>`<div class="bcd" draggable="true" data-r="${r._i}"><b>${r.id}</b><span class="mono">${r.model}</span><div class="r"><span class="tag tg-${OPT.gpu.indexOf(r.gpu)%7}">${r.gpu}</span><span class="mono">${r.cnt} 卡</span></div><div class="r">${r.dept} · ${r.owner}</div></div>`).join("")}</div></div>`}).join("")+`</div>`;
}
function render(){ renderViews(); VIEWS.find(x=>x.id===view).ty==="board"?renderBoard():renderGrid(); }
function paintSel(){
  document.querySelectorAll("td.sel").forEach(x=>x.classList.remove("sel")); document.querySelectorAll("th.col-on").forEach(x=>x.classList.remove("col-on"));
  if(!selCell) return; const td=cellEl(selCell.r,selCell.k); if(td){td.classList.add("sel"); const th=document.querySelector(`th[data-k="${selCell.k}"]`); th&&th.classList.add("col-on");}
}
const cellEl=(r,k)=>document.querySelector(`tr[data-r="${r}"] td[data-k="${k}"]`);
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("show"),1800)}
function closePop(){ $("#pop").style.display="none"; }
function openSelect(el,col,rec,onDone){
  const p=$("#pop"), rc=el.getBoundingClientRect(); const cur=rec[col.k];
  p.innerHTML=OPT[col.o].map(o=>`<div class="o ${o===cur?"on":""}" data-o="${o}">${tag(col,o)}${o===cur?"<i>✓</i>":""}</div>`).join("");
  p.style.display="block"; p.style.left=Math.min(rc.left,innerWidth-200)+"px"; p.style.top=Math.min(rc.bottom+2,innerHeight-p.offsetHeight-10)+"px";
  p.onclick=e=>{const o=e.target.closest(".o"); if(!o) return; rec[col.k]=o.dataset.o; closePop(); onDone(); toast(`${rec.id} · ${col.n} 已改为「${o.dataset.o}」`)};
}
document.addEventListener("mousedown",e=>{ if(!e.target.closest("#pop")&&!e.target.closest("[data-keep]")) closePop(); });
function startEdit(r,k){
  const c=COLS.find(x=>x.k===k), rec=R.find(x=>x._i===r), td=cellEl(r,k); if(!td) return;
  if(c.t==="sel"){ openSelect(td,c,rec,()=>{render();}); return; }
  editing={r,k}; const inp=document.createElement("input"); inp.className="ed"; inp.value=rec[k]; if(c.t==="date") inp.type="date"; if(c.t==="num") inp.type="number"; td.appendChild(inp); inp.focus(); inp.select&&inp.select();
  const done=ok=>{ if(!editing) return; editing=null; if(ok){ const v=c.t==="num"?+inp.value:inp.value; if(v!==""&&v!==rec[k]){rec[k]=v; toast(`${rec.id} · ${c.n} 已更新`);} } render(); };
  inp.onkeydown=e=>{ e.stopPropagation(); if(e.key==="Enter"){done(true)} else if(e.key==="Escape"){done(false)} };
  inp.onblur=()=>done(true);
}
/* 事件 */
$("#views").onclick=e=>{const v=e.target.closest(".vw[data-v]"); if(v){view=v.dataset.v;selCell=null;render()}};
$("#content").addEventListener("click",e=>{
  const gh=e.target.closest(".gh"); if(gh){fold[gh.dataset.g]=!fold[gh.dataset.g];renderGrid();return}
  const ex=e.target.closest(".exp"); if(ex){openRec(+ex.closest("tr").dataset.r);return}
  const bd=e.target.closest(".bcd"); if(bd){openRec(+bd.dataset.r);return}
  const td=e.target.closest("td[data-k]"); if(td&&!editing){ selCell={r:+td.parentNode.dataset.r,k:td.dataset.k}; paintSel(); }
});
$("#content").addEventListener("dblclick",e=>{const td=e.target.closest("td[data-k]"); if(td){startEdit(+td.parentNode.dataset.r,td.dataset.k)}});
document.addEventListener("keydown",e=>{
  if(editing||e.target.tagName==="INPUT"||!selCell||$("#scrim").classList.contains("show")) { if(e.key==="Escape") closeRec(); return }
  const a=rows(), vis=[...document.querySelectorAll("tbody tr[data-r]")].map(t=>+t.dataset.r), ki=COLS.findIndex(c=>c.k===selCell.k), ri=vis.indexOf(selCell.r);
  if(e.key==="ArrowRight"){selCell.k=COLS[Math.min(COLS.length-1,ki+1)].k}
  else if(e.key==="ArrowLeft"){selCell.k=COLS[Math.max(0,ki-1)].k}
  else if(e.key==="ArrowDown"){selCell.r=vis[Math.min(vis.length-1,ri+1)]}
  else if(e.key==="ArrowUp"){selCell.r=vis[Math.max(0,ri-1)]}
  else if(e.key==="Enter"||e.key==="F2"){startEdit(selCell.r,selCell.k);e.preventDefault();return}
  else return;
  e.preventDefault(); paintSel(); const t=cellEl(selCell.r,selCell.k); t&&t.scrollIntoView({block:"nearest",inline:"nearest"});
});
$("#q").oninput=e=>{search=e.target.value;render()};
$("#newrow").onclick=()=>{const n=Math.max(...R.map(r=>r._i))+1;R.push({_i:n,id:"SV-"+(1500+n),model:"Atlas-8H100",gpu:"H100 80G",cnt:8,dept:"平台研发",st:"空闲",owner:"陈汐",room:"北京亦庄",exp:"2027-06-30"});render();selCell={r:n,k:"id"};paintSel();const t=cellEl(n,"id");t&&t.scrollIntoView({block:"nearest"});toast("已新增记录 SV-"+(1500+n))};
document.querySelectorAll(".tb[data-tb]").forEach(b=>b.onclick=()=>toast("已按当前视图配置应用"));
/* 看板拖动 */
document.addEventListener("dragstart",e=>{const c=e.target.closest(".bcd"); if(c){e.dataTransfer.setData("text/plain",c.dataset.r);e.dataTransfer.effectAllowed="move"}});
document.addEventListener("dragover",e=>{const col=e.target.closest(".bc"); document.querySelectorAll(".bc.over").forEach(x=>x!==col&&x.classList.remove("over")); if(col){e.preventDefault();col.classList.add("over")}});
document.addEventListener("drop",e=>{const col=e.target.closest(".bc"); if(!col) return; e.preventDefault(); const r=R.find(x=>x._i===+e.dataTransfer.getData("text/plain")); if(r){r.st=col.dataset.s;render();toast(`${r.id} 已移到「${r.st}」`)}});
document.addEventListener("dragend",()=>document.querySelectorAll(".bc.over").forEach(x=>x.classList.remove("over")));
/* 记录卡 */
let recId=null;
function openRec(id){ recId=id; drawRec(); $("#scrim").classList.add("show"); }
function closeRec(){ $("#scrim").classList.remove("show"); closePop(); render(); }
function drawRec(){
  const r=R.find(x=>x._i===recId);
  $("#rec").innerHTML=`<header><h3>${r.id}</h3><small>记录 #${r._i}</small><button id="rx">✕</button></header><div class="fs">${COLS.map(c=>`<div class="fr"><label>${ICO[c.t]}${c.n}</label><div class="fv ${c.t==="sel"?"sl":""}" data-k="${c.k}">${cellHTML(c,r)||'<span style="color:var(--mute)">空</span>'}</div></div>`).join("")}</div>`;
  $("#rx").onclick=closeRec;
}
$("#rec").addEventListener("click",e=>{
  const fv=e.target.closest(".fv"); if(!fv||fv.querySelector("input")) return; const c=COLS.find(x=>x.k===fv.dataset.k), r=R.find(x=>x._i===recId);
  if(c.t==="sel"){ openSelect(fv,c,r,drawRec); return }
  fv.innerHTML=`<input type="${c.t==="num"?"number":c.t==="date"?"date":"text"}" value="${r[c.k]}">`; const i=fv.querySelector("input"); i.focus();
  const done=ok=>{ if(ok){ const v=c.t==="num"?+i.value:i.value; if(v!==""){r[c.k]=v;toast(`${c.n} 已更新`)} } drawRec(); };
  i.onkeydown=ev=>{ev.stopPropagation(); if(ev.key==="Enter")done(true); if(ev.key==="Escape")done(false)}; i.onblur=()=>done(true);
});
$("#scrim").addEventListener("mousedown",e=>{if(e.target.id==="scrim")closeRec()});
document.getElementById("pop").setAttribute("data-keep","1");
render();
</script>
</body>
</html>
