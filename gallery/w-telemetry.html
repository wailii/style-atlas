<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>日志探针 · 推理服务日志</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#fff; --ink:#1d1a2f; --ink2:#575470; --mute:#8b88a0; --line:#e9e7f1; --line2:#f3f2f8; --acc:#5b35d5; --acc2:#7a5ae6; --tint:#f2eefd; --tint2:#e6defa;
    --info:#c9bdf1; --warn:#e8a317; --err:#d9304a; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; overflow:hidden; background:var(--bg); }
  body { font-family:"Inter","Noto Sans SC",sans-serif; font-size:12.5px; color:var(--ink); -webkit-font-smoothing:antialiased; }
  button,input { font:inherit; color:inherit; background:none; border:0; outline:none; cursor:pointer; }
  input { cursor:text; }
  .mono { font-family:"JetBrains Mono",monospace; font-variant-numeric:tabular-nums; }
  svg { display:block; }
  .app { height:100vh; display:flex; flex-direction:column; }
  .top { height:46px; flex:none; display:flex; align-items:center; gap:22px; padding:0 16px; border-bottom:1px solid var(--line); }
  .logo { display:flex; align-items:center; gap:8px; font-weight:600; font-size:14px; letter-spacing:.01em; }
  .logo svg { width:22px; height:22px; }
  .nav { display:flex; gap:2px; height:100%; }
  .nav button { padding:0 12px; color:var(--ink2); font-size:13px; position:relative; }
  .nav button:hover { color:var(--ink); }
  .nav button.on { color:var(--acc); font-weight:500; }
  .nav button.on::after { content:""; position:absolute; left:10px; right:10px; bottom:-1px; height:2px; background:var(--acc); }
  .sp { flex:1; }
  .tiny { color:var(--mute); font-size:11px; }

  .qbar { flex:none; display:flex; gap:8px; align-items:center; padding:10px 16px; border-bottom:1px solid var(--line); }
  .q { flex:1; display:flex; align-items:center; gap:8px; height:34px; border:1px solid #d3cfe6; border-radius:6px; padding:0 10px; transition:border-color .15s, box-shadow .15s; }
  .q:focus-within { border-color:var(--acc); box-shadow:0 0 0 3px #5b35d51f; }
  .q svg { width:15px; height:15px; color:var(--mute); flex:none; }
  .q input { flex:1; min-width:0; font-family:"JetBrains Mono"; font-size:12.5px; }
  .q input::placeholder { color:#a9a6bd; }
  .qh { font-size:11px; color:var(--mute); font-family:"JetBrains Mono"; border:1px solid var(--line); padding:1px 6px; border-radius:3px; }
  .win { height:34px; display:flex; align-items:center; gap:8px; padding:0 12px; border:1px solid #d3cfe6; border-radius:6px; font-family:"JetBrains Mono"; font-size:12px; }
  .win svg { width:14px; height:14px; color:var(--mute); }
  .win b { font-weight:500; }
  .btn { height:34px; padding:0 12px; border:1px solid #d3cfe6; border-radius:6px; color:var(--acc); font-weight:500; display:none; align-items:center; gap:6px; }
  .btn:hover { background:var(--tint); }
  .btn.show { display:flex; }

  .main { flex:1; min-height:0; display:flex; position:relative; }
  .facets { width:254px; flex:none; border-right:1px solid var(--line); overflow-y:auto; padding:6px 0 20px; scrollbar-width:thin; }
  .fh { display:flex; align-items:center; justify-content:space-between; padding:8px 16px 6px; }
  .fh b { font-size:11px; font-weight:600; color:var(--mute); letter-spacing:.06em; }
  .fh button { font-size:11.5px; color:var(--acc); }
  .fg { padding:2px 0 8px; }
  .fgt { display:flex; align-items:center; gap:6px; padding:6px 16px; font-weight:600; font-size:12px; cursor:pointer; user-select:none; }
  .fgt svg { width:9px; height:9px; color:var(--mute); transition:transform .15s; }
  .fg.close .fgt svg { transform:rotate(-90deg); } .fg.close .fv { display:none; }
  .fgt em { font-style:normal; margin-left:auto; font-weight:400; color:var(--mute); font-size:11px; }
  .fv { display:flex; align-items:center; gap:8px; height:25px; padding:0 16px; cursor:pointer; position:relative; }
  .fv:hover { background:var(--line2); }
  .fv .cb { width:13px; height:13px; border:1.2px solid #bdb9d3; border-radius:3px; flex:none; display:grid; place-items:center; }
  .fv.on .cb { background:var(--acc); border-color:var(--acc); }
  .fv.on .cb::after { content:""; width:6px; height:3px; border-left:1.6px solid #fff; border-bottom:1.6px solid #fff; transform:rotate(-45deg) translate(1px,-1px); }
  .fv .lb { flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .fv.on .lb { font-weight:500; }
  .fv .n { font-family:"JetBrains Mono"; font-size:11.5px; color:var(--ink2); position:relative; z-index:1; }
  .fv .bar { position:absolute; right:16px; top:4px; bottom:4px; background:var(--tint); z-index:0; border-radius:2px; transition:width .25s; }
  .fv.zero { opacity:.4; }
  .ldot { width:7px; height:7px; border-radius:50%; flex:none; }

  .center { flex:1; min-width:0; display:flex; flex-direction:column; }
  .hist { flex:none; padding:10px 16px 0; border-bottom:1px solid var(--line); }
  .hh { display:flex; align-items:baseline; gap:10px; margin-bottom:2px; }
  .hh b { font-size:20px; font-weight:600; letter-spacing:-.01em; }
  .hh span { color:var(--mute); }
  .hh .lg { margin-left:auto; display:flex; gap:12px; font-size:11px; color:var(--ink2); }
  .hh .lg i { display:inline-block; width:8px; height:8px; border-radius:2px; margin-right:5px; }
  #hsvg { width:100%; height:112px; cursor:crosshair; user-select:none; }
  .ax { fill:var(--mute); font-size:10px; font-family:"JetBrains Mono"; }
  .htip { position:fixed; pointer-events:none; background:#241f3c; color:#fff; border-radius:4px; padding:6px 9px; font-size:11px; display:none; z-index:30; line-height:1.55; }
  .htip b { font-family:"JetBrains Mono"; font-weight:500; display:block; color:#cfc7ee; }

  .lh { flex:none; display:grid; grid-template-columns:104px 64px 120px 96px 1fr 76px; gap:0; padding:0 16px; height:28px; align-items:center; font-size:11px; font-weight:600; color:var(--mute); letter-spacing:.04em; border-bottom:1px solid var(--line); background:#fcfcfe; }
  .lh span:last-child { text-align:right; }
  .list { flex:1; overflow-y:auto; min-height:0; scrollbar-width:thin; }
  .row { display:grid; grid-template-columns:104px 64px 120px 96px 1fr 76px; align-items:center; padding:0 16px; height:26px; font-family:"JetBrains Mono"; font-size:11.5px; border-bottom:1px solid var(--line2); cursor:pointer; position:relative; white-space:nowrap; }
  .row > * { overflow:hidden; text-overflow:ellipsis; }
  .row:hover { background:#f8f6fe; }
  .row.sel { background:var(--tint); }
  .row.sel::before { content:""; position:absolute; left:0; top:0; bottom:0; width:2px; background:var(--acc); }
  .row .t { color:var(--ink2); }
  .row .svc { color:var(--ink2); } .row .mdl { color:var(--mute); }
  .row .d { text-align:right; color:var(--ink2); }
  .row .d.slow { color:var(--warn); font-weight:500; }
  .lv { font-size:10px; font-weight:500; letter-spacing:.04em; }
  .lv.info { color:var(--mute); } .lv.warn { color:#b87a00; } .lv.error { color:var(--err); font-weight:600; }
  .row.error .msg { color:#7d1830; }
  .empty { padding:60px; text-align:center; color:var(--mute); }
  .more { padding:10px 16px; color:var(--mute); font-size:11.5px; }

  .drawer { position:absolute; top:0; right:0; bottom:0; width:640px; background:#fff; border-left:1px solid #cfcae4; box-shadow:-12px 0 32px #2a1f5a1a; transform:translateX(102%); transition:transform .25s cubic-bezier(.3,.7,.2,1); display:flex; flex-direction:column; z-index:20; }
  .drawer.open { transform:none; }
  .dh { padding:12px 16px 10px; border-bottom:1px solid var(--line); display:flex; gap:10px; align-items:flex-start; }
  .dh .tt { flex:1; min-width:0; }
  .dh .tt b { display:block; font-size:13px; line-height:1.4; word-break:break-all; }
  .dh .tt span { color:var(--mute); font-family:"JetBrains Mono"; font-size:11px; }
  .x { width:26px; height:26px; border-radius:5px; display:grid; place-items:center; color:var(--ink2); }
  .x:hover { background:var(--line2); } .x svg { width:13px; height:13px; }
  .db { flex:1; overflow-y:auto; padding:0 0 20px; }
  .ds { padding:14px 16px 0; }
  .ds h4 { font-size:11px; letter-spacing:.06em; color:var(--mute); font-weight:600; margin-bottom:8px; display:flex; justify-content:space-between; }
  .ds h4 span { font-weight:400; letter-spacing:0; font-family:"JetBrains Mono"; }
  .wf { border:1px solid var(--line); border-radius:6px; overflow:hidden; }
  .wfa { display:grid; grid-template-columns:230px 1fr; height:22px; background:#fcfcfe; border-bottom:1px solid var(--line); font-size:10.5px; color:var(--mute); }
  .wfa div:first-child { padding:5px 10px; }
  .wfa div:last-child { position:relative; font-family:"JetBrains Mono"; }
  .wfa i { white-space:nowrap; position:absolute; top:5px; font-style:normal; transform:translateX(-50%); }
  .sr { display:grid; grid-template-columns:230px 1fr; height:26px; align-items:center; border-bottom:1px solid var(--line2); }
  .sr:last-child { border-bottom:0; }
  .sr:hover { background:#f8f6fe; }
  .sr .nm { padding:0 10px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-size:11.5px; }
  .sr .nm small { color:var(--mute); margin-left:6px; font-size:10.5px; }
  .sr .tr { position:relative; height:100%; border-left:1px solid var(--line2); }
  .sr .tr u { position:absolute; top:7px; height:12px; background:var(--acc2); border-radius:2px; min-width:2px; text-decoration:none; }
  .sr .tr u.e { background:var(--err); }
  .sr .tr em { position:absolute; top:6px; font-style:normal; font-family:"JetBrains Mono"; font-size:10.5px; color:var(--ink2); white-space:nowrap; }
  .kv { border:1px solid var(--line); border-radius:6px; }
  .kr { display:grid; grid-template-columns:130px 1fr; min-height:28px; align-items:center; border-bottom:1px solid var(--line2); }
  .kr:last-child { border-bottom:0; }
  .kr .k { padding:0 12px; color:var(--mute); font-family:"JetBrains Mono"; font-size:11.5px; }
  .kr .v { display:flex; align-items:center; gap:6px; padding:3px 8px 3px 0; font-family:"JetBrains Mono"; font-size:11.5px; min-width:0; }
  .kr .v > span { overflow-wrap:anywhere; }
  .kr .acts { display:none; gap:4px; margin-left:auto; flex:none; }
  .kr:hover .acts { display:flex; }
  .kr:hover { background:#faf9fe; }
  .acts button { font-family:"Inter","Noto Sans SC"; font-size:11px; padding:1px 7px; border:1px solid #cfc7ee; border-radius:4px; color:var(--acc); background:#fff; white-space:nowrap; }
  .acts button:hover { background:var(--acc); color:#fff; border-color:var(--acc); }
  .toast { position:fixed; left:50%; bottom:24px; transform:translate(-50%,20px); background:#241f3c; color:#fff; padding:7px 14px; border-radius:6px; font-size:12px; opacity:0; transition:all .25s; pointer-events:none; z-index:50; }
  .toast.on { opacity:1; transform:translate(-50%,0); }
  .note { position:fixed; left:16px; bottom:6px; font-size:10px; color:#aaa7bd; z-index:5; }
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="logo"><svg viewBox="0 0 22 22" fill="none"><rect x="1" y="1" width="20" height="20" rx="5" fill="#5b35d5"/><circle cx="11" cy="11" r="4.2" stroke="#fff" stroke-width="1.6"/><path d="M11 3v3M11 16v3M3 11h3M16 11h3" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/></svg>探针</div>
    <div class="nav" id="nav"><button class="on">日志</button><button>链路</button><button>指标</button><button>告警规则</button></div>
    <div class="sp"></div><span class="tiny">推理网关 · 生产环境</span>
  </div>
  <div class="qbar">
    <label class="q"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><circle cx="7" cy="7" r="4.6"/><path d="M10.6 10.6L14 14"/></svg>
      <input id="qi" placeholder="搜索日志内容，或输入 字段:值，例如  tenant:t-482  status:429" autocomplete="off"><span class="qh">Enter</span></label>
    <div class="win"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.3"><circle cx="7" cy="7" r="5.6"/><path d="M7 3.8V7l2.2 1.4"/></svg><b id="winT"></b></div>
    <button class="btn" id="winReset"><svg viewBox="0 0 12 12" width="11" height="11" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M10 6a4 4 0 1 1-1.2-2.8M10 1.5V4H7.5"/></svg>还原时间</button>
  </div>
  <div class="main">
    <aside class="facets" id="facets"></aside>
    <section class="center">
      <div class="hist">
        <div class="hh"><b class="mono" id="total">0</b><span>条日志</span><span id="hsub"></span>
          <div class="lg"><span><i style="background:var(--info)"></i>INFO</span><span><i style="background:var(--warn)"></i>WARN</span><span><i style="background:var(--err)"></i>ERROR</span></div></div>
        <svg id="hsvg"></svg>
      </div>
      <div class="lh"><span>时间</span><span>级别</span><span>服务</span><span>模型</span><span>消息</span><span>耗时</span></div>
      <div class="list" id="list"></div>
    </section>
    <aside class="drawer" id="drawer"></aside>
  </div>
</div>
<div class="htip" id="htip"></div><div class="toast" id="toast"></div><div class="note">示例数据</div>

<script>
const $ = (s, r = document) => r.querySelector(s);
function hash(s) { let h = 2166136261; for (const c of String(s)) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; };
const pad = (n, l = 2) => String(n).padStart(l, "0");
const T0 = Date.UTC(2026, 10, 20, 13, 30, 0), T1 = Date.UTC(2026, 10, 20, 14, 30, 0);
const fmt = (ts, ms) => { const d = new Date(ts); return `${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}:${pad(d.getUTCSeconds())}` + (ms ? "." + pad(d.getUTCMilliseconds(), 3) : ""); };

/* ---------- 数据 ---------- */
const SERVICES = ["gateway", "auth", "router", "llm-serving", "embed-serving", "kv-cache"];
const MODELS = ["luna-72b", "luna-7b", "luna-embed-v2", "lumen-vl-13b"];
const REGIONS = ["华北-北京", "华东-上海", "西南-成都"];
const LEVELS = ["info", "warn", "error"];
const TEN = ["t-482", "t-117", "t-903", "t-255", "t-761", "t-338", "t-640"];
const MSG = {
  info: [["gateway", "POST /v1/chat/completions 200"], ["llm-serving", "decode 完成 tokens_out={o} 吞吐 {x} tok/s"], ["router", "路由到实例 {m}-{i} 命中前缀缓存"], ["embed-serving", "批处理 batch={b} 编码完成"], ["kv-cache", "kv-cache 命中率 0.{h}"], ["auth", "令牌校验通过 tenant={t}"], ["gateway", "POST /v1/embeddings 200"], ["llm-serving", "prefill 完成 tokens_in={n}"]],
  warn: [["router", "队列等待 {q}ms 超过 1500ms 阈值"], ["kv-cache", "显存占用 9{h}% 接近上限，触发换出"], ["gateway", "上游重试 {r}/3 实例 {m}-{i}"], ["llm-serving", "请求排队 {q}ms，batch 已满"], ["auth", "租户 {t} 用量达到配额 90%"]],
  error: [["llm-serving", "CUDA out of memory: 尝试分配 {g} GiB"], ["gateway", "请求超时 30000ms 已断开 tenant={t}"], ["router", "实例 {m}-{i} 健康检查失败，已摘除"], ["auth", "429 租户 {t} 配额已用尽"], ["kv-cache", "block 分配失败：无可用显存块"], ["llm-serving", "解码异常中止 tokens_out={o}"]],
};
const R = rng(20261120);
const LOGS = [];
for (let i = 0; i < 900; i++) {
  const t = T0 + Math.floor(R() * (T1 - T0));
  const minute = (t - T0) / 60000, burst = minute > 28 && minute < 36 ? 1 : 0;
  const x = R(), pe = burst ? .3 : .045, pw = burst ? .3 : .13;
  const level = x < pe ? "error" : x < pe + pw ? "warn" : "info";
  const pool = MSG[level], [svc0, tpl] = pool[Math.floor(R() * pool.length)];
  const model = MODELS[Math.floor(R() * (svc0 === "embed-serving" ? 0 : 1) ) + (svc0 === "embed-serving" ? 2 : Math.floor(R() * 2) + (R() < .15 ? 2 : 0) - 0) ] || MODELS[0];
  const m = svc0 === "embed-serving" ? "luna-embed-v2" : MODELS[[0, 0, 1, 1, 0, 3][Math.floor(R() * 6)]];
  const region = REGIONS[R() < .5 ? 0 : R() < .6 ? 1 : 2];
  const tenant = TEN[Math.floor(R() * R() * TEN.length)];
  const dur = Math.round(level === "error" ? (R() < .5 ? 30000 : 40 + R() * 2400) : level === "warn" ? 900 + R() * 5000 : svc0 === "embed-serving" ? 20 + R() * 120 : 60 + Math.pow(R(), 2) * 2600);
  const msg = tpl.replace("{o}", Math.round(40 + R() * 900)).replace("{n}", Math.round(80 + R() * 3000)).replace("{x}", Math.round(30 + R() * 90)).replace("{m}", m).replace("{i}", Math.floor(R() * 8)).replace("{b}", [8, 16, 32][Math.floor(R() * 3)]).replace("{h}", Math.floor(R() * 9) + 1).replace("{q}", Math.round(1500 + R() * 2800)).replace("{r}", Math.ceil(R() * 3)).replace("{t}", tenant).replace("{g}", (1 + R() * 3).toFixed(2));
  const status = level === "error" ? (msg.startsWith("429") ? 429 : msg.includes("超时") ? 504 : 500) : level === "warn" ? 200 : R() < .02 ? 400 : 200;
  LOGS.push({ id: i, ts: t, level, service: svc0, model: m, region, tenant, dur, msg, status, trace: (hash("tr" + i) .toString(16) + hash("tz" + i).toString(16)).padEnd(16, "0").slice(0, 16), host: `ipod-${["a", "b", "c"][i % 3]}${10 + (i * 7) % 40}`, tin: Math.round(60 + R() * 3000), tout: Math.round(20 + R() * 900) });
}
LOGS.sort((a, b) => b.ts - a.ts);
const DUR = [["<100ms", 0, 100], ["100–500ms", 100, 500], ["0.5–2s", 500, 2000], ["2–10s", 2000, 10000], [">10s", 10000, 1e9]];

/* ---------- 状态 ---------- */
const F = { service: new Set(), level: new Set(), model: new Set(), region: new Set(), dur: new Set() };
const FACETS = [["service", "服务", SERVICES], ["level", "状态", LEVELS], ["model", "模型", MODELS], ["region", "地域", REGIONS], ["dur", "耗时区间", DUR.map((d) => d[0])]];
let win = [T0, T1], query = "", selId = null;
const dkey = (l) => DUR.find((d) => l.dur >= d[1] && l.dur < d[2])[0];
const val = (l, k) => k === "dur" ? dkey(l) : l[k];
function qmatch(l) {
  if (!query.trim()) return true;
  return query.trim().split(/\s+/).every((tk) => { const m = tk.match(/^(\w+):(.+)$/); if (m && m[1] in l) return String(l[m[1]]).toLowerCase() === m[2].toLowerCase(); return (l.msg + l.service + l.model).toLowerCase().includes(tk.toLowerCase()); });
}
const inWin = (l) => l.ts >= win[0] && l.ts < win[1];
function pass(l, except) { if (!inWin(l) || !qmatch(l)) return false; for (const k in F) if (k !== except && F[k].size && !F[k].has(val(l, k))) return false; return true; }
let CUR = [];

/* ---------- 渲染：左侧筛选 ---------- */
const closed = new Set();
function renderFacets() {
  const box = $("#facets"), nsel = Object.values(F).reduce((a, s) => a + s.size, 0);
  let h = `<div class="fh"><b>筛选</b>${nsel ? `<button id="clr">清除 ${nsel} 项</button>` : ""}</div>`;
  FACETS.forEach(([k, label, vals]) => {
    const counts = Object.fromEntries(vals.map((v) => [v, 0])); LOGS.forEach((l) => { if (pass(l, k)) counts[val(l, k)]++; });
    const mx = Math.max(1, ...Object.values(counts)), sorted = k === "dur" || k === "level" ? vals : [...vals].sort((a, b) => counts[b] - counts[a]);
    h += `<div class="fg ${closed.has(k) ? "close" : ""}" data-g="${k}"><div class="fgt"><svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 3.5l3 3 3-3"/></svg>${label}${F[k].size ? `<em>${F[k].size} 项已选</em>` : ""}</div>` +
      sorted.map((v) => `<div class="fv ${F[k].has(v) ? "on" : ""} ${counts[v] ? "" : "zero"}" data-k="${k}" data-v="${v}"><span class="cb"></span>${k === "level" ? `<i class="ldot" style="background:${v === "info" ? "var(--info)" : v === "warn" ? "var(--warn)" : "var(--err)"}"></i>` : ""}<span class="lb ${k === "service" || k === "model" ? "mono" : ""}">${k === "level" ? v.toUpperCase() : v}</span><i class="bar" style="width:${counts[v] / mx * 70}px"></i><span class="n">${counts[v]}</span></div>`).join("") + "</div>";
  });
  box.innerHTML = h;
  box.querySelectorAll(".fv").forEach((e) => e.onclick = () => { toggle(e.dataset.k, e.dataset.v); });
  box.querySelectorAll(".fgt").forEach((e) => e.onclick = () => { const k = e.parentNode.dataset.g; closed.has(k) ? closed.delete(k) : closed.add(k); renderFacets(); });
  const c = $("#clr"); if (c) c.onclick = () => { for (const k in F) F[k].clear(); refresh(); };
}
function toggle(k, v, on) { const s = F[k]; (on === undefined ? !s.has(v) : on) ? s.add(v) : s.delete(v); refresh(); }

/* ---------- 渲染：直方图 ---------- */
const NB = 60; let hgeo = null;
function renderHist() {
  const svg = $("#hsvg"), W = svg.clientWidth, H = 112, L = 30, B = 18, T = 6, pw = W - L - 2, ph = H - B - T;
  const span = win[1] - win[0], bw = span / NB, b = Array.from({ length: NB }, () => ({ info: 0, warn: 0, error: 0 }));
  LOGS.forEach((l) => { if (pass(l)) b[Math.min(NB - 1, Math.floor((l.ts - win[0]) / bw))][l.level]++; });
  const mx = Math.max(4, ...b.map((x) => x.info + x.warn + x.error)), top = Math.ceil(mx / 5) * 5 || 5;
  const Y = (v) => T + ph - v / top * ph, cw = pw / NB;
  let g = "";
  for (let k = 0; k <= 2; k++) { const v = top / 2 * k, y = Y(v); g += `<line x1="${L}" x2="${W}" y1="${y}" y2="${y}" stroke="#eeedf5"/><text class="ax" x="${L - 5}" y="${y + 3}" text-anchor="end">${Math.round(v)}</text>`; }
  for (let k = 0; k <= 5; k++) { g += `<text class="ax" x="${Math.min(Math.max(L + k / 5 * pw, L + 16), W - 20)}" y="${H - 4}" text-anchor="middle">${fmt(win[0] + span * k / 5)}</text>`; }
  b.forEach((x, i) => { let y = Y(0); [["info", "var(--info)"], ["warn", "var(--warn)"], ["error", "var(--err)"]].forEach(([k, c]) => { const h = x[k] / top * ph; if (h > 0) { g += `<rect x="${L + i * cw + .6}" y="${y - h}" width="${Math.max(1, cw - 1.2)}" height="${h}" fill="${c}"/>`; y -= h; } }); });
  g += `<rect id="brush" y="${T}" height="${ph}" fill="#5b35d5" opacity=".14" stroke="#5b35d5" stroke-width="1" style="display:none"/>`;
  svg.innerHTML = g; hgeo = { L, pw, cw, b, W };
  $("#hsub").textContent = `${fmt(win[0])} – ${fmt(win[1])}`;
}
(function bindHist() {
  const svg = $("#hsvg"), tip = $("#htip"); let sx = null, bx = null;
  const px = (e) => Math.max(hgeo.L, Math.min(hgeo.L + hgeo.pw, e.clientX - svg.getBoundingClientRect().left));
  svg.addEventListener("mousedown", (e) => { sx = px(e); bx = sx; tip.style.display = "none"; });
  window.addEventListener("mousemove", (e) => {
    if (!hgeo) return; const r = svg.getBoundingClientRect();
    if (sx != null) { bx = px(e); const br = $("#brush"), a = Math.min(sx, bx), w = Math.abs(bx - sx); br.setAttribute("x", a); br.setAttribute("width", w); br.style.display = w > 3 ? "" : "none"; return; }
    if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) { tip.style.display = "none"; return; }
    const i = Math.floor((e.clientX - r.left - hgeo.L) / hgeo.cw); if (i < 0 || i >= NB) { tip.style.display = "none"; return; }
    const x = hgeo.b[i], bw = (win[1] - win[0]) / NB, t = win[0] + i * bw;
    tip.innerHTML = `<b>${fmt(t)} – ${fmt(t + bw)}</b>INFO ${x.info}　WARN ${x.warn}　ERROR ${x.error}`; tip.style.display = "block"; tip.style.left = e.clientX + 14 + "px"; tip.style.top = r.top + 8 + "px";
  });
  window.addEventListener("mouseup", () => {
    if (sx == null) return; const a = Math.min(sx, bx), z = Math.max(sx, bx); sx = null;
    if (z - a < 6) { $("#brush") && ($("#brush").style.display = "none"); return; }
    const span = win[1] - win[0], t0 = win[0] + (a - hgeo.L) / hgeo.pw * span, t1 = win[0] + (z - hgeo.L) / hgeo.pw * span;
    win = [Math.round(t0), Math.round(t1)]; refresh();
  });
})();

/* ---------- 渲染：日志列表 ---------- */
const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
function renderList() {
  CUR = LOGS.filter((l) => pass(l)); $("#total").textContent = CUR.length.toLocaleString();
  const L = $("#list"), shown = CUR.slice(0, 200);
  L.innerHTML = shown.length ? shown.map((l) => `<div class="row ${l.level} ${l.id === selId ? "sel" : ""}" data-id="${l.id}"><span class="t">${fmt(l.ts, 1)}</span><span class="lv ${l.level}">${l.level.toUpperCase()}</span><span class="svc">${l.service}</span><span class="mdl">${l.model}</span><span class="msg">${esc(l.msg)}</span><span class="d ${l.dur > 2000 ? "slow" : ""}">${l.dur >= 1000 ? (l.dur / 1000).toFixed(2) + " s" : l.dur + " ms"}</span></div>`).join("") + (CUR.length > 200 ? `<div class="more">仅显示最近 200 条，共 ${CUR.length} 条。缩小时间范围或加筛选可看到更多。</div>` : "") : `<div class="empty">没有符合条件的日志，试试清除部分筛选或还原时间。</div>`;
  L.querySelectorAll(".row").forEach((e) => e.onclick = () => openDrawer(+e.dataset.id));
}

/* ---------- 抽屉：链路瀑布 + 字段 ---------- */
function spansOf(l) {
  const r = rng(l.id + 99), D = l.dur, err = l.level === "error", q = l.level === "warn" ? .22 + r() * .2 : .03 + r() * .1;
  const s = [{ n: "gateway.handle", svc: "gateway", d: 0, st: 0, du: D }];
  s.push({ n: "auth.verify", svc: "auth", d: 1, st: 0.004 * D, du: Math.max(2, D * .012) });
  s.push({ n: "router.dispatch", svc: "router", d: 1, st: .02 * D, du: Math.max(2, D * .02) });
  const qs = .045 * D; s.push({ n: "queue.wait", svc: "router", d: 1, st: qs, du: q * D });
  const is = qs + q * D, ie = err && l.service === "llm-serving" ? D * .98 : D * .95;
  s.push({ n: l.service === "embed-serving" ? "embed.encode" : "llm.generate", svc: l.service === "embed-serving" ? "embed-serving" : "llm-serving", d: 1, st: is, du: ie - is, e: err });
  if (l.service !== "embed-serving") {
    const w = ie - is; s.push({ n: "tokenizer.encode", svc: "llm-serving", d: 2, st: is, du: Math.max(2, w * .02) });
    s.push({ n: "kv-cache.lookup", svc: "kv-cache", d: 2, st: is + w * .03, du: Math.max(2, w * .04), e: err && l.service === "kv-cache" });
    s.push({ n: "prefill", svc: "llm-serving", d: 2, st: is + w * .08, du: w * .22 });
    s.push({ n: "decode", svc: "llm-serving", d: 2, st: is + w * .3, du: w * .7, e: err });
  }
  s.push({ n: "response.stream", svc: "gateway", d: 1, st: ie, du: D - ie });
  return s;
}
const FIELDS = [["service", "服务"], ["level", "级别"], ["model", "模型"], ["region", "地域"], ["tenant", "租户"], ["status", "状态码"], ["host", "主机"], ["trace", "trace_id"]];
function openDrawer(id) {
  selId = id; const l = LOGS.find((x) => x.id === id), sp = spansOf(l), D = l.dur;
  document.querySelectorAll(".row").forEach((e) => e.classList.toggle("sel", +e.dataset.id === id));
  const ticks = [0, .25, .5, .75, 1].map((p) => `<i style="left:${p * 100}%${p === 0 ? ";transform:none;left:6px" : p === 1 ? ";transform:translateX(-100%);left:calc(100% - 6px)" : ""}">${(D * p) >= 1000 ? (D * p / 1000).toFixed(2) + " s" : Math.round(D * p) + " ms"}</i>`).join("");
  const fmtD = (v) => v >= 1000 ? (v / 1000).toFixed(2) + " s" : v >= 10 ? Math.round(v) + " ms" : v.toFixed(1) + " ms";
  $("#drawer").innerHTML = `<div class="dh"><div class="tt"><b>${esc(l.msg)}</b><span>${fmt(l.ts, 1)} · ${l.level.toUpperCase()} · ${l.service}</span></div><button class="x" id="dx"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2 2l8 8M10 2l-8 8"/></svg></button></div>
  <div class="db"><div class="ds"><h4>链路 <span>${sp.length} 个 span · 总耗时 ${fmtD(D)}</span></h4>
    <div class="wf"><div class="wfa"><div>span</div><div>${ticks}</div></div>${sp.map((s) => `<div class="sr" data-tip="${s.n} · 起点 +${fmtD(s.st)} · 耗时 ${fmtD(s.du)}"><div class="nm" style="padding-left:${10 + s.d * 14}px">${s.n}<small>${s.svc}</small></div><div class="tr"><u class="${s.e ? "e" : ""}" style="left:${s.st / D * 100}%;width:${Math.max(.4, s.du / D * 100)}%"></u><em style="${(s.st + s.du) / D > .78 ? `right:${100 - s.st / D * 100 + 1}%` : `left:${(s.st + s.du) / D * 100 + 1}%`}">${fmtD(s.du)}</em></div></div>`).join("")}</div></div>
    <div class="ds"><h4>字段 <span>悬停一行可加入筛选</span></h4><div class="kv">${FIELDS.map(([k, label]) => { const v = k === "trace" ? l.trace : l[k]; return `<div class="kr" data-k="${k}" data-v="${v}"><div class="k">${k === "trace" ? "trace_id" : k}</div><div class="v"><span>${v}</span><span class="acts"><button data-a="in">＋ 加入筛选</button><button data-a="out">－ 排除</button></span></div></div>`; }).join("")}
      <div class="kr"><div class="k">tokens</div><div class="v"><span>输入 ${l.tin} → 输出 ${l.tout}</span></div></div><div class="kr"><div class="k">duration</div><div class="v"><span>${fmtD(D)}</span></div></div></div></div></div>`;
  $("#drawer").classList.add("open");
  $("#dx").onclick = closeDrawer;
  $("#drawer").querySelectorAll(".kr[data-k]").forEach((r) => r.querySelectorAll("button").forEach((b) => b.onclick = () => addFilter(r.dataset.k, r.dataset.v, b.dataset.a)));
  const tip = $("#htip");
  $("#drawer").querySelectorAll(".sr").forEach((r) => { r.onmousemove = (e) => { tip.textContent = r.dataset.tip; tip.style.display = "block"; tip.style.left = Math.min(e.clientX + 12, innerWidth - 330) + "px"; tip.style.top = e.clientY + 14 + "px"; }; r.onmouseleave = () => tip.style.display = "none"; });
}
function closeDrawer() { $("#drawer").classList.remove("open"); selId = null; document.querySelectorAll(".row.sel").forEach((e) => e.classList.remove("sel")); }
function addFilter(k, v, mode) {
  const facet = ["service", "level", "model", "region"].includes(k);
  if (facet && mode === "in") { F[k].clear(); F[k].add(v); toast(`已筛选 ${k} = ${v}`); }
  else if (facet) { const all = (k === "service" ? SERVICES : k === "level" ? LEVELS : k === "model" ? MODELS : REGIONS).filter((x) => x !== v); F[k] = new Set(all); toast(`已排除 ${k} = ${v}`); }
  else { if (mode === "out") return toast("该字段暂只支持加入筛选"); query = (query + " " + `${k}:${v}`).trim(); $("#qi").value = query; toast(`已加入查询 ${k}:${v}`); }
  refresh();
}
let tt; function toast(s) { const t = $("#toast"); t.textContent = s; t.classList.add("on"); clearTimeout(tt); tt = setTimeout(() => t.classList.remove("on"), 1800); }

/* ---------- 总控 ---------- */
function refresh() {
  $("#winT").textContent = `${fmt(win[0])} – ${fmt(win[1])}`;
  $("#winReset").classList.toggle("show", win[0] !== T0 || win[1] !== T1);
  renderFacets(); renderHist(); renderList();
}
$("#winReset").onclick = () => { win = [T0, T1]; refresh(); };
$("#qi").addEventListener("input", (e) => { query = e.target.value; renderFacets(); renderHist(); renderList(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeDrawer(); });
window.addEventListener("resize", () => renderHist());
$("#nav").querySelectorAll("button").forEach((b) => b.onclick = () => { if (b.textContent !== "日志") toast("这个页面只演示日志检索"); });
refresh();
</script>
