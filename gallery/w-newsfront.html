<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>信号日报 · 科技与人工智能头版</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;900&family=Noto+Sans+SC:wght@400;500;700&family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{--bg:#fff1e5;--ink:#33302e;--head:#1a1817;--mute:#807973;--rule:#cdbfb3;--rule2:#e0d3c7;--acc:#990f3d;--up:#0f7a4b;--dn:#b4231a;--soft:#f6e4d3}
body.white{--bg:#fff;--ink:#333;--head:#111;--mute:#767676;--rule:#cfcfcf;--rule2:#e6e6e6;--soft:#f3f3f3}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:60px}
body{font:400 15px/1.6 "Noto Sans SC",system-ui,sans-serif;color:var(--ink);background:var(--bg);transition:background .4s,color .4s;min-width:1180px}
a{color:inherit;text-decoration:none}
.sf{font-family:"Noto Serif SC","Songti SC",serif}
.mono{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
.wrap{max-width:1360px;margin:0 auto;padding:0 40px}
.util{display:flex;align-items:center;gap:22px;height:38px;font-size:12px;color:var(--mute);border-bottom:1px solid var(--rule2)}
.util .sp{margin-left:auto}
.util button{font:inherit;color:var(--ink);background:none;border:0;cursor:pointer}
.util button:hover{color:var(--acc)}
.tog{display:inline-flex;border:1px solid var(--rule);border-radius:14px;overflow:hidden;font-size:12px}
.tog button{padding:2px 12px;color:var(--mute)}
.tog button.on{background:var(--head);color:var(--bg)}
.mast{text-align:center;padding:20px 0 14px;border-bottom:3px double var(--head);position:relative}
.mast h1{font-family:"Noto Serif SC",serif;font-weight:900;font-size:74px;line-height:1.05;letter-spacing:.14em;color:var(--head);padding-left:.14em}
.mast .en{font-family:"Playfair Display",serif;font-style:italic;font-weight:700;font-size:17px;letter-spacing:.3em;color:var(--mute);margin-top:4px;text-transform:uppercase}
.mast .ed{position:absolute;left:0;bottom:16px;font-size:12px;color:var(--mute);text-align:left;line-height:1.5}
.mast .wx{position:absolute;right:0;bottom:16px;font-size:12px;color:var(--mute);text-align:right;line-height:1.5}
.live{display:flex;align-items:center;height:38px;border-bottom:1px solid var(--rule);overflow:hidden;font-size:13.5px}
.live .lb{flex:none;display:flex;align-items:center;gap:8px;font-weight:700;color:var(--acc);padding-right:16px;border-right:1px solid var(--rule);margin-right:16px;height:100%;letter-spacing:.06em}
.live .lb i{width:8px;height:8px;border-radius:50%;background:var(--acc);animation:pl 1.4s infinite}
@keyframes pl{50%{opacity:.2}}
.live .vp{flex:1;overflow:hidden;white-space:nowrap;-webkit-mask-image:linear-gradient(90deg,#000 94%,transparent);mask-image:linear-gradient(90deg,#000 94%,transparent)}
.live .tr{display:inline-block;animation:mq 90s linear 6s infinite}
.live:hover .tr{animation-play-state:paused}
@keyframes mq{to{transform:translateX(-50%)}}
.live .tr a{margin-right:38px;cursor:pointer}
.live .tr a b{font-family:"IBM Plex Mono";font-weight:500;color:var(--mute);margin-right:8px;font-size:12px}
.live .tr a:hover span{text-decoration:underline;text-underline-offset:3px}
.live .up{flex:none;margin-left:14px;color:var(--mute);font-size:12px}
nav.sec{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--head);transition:background .4s,box-shadow .3s}
nav.sec.stuck{box-shadow:0 1px 0 var(--rule2),0 6px 14px -10px rgba(0,0,0,.25)}
nav.sec .in{display:flex;align-items:center;height:46px;gap:0}
nav.sec .mini{font-family:"Noto Serif SC";font-weight:900;font-size:19px;letter-spacing:.1em;color:var(--head);width:0;overflow:hidden;white-space:nowrap;opacity:0;transition:width .35s,opacity .35s,margin .35s;cursor:pointer}
nav.sec.stuck .mini{width:96px;opacity:1;margin-right:18px}
nav.sec a.t{position:relative;padding:0 15px;height:46px;line-height:46px;font-size:14.5px;font-weight:500;color:var(--head)}
nav.sec a.t::after{content:"";position:absolute;left:15px;right:15px;bottom:-1px;height:3px;background:var(--acc);transform:scaleX(0);transition:transform .25s}
nav.sec a.t:hover::after,nav.sec a.t.on::after{transform:scaleX(1)}
nav.sec a.t.on{color:var(--acc);font-weight:700}
nav.sec .sp{margin-left:auto;font-size:12px;color:var(--mute)}
.hl{background:linear-gradient(currentColor,currentColor) 0 100%/0 1.5px no-repeat;transition:background-size .3s;cursor:pointer;color:inherit}
.hl:hover,a:hover>.hl,.card:hover .hl{background-size:100% 1.5px}
.front{display:grid;grid-template-columns:300px 1fr 300px;gap:0;padding:22px 0 10px}
.front>div{padding:0 24px}
.front>div:first-child{padding-left:0;border-right:1px solid var(--rule)}
.front>div:last-child{padding-right:0;border-left:1px solid var(--rule)}
.kick{font:700 12px "Noto Sans SC";letter-spacing:.12em;color:var(--acc);margin-bottom:6px}
.itm{padding:14px 0;border-top:1px solid var(--rule2);cursor:pointer}
.itm:first-of-type{border-top:0;padding-top:0}
.itm h3{font-family:"Noto Serif SC";font-weight:700;font-size:19px;line-height:1.38;color:var(--head)}
.itm p{font-size:13.5px;color:var(--ink);margin-top:6px;line-height:1.6}
.itm .by{font-size:12px;color:var(--mute);margin-top:6px}
.lead{cursor:pointer}
.lead h2{font-family:"Noto Serif SC";font-weight:900;font-size:44px;line-height:1.24;color:var(--head);letter-spacing:-.005em;margin-bottom:12px}
.lead .deck{font-family:"Noto Serif SC";font-size:17px;line-height:1.7;color:var(--ink);margin-bottom:10px}
.by{font-size:12.5px;color:var(--mute)}
.by b{color:var(--head);font-weight:700;letter-spacing:.04em}
figure{margin:16px 0 0}
figure .ph{aspect-ratio:16/8.4;overflow:hidden;background:var(--soft)}
figure img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .8s cubic-bezier(.2,.8,.2,1)}
.lead:hover figure img,.card:hover img{transform:scale(1.025)}
figcaption{font-size:11.5px;color:var(--mute);margin-top:6px;display:flex;justify-content:space-between}
.sub2{display:grid;grid-template-columns:1fr 1fr;gap:0;margin-top:18px;border-top:1px solid var(--rule)}
.sub2>div{padding:14px 18px 0 0;cursor:pointer}
.sub2>div+div{padding:14px 0 0 18px;border-left:1px solid var(--rule2)}
.sub2 h3{font-family:"Noto Serif SC";font-weight:700;font-size:20px;line-height:1.38;color:var(--head)}
.sub2 p{font-size:13.5px;margin-top:6px}
.rd h4,.mk h4{font:700 12px "Noto Sans SC";letter-spacing:.14em;border-bottom:2px solid var(--head);padding-bottom:6px;margin-bottom:4px;color:var(--head)}
.rd ol{list-style:none}
.rd li{display:grid;grid-template-columns:34px 1fr;gap:6px;padding:11px 0;border-top:1px solid var(--rule2);cursor:pointer}
.rd li:first-child{border-top:0}
.rd li i{font:900 26px/1 "Noto Serif SC";font-style:normal;color:var(--acc)}
.rd li span{font-family:"Noto Serif SC";font-weight:600;font-size:15.5px;line-height:1.45;color:var(--head)}
.mk{margin-top:20px}
.mk table{width:100%;border-collapse:collapse;font-size:12.5px}
.mk td{padding:6px 0;border-top:1px solid var(--rule2)}
.mk tr:first-child td{border-top:0}
.mk td:nth-child(2){text-align:right;color:var(--head)}.mk td:nth-child(3){text-align:right;width:62px}
.u{color:var(--up)}.d{color:var(--dn)}
.mk small{display:block;font-size:11px;color:var(--mute);margin-top:6px}
.band{border-top:3px double var(--head);margin-top:18px;padding-top:26px}
.band h3.sh{font-family:"Noto Serif SC";font-weight:900;font-size:22px;color:var(--head);margin-bottom:16px;display:flex;align-items:baseline;gap:14px}
.band h3.sh span{font:400 12px "Noto Sans SC";color:var(--mute)}
.cols4{display:grid;grid-template-columns:repeat(4,1fr);gap:0 0;margin-bottom:34px}
.cols4>div{padding:0 22px;border-left:1px solid var(--rule)}
.cols4>div:first-child{padding-left:0;border-left:0}
.cols4>div:last-child{padding-right:0}
.card{cursor:pointer}
.card .ph{aspect-ratio:3/2;overflow:hidden;background:var(--soft);margin-bottom:10px}
.card .ph img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .8s cubic-bezier(.2,.8,.2,1)}
.cols4 .card .by{font-size:12px}
.card h4{font-family:"Noto Serif SC";font-weight:700;font-size:18px;line-height:1.42;color:var(--head)}
.card p{font-size:13px;margin-top:5px;color:var(--ink)}
.card .cap{font-size:10.5px;color:var(--mute);margin-top:4px}
.opn{display:grid;grid-template-columns:repeat(3,1fr);margin-bottom:30px}
.opn>div{padding:0 26px;border-left:1px solid var(--rule);cursor:pointer}
.opn>div:first-child{padding-left:0;border-left:0}
.opn q{display:block;font-family:"Noto Serif SC";font-weight:700;font-size:20px;line-height:1.5;color:var(--head);quotes:"“" "”"}
.opn .by{margin-top:10px}
footer.ft{border-top:1px solid var(--head);margin-top:20px;padding:20px 0 50px;font-size:12px;color:var(--mute);display:flex;justify-content:space-between}
/* 文章 */
#art{display:none;padding:34px 0 80px}
#art .col{max-width:740px;margin:0 auto}
#art .bk{font-size:13px;color:var(--acc);cursor:pointer;display:inline-block;margin-bottom:26px;font-weight:500}
#art .bk:hover{text-decoration:underline}
#art h1{font-family:"Noto Serif SC";font-weight:900;font-size:46px;line-height:1.27;color:var(--head);margin:6px 0 16px}
#art .deck{font-family:"Noto Serif SC";font-size:20px;line-height:1.7;color:var(--ink);margin-bottom:18px}
#art .meta{display:flex;justify-content:space-between;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:9px 0;font-size:12.5px;color:var(--mute);margin-bottom:24px}
#art figure{margin:0 0 30px}
#art p.b{font-family:"Noto Serif SC";font-size:18.5px;line-height:1.95;margin-bottom:20px;color:var(--ink)}
#art p.b:first-of-type::first-letter{float:left;font-weight:900;font-size:68px;line-height:.86;padding:6px 10px 0 0;color:var(--acc)}
#art blockquote{font-family:"Noto Serif SC";font-weight:700;font-size:26px;line-height:1.5;color:var(--head);border-top:3px solid var(--head);border-bottom:1px solid var(--rule);padding:16px 0;margin:30px 0}
#art .rel{margin-top:40px;border-top:3px double var(--head);padding-top:16px}
#art .rel h5{font:700 12px "Noto Sans SC";letter-spacing:.14em;color:var(--acc);margin-bottom:8px}
#art .rel a{display:block;font-family:"Noto Serif SC";font-weight:700;font-size:17px;padding:9px 0;border-top:1px solid var(--rule2);cursor:pointer;color:var(--head)}
#art .rel a:first-of-type{border-top:0}
.fade{animation:fd .5s cubic-bezier(.2,.8,.2,1)}
@keyframes fd{from{opacity:0;transform:translateY(12px)}}
.reveal{opacity:0;transform:translateY(14px);transition:opacity .7s,transform .7s}
.reveal.in{opacity:1;transform:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="util"><span id="dt">—</span><span>头版</span><span>全球版</span><span class="sp"></span><span class="tog" id="tog"><button class="on" data-m="paper">纸色</button><button data-m="white">白色</button></span><button>搜索</button><button>登录</button><button style="font-weight:700">订阅</button></div>
  <header class="mast"><div class="ed">创刊于 2019 年<br>示例数据 · 报名虚构</div><h1>信号日报</h1><div class="en">The Signal · Technology &amp; AI</div><div class="wx">杭州 · 周五<br>多云 14°C</div></header>
  <div class="live"><div class="lb"><i></i>实时</div><div class="vp"><div class="tr" id="tr"></div></div><span class="up mono" id="upd">更新于 --:--</span></div>
</div>

<script>
const $=id=>document.getElementById(id);
const IM={a:["satellite-downtown","Alexander Pidgeon"],b:["flatlay-keyboard","Nik"],c:["flatlay-rocket","SpaceX"],d:["satellite-harbor","Michael Olsen"],e:["satellite-roundabout","Maximillian Conacher"],f:["device-tablet","Olena Sergienko"],g:["satellite-campus","Victor"],h:["lifestyle-table","Harry Tang"]};
const A=[
{id:0,s:"人工智能",h:"大模型推理价格一年降八成，「按次计费」成云厂商新卖点",d:"多家厂商把每百万 token 的价格压到去年的五分之一，竞争焦点从单价转向延迟和稳定性。",by:"陈岚",t:"09:12",im:"a",cap:"城市街区航拍（示意）",p:["过去十二个月，主流大模型的推理报价平均下降了 78%，其中小模型降幅最大。多位采购负责人对本报表示，单价已经不再是谈判的第一项，他们更关心高峰期的首字延迟和失败率。","一家云服务商本周推出「按次计费」套餐：一次调用不论长短，统一收 0.02 元，上限 8 千 token。该公司称，这样可以让客户在做预算时更容易估算。","分析人士提醒，低价背后是算力利用率的竞争。机房空转一小时的成本，需要靠更密的调度来摊平，价格战短期内难以结束。"],q:"单价已经不再是谈判的第一项。",rel:[1,2,3]},
{id:1,s:"人工智能",h:"企业开始给模型「记账」：每个部门每月用了多少 token",d:"用量看板成为采购后的第一个需求，财务部门要求按项目拆分。",by:"周启明",t:"08:40",im:"b",cap:"办公桌上的键盘（示意）",p:["越来越多企业把模型调用纳入内部分摊。一家制造企业的信息部门透露，他们为 14 个业务线分别建了额度，月底按实际用量出账。","这类需求让「谁调用了什么」成为刚需：调用方、模型、项目标签、失败重试，缺一项账单就对不上。","一位财务总监说，最难的是把共享调用的费用合理拆给各部门，目前只能按调用次数的比例暂估。"],q:"月底对不上账，是最常见的投诉。",rel:[0,4,5]},
{id:2,s:"芯片与算力",h:"新一代加速卡能效追平旗舰，交期拖到明年二季度",d:"首批样卡在多项测试中表现接近，但封装产能仍是瓶颈。",by:"赵未",t:"08:05",im:"c",cap:"发射升空的火箭（示意）",p:["据多家系统集成商透露，新一代加速卡在每瓦性能上已接近上一代旗舰，但首批订单交期被推迟到明年二季度。","瓶颈在先进封装：同一条产线要同时供应多个客户，排产优先级由长期协议决定。","采购方的策略正在分化，一部分选择继续等待，另一部分转向上一代产品并增加数量。"],q:"瓶颈不在芯片，在封装。",rel:[0,6,7]},
{id:3,s:"云与数据中心",h:"数据中心改用液冷后，机房电费一年少了三成",d:"一座新园区的运行数据显示，冷却能耗占比从 38% 降到 19%。",by:"林晓",t:"07:50",im:"g",cap:"园区鸟瞰（示意）",p:["该园区去年完成液冷改造，全年冷却电耗减少约一半。综合下来，机房总电费同比下降 31%。","运维人员说，最大的变化是噪声消失和故障定位更快，漏液检测的告警比温度告警更可靠。","改造成本约在三年内回收，前提是机柜功率持续保持在高位。"],q:"漏液检测的告警比温度告警更可靠。",rel:[2,0,6]},
{id:4,s:"机器人",h:"港口试点无人集卡，夜班事故数降为零",d:"试点三个月，单箱作业时长缩短 12%。",by:"孙远",t:"07:30",im:"d",cap:"港口与船只（示意）",p:["试点港口在夜间引入 20 辆无人集卡，由中央调度系统统一派单。三个月内未发生人员伤害事故。","调度员表示，系统最大的价值在于稳定：它不疲劳，也不会因为交接班丢掉信息。","接下来试点范围将扩大到白班，并与泊位计划系统打通。"],q:"它不疲劳，也不会因为交接班丢掉信息。",rel:[1,5,3]},
{id:5,s:"人工智能",h:"平板上的写作助手：我们让它替一位编辑工作了一周",d:"它擅长整理，不擅长取舍。",by:"唐宁",t:"07:10",im:"f",cap:"木桩上的平板和键盘（示意）",p:["本报编辑部让写作助手参与一周选题会，它在归纳资料和列提纲上明显比人快。","但当需要判断哪条新闻该放头版时，它给出的理由大多正确却不够有立场。","最后的结论是：它可以替编辑做完九成的整理，剩下一成仍然需要人负责。"],q:"剩下一成仍然需要人负责。",rel:[0,1,4]},
{id:6,s:"云与数据中心",h:"跨城灾备演练：切换用时从 40 分钟缩到 6 分钟",d:"演练覆盖 120 个业务系统，唯一的人工步骤是确认。",by:"何岸",t:"06:55",im:"e",cap:"城市环岛（示意）",p:["一家大型企业完成年度跨城灾备演练，核心系统在 6 分钟内完成切换。","此前最大的耽误来自人工核对，如今核对步骤被写成脚本，只在最后保留一次人工确认。","演练也暴露出问题：有 9 个边缘系统没有登记在资产清单里。"],q:"有 9 个边缘系统没有登记在资产清单里。",rel:[3,2,0]},
{id:7,s:"观点",h:"便宜的模型会让软件更复杂，还是更简单？",d:"当调用不再需要精打细算，产品设计会先变得啰嗦。",by:"沈知",t:"06:30",im:"h",cap:"阳光下的木桌（示意）",p:["当每次调用只要几厘钱，工程师不再克制：多问一句、多读一遍、多生成三个候选。","这会让产品先变得啰嗦，用户看到的选项越来越多。真正的设计任务，是在能力变多的时候依然只留下三件事。","便宜是一种诱惑，也是一种考验。"],q:"便宜是一种诱惑，也是一种考验。",rel:[0,1,5]},
