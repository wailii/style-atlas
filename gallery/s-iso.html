<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>等距积木</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Noto+Sans+SC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root { --bg: #eef2f6; --ink: #1d2433; --mute: #6b7487; --line: #dbe2ea; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: var(--bg); }
  body { font-family: "Space Grotesk", "Noto Sans SC", sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  .app { position: relative; height: 100vh; display: flex; flex-direction: column; background: var(--bg) var(--iso); }
  .sb { height: 40px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 6px 24px 0; font-weight: 700; font-size: 15px; }
  .top { flex: none; display: flex; justify-content: space-between; align-items: center; padding: 0 18px 0; }
  h1 { font-family: "Noto Sans SC"; font-weight: 900; font-size: 30px; letter-spacing: -.5px; }
  .date { font-size: 12.5px; color: var(--mute); font-weight: 600; margin-top: 2px; }
  .listen { display: flex; align-items: center; gap: 8px; font-family: "Noto Sans SC"; font-weight: 700; font-size: 14px; padding: 8px 14px 8px 10px; background: #fff; border-radius: 12px; box-shadow: 0 4px 0 #c9d3df, 0 10px 18px -10px rgba(29,36,51,.3); transition: transform .12s, box-shadow .12s; }
  .listen:active { transform: translateY(3px); box-shadow: 0 1px 0 #c9d3df; }
  .listen svg { width: 22px; height: 22px; }
  .listen.on { background: #ff7a59; color: #fff; box-shadow: 0 4px 0 #d9563a; }

  .scroll { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 0 16px 26px; scrollbar-width: none; }
  .scroll::-webkit-scrollbar { display: none; }
  .city { display: block; width: 100%; height: 312px; overflow: visible; margin-top: -4px; }
  .lbl { font-family: "Space Grotesk"; font-weight: 700; font-size: 11px; fill: var(--ink); }
  .hero h2 { margin-top: 2px; font-family: "Noto Sans SC"; font-weight: 900; font-size: 21px; line-height: 1.42; }
  .hero h2 span { display: inline-block; font-family: "Space Grotesk"; font-size: 13px; color: #fff; background: #ff7a59; border-radius: 6px; padding: 1px 7px; margin-right: 6px; vertical-align: 3px; }
  .hero p { margin-top: 8px; font-family: "Noto Sans SC"; font-size: 13.5px; line-height: 1.7; color: var(--mute); }
  .stats { display: flex; gap: 10px; margin-top: 12px; }
  .stats div { flex: 1; background: #fff; border-radius: 12px; padding: 9px 12px; box-shadow: 0 3px 0 #d3dce7; font-size: 11.5px; color: var(--mute); font-weight: 600; }
  .stats b { display: block; font-size: 22px; color: var(--ink); line-height: 1.1; }

  ol { list-style: none; display: flex; flex-direction: column; gap: 10px; margin-top: 18px; }
  .it { display: grid; grid-template-columns: 70px 1fr; gap: 12px; align-items: center; background: #fff; border-radius: 14px; padding: 8px 12px 8px 6px; box-shadow: 0 3px 0 #d3dce7; cursor: pointer; transition: transform .2s; }
  .it.on { transform: translateY(-2px); box-shadow: 0 5px 0 var(--c, #ff7a59); }
  .it svg { width: 70px; height: 64px; overflow: visible; }
  .it h3 { font-family: "Noto Sans SC"; font-weight: 700; font-size: 15px; line-height: 1.45; }
  .it .m { margin-top: 4px; font-size: 12px; color: var(--mute); font-weight: 600; display: flex; align-items: center; gap: 6px; }
  .it .m i { width: 8px; height: 8px; border-radius: 2px; background: var(--c); }
  .it .more { display: none; margin-top: 6px; font-family: "Noto Sans SC"; font-size: 12.5px; line-height: 1.6; color: var(--mute); }
  .it.open .more { display: block; }

  .tabs { flex: none; display: grid; grid-template-columns: repeat(5, 1fr); background: #fff; padding: 10px 6px 24px; box-shadow: 0 -1px 0 var(--line); }
  .tab { display: flex; flex-direction: column; align-items: center; gap: 3px; font-family: "Noto Sans SC"; font-weight: 700; font-size: 11.5px; color: var(--mute); }
  .tab svg { width: 26px; height: 26px; overflow: visible; }
  .tab.on { color: #f06a49; }
  .tab svg { width: 23px; height: 23px; }
</style>
</head>
<body>
<div class="app" id="app"></div>
<script src="data.js"></script>
<script src="common.js"></script>
<script src="engines.js"></script>
<script>
const { isoP: P, isoCube: cube, ISO_COS: COS, ISO_SIN: SIN } = Engines;
const app = document.getElementById("app");
const [h1, ...rest] = HOT;
const C = [["#ff9a80", "#f06a49", "#d9563a"], ["#7aa0ff", "#4c7dff", "#3a63d6"], ["#ffd76a", "#ffc93c", "#e0a91f"], ["#6fe0b8", "#3ccb9a", "#2aa77e"], ["#c4b2ff", "#9d84f5", "#7d64d6"]];
const GRAY = ["#ffffff", "#dde5ee", "#c3cfdc"];
const SVGNS = "http://www.w3.org/2000/svg";
// 等距投影：x 往右下、y 往左下、z 往上
app.style.setProperty("--iso", `url("data:image/svg+xml,${encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' width='34.64' height='20'><path d='M0 0 L34.64 20 M34.64 0 L0 20' stroke='%23dbe2ea' stroke-width='.6' fill='none'/></svg>`).replace(/%2523/g, "%23")}")`);

// ── 城市：封面铺成地面，每条热点一座楼，楼高按热度 ──
const S = 21, OX = 195, OY = 168, N = 6;
const maxHeat = Math.max(...HOT.map((h) => h.heat));
const spots = [[1, 1], [3, 0], [4, 2], [0, 3], [2, 3], [4, 4], [1, 5], [3, 5]];
function citySVG() {
  const g = (x, y) => P(x, y, 0, S, OX, OY);
  const [ax, ay] = g(0, 0), [bx, by] = g(N, 0), [cx, cy] = g(N, N), [dx, dy] = g(0, N);
  let s = `<defs><clipPath id="gc"><polygon points="${ax},${ay} ${bx},${by} ${cx},${cy} ${dx},${dy}"/></clipPath></defs>`;
  s += `<polygon points="${dx},${dy} ${cx},${cy} ${cx},${cy + 14} ${dx},${dy + 14}" fill="#c3cfdc"/><polygon points="${bx},${by} ${cx},${cy} ${cx},${cy + 14} ${bx},${by + 14}" fill="#aab8c8"/>`;
  s += `<g clip-path="url(#gc)"><image href="${h1.cover}" x="0" y="0" width="${N}" height="${N}" preserveAspectRatio="xMidYMid slice" transform="matrix(${COS * S},${SIN * S},${-COS * S},${SIN * S},${OX},${OY})" opacity=".92"/></g>`;
  // 从后往前画，前面的楼挡住后面的
  const order = HOT.map((h, i) => ({ h, i, xy: spots[i] })).sort((a, b) => a.xy[0] + a.xy[1] - (b.xy[0] + b.xy[1]));
  for (const { h, i, xy } of order) {
    const n = Math.max(1, Math.round((h.heat / maxHeat) * 7)), col = i === 0 ? C[0] : i < 4 ? C[(i % 4) + 1] : GRAY;
    s += `<g class="tower" data-i="${i}">`;
    for (let z = 0; z < n; z++) s += cube(xy[0], xy[1], z, S, OX, OY, col);
    const [lx, ly] = P(xy[0] + 0.5, xy[1] + 0.5, n + 0.9, S, OX, OY);
    s += `<g class="tag"><rect x="${lx - 13}" y="${ly - 10}" width="26" height="17" rx="5" fill="#1d2433"/><text class="lbl" x="${lx}" y="${ly + 3}" text-anchor="middle" fill="#fff" style="fill:#fff">${pad2(h.rank)}</text></g></g>`;
  }
  return s;
}
// 列表小图：一块方块，封面贴在顶面
function tile(h, i) {
  const s = 26, ox = 35, oy = 14, col = i < 3 ? C[(i % 4) + 1] : GRAY;
  const p = (a, b, c) => P(a, b, c, s, ox, oy);
  let svg = `<svg viewBox="0 0 70 64">`;
  svg += cube(0, 0, -0.55, s, ox, oy + 0, col).replace('class="cb"', "");
  if (h.cover) {
    const [tx, ty] = p(0, 0, 0.45);
    svg += `<defs><clipPath id="t${i}"><polygon points="${[p(0, 0, 0.45), p(1, 0, 0.45), p(1, 1, 0.45), p(0, 1, 0.45)].map((q) => q.join(",")).join(" ")}"/></clipPath></defs><g clip-path="url(#t${i})"><image href="${h.cover}" width="1" height="1" preserveAspectRatio="xMidYMid slice" transform="matrix(${COS * s},${SIN * s},${-COS * s},${SIN * s},${tx},${ty})"/></g>`;
  } else {
    const [tx, ty] = p(0.5, 0.5, 0.45);
    svg += `<g transform="translate(${tx - 11},${ty - 11}) scale(.34)"><path d="${DOODLE[h.rank]}" fill="none" stroke="#1d2433" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g>`;
  }
  return svg + "</svg>";
}
const tabIcon = (i, on) => iconSVG(i);

app.innerHTML = `
  <div class="sb"><span>${nowHM()}</span><span>5G ▲</span></div>
  <header class="top"><div><h1>AI 热点</h1><div class="date">10 月 22 日 · 周四 · 热度城市</div></div><button class="listen" id="listen"><svg viewBox="0 0 22 22">${cube(0, 0, 0, 11, 11, 0, C[0])}</svg><span>听热点</span></button></header>
  <main class="scroll">
    <section class="hero">
      <svg class="city" id="city" viewBox="0 0 390 312">${citySVG()}</svg>
      <h2><span>No.01</span>${esc(shortTitle(h1))}</h2>
      <p>${esc(clip(firstLine(h1.summary), 56))}</p>
      <div class="stats"><div>热度<b>${heatText(h1)}</b></div><div>来源<b>${h1.sources}</b></div><div>参与<b>${h1.people}</b></div></div>
    </section>
    <ol>${rest.map((h, i) => `<li class="it" data-i="${i + 1}" style="--c:${(i + 1) < 4 ? C[((i + 1) % 4) + 1][1] : "#aab8c8"}">${tile(h, i)}<div><h3>${esc(shortTitle(h))}</h3><div class="m"><i></i>热度 ${heatText(h)} · ${h.sources} 家</div><div class="more">${esc(clip(firstLine(h.summary), 80))}</div></div></li>`).join("")}</ol>
  </main>
  <nav class="tabs">${TAB_NAMES.map((n, i) => `<button class="tab ${i ? "" : "on"}" data-i="${i}">${tabIcon(i, !i)}${n}</button>`).join("")}</nav>`;

const $ = (id) => document.getElementById(id);
const BOUNCE = "cubic-bezier(.3,1.6,.5,1)";
(async () => {
await fontsReady();
// 地面先铺开，再一块块往下掉、往上堆
const city = $("city");
city.querySelector("g[clip-path]").animate([{ opacity: 0, transform: "translateY(20px)" }, { opacity: 1, transform: "none" }], { duration: 700, delay: 100, fill: "backwards", easing: "cubic-bezier(.2,.8,.2,1)" });
let d = 500;
city.querySelectorAll(".tower").forEach((t) => {
  const i = +t.dataset.i;
  t.querySelectorAll(".cb").forEach((c, z) => { c.animate([{ transform: "translateY(-160px)", opacity: 0 }, { opacity: 1, offset: 0.3 }, { transform: "none", opacity: 1 }], { duration: 520, delay: 500 + i * 90 + z * 70, easing: BOUNCE, fill: "backwards" }); });
  t.querySelector(".tag").animate([{ transform: "translateY(-10px) scale(.4)", opacity: 0 }, { transform: "none", opacity: 1 }], { duration: 400, delay: 1300 + i * 90, easing: BOUNCE, fill: "backwards" });
});
app.querySelectorAll(".hero h2, .hero p, .stats").forEach((el, i) => el.animate([{ opacity: 0, transform: "translateY(12px)" }, { opacity: 1, transform: "none" }], { duration: 500, delay: 1400 + i * 120, fill: "backwards", easing: "ease-out" }));
app.querySelectorAll(".it").forEach((li, i) => {
  li.animate([{ opacity: 0, transform: "translateY(30px)" }, { opacity: 1, transform: "none" }], { duration: 520, delay: 1700 + i * 80, fill: "backwards", easing: BOUNCE });
  // 点一条：城市里对应那座楼跳一下
  li.addEventListener("click", () => {
    li.classList.toggle("open");
    app.querySelectorAll(".it").forEach((x) => x.classList.toggle("on", x === li));
    const t = city.querySelector(`.tower[data-i="${li.dataset.i}"]`);
    t.animate([{ transform: "none" }, { transform: "translateY(-18px)" }, { transform: "none" }], { duration: 600, easing: BOUNCE });
  });
});
// 楼顶的号码牌轻轻浮动
city.querySelectorAll(".tag").forEach((tg, i) => tg.animate([{ transform: "translateY(0)" }, { transform: "translateY(-3px)" }, { transform: "translateY(0)" }], { duration: 2200, delay: 2000 + i * 200, iterations: Infinity, easing: "ease-in-out" }));
const listen = $("listen");
listen.addEventListener("click", () => { const on = listen.classList.toggle("on"); listen.querySelector("span").textContent = on ? "在听 01" : "听热点"; });
const tabs = [...app.querySelectorAll(".tab")];
tabs.forEach((t) => t.addEventListener("click", () => tabs.forEach((x, j) => { const on = x === t; x.classList.toggle("on", on); x.querySelector("svg").outerHTML = tabIcon(j, on); if (on) x.querySelector("svg").animate([{ transform: "translateY(-8px)" }, { transform: "none" }], { duration: 400, easing: BOUNCE }); })));
})();
</script>
</body>
</html>
