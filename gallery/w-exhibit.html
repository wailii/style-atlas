<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>算力的六十年 · 线上展</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Noto+Serif+SC:wght@400;600;900&family=Noto+Sans+SC:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" media="print" onload="this.media='all'">
<style>
:root{--wall:#f2efe7;--ink:#1b1a17;--ink2:#5d5a50;--mute:#948f80;--line:#d8d3c4;--red:#e4452a;--paper:#fbf9f3;
--serif:"Noto Serif SC","Cormorant Garamond",serif;--num:"Cormorant Garamond","Noto Serif SC",serif;--sans:"Noto Sans SC",system-ui,sans-serif;--mono:"IBM Plex Mono","Noto Sans SC",monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--wall);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
body{overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
#scroller{position:relative}
#stage{position:sticky;top:0;height:100vh;overflow:hidden}
#track{position:absolute;left:0;top:0;height:100%;display:flex;align-items:center;will-change:transform;padding-bottom:64px}
/* top */
.top{position:fixed;left:0;right:0;top:0;z-index:30;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 48px;font-size:13px;letter-spacing:.08em;pointer-events:none}
.top b{font-family:var(--serif);font-weight:600;letter-spacing:.2em;font-size:14px}.top span{font-family:var(--mono);font-size:12px;color:var(--mute);letter-spacing:.06em}
.top .rt{display:flex;gap:26px;align-items:center}.top .hint{display:flex;align-items:center;gap:10px}
.hint i{display:block;width:40px;height:1px;background:var(--ink);position:relative;animation:nudge 1.8s ease-in-out infinite}.hint i:after{content:"";position:absolute;right:0;top:-3px;width:6px;height:6px;border-top:1px solid var(--ink);border-right:1px solid var(--ink);transform:rotate(45deg)}
@keyframes nudge{50%{transform:translateX(8px)}}
/* panels */
.p{flex:none;height:100%;position:relative;display:flex;align-items:center}
.intro{width:960px;padding-left:96px}
.intro h1{font-family:var(--serif);font-weight:900;font-size:172px;margin-top:-70px;line-height:.98;letter-spacing:-.04em;margin-left:-8px}
.intro h1 em{font-style:normal;color:var(--red)}
.intro .sub{position:absolute;left:96px;bottom:150px;display:flex;gap:36px;font-size:14px;color:var(--ink2);line-height:1.8}
.intro .sub div{border-top:1px solid var(--ink);padding-top:10px;min-width:150px}.intro .sub b{display:block;font-family:var(--num);font-size:34px;font-weight:600;color:var(--ink);line-height:1.1}
.intro .tag{position:absolute;left:96px;top:128px;font-family:var(--mono);font-size:12px;letter-spacing:.16em;color:var(--red)}
.say{width:760px;padding:0 90px}
.say p{font-family:var(--serif);font-weight:600;font-size:56px;line-height:1.35;letter-spacing:-.02em}
.say p em{font-style:normal;color:var(--red)}
.say small{position:absolute;left:90px;bottom:200px;font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--mute)}
.ex{width:780px;padding:0 70px}
.ex .yr{position:absolute;left:30px;top:62px;font-family:var(--num);font-weight:500;font-size:300px;line-height:1;letter-spacing:-.05em;color:transparent;-webkit-text-stroke:1.2px #bdb7a6;pointer-events:none;will-change:transform;white-space:nowrap}
.ex .frame{position:relative;width:560px;height:520px;background:var(--c);cursor:pointer;margin-top:-10px;transition:transform .5s cubic-bezier(.2,.9,.2,1)}
.ex .frame:hover{transform:translateY(-6px)}
.ex .frame svg.art{position:absolute;left:50%;top:50%;width:470px;height:430px;margin:-215px 0 0 -235px;will-change:transform;transition:transform .25s ease-out;overflow:visible}
.ex .frame .cn{position:absolute;right:14px;top:14px;font-family:var(--mono);font-size:11px;color:var(--ink2);letter-spacing:.08em}
.ex .frame .zm{position:absolute;right:14px;bottom:14px;width:34px;height:34px;border:1px solid var(--ink);border-radius:50%;display:grid;place-items:center;opacity:0;transform:scale(.8);transition:.3s;background:var(--paper)}
.ex .frame:hover .zm{opacity:1;transform:none}.zm svg{width:14px;height:14px;stroke:var(--ink);fill:none;stroke-width:1.6}
.label{position:absolute;left:30px;bottom:92px;width:264px;background:var(--paper);border:1px solid var(--ink);padding:16px 18px 14px;box-shadow:0 14px 30px -18px rgba(40,30,10,.5);transition:transform .45s cubic-bezier(.2,.9,.2,1)}
.ex .frame:hover~.label,.ex .label:hover{transform:translate(8px,-8px)}
.label .no{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;color:var(--mute);display:flex;justify-content:space-between}
.label h3{font-family:var(--serif);font-weight:900;font-size:21px;line-height:1.3;margin:7px 0 3px;letter-spacing:-.01em}
.label .m{font-size:12px;color:var(--ink2);line-height:1.6}
.label .m b{font-family:var(--num);font-size:15px;font-weight:600;color:var(--ink)}
.label .go{margin-top:9px;padding-top:8px;border-top:1px dashed var(--line);font-size:11.5px;color:var(--red);letter-spacing:.06em;display:flex;justify-content:space-between}
.outro{width:1000px;padding-left:120px}
.outro h2{font-family:var(--serif);font-weight:900;font-size:120px;line-height:1.08;letter-spacing:-.04em}
.outro h2 em{font-style:normal;color:var(--red)}
.outro p{margin-top:24px;font-size:17px;color:var(--ink2);line-height:1.9;max-width:520px}
.outro button{margin-top:34px;border:1px solid var(--ink);padding:12px 26px;font-size:14px;letter-spacing:.1em;transition:.2s}.outro button:hover{background:var(--ink);color:var(--wall)}
/* ruler */
#ruler{position:fixed;left:0;right:0;bottom:0;height:84px;z-index:30;background:var(--wall);border-top:1px solid var(--ink)}
#ruler .cur{position:absolute;left:48px;top:10px;font-family:var(--num);font-size:34px;font-weight:600;line-height:1;color:var(--ink);letter-spacing:-.02em}
#ruler .cur small{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--mute);display:block;margin-bottom:2px;font-weight:400}
#rl{position:absolute;left:0;right:0;top:0;bottom:0}
.tk{position:absolute;bottom:0;width:1px;background:var(--ink);opacity:.5}
.tk.y{height:8px}.tk.f{height:14px}.tk.t{height:24px;opacity:1}
.tl{position:absolute;bottom:28px;font-family:var(--mono);font-size:10.5px;color:var(--ink2);transform:translateX(-50%)}
.mk{position:absolute;bottom:6px;width:22px;height:34px;margin-left:-11px;display:flex;align-items:flex-end;justify-content:center}
.mk i{width:9px;height:9px;border-radius:50%;background:var(--wall);border:1.5px solid var(--ink);transition:.25s;margin-bottom:-1px}
.mk:hover i,.mk.on i{background:var(--red);border-color:var(--red);transform:scale(1.5)}
.mk span{position:absolute;bottom:42px;left:50%;transform:translate(-50%,4px);white-space:nowrap;background:var(--ink);color:var(--wall);font-size:12px;padding:3px 9px;opacity:0;pointer-events:none;transition:.2s}
.mk:hover span,.mk.on span{opacity:1;transform:translate(-50%,0)}
#ptr{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--red);pointer-events:none}
#ptr:before{content:"";position:absolute;top:-1px;left:-5px;border:6px solid transparent;border-top:8px solid var(--red);border-bottom:0}
/* detail */
#detail{position:fixed;inset:0;z-index:60;display:none;background:var(--paper)}
#detail.on{display:grid;grid-template-columns:1.05fr 1fr}
#detail .L{background:var(--c);position:relative;display:grid;place-items:center;overflow:hidden}
#detail .L svg{width:min(700px,88%);height:auto;max-height:70vh;margin-top:-6vh;overflow:visible}
#detail .L .bigyr{position:absolute;left:36px;bottom:10px;font-family:var(--num);font-size:260px;line-height:1;color:transparent;-webkit-text-stroke:1.2px rgba(27,26,23,.35);letter-spacing:-.05em}
#detail .R{padding:84px 80px 60px 70px;display:flex;flex-direction:column;overflow:auto}
#detail .R .no{font-family:var(--mono);font-size:12px;letter-spacing:.14em;color:var(--red)}
#detail .R h2{font-family:var(--serif);font-weight:900;font-size:56px;line-height:1.15;letter-spacing:-.03em;margin:14px 0 4px}
#detail .R .en{font-family:var(--num);font-style:italic;font-size:22px;color:var(--mute)}
#detail .R p.s{margin-top:26px;font-size:17px;line-height:2;color:var(--ink2);font-family:var(--serif);max-width:520px}
#detail dl{margin-top:30px;border-top:1px solid var(--ink);max-width:520px}
#detail dl div{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
#detail dt{color:var(--mute)}#detail dd{font-family:var(--mono);font-size:13px;color:var(--ink)}
#detail .nav{margin-top:auto;padding-top:30px;display:flex;align-items:center;gap:14px}
#detail .nav button{border:1px solid var(--ink);width:46px;height:46px;border-radius:50%;display:grid;place-items:center;transition:.2s}#detail .nav button:hover{background:var(--ink)}#detail .nav button:hover svg{stroke:var(--wall)}
#detail .nav svg{width:18px;height:18px;stroke:var(--ink);fill:none;stroke-width:1.6}
#detail .nav span{font-family:var(--mono);font-size:12px;color:var(--mute);margin-left:8px}
#detail .x{position:absolute;right:36px;top:30px;z-index:3;border:1px solid var(--ink);padding:7px 16px;font-size:12px;letter-spacing:.12em;font-family:var(--mono);background:var(--paper);transition:.2s}#detail .x:hover{background:var(--ink);color:var(--wall)}
.eg{position:fixed;left:48px;bottom:92px;font-size:11px;color:var(--mute);z-index:31}
@keyframes blink{50%{opacity:.25}}.bl{animation:blink 2.4s infinite}
@keyframes pulse{0%,100%{opacity:.15}50%{opacity:1}}.pu{animation:pulse 2.2s infinite}
</style></head><body>
<div class="top"><b>算力的六十年</b><div class="rt"><span class="hint"><span>向下滚动，展厅向右移动</span><i></i></span><span>1966 — 2026</span></div></div>
<div id="scroller"><div id="stage"><div id="track"></div></div></div>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const K="#1b1a17",RED="#e4452a",P="#fbf9f3";
const st=(f="none",w=2)=>`fill="${f}" stroke="${K}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"`;

const lights=(x,y,cols,rows,gap,seed)=>{let s="";for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){const hot=((r*7+c*3+seed)%5===0);s+=`<circle cx="${x+c*gap}" cy="${y+r*gap}" r="3.6" fill="${hot?RED:P}" stroke="${K}" stroke-width="1.4" ${hot?`class="bl" style="animation-delay:${((r*c+seed)%7)*.3}s"`:""}/>`}return s};
const gpu=(x,y,s,fans,tag)=>{const w=360*s,h=160*s;let f="";for(let i=0;i<fans;i++){const cx=x+w*(fans===1?.5:.28+.44*i),cy=y+h*.5,r=h*.3;f+=`<circle cx="${cx}" cy="${cy}" r="${r}" ${st("#d8d2c2",1.8)}/><circle cx="${cx}" cy="${cy}" r="${r*.78}" ${st("none",1)}/>`;for(let k=0;k<7;k++){const a=k*Math.PI*2/7;f+=`<path d="M${cx} ${cy}Q${cx+Math.cos(a+.5)*r*.8} ${cy+Math.sin(a+.5)*r*.8} ${cx+Math.cos(a+.9)*r*.7} ${cy+Math.sin(a+.9)*r*.7}" ${st("none",1.3)}/>`}f+=`<circle cx="${cx}" cy="${cy}" r="${r*.16}" fill="${RED}" stroke="${K}" stroke-width="1.4"/>`}
 let fin="";for(let i=0;i<16;i++)fin+=`<line x1="${x+w*.06+i*(w*.88/15)}" y1="${y+h*.12}" x2="${x+w*.06+i*(w*.88/15)}" y2="${y+h*.2}" ${st("none",1.2)}/>`;
 let gold="";for(let i=0;i<22;i++)gold+=`<rect x="${x+w*.2+i*(w*.52/22)}" y="${y+h+3}" width="${w*.52/22-2}" height="${14*s}" fill="#e4a52a" stroke="${K}" stroke-width="1"/>`;
 return `<rect x="${x-18*s}" y="${y-6}" width="${20*s}" height="${h+30*s}" ${st("#c9c2b0")}/><rect x="${x-14*s}" y="${y+h*.2}" width="${12*s}" height="${10*s}" ${st("#2a2823",1)}/><rect x="${x-14*s}" y="${y+h*.5}" width="${12*s}" height="${10*s}" ${st("#2a2823",1)}/>
 <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="8" ${st("#e9e4d6")}/>${fin}${f}${gold}<text x="${x+w-12*s}" y="${y+h-10*s}" font-family="IBM Plex Mono,monospace" font-size="${11*s}" text-anchor="end" fill="${K}">${tag}</text>`};
const ART=[
()=>`${floor(400)}${[0,1,2].map(i=>`<rect x="${26+i*92}" y="110" width="86" height="260" ${st("#e7e1d1")}/><rect x="${34+i*92}" y="120" width="70" height="86" ${st(P,1.6)}/>${lights(46+i*92,134,4,3,16,i*2+1)}<line x1="${26+i*92}" y1="222" x2="${112+i*92}" y2="222" ${st("none",1.6)}/>${[0,1,2,3,4].map(k=>`<line x1="${42+i*92}" y1="${244+k*14}" x2="${96+i*92}" y2="${244+k*14}" ${st("none",1.2)}/>`).join("")}<circle cx="${69+i*92}" cy="346" r="5" ${st(P,1.4)}/>`).join("")}
 <rect x="316" y="90" width="120" height="280" ${st("#dcd6c5")}/><circle cx="376" cy="160" r="38" ${st(P)}/><circle cx="376" cy="160" r="12" ${st(RED)}/>${[0,1,2].map(k=>`<line x1="376" y1="160" x2="${376+Math.cos(k*2.09)*36}" y2="${160+Math.sin(k*2.09)*36}" ${st("none",1.4)}/>`).join("")}<circle cx="376" cy="262" r="38" ${st(P)}/><circle cx="376" cy="262" r="12" ${st(RED)}/>${[0,1,2].map(k=>`<line x1="376" y1="262" x2="${376+Math.cos(k*2.09+.5)*36}" y2="${262+Math.sin(k*2.09+.5)*36}" ${st("none",1.4)}/>`).join("")}<path d="M338 198L338 224M414 198L414 224" ${st("none",1.6)}/><rect x="330" y="330" width="92" height="18" ${st(P,1.4)}/>`,
()=>`${floor(300)}<g transform="rotate(-6 230 230)">${Array.from({length:8},(_, i)=>`<rect x="${106+i*36}" y="140" width="16" height="30" ${st("#d6b24a",1.6)}/><rect x="${106+i*36}" y="296" width="16" height="30" ${st("#d6b24a",1.6)}/>`).join("")}<rect x="82" y="168" width="316" height="130" rx="6" ${st("#d9d2c0")}/><rect x="150" y="190" width="180" height="86" ${st("#2a2823")}/>${Array.from({length:7},(_, i)=>`<path d="M${160} ${200+i*11}H${200+((i*37)%70)}V${205+i*11}H${250+((i*53)%60)}" ${st("none",1)} stroke="${i%3?"#d6b24a":RED}"/>`).join("")}<rect x="160" y="206" width="30" height="30" ${st("none",1)} stroke="#d6b24a"/><text x="96" y="238" font-family="IBM Plex Mono,monospace" font-size="15" fill="${K}" transform="rotate(-90 96 238)" text-anchor="middle">4004</text><circle cx="364" cy="186" r="5" ${st(P,1.4)}/></g>
 <text x="230" y="62" text-anchor="middle" font-family="Cormorant Garamond,serif" font-style="italic" font-size="22" fill="${K}">2,300 个晶体管</text><path d="M120 76H340M120 70V82M340 70V82" ${st("none",1.2)}/>`,
()=>`${floor(380)}<rect x="70" y="326" width="320" height="46" rx="14" ${st(RED)}/><path d="M76 326H384" ${st("none",1.4)}/>${Array.from({length:9},(_, i)=>`<line x1="${100+i*32}" y1="332" x2="${100+i*32}" y2="366" ${st("none",1.2)}/>`).join("")}
 <path d="M110 326V130Q110 82 230 82Q350 82 350 130V326Z" ${st("#e7e1d1")}/><path d="M110 130Q110 100 230 100Q350 100 350 130" ${st("none",1.6)}/>${Array.from({length:7},(_, i)=>`<line x1="${146+i*28}" y1="104" x2="${146+i*28}" y2="326" ${st("none",1.4)}/>`).join("")}<rect x="110" y="120" width="240" height="26" ${st("#2a2823")}/>${Array.from({length:12},(_, i)=>`<circle cx="${126+i*19}" cy="133" r="3.4" fill="${i%4===1?RED:P}"/>`).join("")}<rect x="150" y="212" width="160" height="46" ${st(P,1.6)}/><text x="230" y="242" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="15" fill="${K}">160 MFLOPS</text>`,
()=>`${floor(400)}<rect x="96" y="40" width="268" height="196" rx="18" ${st("#e6dfcc")}/><rect x="120" y="62" width="220" height="150" rx="26" ${st("#2a2823")}/><g font-family="IBM Plex Mono,monospace" font-size="15" fill="#9be3b0"><text x="138" y="96">C:\\&gt; DIR</text><text x="138" y="120">COMMAND  COM</text><text x="138" y="144">AUTOEXEC BAT</text><text x="138" y="172">C:\\&gt;</text></g><rect x="182" y="160" width="10" height="16" fill="#9be3b0" class="bl"/>
 <rect x="70" y="248" width="320" height="64" ${st("#e6dfcc")}/><rect x="238" y="270" width="110" height="8" ${st("#2a2823",1.4)}/><rect x="238" y="288" width="110" height="8" ${st("#2a2823",1.4)}/><circle cx="102" cy="280" r="6" ${st(RED,1.6)}/><circle cx="124" cy="280" r="6" ${st(P,1.4)}/><path d="M60 330H400L430 376H30Z" ${st("#e6dfcc")}/>${Array.from({length:3},(_, r)=>Array.from({length:12},(_, c)=>`<rect x="${64+c*28-r*6+ (r*8)}" y="${338+r*12}" width="20" height="8" ${st(P,1)}/>`).join("")).join("")}`,
()=>`${floor(400)}${gpu(80,170,.9,1,"256-bit")}<text x="230" y="84" text-anchor="middle" font-family="Cormorant Garamond,serif" font-style="italic" font-size="24" fill="${K}">首款称为「GPU」的显卡</text><path d="M150 100H310M150 94V106M310 94V106" ${st("none",1.2)}/><text x="230" y="130" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="12" fill="${K}">2,300 万晶体管</text>`,
()=>`${floor(420)}${gpu(60,120,1.0,2,"3 GB")}${gpu(60,262,1.0,2,"3 GB")}<path d="M410 190V320" ${st("none",3)} stroke="${RED}"/><text x="230" y="70" text-anchor="middle" font-family="Cormorant Garamond,serif" font-style="italic" font-size="24" fill="${K}">两块显卡，一间卧室</text>`,
()=>{let cells="",pins="";for(let r=0;r<6;r++)for(let c=0;c<6;c++){const d=(r+c)%6;cells+=`<rect x="${150+c*26}" y="${130+r*26}" width="22" height="22" rx="3" fill="${d===2?RED:P}" stroke="${K}" stroke-width="1.4" class="pu" style="animation-delay:${(r+c)*.18}s"/>`}
 for(let i=0;i<12;i++){pins+=`<line x1="${112+i*20.5}" y1="86" x2="${112+i*20.5}" y2="102" ${st("none",1.6)}/><line x1="${112+i*20.5}" y1="338" x2="${112+i*20.5}" y2="354" ${st("none",1.6)}/><line x1="106" y1="${112+i*20.5}" x2="90" y2="${112+i*20.5}" ${st("none",1.6)}/><line x1="354" y1="${112+i*20.5}" x2="370" y2="${112+i*20.5}" ${st("none",1.6)}/>`}
 return `${floor(300)}${pins}<rect x="106" y="102" width="248" height="236" rx="10" ${st("#d9d2c0")}/><rect x="136" y="116" width="188" height="208" ${st("#2a2823",1.6)}/>${cells}<path d="M146 300H314" ${st("none",1)} stroke="#d6b24a"/><text x="230" y="318" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="11" fill="#d6b24a">MATMUL · 6×6</text>`},
()=>{let r="";for(let i=0;i<7;i++){const x=42+i*58;r+=`<rect x="${x}" y="90" width="50" height="280" ${st("#e0dacb")}/>`;for(let k=0;k<12;k++)r+=`<rect x="${x+6}" y="${100+k*22}" width="38" height="16" ${st(P,1.2)}/><circle cx="${x+13}" cy="${108+k*22}" r="2.6" fill="${(i*5+k*3)%7===0?RED:"#5fa883"}" class="bl" style="animation-delay:${((i+k)%9)*.25}s"/>`}return `${floor(420)}${r}<path d="M30 370H430" ${st("none",2)}/><text x="230" y="62" text-anchor="middle" font-family="Cormorant Garamond,serif" font-style="italic" font-size="24" fill="${K}">一万张卡，同时在算</text>`}
];
const EX=[
{y:1966,t:"晶体管大型机",en:"Transistor Mainframe",c:"#e7e2d4",m:"整机占一间机房",s:"银行和航天机构按「小时」租用算力，程序用穿孔卡提交，排队等结果是常态。一台机器服务一整栋楼，管理它的人比使用它的人还多。",sp:[["运算速度","约 50 万次 / 秒"],["内存","最大 1 MB"],["占地","整间机房"],["使用方式","穿孔卡 · 批处理"]]},
{y:1971,t:"四位微处理器",en:"The First Microprocessor",c:"#dde4dc",m:"指甲盖大小的硅片",s:"第一次把一台计算机的中央处理器放进一颗芯片。最初是为计算器设计的，没有人想到它会成为之后所有设备的起点。",sp:[["晶体管","2,300 个"],["主频","740 kHz"],["字长","4 位"],["封装","16 针陶瓷"]]},
{y:1976,t:"向量超级计算机",en:"Vector Supercomputer",c:"#ecdfd3",m:"圆柱形机柜，一圈长椅",s:"为了缩短导线，机柜做成一个 C 形圆柱，外圈的长椅下面藏着电源。它每秒能做上亿次浮点运算，一台机器的造价相当于一栋楼。",sp:[["峰值性能","160 MFLOPS"],["冷却","液氟循环"],["重量","约 5 吨"],["用户","气象、核研究"]]},
{y:1985,t:"个人计算机",en:"Personal Computer",c:"#dfe3e9",m:"桌面上的整套系统",s:"算力第一次属于个人。软盘、命令行和一块黑底绿字的屏幕，让一个人在自己的桌子上完成过去要去机房排队的事。",sp:[["内存","640 KB"],["存储","1.2 MB 软盘"],["显示","文本 80×25"],["使用方式","命令行"]]},
{y:1999,t:"图形处理器",en:"The First GPU",c:"#eadfdf",m:"一块插在主板上的卡",s:"最初为游戏而生，专门并行地处理大量简单的像素运算。没有人想到，十几年后同一种结构会被拿去训练神经网络。",sp:[["晶体管","2,300 万"],["显存","32 MB"],["接口","AGP 4×"],["定位","游戏与图形"]]},
{y:2012,t:"双显卡工作站",en:"Two Cards in a Bedroom",c:"#e3e0ec",m:"两块消费级显卡",s:"一个研究小组用两块显卡训练出卷积神经网络，在图像识别比赛中把错误率压低了十多个百分点。此后，深度学习的算力单位变成了「卡」。",sp:[["显卡","2 × 3 GB"],["训练时长","约 5～6 天"],["识别错误率","15.3%"],["第二名","26.2%"]]},
{y:2017,t:"张量加速器",en:"Tensor Accelerator",c:"#e7e9d4",m:"矩阵乘法专用芯片",s:"Transformer 结构发表的同一年，专为矩阵乘法设计的加速器进入数据中心。脉动阵列让数据在运算单元之间流动，而不必每次回到内存。",sp:[["核心结构","脉动阵列"],["擅长","矩阵乘法"],["精度","半精度浮点"],["部署","数据中心"]]},
{y:2022,t:"万卡集群",en:"The 10,000-GPU Cluster",c:"#d9e4e3",m:"一排排机柜",s:"训练一个大模型，要让上万张加速卡在几周内保持同步。互联、供电、散热、故障恢复，都成了和算法同等重要的工程。",sp:[["规模","超过 10,000 张卡"],["训练周期","数周"],["互联","高速光网络"],["难点","故障恢复"]]}
];
const SAY=[
 {after:1,t:"每一次跃迁，都是把同样的计算，做得<em>更便宜、更密。</em>",n:"1966 — 1976"},
 {after:4,t:"算力不再只属于机房，它走到了<em>每个人的桌面。</em>",n:"1985 — 1999"},
 {after:6,t:"这一次，算力按<em>「卡」</em>来数。",n:"2012 — 2022"}
];
/* 构建 */
let h=`<section class="p intro"><div class="tag">线上展览 · 共 ${EX.length} 件展品</div><h1>算力的<br>六十<em>年</em></h1><div class="sub"><div><b>1966</b>第一件展品</div><div><b>${EX.length}</b>件展品</div><div><b>2026</b>现在</div></div></section>`;
EX.forEach((e,i)=>{h+=`<article class="p ex" data-i="${i}" style="--c:${e.c}"><div class="yr">${e.y}</div><div class="frame" data-i="${i}"><span class="cn">№ ${String(i+1).padStart(2,"0")}</span><svg class="art" viewBox="0 0 460 420" xmlns="http://www.w3.org/2000/svg">${ART[i]()}</svg><span class="zm"><svg viewBox="0 0 16 16"><path d="M10 2h4v4M6 14H2v-4M14 2L9 7M2 14l5-5"/></svg></span></div>
 <div class="label"><div class="no"><span>展品 ${String(i+1).padStart(2,"0")} / ${String(EX.length).padStart(2,"0")}</span><span>${e.y}</span></div><h3>${e.t}</h3><div class="m">${e.m}</div><div class="go"><span>查看详情</span><span>→</span></div></div></article>`;
 SAY.filter(s=>s.after===i).forEach(s=>{h+=`<section class="p say"><p>${s.t}</p><small>${s.n}</small></section>`})});
h+=`<section class="p outro"><div><h2>现在，<br>轮到<em>管理</em>它们。</h2><p>今天的机房里，有成千上万张卡同时在运行。谁在用、用了多少、哪里空着，是下一件要被认真做好的事。</p><button id="back">回到入口 ↺</button></div></section>`;
$("#track").innerHTML=h;
/* 尺寸与滚动 */
let vw,vh,TW,range,items=[],cur=0,tgt=0,mx=0,my=0,hov=null;
function measure(){vw=innerWidth;vh=innerHeight;TW=$("#track").scrollWidth;range=TW-vw;$("#scroller").style.height=(range+vh)+"px";
 items=$$(".ex").map(e=>({el:e,cx:e.offsetLeft+e.offsetWidth/2,y:EX[+e.dataset.i].y,yr:e.querySelector(".yr"),art:e.querySelector(".art"),frame:e.querySelector(".frame")}));drawRuler()}
const Y0=1960,Y1=2030,rx=y=>170+(y-Y0)/(Y1-Y0)*(vw-170-56);
function drawRuler(){let r="";for(let y=Y0;y<=Y1;y++){const c=y%10===0?"t":y%5===0?"f":"y";r+=`<i class="tk ${c}" style="left:${rx(y)}px"></i>`;if(y%10===0)r+=`<span class="tl" style="left:${rx(y)}px">${y}</span>`}
 EX.forEach((e,i)=>{r+=`<button class="mk" data-i="${i}" style="left:${rx(e.y)}px" aria-label="${e.y} ${e.t}"><span>${e.y} · ${e.t}</span><i></i></button>`});$("#rl").innerHTML=r;
 $$(".mk").forEach(b=>b.onclick=()=>jump(+b.dataset.i))}
function jump(i){const it=items[i];const t=Math.max(0,Math.min(range,it.cx-vw/2));scrollTo({top:t,behavior:"smooth"})}
function yearAt(x){const pts=[[0,Y0],...items.map(i=>[i.cx,i.y]),[TW,Y1]];for(let k=0;k<pts.length-1;k++){if(x<=pts[k+1][0]){const a=pts[k],b=pts[k+1];return a[1]+(b[1]-a[1])*Math.max(0,(x-a[0])/(b[0]-a[0]))}}return Y1}
function frame(){
 tgt=scrollY;cur+=(tgt-cur)*.12;if(Math.abs(tgt-cur)<.1)cur=tgt;
 $("#track").style.transform=`translate3d(${-cur}px,0,0)`;
 const cx=cur+vw/2,yr=yearAt(cx);$("#cy").textContent=Math.round(yr);$("#ptr").style.left=rx(yr)+"px";
 let near=0,nd=1e9;
 items.forEach((it,i)=>{const d=it.cx-cx;if(Math.abs(d)<nd){nd=Math.abs(d);near=i}
  const k=d/vw; it.yr.style.transform=`translateX(${-k*140}px)`;
  const hx=hov===i?(mx-.5)*-22:0,hy=hov===i?(my-.5)*-16:0;it.art.style.transform=`translate(${hx+k*-34}px,${hy}px)`});
 $$(".mk").forEach((b,i)=>b.classList.toggle("on",i===near&&nd<vw*.34));
 requestAnimationFrame(frame)}
$$(".ex").forEach(e=>{const i=+e.dataset.i,f=e.querySelector(".frame");
 f.addEventListener("mousemove",ev=>{const r=f.getBoundingClientRect();mx=(ev.clientX-r.left)/r.width;my=(ev.clientY-r.top)/r.height;hov=i});
 f.addEventListener("mouseleave",()=>{hov=null});f.onclick=()=>openD(i)});
/* 详情 */
let di=0;
function openD(i){di=i;const e=EX[i],d=$("#detail");$("#dl").style.setProperty("--c",e.c);
 $("#dl").innerHTML=`<div class="bigyr">${e.y}</div><svg viewBox="0 0 460 420" xmlns="http://www.w3.org/2000/svg">${ART[i]()}</svg>`;
 $("#dr").innerHTML=`<div class="no">展品 ${String(i+1).padStart(2,"0")} / ${String(EX.length).padStart(2,"0")} · ${e.y} 年</div><h2>${e.t}</h2><div class="en">${e.en}</div><p class="s">${e.s}</p><dl>${e.sp.map(x=>`<div><dt>${x[0]}</dt><dd>${x[1]}</dd></div>`).join("")}</dl><div class="nav"><button id="dp" aria-label="上一件"><svg viewBox="0 0 18 18"><path d="M11 3L5 9l6 6"/></svg></button><button id="dn" aria-label="下一件"><svg viewBox="0 0 18 18"><path d="M7 3l6 6-6 6"/></svg></button><span>← → 切换　Esc 关闭</span></div>`;
 document.documentElement.style.overflow="hidden";d.classList.add("on");d.animate([{clipPath:"inset(0 0 100% 0)"},{clipPath:"inset(0)"}],{duration:560,easing:"cubic-bezier(.7,0,.2,1)"});
 $("#dl svg").animate([{transform:"scale(.85) translateY(30px)",opacity:0},{transform:"none",opacity:1}],{duration:700,delay:200,easing:"cubic-bezier(.2,.9,.2,1)",fill:"backwards"});
 $$("#dr > *").forEach((n,k)=>n.animate([{opacity:0,transform:"translateY(16px)"},{opacity:1,transform:"none"}],{duration:520,delay:260+k*70,easing:"ease-out",fill:"backwards"}));
 $("#dp").onclick=()=>openD((di+EX.length-1)%EX.length);$("#dn").onclick=()=>openD((di+1)%EX.length)}
function closeD(){const d=$("#detail");if(!d.classList.contains("on"))return;d.animate([{clipPath:"inset(0)"},{clipPath:"inset(0 0 100% 0)"}],{duration:420,easing:"cubic-bezier(.7,0,.2,1)"}).onfinish=()=>{d.classList.remove("on");document.documentElement.style.overflow=""};jump(di)}
$("#dx").onclick=closeD;
addEventListener("keydown",e=>{const open=$("#detail").classList.contains("on");
 if(e.key==="Escape")closeD();
 else if(open&&e.key==="ArrowRight")openD((di+1)%EX.length);else if(open&&e.key==="ArrowLeft")openD((di+EX.length-1)%EX.length);
 else if(!open&&(e.key==="ArrowRight"||e.key==="ArrowLeft")){let c=0,nd=1e9;items.forEach((it,i)=>{const d=Math.abs(it.cx-(cur+vw/2));if(d<nd){nd=d;c=i}});const n=Math.max(0,Math.min(EX.length-1,c+(e.key==="ArrowRight"?(nd<60?1:0):(nd<60?-1:0))));jump(n)}});
$("#back").onclick=()=>scrollTo({top:0,behavior:"smooth"});
$("#detail").addEventListener("wheel",e=>e.stopPropagation());
document.fonts&&document.fonts.ready.then(measure);
addEventListener("resize",measure);measure();requestAnimationFrame(frame);
</script></body></html>
