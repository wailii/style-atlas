<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>线稿</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-screen-webfont@1.7.0/lxgwwenkaigbscreen.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root { --paper: #faf8f2; --ink: #1e1d1a; --pencil: #7b776d; --faint: #b9b4a8; --hl: #ffe04a; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: var(--paper); }
  body { font-family: "LXGW WenKai Screen", "Kaiti SC", "STKaiti", serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  .app { position: relative; height: 100vh; display: flex; flex-direction: column; background-color: var(--paper); }
  .app::after { content: ""; position: absolute; inset: 0; pointer-events: none; background-image: var(--grain); opacity: 0.9; mix-blend-mode: multiply; }

  .sb { height: 40px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 6px 26px 0; font-family: Caveat, cursive; font-size: 19px; font-weight: 700; }
  .sb svg { width: 52px; height: 18px; overflow: visible; }

  .top { flex: none; display: flex; align-items: flex-start; justify-content: space-between; padding: 6px 20px 8px; }
  .brand { position: relative; }
  .brand h1 { font-size: 34px; font-weight: 400; letter-spacing: 1px; line-height: 1.1; }
  .brand .u { position: absolute; left: -4px; top: 34px; width: 132px; height: 16px; overflow: visible; }
  .brand .d { margin-top: 12px; font-size: 13px; color: var(--pencil); }
  .listen { position: relative; width: 112px; height: 42px; margin-top: 4px; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 16px; }
  .listen > svg.pill { position: absolute; inset: -2px; width: calc(100% + 4px); height: calc(100% + 4px); overflow: visible; }
  .listen .ic { width: 22px; height: 22px; overflow: visible; position: relative; }
  .listen span { position: relative; }
  .listen .wave { width: 0; height: 18px; overflow: visible; transition: width .3s; position: relative; }
  .listen.on .wave { width: 26px; }

  .scroll { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 4px 16px 24px; scrollbar-width: none; }
  .scroll::-webkit-scrollbar { display: none; }

  .hero { position: relative; padding: 14px 14px 16px; margin: 6px 2px 10px; }
  .hero > svg.frame { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
  .pic { position: relative; height: 188px; margin-bottom: 14px; }
  .pic canvas { width: 100%; height: 100%; display: block; -webkit-mask-image: linear-gradient(100deg, #000 46%, transparent 54%); mask-image: linear-gradient(100deg, #000 46%, transparent 54%); -webkit-mask-size: 240% 100%; mask-size: 240% 100%; -webkit-mask-position: 100% 0; mask-position: 100% 0; transition: -webkit-mask-position 1.6s cubic-bezier(.45,.05,.35,1), mask-position 1.6s cubic-bezier(.45,.05,.35,1); }
  .pic canvas.in { -webkit-mask-position: 0 0; mask-position: 0 0; }
  .pic .cap { position: absolute; right: 0; bottom: -2px; font-family: Caveat, cursive; font-size: 15px; color: var(--pencil); transform: rotate(-3deg); opacity: 0; transition: opacity .6s 1.4s; }
  .pic.on .cap { opacity: 1; }
  .no { position: absolute; left: 4px; top: 154px; width: 64px; height: 64px; display: grid; place-items: center; background: var(--paper); border-radius: 50%; }
  .no svg { position: absolute; inset: -6px; width: 76px; height: 76px; overflow: visible; }
  .no b { font-family: Caveat, cursive; font-size: 34px; font-weight: 700; position: relative; top: 2px; }
  .hero h2 { font-size: 23px; font-weight: 400; line-height: 1.42; margin: 0 0 8px 2px; padding-left: 64px; min-height: 64px; }
  .hl { position: relative; white-space: nowrap; }
  .hl > svg { position: absolute; left: -6px; top: 4px; height: calc(100% - 4px); width: calc(100% + 12px); overflow: visible; z-index: -1; }
  .hero h2, .hero p, .hero .meta { position: relative; z-index: 1; }
  .hero p { font-size: 14.5px; line-height: 1.65; color: #4a473f; }
  .meta { display: flex; align-items: center; gap: 10px; margin-top: 12px; font-size: 13px; color: var(--pencil); }
  .meta svg { width: 92px; height: 26px; overflow: visible; }

  .fade { opacity: 0; transform: translateY(6px); transition: opacity .7s, transform .7s cubic-bezier(.2,.7,.2,1); }
  .fade.in { opacity: 1; transform: none; }

  ol { list-style: none; }
  .it { position: relative; display: grid; grid-template-columns: 38px 1fr 76px; gap: 10px; align-items: start; padding: 16px 4px 18px; cursor: pointer; }
  .it .rk { position: relative; font-family: Caveat, cursive; font-weight: 700; font-size: 27px; line-height: 1; padding-top: 2px; text-align: center; }
  .it .rk svg { position: absolute; left: -9px; top: -10px; width: 56px; height: 50px; overflow: visible; }
  .it h3 { font-size: 17.5px; font-weight: 400; line-height: 1.45; }
  .it p { margin-top: 5px; font-size: 13px; line-height: 1.5; color: var(--pencil); display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
  .it .more { max-height: 0; overflow: hidden; transition: max-height .6s cubic-bezier(.2,.7,.2,1); font-size: 14px; line-height: 1.65; color: #4a473f; }
  .it.open .more { max-height: 220px; }
  .it .more div { padding-top: 8px; }
  .it .th { position: relative; width: 76px; height: 64px; }
  .it .th canvas, .it .th svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .it .th canvas { -webkit-mask-image: linear-gradient(100deg, #000 46%, transparent 54%); mask-image: linear-gradient(100deg, #000 46%, transparent 54%); -webkit-mask-size: 240% 100%; mask-size: 240% 100%; -webkit-mask-position: 100% 0; mask-position: 100% 0; transition: -webkit-mask-position 1.1s ease, mask-position 1.1s ease; }
  .it .th canvas.in { -webkit-mask-position: 0 0; mask-position: 0 0; }
  .it > svg.sep { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 10px; overflow: visible; }

  .tabs { flex: none; position: relative; display: grid; grid-template-columns: repeat(5, 1fr); padding: 8px 8px 22px; }
  .tabs > svg.line { position: absolute; left: 10px; right: 10px; top: 0; width: calc(100% - 20px); height: 8px; overflow: visible; }
  .tab { position: relative; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0 0; font-size: 12.5px; color: var(--pencil); }
  .tab.on { color: var(--ink); }
  .tab svg.ic { width: 26px; height: 26px; overflow: visible; }
  .tab svg.ring { position: absolute; left: 50%; top: -1px; width: 64px; height: 56px; margin-left: -32px; overflow: visible; pointer-events: none; }

  /* 线条抖动：每 140ms 换一版手绘线，像逐帧手绘动画 */
  .rs:not(.live) .v1, .rs:not(.live) .v2 { display: none; }
  [data-f="0"] .rs.live .v1, [data-f="0"] .rs.live .v2,
  [data-f="1"] .rs.live .v0, [data-f="1"] .rs.live .v2,
  [data-f="2"] .rs.live .v0, [data-f="2"] .rs.live .v1 { display: none; }
  [data-f="0"] .boil { filter: url(#b0); }
  [data-f="1"] .boil { filter: url(#b1); }
  [data-f="2"] .boil { filter: url(#b2); }
</style>
</head>
<body data-f="0">
<svg width="0" height="0" style="position:absolute">
  <filter id="b0"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="2"/><feDisplacementMap in="SourceGraphic" scale="2.2"/></filter>
  <filter id="b1"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="2.2"/></filter>
  <filter id="b2"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="13"/><feDisplacementMap in="SourceGraphic" scale="2.2"/></filter>
</svg>
<div class="app" id="app"></div>
<script src="vendor/rough.js"></script>
<script src="data.js"></script>
<script src="common.js"></script>
<script src="engines.js"></script>
<script>
const { sketchy } = Engines;
const NS = "http://www.w3.org/2000/svg";
const INK = "#1e1d1a", PENCIL = "#7b776d";
const app = document.getElementById("app");
app.style.setProperty("--grain", `url(${grainURL(180, 0.07, 60)})`);

const [h1, ...rest] = HOT;
const markKey = (h) => {
  const k = KEY[h.rank], t = esc(shortTitle(h));
  return k && h.title.includes(k) ? t.replace(esc(k), `<span class="hl"><svg></svg>${esc(k)}</span>`) : t;
};

app.innerHTML = `
  <div class="sb"><span>${nowHM()}</span><svg id="sbic"></svg></div>
  <header class="top">
    <div class="brand"><h1 class="fade">AI 热点</h1><svg class="u"></svg><div class="d fade">10 月 22 日 · 周四 · 实时</div></div>
    <button class="listen" id="listen"><svg class="pill"></svg><svg class="ic" viewBox="0 0 24 24"></svg><span class="fade">听热点</span><svg class="wave" viewBox="0 0 26 18"></svg></button>
  </header>
  <main class="scroll">
    <section class="hero">
      <svg class="frame"></svg>
      <div class="pic"><canvas class="boil"></canvas><span class="cap">图 / claude.com</span></div>
      <div class="no"><svg></svg><b>01</b></div>
      <h2 class="fade">${markKey(h1)}</h2>
      <p class="fade">${esc(clip(firstLine(h1.summary), 62))}</p>
      <div class="meta fade"><span>${h1.sources} 家在说</span><svg class="spark"></svg><span>热度 ${heatText(h1)}</span></div>
    </section>
    <ol>${rest.map((h) => `
      <li class="it" data-r="${h.rank}">
        <div class="rk"><svg></svg>${pad2(h.rank)}</div>
        <div class="tx fade"><h3>${markKey(h)}</h3><p>${esc(h.latest)}</p><div class="more"><div>${esc(clip(firstLine(h.summary), 96))}</div></div></div>
        <div class="th">${h.cover ? `<canvas class="boil"></canvas>` : `<svg viewBox="0 0 64 64"></svg>`}</div>
        <svg class="sep"></svg>
      </li>`).join("")}
    </ol>
  </main>
  <nav class="tabs"><svg class="line"></svg>${["精选", "热点", "日报", "模型", "重置"].map((n, i) => `<button class="tab ${i ? "" : "on"}" data-i="${i}"><svg class="ic" viewBox="0 0 24 24"></svg><span>${n}</span></button>`).join("")}</nav>`;

(async () => {
await Promise.race([document.fonts.ready, new Promise((r) => setTimeout(r, 1500))]);

// ── 手绘线：每个形状画三版，入场时第一版一笔笔画出来，之后三版轮换 ──
const box = (el) => { const r = el.getBoundingClientRect(); return [r.width, r.height]; };
const opt = (seed, o = {}) => ({ seed, stroke: INK, strokeWidth: 1.5, roughness: 1.1, bowing: 1.2, ...o });
const later = (ms, fn) => setTimeout(fn, ms);
const show = (el, ms) => later(ms, () => el.classList.add("in"));

// 状态栏
sketchy(document.getElementById("sbic"), (rc, s) => {
  const g = document.createElementNS(NS, "g");
  [[0, 10, 3, 5], [5, 7, 3, 8], [10, 4, 3, 11]].forEach(([x, y, w, h]) => g.appendChild(rc.rectangle(x, y, w, h, opt(s, { strokeWidth: 1.2, roughness: 0.6 }))));
  g.appendChild(rc.rectangle(22, 3, 24, 12, opt(s, { strokeWidth: 1.2, roughness: 0.7 })));
  g.appendChild(rc.rectangle(25, 6, 14, 6, opt(s, { fill: INK, fillStyle: "zigzag", hachureGap: 2, strokeWidth: 0.8, roughness: 0.6 })));
  return g;
}, { delay: 200, dur: 500 });

// 标题下划线、听热点
const title = app.querySelector(".brand h1");
show(title, 60); show(app.querySelector(".brand .d"), 500);
sketchy(app.querySelector(".brand .u"), (rc, s) => rc.curve([[2, 6], [40, 3], [90, 7], [130, 4]], opt(s, { strokeWidth: 2.2, roughness: 1.4 })), { delay: 350, dur: 600 });
const listen = document.getElementById("listen");
const pill = listen.querySelector(".pill");
later(30, () => {
  const [w, h] = box(pill);
  sketchy(pill, (rc, s) => rc.path(`M${h / 2} 2 H${w - h / 2} A${h / 2 - 2} ${h / 2 - 2} 0 0 1 ${w - h / 2} ${h - 2} H${h / 2} A${h / 2 - 2} ${h / 2 - 2} 0 0 1 ${h / 2} 2 Z`, opt(s, { roughness: 1.3 })), { delay: 400, dur: 800 });
});
sketchy(listen.querySelector(".ic"), (rc, s) => rc.path("M4 15 V12 A8 8 0 0 1 20 12 V15 M3 14 H7 V21 H3 Z M17 14 H21 V21 H17 Z", opt(s, { strokeWidth: 1.4, roughness: 0.7 })), { delay: 700, dur: 700 });
show(listen.querySelector("span"), 900);
listen.addEventListener("click", () => {
  const on = listen.classList.toggle("on");
  listen.querySelector("span").textContent = on ? "在听 01" : "听热点";
  const wv = listen.querySelector(".wave"); wv.innerHTML = "";
  if (on) sketchy(wv, (rc, s) => rc.path("M1 9 Q4 1 7 9 T13 9 T19 9 T25 9", opt(s, { strokeWidth: 1.6, roughness: 1.6 })), { dur: 400 });
});

// 头条：边框、真封面描成线稿、圈出 01、荧光笔划重点、热度曲线
const hero = app.querySelector(".hero");
later(30, () => {
  const [w, h] = box(hero);
  sketchy(hero.querySelector(".frame"), (rc, s) => rc.rectangle(2, 2, w - 4, h - 4, opt(s, { roughness: 1.6, bowing: 2 })), { delay: 500, dur: 1000 });
});
loadImage(h1.cover).then((img) => {
  const cv = hero.querySelector(".pic canvas"), [w, h] = box(cv);
  const sk = sketchCanvas(img, Math.round(w * 2), Math.round(h * 2), { ink: INK, gain: 3.4 });
  cv.width = sk.width; cv.height = sk.height; cv.getContext("2d").drawImage(sk, 0, 0);
  show(cv, 900); later(900, () => hero.querySelector(".pic").classList.add("on"));
});
sketchy(hero.querySelector(".no svg"), (rc, s) => rc.ellipse(38, 38, 66, 60, opt(s, { strokeWidth: 2, roughness: 1.6 })), { delay: 1600, dur: 700 });
hero.querySelectorAll(".fade").forEach((el, i) => show(el, 1500 + i * 220));
function highlight(span, delay) {
  const svg = span.querySelector("svg"), [w, h] = box(span);
  svg.setAttribute("viewBox", `0 0 ${w + 12} ${h}`);
  sketchy(svg, (rc, s) => rc.rectangle(2, h * 0.38, w + 8, h * 0.5, { seed: s, stroke: "none", fill: "#ffe04a", fillStyle: "hachure", hachureAngle: -12, hachureGap: 2.2, fillWeight: 3.4, roughness: 1.8 }), { delay, dur: 600 });
}
later(60, () => highlight(hero.querySelector(".hl"), 2200));
sketchy(hero.querySelector(".spark"), (rc, s) => rc.linearPath(sparkPts(h1, 92, 26, 3), opt(s, { strokeWidth: 1.4, roughness: 0.8 })), { delay: 2300, dur: 900 });

// 列表：分隔线、缩略图（有封面就描，没封面就按内容画一个小图）
const items = [...app.querySelectorAll(".it")];
items.forEach((li, i) => {
  const h = rest[i], t0 = 2000 + i * 200;
  show(li.querySelector(".tx"), t0);
  later(30, () => {
    const [w] = box(li);
    sketchy(li.querySelector(".sep"), (rc, s) => rc.line(4, 6, w - 4, 6, opt(s, { stroke: PENCIL, strokeWidth: 1, roughness: 1.6, bowing: 3 })), { delay: t0, dur: 600 });
  });
  const th = li.querySelector(".th");
  if (h.cover) {
    loadImage(h.cover).then((img) => {
      const cv = th.querySelector("canvas"), sk = sketchCanvas(img, 152, 128, { ink: INK, gain: 2.2, hatch: false, soft: 2.5 });
      cv.width = 152; cv.height = 128; cv.getContext("2d").drawImage(sk, 0, 0);
      show(cv, t0 + 150);
    });
    later(30, () => {
      const svg = document.createElementNS(NS, "svg"); th.appendChild(svg);
      sketchy(svg, (rc, s) => rc.rectangle(1, 1, 74, 62, opt(s, { strokeWidth: 1.1, roughness: 1.2 })), { delay: t0 + 100, dur: 600 });
    });
  } else {
    sketchy(th.querySelector("svg"), (rc, s) => rc.path(DOODLE[h.rank], opt(s, { strokeWidth: 1.6, roughness: 0.9 })), { delay: t0 + 100, dur: 900 });
  }
  li.addEventListener("click", () => {
    const open = li.classList.toggle("open"), rk = li.querySelector(".rk svg");
    rk.innerHTML = "";
    if (open) sketchy(rk, (rc, s) => rc.ellipse(28, 24, 50, 42, opt(s, { strokeWidth: 1.8, roughness: 1.7 })), { dur: 450 });
    const hl = li.querySelector(".hl");
    if (hl) { hl.querySelector("svg").innerHTML = ""; if (open) highlight(hl, 250); }
  });
});

// 底栏：手绘图标，当前页画个圈
const ICONS = [
  "M4 6 H20 M4 12 H20 M4 18 H14",
  "M12 3 C16 8 19 11 19 15 C19 19 16 21 12 21 C8 21 5 19 5 15 C5 11 9 10 9 6 C11 8 11 9 12 3 Z",
  "M6 3 H15 L19 7 V21 H6 Z M9 11 H16 M9 15 H16",
  "M5 20 V13 M10 20 V6 M15 20 V10 M20 20 V15",
  "M5 12 A7 7 0 1 0 8 6.5 M4 4 L8 6.5 L5.5 10 M12 8 V12 L15 14",
];
const tabs = [...app.querySelectorAll(".tab")];
later(30, () => {
  const [w] = box(app.querySelector(".tabs .line"));
  sketchy(app.querySelector(".tabs .line"), (rc, s) => rc.line(0, 4, w, 4, opt(s, { stroke: PENCIL, strokeWidth: 1, roughness: 1.4, bowing: 2 })), { delay: 600, dur: 700 });
});
tabs.forEach((t, i) => sketchy(t.querySelector(".ic"), (rc, s) => rc.path(ICONS[i], opt(s, { strokeWidth: 1.5, roughness: 0.8 })), { delay: 700 + i * 120, dur: 600 }));
function ring(t, delay = 0) {
  app.querySelectorAll(".tab .ring").forEach((r) => r.remove());
  const svg = document.createElementNS(NS, "svg"); svg.classList.add("ring"); t.prepend(svg);
  sketchy(svg, (rc, s) => rc.ellipse(32, 28, 58, 50, opt(s, { strokeWidth: 1.6, roughness: 1.8 })), { delay, dur: 500 });
}
ring(tabs[0], 1500);
tabs.forEach((t) => t.addEventListener("click", () => { tabs.forEach((x) => x.classList.toggle("on", x === t)); ring(t); }));

// 8 帧/秒左右的线条抖动
let f = 0;
setInterval(() => { f = (f + 1) % 3; document.body.dataset.f = f; }, 140);
})();
</script>
</body>
</html>
