<!doctype html>
<html lang="zh-CN">

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>地图调度 · 全国算力运营</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>

  @keyframes blink { 50% { opacity: .3; } }
  #head p { font-size: 11.5px; color: var(--mute); margin-top: 2px; }
  .kp { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
  .kp small { display: block; font-size: 10.5px; color: var(--mute); }
  .kp b { font-size: 19px; font-weight: 600; letter-spacing: -.02em; }
  .kp b em { font-style: normal; font-size: 11px; color: var(--mute); margin-left: 1px; }
  #layers { left: 20px; top: 178px; width: 170px; padding: 8px; }
  #layers h4 { font-size: 10.5px; color: var(--mute); font-weight: 600; letter-spacing: .08em; padding: 5px 8px 4px; }
  .lay { display: flex; align-items: center; gap: 9px; width: 100%; height: 34px; padding: 0 8px; border-radius: 9px; font-size: 12.5px; font-weight: 500; text-align: left; }
  .lay:hover { background: rgba(28,34,48,.05); }
  .lay svg { width: 16px; height: 16px; flex: none; }
  .lay span { flex: 1; }
  .sw { width: 28px; height: 16px; border-radius: 8px; background: #cfd4da; position: relative; transition: background .2s; flex: none; }
  .sw::after { content: ""; position: absolute; left: 2px; top: 2px; width: 12px; height: 12px; border-radius: 50%; background: #fff; transition: transform .2s; box-shadow: 0 1px 2px rgba(0,0,0,.25); }
  .lay.on .sw { background: var(--ink); } .lay.on .sw::after { transform: translateX(12px); }

  #scale .bar { display: flex; height: 8px; border-radius: 2px; overflow: hidden; } #scale .bar i { flex: 1; }
  #scale .tk { display: flex; justify-content: space-between; margin-top: 5px; font-size: 10px; color: var(--mute); }

  #card.on { opacity: 1; pointer-events: auto; transform: none; }

  #toast.on { transform: translate(-50%, 0); }
  .foot { position: fixed; right: 16px; bottom: 8px; font-size: 10px; color: var(--mute); }
</style>
</head>
<body>

</div>

</div>
<div class="glass" id="scale"><h4>六边形 · 加权负载</h4><div class="bar" id="bar"></div><div class="tk mono"><span>0</span><span>50%</span><span>100%</span></div></div>
<div class="glass" id="card"></div>
<div class="glass" id="time">
  <button id="play" aria-label="播放"></button>

</div>
<div id="tip"></div><div id="toast"></div>
<div class="foot">示例数据 · 底图为示意轮廓</div>

const COL = ["#f6e9cc", "#f5c183", "#ea8052", "#c4384f", "#7b2060"];
const lerp = (a, b, t) => a + (b - a) * t, hex = (c) => [1, 3, 5].map((i) => parseInt(c.slice(i, i + 2), 16));

const inPoly = (x, y, poly) => { let c = false; for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) { const [xi, yi] = poly[i], [xj, yj] = poly[j]; if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) c = !c; } return c; };
const HR = 17;

  S = Math.min((W - 80) / (62 * .82), (H - 70) / 36.5);
