<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>漫画分镜</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=ZCOOL+QingKe+HuangYou&family=Noto+Sans+SC:wght@500;700;900&family=Noto+Serif+SC:wght@600;900&display=swap" rel="stylesheet">
<style>
  :root { --paper: #fbfaf6; --ink: #0c0c0c; --spot: #00a0e9; --gut: 7px; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: var(--paper); }
  body { font-family: "Noto Sans SC", sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  .app { position: relative; height: 100vh; display: flex; flex-direction: column; overflow: hidden; background: var(--paper); }
  .app::after { content: ""; position: absolute; inset: 0; pointer-events: none; background-image: var(--grain); mix-blend-mode: multiply; z-index: 60; }
  .sfx, .dg { font-family: "Dela Gothic One", "ZCOOL QingKe HuangYou", sans-serif; font-weight: 400; }

  .sb { height: 40px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 6px 24px 0; font-family: "Dela Gothic One"; font-size: 14px; }

  /* 刊头：杂志式标题 + 话数 + 气泡按钮 */
  .top { flex: none; position: relative; height: 66px; padding: 0 14px 0 12px; display: flex; align-items: center; gap: 8px; z-index: 5; }
  .logo { font-weight: 900; font-size: 38px; line-height: 1; letter-spacing: -1px; color: var(--ink); -webkit-text-stroke: 9px var(--ink); paint-order: stroke fill; position: relative; }
  .logo span { position: absolute; left: 0; top: 0; color: var(--paper); -webkit-text-stroke: 3px var(--paper); paint-order: stroke fill; }
  .logo span i { font-style: normal; color: var(--ink); -webkit-text-stroke: 0; }
  .ep { display: flex; flex-direction: column; gap: 2px; margin-left: 2px; }
  .ep b { background: var(--ink); color: var(--paper); font-family: "Dela Gothic One", "Noto Sans SC"; font-weight: 400; font-size: 12px; padding: 2px 6px 3px; letter-spacing: 1px; align-self: flex-start; }
  .ep small { font-size: 11px; font-weight: 700; letter-spacing: 1px; }
  .say { position: absolute; right: 12px; top: 4px; width: 84px; height: 58px; }
  .say svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .say .t { position: absolute; inset: 0 0 8px; display: grid; place-items: center; font-weight: 900; font-size: 17px; letter-spacing: 1px; }
  .say .shout { display: none; }
  .say.on .calm { display: none; } .say.on .shout { display: block; }
  .say.on .t { color: var(--paper); }
  .boom { position: absolute; right: 74px; top: 36px; font-family: "ZCOOL QingKe HuangYou", sans-serif; font-size: 46px; color: var(--paper); -webkit-text-stroke: 7px var(--ink); paint-order: stroke fill; transform: rotate(-14deg); pointer-events: none; opacity: 0; z-index: 8; }
  .boom.go { animation: boom .9s cubic-bezier(.2,1.6,.4,1) forwards; }
  @keyframes boom { 0% { opacity: 1; transform: rotate(-14deg) scale(2.6); } 20% { transform: rotate(-10deg) scale(.9); } 32% { transform: rotate(-14deg) scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: rotate(-14deg) scale(1.05); } }
  .dir { position: absolute; right: 16px; bottom: -6px; font-size: 9.5px; font-weight: 700; letter-spacing: 1px; background: var(--paper); padding: 0 4px; z-index: 6; }

  .scroll { flex: 1; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; position: relative; perspective: 1400px; }
  .scroll::-webkit-scrollbar { display: none; }
  .sheet { position: relative; transform-origin: 0 50%; }

  /* 一页漫画：每格 = 一个裁好的 div + 一圈黑框 */
  .page { position: relative; height: 500px; margin: 6px 10px 0; }
  .pg { position: absolute; inset: 0; pointer-events: none; }
  .pg .cl { position: absolute; inset: 0; overflow: hidden; pointer-events: auto; background: var(--paper); }
  .pg .in { position: absolute; inset: 0; }
  .pg svg.fr { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .pg svg.fr polygon { fill: none; stroke: var(--ink); stroke-width: 2.6; stroke-linejoin: miter; }
  .abs { position: absolute; }
  canvas.fit { position: absolute; display: block; }

  .eyes { position: absolute; left: 0; top: 0; width: 370px; height: 152px; overflow: visible; }
  .narr { position: absolute; right: 10px; top: 8px; writing-mode: vertical-rl; background: var(--paper); border: 2px solid var(--ink); padding: 7px 5px; font-family: "Noto Serif SC", serif; font-weight: 900; font-size: 12.5px; line-height: 1.5; letter-spacing: 2px; }
  .gogo { position: absolute; left: 318px; top: 238px; z-index: 9; display: flex; flex-direction: column; pointer-events: none; }
  .gogo b { display: block; font-family: "Dela Gothic One"; font-weight: 400; font-size: 30px; line-height: .92; color: var(--paper); -webkit-text-stroke: 6px var(--ink); paint-order: stroke fill; }
  .gogo b:nth-child(2) { margin-left: 9px; } .gogo b:nth-child(3) { margin-left: 3px; } .gogo b:nth-child(4) { margin-left: 12px; }
  .don { position: absolute; left: 118px; top: 286px; z-index: 9; pointer-events: none; font-family: "Dela Gothic One"; font-weight: 400; font-size: 70px; line-height: 1; letter-spacing: -6px; transform: rotate(-9deg); }
  .don span { position: relative; display: inline-block; color: var(--paper); -webkit-text-stroke: 9px var(--ink); paint-order: stroke fill; }
  .don span::before { content: attr(data-t); white-space: nowrap; position: absolute; left: 5px; top: 5px; z-index: -1; color: var(--spot); -webkit-text-stroke: 9px var(--spot); }
  .don small { font-size: 34px; margin-left: 2px; vertical-align: 6px; letter-spacing: 0; color: var(--paper); -webkit-text-stroke: 7px var(--ink); paint-order: stroke fill; }
  .rank { position: absolute; right: 7px; top: 150px; writing-mode: vertical-rl; background: var(--ink); color: var(--paper); font-family: "Dela Gothic One", "Noto Sans SC"; font-weight: 400; font-size: 15px; padding: 8px 4px; letter-spacing: 3px; }
  .rank em { font-style: normal; font-size: 26px; text-combine-upright: all; color: var(--spot); }
  .num { position: absolute; left: 0; top: 0; width: 128px; text-align: center; }
  .num .lb { display: inline-block; margin-top: 214px; background: var(--ink); color: var(--paper); font-weight: 900; font-size: 12px; padding: 2px 8px; letter-spacing: 2px; }
  .num .v { display: block; font-family: "Dela Gothic One"; font-weight: 400; font-size: 40px; line-height: 1.05; margin-top: 4px; color: var(--ink); -webkit-text-stroke: 7px var(--paper); paint-order: stroke fill; letter-spacing: -1px; }
  .num .s { display: inline-block; font-weight: 900; font-size: 12px; background: var(--paper); padding: 1px 6px; border: 1.8px solid var(--ink); }
  .bal { position: absolute; left: 0; top: 0; width: 370px; height: 500px; overflow: visible; pointer-events: none; }
  .ttl { position: absolute; left: 50px; top: 421px; width: 274px; height: 50px; display: flex; align-items: center; justify-content: center; text-align: center; font-weight: 900; font-size: 17.5px; line-height: 1.38; z-index: 3; }
  .ttl i { font-style: normal; background: var(--ink); color: var(--paper); padding: 0 3px; }
  .date { position: absolute; left: 6px; top: 384px; background: var(--paper); border: 2px solid var(--ink); font-size: 10.5px; font-weight: 900; padding: 1px 5px; letter-spacing: 1px; z-index: 4; }

  .sum { position: relative; margin: 12px 18px 0 22px; border: 2.4px solid var(--ink); padding: 10px 12px; font-family: "Noto Serif SC", serif; font-weight: 600; font-size: 13px; line-height: 1.75; background: var(--paper); box-shadow: 4px 4px 0 var(--ink); }

  .lh { display: flex; align-items: center; gap: 8px; margin: 16px 14px 8px; font-weight: 900; font-size: 14px; letter-spacing: 2px; }
  .lh::before, .lh::after { content: ""; flex: 1; height: 2.4px; background: var(--ink); }
  ol { list-style: none; padding: 0 12px 26px; display: flex; flex-direction: column; gap: var(--gut); }
  .it { position: relative; border: 2.6px solid var(--ink); background: var(--paper); display: grid; grid-template-columns: 1fr 92px; min-height: 98px; cursor: pointer; overflow: hidden; }
  .it .tx { padding: 10px 12px 10px 46px; position: relative; }
  .it .no { position: absolute; left: 0; top: 0; width: 36px; height: 100%; border-right: 2.6px solid var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: "Dela Gothic One"; font-size: 20px; }
  .it .no small { font-family: "Noto Sans SC"; font-weight: 900; font-size: 10px; }
  .it h3 { font-weight: 900; font-size: 15px; line-height: 1.42; }
  .it .m { margin-top: 5px; font-size: 11.5px; font-weight: 700; display: flex; gap: 8px; }
  .it .m b { font-family: "Dela Gothic One"; font-weight: 400; }
  .it .th { position: relative; border-left: 2.6px solid var(--ink); overflow: hidden; }
  .it .th canvas, .it .th svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .it .th .fx { position: absolute; right: 4px; bottom: 2px; font-family: "Dela Gothic One"; font-size: 19px; color: var(--paper); -webkit-text-stroke: 5px var(--ink); paint-order: stroke fill; transform: rotate(-8deg); }
  .it .more { display: none; position: relative; margin-top: 12px; }
  .it.open .more { display: block; }
  .it .more p { position: relative; z-index: 1; padding: 12px 18px 10px 20px; font-size: 12.5px; font-weight: 700; line-height: 1.6; }
  .it .more svg { position: absolute; inset: -6px -4px -2px; width: calc(100% + 8px); height: calc(100% + 8px); overflow: visible; }
  .it.open { grid-template-columns: 1fr 0; }
  .it.open .th { border: 0; }
  .it.flash { filter: invert(1); }

  .tabs { flex: none; position: relative; z-index: 7; border-top: 3px solid var(--ink); background: var(--paper); display: grid; grid-template-columns: repeat(5, 1fr); padding: 9px 6px 22px; }
  .tab { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; font-weight: 900; font-size: 11.5px; letter-spacing: 1px; padding: 5px 0 4px; }
  .tab svg { width: 22px; height: 22px; position: relative; z-index: 1; }
  .tab span { position: relative; z-index: 1; }
  .tab .bg { position: absolute; inset: 0 7px; background: var(--ink); clip-path: polygon(6% 0, 100% 4%, 94% 100%, 0 96%); display: none; }
  .tab .bg::after { content: ""; position: absolute; right: -2px; bottom: -2px; width: 14px; height: 14px; background: radial-gradient(circle, var(--spot) 1.1px, transparent 1.4px) 0 0 / 3.5px 3.5px; }
  .tab.on { color: var(--paper); }
  .tab.on .bg { display: block; }
  .turn { position: absolute; inset: 0; z-index: 30; pointer-events: none; background: var(--paper); border-left: 2.6px solid var(--ink); transform-origin: 0 50%; display: none; box-shadow: -18px 0 0 -8px rgba(0,0,0,.0); }
  .turn.go { display: block; animation: turn .62s cubic-bezier(.55,0,.25,1) forwards; }
  @keyframes turn { 0% { transform: translateX(100%) skewY(0); } 45% { transform: translateX(8%) skewY(-4deg); } 100% { transform: translateX(-105%) skewY(0); } }
</style>
</head>
<body>
<div class="app" id="app"></div>
<script src="data.js"></script>
<script src="common.js"></script>
<script>
const app = document.getElementById("app");
const [h1, ...rest] = HOT;
app.style.setProperty("--grain", `url(${grainURL(180, 0.05, 40)})`);
const $ = (id) => document.getElementById(id);
const R = (() => { let s = 7; return () => ((s = (s * 16807) % 2147483647) / 2147483647); })();

// ── 分镜：页面坐标 370×516，右上起读 ──
const W = 370, HP = 500;
const yA = (x) => 150 - (22 / W) * x;          // 第 1 格下沿（斜）
const yB = (x) => 360 + (24 / W) * x;          // 第 2/3 格下沿（反方向斜）
const xD = (y) => 150 - ((y - 150) / 230) * 26; // 第 3 / 第 2 格之间的斜分隔
const g = 7;
const PANELS = {
  eyes: [[0, 0], [W, 0], [W, yA(W)], [0, yA(0)]],
  img: [[xD(yA(xD(160))) + g, yA(xD(160)) + g], [W, yA(W) + g], [W, yB(W)], [xD(yB(xD(360))) + g, yB(xD(360))]],
  num: [[0, yA(0) + g], [xD(yA(xD(160))) - 0, yA(xD(160)) + g], [xD(yB(xD(360))), yB(xD(360))], [0, yB(0)]],
  ttl: [[0, yB(0) + g], [W, yB(W) + g], [W, HP], [0, HP]],
};
const poly = (p) => p.map(([x, y]) => `${x.toFixed(1)}px ${y.toFixed(1)}px`).join(",");
const bbox = (p) => { const xs = p.map((q) => q[0]), ys = p.map((q) => q[1]); return { x: Math.min(...xs), y: Math.min(...ys), w: Math.max(...xs) - Math.min(...xs), h: Math.max(...ys) - Math.min(...ys) }; };
const panel = (key, inner) => `<div class="pg" id="pg-${key}"><div class="cl" style="clip-path:polygon(${poly(PANELS[key])})"><div class="in">${inner}</div></div><svg class="fr" viewBox="0 0 ${W} ${HP}"><polygon points="${PANELS[key].map((q) => q.join(",")).join(" ")}"/></svg></div>`;

// ── 特写：一双瞪大的眼睛（矢量手画，瞳孔会抖）──
function eyesSVG() {
  const one = (side) => {
    const s = side; // 1 = 画面左眼；-1 镜像
    const iris = `<g class="iris"><circle cx="-2" cy="-4" r="17.5" fill="#fbfaf6" stroke="#0c0c0c" stroke-width="2.6"/>
      <clipPath id="ic${s}"><circle cx="-2" cy="-4" r="16.4"/></clipPath>
      <g clip-path="url(#ic${s})"><rect x="-22" y="-24" width="40" height="40" fill="url(#tn2)"/><ellipse cx="-2" cy="-23" rx="22" ry="12" fill="#0c0c0c"/>
      ${Array.from({ length: 22 }, (_, i) => { const a = (i / 22) * Math.PI * 2; return `<line x1="${(-2 + Math.cos(a) * 6.5).toFixed(1)}" y1="${(-4 + Math.sin(a) * 6.5).toFixed(1)}" x2="${(-2 + Math.cos(a) * 15).toFixed(1)}" y2="${(-4 + Math.sin(a) * 15).toFixed(1)}" stroke="#0c0c0c" stroke-width="${i % 2 ? .7 : 1.2}"/>`; }).join("")}</g>
      <circle class="pu" cx="-2" cy="-4" r="4.6" fill="#0c0c0c"/>
      <ellipse cx="-9.5" cy="-11" rx="5.2" ry="4" fill="#fbfaf6" stroke="#0c0c0c" stroke-width=".8"/><circle cx="5.5" cy="3.5" r="2" fill="#fbfaf6"/></g>`;
    const lash = `M-72,-6 L-90,-20 L-70,-14 Z M-66,-14 L-80,-32 L-61,-21 Z`;
    const hatch = Array.from({ length: 9 }, (_, i) => `<line x1="${-58 + i * 4}" y1="${-30 + i * .3}" x2="${-66 + i * 4}" y2="${-20 + i * .3}" stroke="#0c0c0c" stroke-width=".9"/>`).join("");
    return `<g transform="translate(${s > 0 ? 92 : 278},88) scale(${s * 1.22},1.22)">
      <path d="M-70,-6 C-40,-40 30,-42 62,8 C20,26 -40,22 -70,-6 Z" fill="#fbfaf6"/>
      ${iris}
      <path d="M-70,-6 C-42,-48 32,-50 62,8 C30,-41 -40,-38 -70,-6 Z" fill="#0c0c0c"/>
      <path d="${lash}" fill="#0c0c0c"/>
      <path d="M-64,4 C-44,20 6,26 46,14" fill="none" stroke="#0c0c0c" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="70 6 18 4 30"/>
      <path d="M-56,26 C-30,34 10,34 34,28" fill="none" stroke="#0c0c0c" stroke-width="1.1" stroke-dasharray="40 7 12"/>
      <path d="M-82,-50 C-44,-72 18,-70 64,-38 L60,-30 C18,-58 -42,-60 -80,-43 Z" fill="#0c0c0c"/>
      ${hatch}
      <path d="M-96,10 C-102,22 -100,30 -94,30 C-88,30 -88,22 -96,10 Z" fill="#fbfaf6" stroke="#0c0c0c" stroke-width="1.6"/>
    </g>`;
  };
  // 縦線：额头上一排竖线（不安、压迫）
  let v = "";
  for (let x = 2; x < W; x += 3.1) { const len = 18 + R() * 30 + (Math.abs(x - 185) < 40 ? 30 : 0); v += `<line x1="${x.toFixed(1)}" y1="0" x2="${x.toFixed(1)}" y2="${len.toFixed(1)}" stroke="#0c0c0c" stroke-width="${(.6 + R() * .7).toFixed(2)}"/>`; }
  // 渐变网点：脸颊往下越来越密
  let tone = "";
  for (let y = 108; y < 160; y += 3.6) for (let x = (y % 7.2 ? 1.8 : 0); x < W; x += 3.6) { const r = Math.max(0, (y - 104) / 60) * 1.25; if (r > .2) tone += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(2)}"/>`; }
  // 鼻梁阴影 + 眉间皱
  let nose = ""; for (let i = 0; i < 6; i++) nose += `<line x1="${178 + i * 3}" y1="${78 + i * 2}" x2="${176 + i * 3}" y2="${126 - i * 3}" stroke="#0c0c0c" stroke-width=".8"/>`;
  return `<svg class="eyes" viewBox="0 0 ${W} 152"><defs>
      <pattern id="tn2" width="3.2" height="3.2" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><circle cx="1.6" cy="1.6" r=".95" fill="#0c0c0c"/></pattern></defs>
    <g class="vl">${v}</g><g fill="#0c0c0c">${tone}</g>${nose}
    <path d="M176,52 L182,64 M194,52 L188,64" stroke="#0c0c0c" stroke-width="1.6" stroke-linecap="round"/>
    <g class="lids">${one(1)}${one(-1)}</g></svg>`;
}

const cpuCanvas = (w, h) => { const c = document.createElement("canvas"); c.width = w; c.height = h; c.getContext("2d", { willReadFrequently: true }); return c; };
// ── 真图 → 网点纸 + 墨线（固定大小的网点一块块「贴」上去，不是连续网点）──
function toneCanvas(src, w, h, { k = 2, p = 4.2, cuts = [0.2, 0.44, 0.7], edge = 0.16, soft = 2 } = {}) {
  // 读像素的画布开 willReadFrequently（放在内存里），省掉第一次从显卡读回
  const small = cpuCanvas(Math.round(w / soft), Math.round(h / soft)), base = cpuCanvas(w, h);
  { const s2 = Math.max(small.width / src.width, small.height / src.height), dw = src.width * s2, dh = src.height * s2; small.getContext("2d").drawImage(src, (small.width - dw) / 2, (small.height - dh) / 2, dw, dh); }
  base.getContext("2d").drawImage(small, 0, 0, w, h);
  const L = lumaOf(base), sorted = Float32Array.from(L).sort();
  const lo = sorted[Math.floor(L.length * 0.03)], hi = sorted[Math.floor(L.length * 0.97)];
  for (let i = 0; i < L.length; i++) L[i] = Math.min(1, Math.max(0, (L[i] - lo) / Math.max(0.05, hi - lo)));
  const W2 = w * k, H2 = h * k, out = document.createElement("canvas"); out.width = W2; out.height = H2;
  const ctx = out.getContext("2d"), id = ctx.createImageData(W2, H2), d = id.data;
  const P = p * k, rad = [0, 0.4 * P, 0.24 * P], S = Math.SQRT1_2;
  const ink = [12, 12, 12], pap = [251, 250, 246];
  for (let Y = 0; Y < H2; Y++) for (let X = 0; X < W2; X++) {
    const x = Math.min(w - 2, Math.max(1, (X / k) | 0)), y = Math.min(h - 2, Math.max(1, (Y / k) | 0)), i = y * w + x;
    const gx = L[i + 1] - L[i - 1], gy = L[i + w] - L[i - w], v = L[i];
    let a;
    if (Math.hypot(gx, gy) > edge) a = 1;
    else if (v < cuts[0]) a = 1;
    else if (v < cuts[2]) {
      const r = v < cuts[1] ? rad[1] : rad[2];
      const u = (X + Y) * S / P, t = (X - Y) * S / P, du = (u - Math.round(u)) * P, dt = (t - Math.round(t)) * P;
      a = Math.min(1, Math.max(0, r - Math.hypot(du, dt) + 0.5));
    } else a = 0;
    const o = (Y * W2 + X) * 4;
    d[o] = pap[0] + (ink[0] - pap[0]) * a; d[o + 1] = pap[1] + (ink[1] - pap[1]) * a; d[o + 2] = pap[2] + (ink[2] - pap[2]) * a; d[o + 3] = 255;
  }
  ctx.putImageData(id, 0, 0);
  return out;
}
const cropCanvas = (img, sx, sy, sw, sh) => { const c = cpuCanvas(sw, sh); c.getContext("2d").drawImage(img, sx, sy, sw, sh, 0, 0, sw, sh); return c; };

// ── 集中线：白底从四周往中心收，中间留一个参差的洞 ──
function focusLines(w, h, { k = 2, n = 150, inner = 0.6, cx = w / 2, cy = h / 2, seed = 1 } = {}) {
  let s = seed * 9973; const r = () => ((s = (s * 16807) % 2147483647) / 2147483647);
  const c = document.createElement("canvas"); c.width = w * k; c.height = h * k;
  const x = c.getContext("2d"); x.scale(k, k);
  const rx = (w / 2) * inner, ry = (h / 2) * inner, far = Math.hypot(w, h);
  const rays = Array.from({ length: n }, (_, i) => { const a = (i / n) * Math.PI * 2 + r() * 0.03; return { a, d: 0.82 + r() * 0.5, wd: 0.6 + r() * r() * 5 }; });
  // 白色外圈（洞口参差）
  x.fillStyle = "#fbfaf6"; x.beginPath(); x.rect(0, 0, w, h);
  rays.forEach((q, i) => { const px = cx + Math.cos(q.a) * rx * (0.95 + r() * 0.35), py = cy + Math.sin(q.a) * ry * (0.95 + r() * 0.35); i ? x.lineTo(px, py) : x.moveTo(px, py); });
  x.closePath(); x.fill("evenodd");
  x.fillStyle = "#0c0c0c";
  rays.forEach((q) => {
    const ix = cx + Math.cos(q.a) * rx * q.d, iy = cy + Math.sin(q.a) * ry * q.d;
    const ox = cx + Math.cos(q.a) * far, oy = cy + Math.sin(q.a) * far, nx = -Math.sin(q.a) * q.wd, ny = Math.cos(q.a) * q.wd;
    x.beginPath(); x.moveTo(ix, iy); x.lineTo(ox + nx, oy + ny); x.lineTo(ox - nx, oy - ny); x.closePath(); x.fill();
  });
  return c;
}

// ── 流线：横向速度线 ──
function speedSVG(w, h) {
  let s = ""; for (let i = 0; i < 64; i++) { const y = R() * h, x1 = R() * w * 0.7 - 20, l = 30 + R() * 140, sw = .5 + R() * R() * 3.2; s += `<line x1="${x1.toFixed(1)}" y1="${y.toFixed(1)}" x2="${(x1 + l).toFixed(1)}" y2="${y.toFixed(1)}" stroke="#0c0c0c" stroke-width="${sw.toFixed(2)}" stroke-linecap="round"/>`; }
  return s;
}

function spiky(cx, cy, rx, ry, n = 38, seed = 3) {

  const pts = []; for (let i = 0; i < n * 2; i++) { const a = (i / (n * 2)) * Math.PI * 2, k = i % 2 ? 1 : 1.09 + r() * 0.12; pts.push([cx + Math.cos(a) * rx * k, cy + Math.sin(a) * ry * k]); }
  return "M" + pts.map((p) => p.map((v) => v.toFixed(1)).join(",")).join(" L") + " Z";
}
