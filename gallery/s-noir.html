<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>黑色漫画</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,900&family=Special+Elite&family=Noto+Serif+SC:wght@600;900&display=swap" rel="stylesheet">
<style>
  :root { --ink: #080808; --white: #f3f0e8; --spot: #e3122b; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: var(--ink); }
  body { font-family: "Noto Serif SC", serif; color: var(--white); -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  .tw { font-family: "Special Elite", "Noto Serif SC", monospace; }
  .pf { font-family: "Playfair Display", "Noto Serif SC", serif; font-style: italic; font-weight: 900; }
  .app { position: relative; height: 100vh; display: flex; flex-direction: column; overflow: hidden; background: var(--ink); }
  .hide { visibility: hidden; }

  .sb { height: 40px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 6px 24px 0; font-size: 14px; position: relative; z-index: 3; }
  .top { flex: none; position: relative; z-index: 3; display: flex; align-items: flex-end; justify-content: space-between; padding: 0 16px 12px 18px; }
  .logo { font-weight: 900; font-size: 40px; line-height: 1; letter-spacing: 2px; filter: url(#rough); }
  .logo .pf { font-size: 46px; letter-spacing: -1px; margin-right: 4px; }
  .sub { margin-top: 6px; font-size: 12.5px; letter-spacing: 2px; }
  .tip { position: relative; display: flex; align-items: center; gap: 8px; border: 2px solid var(--white); padding: 7px 11px 6px; font-size: 14px; letter-spacing: 1px; margin-bottom: 4px; }
  .tip .bars { display: none; gap: 3px; align-items: flex-end; height: 14px; }
  .tip .bars b { width: 3px; height: 4px; background: var(--ink); }
  .tip.on { background: var(--white); color: var(--ink); }
  .tip.on .bars { display: flex; } .tip.on .pl { display: none; }
  .tip .pl { width: 0; height: 0; border-left: 9px solid currentColor; border-top: 6px solid transparent; border-bottom: 6px solid transparent; }

  .scroll { flex: 1; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; position: relative; z-index: 2; }
  .scroll::-webkit-scrollbar { display: none; }

  /* 案卷 01：打光的墙（百叶窗影子）+ 白色剪影 + 打字机旁白 */
  .hero { position: relative; height: 470px; }
  .shot { position: absolute; left: 0; top: 0; width: 390px; height: 250px; overflow: hidden; }
  .shot canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .shot svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .cap { position: absolute; background: var(--white); color: var(--ink); font-size: 12.5px; line-height: 1.55; padding: 7px 10px 6px; letter-spacing: .5px; border: 2px solid var(--ink); z-index: 4; }
  .cap1 { left: 14px; top: 16px; transform: rotate(-1deg); max-width: 210px; }
  .cap2 { left: 16px; top: 384px; width: 236px; transform: rotate(.6deg); }
  .cap .cur { display: inline-block; width: .55em; height: 1em; background: var(--ink); vertical-align: -2px; margin-left: 1px; }
  .file { position: absolute; right: 14px; top: 14px; z-index: 4; font-size: 12px; letter-spacing: 2px; color: var(--ink); background: var(--white); padding: 2px 8px; border: 2px solid var(--ink); }
  .man { position: absolute; right: -6px; top: 158px; width: 150px; height: 312px; z-index: 3; overflow: visible; }
  .no1 { position: absolute; left: 12px; top: 232px; font-size: 104px; line-height: 1; z-index: 3; color: var(--ink); -webkit-text-stroke: 2.5px var(--white); letter-spacing: -4px; }
  .ttl { position: absolute; left: 18px; top: 268px; width: 236px; font-weight: 900; font-size: 25px; line-height: 1.3; z-index: 4; filter: url(#rough); }
  .ttl span { display: block; }
  .ttl em { font-style: normal; color: var(--spot); }

  .lh { display: flex; align-items: baseline; justify-content: space-between; margin: 6px 16px 0; padding-bottom: 8px; border-bottom: 2px solid var(--white); font-size: 13px; letter-spacing: 3px; }
  ol { list-style: none; padding: 0 0 28px; }
  .it { position: relative; display: grid; grid-template-columns: 60px 1fr 74px; gap: 12px; align-items: center; padding: 14px 16px 14px 14px; border-bottom: 1.5px solid var(--white); cursor: pointer; }
  .it .n { font-size: 38px; line-height: 1; color: var(--ink); -webkit-text-stroke: 1.6px var(--white); text-align: center; }
  .it h3 { font-weight: 900; font-size: 15.5px; line-height: 1.42; }
  .it .m { margin-top: 5px; font-size: 11.5px; letter-spacing: .5px; }
  .it .th { width: 74px; height: 74px; position: relative; border: 2px solid var(--white); overflow: hidden; background: var(--ink); }
  .it .th canvas, .it .th svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .it .more { display: none; grid-column: 1 / -1; background: var(--white); color: var(--ink); font-size: 12.5px; line-height: 1.65; padding: 9px 12px; letter-spacing: .4px; }
  .it.open .more { display: block; }
  .it.open { background: var(--white); color: var(--ink); }
  .it.open .n { -webkit-text-stroke-color: var(--ink); color: var(--white); }
  .it.open .more { border: 2px solid var(--ink); }

  .tabs { flex: none; position: relative; z-index: 3; background: var(--ink); border-top: 2px solid var(--white); display: grid; grid-template-columns: repeat(5, 1fr); padding: 10px 8px 22px; }
  .tab { position: relative; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 12px; letter-spacing: 2px; padding: 6px 0 5px; }
  .tab svg { width: 21px; height: 21px; }
  .tab.on { background: var(--white); color: var(--ink); }

  /* 雨、闪电、扫过去的百叶窗影 */
  #rain { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 20; pointer-events: none; mix-blend-mode: difference; }
  .bolt { position: absolute; inset: 0; z-index: 30; pointer-events: none; background: #fff; mix-blend-mode: difference; opacity: 0; }
  .sweep { position: absolute; inset: -40px; z-index: 25; pointer-events: none; mix-blend-mode: difference; opacity: 0; background: repeating-linear-gradient(-24deg, #fff 0 10px, transparent 10px 24px); }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="1.1" numOctaves="1" seed="4"/><feDisplacementMap in="SourceGraphic" scale="1.3"/></filter></svg>
<div class="app" id="app"></div>
<script src="data.js"></script>
<script src="common.js"></script>
<script>
const app = document.getElementById("app");
const [h1, ...rest] = HOT;
const $ = (id) => document.getElementById(id);

const cpuCanvas = (w, h) => { const c = document.createElement("canvas"); c.width = w; c.height = h; c.getContext("2d", { willReadFrequently: true }); return c; };
// ── 真图 → 纯黑白（一刀切，不留灰）+ 原图里的红单独拎出来当点色 ──
function noirCanvas(img, w, h, { k = 2, cut = 0.55, soft = 1.6, spot = "#e3122b", invert = false } = {}) {
  const W2 = w * k, H2 = h * k;
  // 读像素的画布开 willReadFrequently（放在内存里），省掉第一次从显卡读回
  const small = cpuCanvas(Math.round(W2 / soft), Math.round(H2 / soft)), src = cpuCanvas(W2, H2);
  { const s2 = Math.max(small.width / img.width, small.height / img.height), dw = img.width * s2, dh = img.height * s2; small.getContext("2d").drawImage(img, (small.width - dw) / 2, (small.height - dh) / 2, dw, dh); }
  src.getContext("2d").drawImage(small, 0, 0, W2, H2);
  const d = src.getContext("2d").getImageData(0, 0, W2, H2).data, L = lumaOf(src);
  const sorted = Float32Array.from(L).sort(), lo = sorted[Math.floor(L.length * .02)], hi = sorted[Math.floor(L.length * .98)];
  const bw = document.createElement("canvas"), red = document.createElement("canvas"); bw.width = red.width = W2; bw.height = red.height = H2;
  const bi = bw.getContext("2d").createImageData(W2, H2), ri = red.getContext("2d").createImageData(W2, H2);
  const S = hex(spot), INK = [8, 8, 8], WH = [243, 240, 232];
  let reds = 0;
  for (let i = 0; i < W2 * H2; i++) {
    const r = d[i * 4], g = d[i * 4 + 1], b = d[i * 4 + 2], mx = Math.max(r, g, b), mn = Math.min(r, g, b), sat = mx ? (mx - mn) / mx : 0;
    let hue = 0; if (mx !== mn) { hue = mx === r ? ((g - b) / (mx - mn)) % 6 : mx === g ? (b - r) / (mx - mn) + 2 : (r - g) / (mx - mn) + 4; hue = (hue * 60 + 360) % 360; }
    const v = (L[i] - lo) / Math.max(.05, hi - lo);
    let on = v < cut; if (invert) on = !on;
    const c = on ? INK : WH;
    bi.data[i * 4] = c[0]; bi.data[i * 4 + 1] = c[1]; bi.data[i * 4 + 2] = c[2]; bi.data[i * 4 + 3] = 255;
    if ((hue < 16 || hue > 346) && sat > .55 && mx > 120) { ri.data[i * 4] = S[0]; ri.data[i * 4 + 1] = S[1]; ri.data[i * 4 + 2] = S[2]; ri.data[i * 4 + 3] = 255; reds++; }
  }
  bw.getContext("2d").putImageData(bi, 0, 0); red.getContext("2d").putImageData(ri, 0, 0);
  return { bw, red, reds };
}

// ── 白色剪影：礼帽风衣，光从右边来，左半边吃进黑里 ──
const MAN = `<svg class="man" id="man" viewBox="0 0 150 312">
  <g stroke="#080808" stroke-width="3" stroke-linejoin="round">
    <path d="M10,312 C8,250 10,196 20,168 C30,150 46,142 56,138 L62,118 L88,118 L94,138 C106,142 122,150 132,168 C142,196 146,250 146,312 Z" fill="#f3f0e8"/>
    <path d="M50,140 L40,108 L64,124 L75,148 L86,124 L110,108 L100,140 L88,176 L75,160 L62,176 Z" fill="#f3f0e8"/>
    <path d="M58,74 C56,98 62,118 75,122 C90,118 95,98 93,74 Z" fill="#f3f0e8"/>
    <path d="M44,70 C44,46 52,26 76,26 C98,26 106,46 106,70 Z" fill="#f3f0e8"/>
    <path d="M18,76 C40,62 112,60 134,74 C112,86 40,88 18,76 Z" fill="#f3f0e8"/>
  </g>
  <path d="M46,64 C60,60 92,60 104,64 L104,70 C90,67 60,67 46,70 Z" fill="#080808"/>
  <path d="M58,80 C66,92 86,92 93,80 L93,96 C84,102 66,102 58,96 Z" fill="#080808"/>
  <path d="M12,312 C10,250 12,198 22,170 C30,154 42,146 52,142 L60,176 L50,214 L58,236 L44,262 L52,312 Z" fill="#080808"/>
  <path d="M75,160 L75,312 M88,176 L104,224 M62,176 L58,206" stroke="#080808" stroke-width="2.4" fill="none"/>
  <path d="M86,236 L146,236" stroke="#080808" stroke-width="7"/>
  <path d="M90,108 L116,104" stroke="#f3f0e8" stroke-width="3.2" stroke-linecap="round"/>
  <circle class="ember" cx="117.5" cy="103.8" r="2.6" fill="#e3122b"/>
  <path class="smoke" d="M119,98 C124,86 114,78 122,66 C128,56 120,48 126,38" stroke="#f3f0e8" stroke-width="1.6" fill="none" stroke-dasharray="7 5"/>
</svg>`;

const KEYW = KEY[1];
// 标题按宽度断行，关键词标红
const LINES = splitLines(shortTitle(h1), '900 25px "Noto Serif SC"', 232);

app.innerHTML = `
  <div class="sb tw"><span>${nowHM()}</span><span>5G · 夜</span></div>
  <header class="top" id="top">
    <div><div class="logo" id="logo"><span class="pf">AI</span>热点</div><div class="sub tw" id="sub">第 22 夜 · 雨 · 实时</div></div>
    <button class="tip tw" id="tip"><i class="pl"></i><span class="bars"><b></b><b></b><b></b><b></b></span><span>听线报</span></button>
  </header>
  <main class="scroll" id="scroll">
    <section class="hero" id="hero">
      <div class="shot" id="shot"><canvas id="bw"></canvas><canvas id="red"></canvas>
        <svg viewBox="0 0 390 250" preserveAspectRatio="none"><defs><pattern id="blinds" width="390" height="17" patternUnits="userSpaceOnUse" patternTransform="rotate(-24)"><rect width="390" height="8" fill="#080808"/></pattern></defs>
          <g id="blindsG"><path d="M118,-10 L410,-10 L410,262 L40,262 Z" fill="url(#blinds)"/><path d="M118,-10 L40,262 L-20,262 L-20,-10 Z" fill="#080808" opacity="0"/></g>
          <path d="M0,214 C120,226 260,222 390,206 L390,250 L0,250 Z" fill="#080808"/></svg>
      </div>
      <div class="cap cap1 tw" id="cap1"></div>
      <div class="file tw" id="file">案卷 №01</div>
      <h2 class="ttl" id="ttl">${LINES.map((l) => `<span>${esc(l).replace(esc(KEYW), `<em>${esc(KEYW)}</em>`)}</span>`).join("")}</h2>
      ${MAN}
      <div class="cap cap2 tw" id="cap2"></div>
    </section>
    <div class="lh tw" id="lh"><span>其余案卷</span><span>${rest.length} 宗</span></div>
    <ol>${rest.map((h) => `<li class="it" data-r="${h.rank}"><span class="n pf">${pad2(h.rank)}</span><div><h3>${esc(shortTitle(h))}</h3><div class="m tw">热度 ${heatText(h)} · ${h.sources} 名线人</div></div><div class="th">${h.cover ? "<canvas></canvas>" : `<svg viewBox="0 0 74 74"></svg>`}</div><div class="more tw" data-t="${esc(clip(firstLine(h.summary), 76))}"></div></li>`).join("")}</ol>
  </main>
  <nav class="tabs tw" id="tabs">${TAB_NAMES.map((n, i) => `<button class="tab ${i ? "" : "on"}">${iconSVG(i)}<span>${n}</span></button>`).join("")}</nav>
  <canvas id="rain"></canvas><div class="bolt" id="bolt"></div><div class="sweep" id="sweep"></div>`;

// 题注第二句接在标题下面；第一句挂在照片左上
const CAP1 = "10 月 22 日，夜。雨一直没停。";
const CAP2 = `${h1.sources} 个线人，${h1.people} 个人，热度 ${heatText(h1)}。都在说同一个名字。`;

// ── 雨：细白线斜着落，差值混合（落在白处变黑）；落到底栏溅起来 ──
const rain = $("rain"), rx = rain.getContext("2d");
let RW = 0, RH = 0; const DROPS = [];
const sizeRain = () => { RW = app.clientWidth; RH = app.clientHeight; rain.width = RW * 2; rain.height = RH * 2; rx.setTransform(2, 0, 0, 2, 0, 0); };
sizeRain();
for (let i = 0; i < 125; i++) DROPS.push({ x: Math.random() * (RW + 120), y: Math.random() * RH, l: 8 + Math.random() * 26, v: 13 + Math.random() * 13, w: Math.random() < .12 ? 1.8 : .9 });
const splashes = [];
let raining = true;
function rainFrame() {
  rx.clearRect(0, 0, RW, RH);
  rx.strokeStyle = "#fff"; rx.lineCap = "round";
  const floor = RH - $("tabs").offsetHeight;
  for (const d of DROPS) {
    d.y += d.v; d.x -= d.v * .26;
    if (d.y > floor && Math.random() < .5) { splashes.push({ x: d.x, y: floor, t: 0 }); d.y = -d.l - Math.random() * 60; d.x = Math.random() * (RW + 120); }
    if (d.y > RH) { d.y = -d.l; d.x = Math.random() * (RW + 120); }
    rx.lineWidth = d.w; rx.beginPath(); rx.moveTo(d.x, d.y); rx.lineTo(d.x + d.l * .26, d.y - d.l); rx.stroke();
  }
  rx.lineWidth = 1;
  for (let i = splashes.length - 1; i >= 0; i--) { const s = splashes[i]; s.t++; rx.beginPath(); rx.arc(s.x, s.y, 1 + s.t * 1.2, Math.PI * 1.1, Math.PI * 1.9); rx.stroke(); if (s.t > 4) splashes.splice(i, 1); }
}
setInterval(rainFrame, 1000 / 30);

// ── 闪电：整屏反相两下 ──
const bolt = (d = 0) => $("bolt").animate([{ opacity: 1 }, { opacity: 1, offset: .18 }, { opacity: 0, offset: .19 }, { opacity: 0, offset: .45 }, { opacity: 1, offset: .46 }, { opacity: 1, offset: .56 }, { opacity: 0, offset: .57 }, { opacity: 0 }], { duration: 360, delay: d });
const cut = (el, d) => el.animate([{ visibility: "hidden" }, { visibility: "visible" }], { duration: 1, delay: d, fill: "backwards" });
// 打字机：一个字一个字敲，光标闪
function type(el, text, d, cps = 34) {
  el.innerHTML = `<span class="cur"></span>`; cut(el, d);
  // 按经过的时间算敲到第几个字（卡顿也不会少字）
  setTimeout(() => { const t0 = performance.now(); let i = 0; const t = setInterval(() => { const n = Math.min(text.length, Math.floor((performance.now() - t0) * cps / 1000) + 1); if (n === i) return; i = n; el.innerHTML = esc(text.slice(0, i)) + `<span class="cur"></span>`; if (i >= text.length) { clearInterval(t); el.querySelector(".cur").animate([{ opacity: 1 }, { opacity: 0 }], { duration: 900, iterations: Infinity, easing: "steps(2)" }); } }, 1000 / cps); }, d);
}

(async () => {
await fontsReady();
const img = await loadImage(h1.cover);
const N = noirCanvas(img, 390, 250, { cut: .74 });
const bw = $("bw"), red = $("red");
bw.width = red.width = N.bw.width; bw.height = red.height = N.bw.height;
bw.getContext("2d").drawImage(N.bw, 0, 0); red.getContext("2d").drawImage(N.red, 0, 0);
// 标题重新断行（字体到了以后量得准）
const L2 = splitLines(shortTitle(h1), '900 25px "Noto Serif SC"', 232);
$("ttl").innerHTML = L2.map((l) => `<span>${esc(l).replace(esc(KEYW), `<em>${esc(KEYW)}</em>`)}</span>`).join("");

app.querySelectorAll(".it").forEach((li, i) => {
  const h = rest[i];
  if (h.cover) loadImage(h.cover).then((im) => { const c = li.querySelector("canvas"); const n = noirCanvas(im, 74, 74, { cut: .5 }); c.width = n.bw.width; c.height = n.bw.height; const x = c.getContext("2d"); x.drawImage(n.bw, 0, 0); });
  else li.querySelector("svg").innerHTML = `<defs><pattern id="bl${h.rank}" width="74" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-24)"><rect width="74" height="4" fill="#f3f0e8"/></pattern></defs><rect width="74" height="74" fill="url(#bl${h.rank})"/><g transform="translate(5,5)"><path d="${DOODLE[h.rank]}" fill="#080808" stroke="#080808" stroke-width="12" stroke-linejoin="round" stroke-linecap="round"/><path d="${DOODLE[h.rank]}" fill="none" stroke="#f3f0e8" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"/></g>`;
});

// ── 进场：黑 → 闪电照出画面 → 百叶窗影子扫过 → 打字机旁白 → 最后才给红 ──
const T0 = 150;
bolt(T0);
[$("top"), $("shot"), $("file")].forEach((e) => cut(e, T0));
cut($("man"), T0 + 170);
$("blindsG").animate([{ transform: "translateX(-460px)" }, { transform: "none" }], { duration: 1000, delay: T0 + 350, easing: "cubic-bezier(.5,0,.15,1)", fill: "backwards" });
type($("cap1"), CAP1, T0 + 550, 32);
[...$("ttl").children].forEach((s, i) => s.animate([{ clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0 0 0)" }], { duration: 260, delay: T0 + 1000 + i * 180, easing: "steps(5)", fill: "backwards" }));
type($("cap2"), CAP2, T0 + 1550, 46);
cut($("lh"), T0 + 1300);
app.querySelectorAll(".it").forEach((li, i) => cut(li, T0 + 1400 + i * 80));
cut($("tabs"), T0);
// 点色最后到：像霓虹灯一样闪两下再亮住
const REDS = [$("red"), ...app.querySelectorAll(".ttl em, .ember")];
const RED_AT = T0 + 2500;
REDS.forEach((e) => e.animate([{ opacity: 0 }, { opacity: 0, offset: .3 }, { opacity: 1, offset: .31 }, { opacity: 1, offset: .45 }, { opacity: 0, offset: .46 }, { opacity: 0, offset: .7 }, { opacity: 1, offset: .71 }, { opacity: 1 }], { duration: 520, delay: RED_AT, fill: "backwards" }));
// 常驻：烟一直往上走；每 7～10 秒打一次闪
document.querySelector(".smoke").animate([{ strokeDashoffset: 0 }, { strokeDashoffset: -24 }], { duration: 1200, iterations: Infinity });
const again = () => setTimeout(() => { bolt(); again(); }, 7000 + Math.random() * 3000); again();

// ── 点击 ──
const tip = $("tip"); let barT = null;
tip.addEventListener("click", () => {
  const on = tip.classList.toggle("on"); clearInterval(barT);
  if (on) { bolt(); barT = setInterval(() => tip.querySelectorAll(".bars b").forEach((b) => (b.style.height = 3 + Math.floor(Math.random() * 4) * 3 + "px")), 125); }
});
app.querySelectorAll(".it").forEach((li) => li.addEventListener("click", () => {
  const open = li.classList.toggle("open"), m = li.querySelector(".more");
  if (open) { li.animate([{ filter: "invert(1)" }, { filter: "invert(1)", offset: .5 }, { filter: "none", offset: .51 }], { duration: 120 }); type(m, m.dataset.t, 60, 60); }
}));
$("shot").addEventListener("click", () => { bolt(); $("blindsG").animate([{ transform: "translateX(-460px)" }, { transform: "none" }], { duration: 900, easing: "cubic-bezier(.5,0,.15,1)" }); });
// 切底栏：一道百叶窗影子从左扫到右（像车灯扫过窗户）
const tabs = [...app.querySelectorAll(".tab")];
tabs.forEach((t) => t.addEventListener("click", () => {
  tabs.forEach((x) => x.classList.toggle("on", x === t));
  $("sweep").animate([{ opacity: 1, transform: "translateX(-110%)" }, { opacity: 1, transform: "translateX(110%)" }], { duration: 700, easing: "cubic-bezier(.5,0,.3,1)" });
}));
})();
</script>
</body>
</html>
